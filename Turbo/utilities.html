<script>

  /** function fBuildTagObject
   * Purpose: Parses a 2D data array to populate a specific namespace within the global `tag` object.
   * Assumptions: The global `tag` object exists. Row tags are in column 0, and column tags are in row 0.
   * Notes: This is the core of our dynamic "magic string" elimination strategy.
   * @param {string} wbAbr - The two-letter workbook abbreviation (e.g., 'cs', 'db').
   * @param {string} sheetName - The sheet name (e.g., 'game', 'abilities').
   * @param {any[][]} dataArr - The 2D data array to parse for tags.
   * @returns {boolean} True on success, false on failure.
   */
  function fBuildTagObject(wbAbr, sheetName, dataArr) {
    const funcName = "fBuildTagObject";
    const wb = String(wbAbr || "").toLowerCase();
    const sheet = String(sheetName || "")
      .toLowerCase()
      .replace(/ /g, "");

    if (!tag[wb] || !tag[wb][sheet]) {
      console.error(`${funcName}: Invalid namespace provided: ${wb}.${sheet}`);
      return false;
    }
    if (
      !Array.isArray(dataArr) ||
      dataArr.length === 0 ||
      !Array.isArray(dataArr[0])
    ) {
      console.warn(
        `${funcName}: Cannot build tags for ${wb}.${sheet}, data array is empty or malformed.`
      );
      return true; // Not a failure, just nothing to do.
    }

    // Clear any existing tags for this namespace before rebuilding
    tag[wb][sheet].r = {};
    tag[wb][sheet].c = {};

    const rows = dataArr.length;
    const cols = dataArr[0].length;

    // Process Row Tags (Column 0)
    for (let r = 0; r < rows; r++) {
      const rowCell = dataArr[r]?.[0];
      if (typeof rowCell === "string" && rowCell) {
        rowCell.split(",").forEach((t) => {
          const trimmedTag = t.trim();
          if (trimmedTag) {
            tag[wb][sheet].r[trimmedTag] = { label: trimmedTag, index: r };
          }
        });
      }
    }

    // Process Column Tags (Row 0)
    const colHeaderRow = dataArr[0];
    if (colHeaderRow) {
      for (let c = 0; c < cols; c++) {
        const colCell = colHeaderRow[c];
        if (typeof colCell === "string" && colCell) {
          colCell.split(",").forEach((t) => {
            const trimmedTag = t.trim();
            if (trimmedTag) {
              tag[wb][sheet].c[trimmedTag] = { label: trimmedTag, index: c };
            }
          });
        }
      }
    }

    fMyConsoleLog(`✅ Tags built for namespace: ${wb}.${sheet}`);
    return true;
  } // End function fBuildTagObject

  /** function fMyConsoleLog
   * Purpose: Logs messages to the console with timestamps, only if gUI.isDebugMode is true.
   * Assumptions: gUI.isDebugMode is a boolean. gUI.startTime and gUI.lastLogTime are numbers.
   * @param {string} msg - The message to log.
   * @returns {void}
   */
  function fMyConsoleLog(msg) {
    if (!gUI.isDebugMode) return;
    try {
      const now =
        typeof performance !== "undefined" ? performance.now() : Date.now();
      if (typeof gUI.startTime !== "number") gUI.startTime = now;
      if (typeof gUI.lastLogTime !== "number") gUI.lastLogTime = gUI.startTime;
      const delta = ((now - gUI.lastLogTime) / 1000).toFixed(2);
      const total = ((now - gUI.startTime) / 1000).toFixed(2);
      gUI.lastLogTime = now;
      console.log(`Status Log: [${total}s] ${msg} (+${delta}s)`);
    } catch (e) {
      console.log(`Status Log: ${msg}`);
    }
  } // End function fMyConsoleLog

  /** function fResolveRow
   * Purpose: Converts a string tag or numeric index to a 0-based row index.
   * Assumptions: gUI.rowTag is populated. The `tag` object is the primary lookup source.
   * @param {string | number} v - Row tag string or 0-based numeric index.
   * @returns {number} The 0-based row index, or NaN if resolution fails.
   */
  const fResolveRow = (v) => {
    if (typeof v === "string") {
      // Fast path: Check the pre-resolved tag object first.
      const resolvedIndex = tag.cs.game.r[v]?.index;
      if (typeof resolvedIndex === "number") {
        return resolvedIndex;
      }
      // Fallback path: For legacy or non-game-sheet tags.
      const fallbackIndex = gUI.rowTag[v];
      if (typeof fallbackIndex === "number") {
        return fallbackIndex;
      }
    }
    if (typeof v === "number" && v >= 0) {
      return v;
    }
    console.warn(`fResolveRow failed for value:`, v);
    return NaN;
  }; // End function fResolveRow

  /** function fResolveCol
   * Purpose: Converts a string tag or numeric index to a 0-based col index.
   * Assumptions: gUI.colTag is populated. The `tag` object is the primary lookup source.
   * @param {string | number} v - Column tag string or 0-based numeric index.
   * @returns {number} The 0-based column index, or NaN if resolution fails.
   */
  const fResolveCol = (v) => {
    if (typeof v === "string") {
      // Fast path: Check the pre-resolved tag object first.
      const resolvedIndex = tag.cs.game.c[v]?.index;
      if (typeof resolvedIndex === "number") {
        return resolvedIndex;
      }
      // Fallback path: For legacy or non-game-sheet tags.
      const fallbackIndex = gUI.colTag[v];
      if (typeof fallbackIndex === "number") {
        return fallbackIndex;
      }
    }
    if (typeof v === "number" && v >= 0) {
      return v;
    }
    console.warn(`fResolveCol failed for value:`, v);
    return NaN;
  }; // End function fResolveCol

  /** function fResolveFSDataRow
   * Purpose: Resolve a row tag or index against a specified Firestore data cache object.
   * Assumptions: The cache object in gUI exists and has a valid structure.
   * @param {string} fsDataObjKey - Key name of the cache object in gUI.
   * @param {string | number} tagOrIndex - Row tag or 0-based index to resolve.
   * @returns {number} The resolved 0-based numeric row index, or NaN on failure.
   */
  function fResolveFSDataRow(fsDataObjKey, tagOrIndex) {
    const funcName = "fResolveFSDataRow";
    const cache = gUI[fsDataObjKey];
    if (
      !cache ||
      typeof cache !== "object" ||
      !cache.text ||
      !Array.isArray(cache.text) ||
      !cache.rowTagsMap ||
      typeof cache.rowTagsMap !== "object"
    ) {
      console.warn(
        `${funcName}: Cache object gUI['${fsDataObjKey}'] is missing, invalid, or incomplete (missing text/rowTagsMap).`
      );
      return NaN;
    }
    const textData = cache.text;
    const numRows = textData.length;
    if (typeof tagOrIndex === "string") {
      const resolvedIndex = cache.rowTagsMap[tagOrIndex];
      if (resolvedIndex === undefined) {
        console.warn(
          `${funcName}: Row tag "${tagOrIndex}" not found in rowTagsMap for cache '${fsDataObjKey}'.`
        );
        return NaN;
      }
      if (
        typeof resolvedIndex !== "number" ||
        isNaN(resolvedIndex) ||
        resolvedIndex < 0 ||
        resolvedIndex >= numRows
      ) {
        console.warn(
          `${funcName}: Resolved row index ${resolvedIndex} for tag "${tagOrIndex}" in cache '${fsDataObjKey}' is out of bounds (0-${
            numRows - 1
          }).`
        );
        return NaN;
      }
      return resolvedIndex;
    } else if (typeof tagOrIndex === "number") {
      if (isNaN(tagOrIndex) || tagOrIndex < 0 || tagOrIndex >= numRows) {
        console.warn(
          `${funcName}: Input row index ${tagOrIndex} for cache '${fsDataObjKey}' is invalid or out of bounds (0-${
            numRows - 1
          }).`
        );
        return NaN;
      }
      return tagOrIndex;
    } else {
      console.warn(
        `${funcName}: Invalid tagOrIndex type (${typeof tagOrIndex}) provided for cache '${fsDataObjKey}'. Must be string or number.`
      );
      return NaN;
    }
  } // End function fResolveFSDataRow

  /** function fResolveFSDataCol
   * Purpose: Resolve a column tag or index against a specified Firestore data cache object.
   * Assumptions: The cache object in gUI exists and has a valid structure.
   * @param {string} fsDataObjKey - Key name of the cache object in gUI.
   * @param {string | number} tagOrIndex - Column tag or 0-based index to resolve.
   * @returns {number} The resolved 0-based numeric column index, or NaN on failure.
   */
  function fResolveFSDataCol(fsDataObjKey, tagOrIndex) {
    const funcName = "fResolveFSDataCol";
    const cache = gUI[fsDataObjKey];
    if (
      !cache ||
      typeof cache !== "object" ||
      !cache.text ||
      !Array.isArray(cache.text) ||
      !cache.colTagsMap ||
      typeof cache.colTagsMap !== "object" ||
      (cache.text.length > 0 && !Array.isArray(cache.text[0]))
    ) {
      console.warn(
        `${funcName}: Cache object gUI['${fsDataObjKey}'] is missing, invalid, or incomplete (missing text/colTagsMap or invalid text[0]).`
      );
      return NaN;
    }
    const textData = cache.text;
    const numCols = textData[0]?.length || 0;
    if (typeof tagOrIndex === "string") {
      const resolvedIndex = cache.colTagsMap[tagOrIndex];
      if (resolvedIndex === undefined) {
        console.warn(
          `${funcName}: Col tag "${tagOrIndex}" not found in colTagsMap for cache '${fsDataObjKey}'.`
        );
        return NaN;
      }
      if (
        typeof resolvedIndex !== "number" ||
        isNaN(resolvedIndex) ||
        resolvedIndex < 0 ||
        resolvedIndex >= numCols
      ) {
        console.warn(
          `${funcName}: Resolved col index ${resolvedIndex} for tag "${tagOrIndex}" in cache '${fsDataObjKey}' is out of bounds (0-${
            numCols - 1
          }).`
        );
        return NaN;
      }
      return resolvedIndex;
    } else if (typeof tagOrIndex === "number") {
      if (isNaN(tagOrIndex) || tagOrIndex < 0 || tagOrIndex >= numCols) {
        console.warn(
          `${funcName}: Input col index ${tagOrIndex} for cache '${fsDataObjKey}' is invalid or out of bounds (0-${
            numCols - 1
          }).`
        );
        return NaN;
      }
      return tagOrIndex;
    } else {
      console.warn(
        `${funcName}: Invalid tagOrIndex type (${typeof tagOrIndex}) provided for cache '${fsDataObjKey}'. Must be string or number.`
      );
      return NaN;
    }
  } // End function fResolveFSDataCol

  /** function fDoesObjectHaveR1C1R2C2Properties
   * Purpose: Checks if an object has the required properties for a valid range definition.
   * Assumptions: A valid range object must have r1, c1, r2, and c2 properties.
   * @param {object} range - The object to check.
   * @returns {boolean} True if the object is a valid range definition, false otherwise.
   */
  function fDoesObjectHaveR1C1R2C2Properties(range) {
    return (
      range &&
      typeof range.r1 !== "undefined" &&
      typeof range.c1 !== "undefined" &&
      typeof range.r2 !== "undefined" &&
      typeof range.c2 !== "undefined"
    );
  } // End function fDoesObjectHaveR1C1R2C2Properties

  /** function fConvertsR1C1R2C2TagOrNumToIndices
   * Purpose: Converts tags or numbers within a range definition object into resolved 0-based indices.
   * Assumptions: The range object has r1, c1, r2, c2 properties.
   * @param {object} range - The range definition object {r1, c1, r2, c2}.
   * @returns {object} An object {r1, c1, r2, c2} with resolved numeric indices (or NaN).
   */
  function fConvertsR1C1R2C2TagOrNumToIndices(range) {
    const r1 = fResolveRow(range.r1);
    const c1 = fResolveCol(range.c1);
    const r2 = fResolveRow(range.r2);
    const c2 = fResolveCol(range.c2);
    return {
      r1,
      c1,
      r2,
      c2,
    };
  } // End function fConvertsR1C1R2C2TagOrNumToIndices

  /** function fIsCellInRangeArray
   * Purpose: Checks if given coordinates (r, c) fall within ANY of the range objects in a given array.
   * Assumptions: Input coordinates are valid numbers.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {Array<object> | object} rangeArray - An array of range definition objects, or a single range object.
   * @returns {boolean} True if (r, c) is inside any valid range, false otherwise.
   */
  function fIsCellInRangeArray(r, c, rangeArray) {
    if (
      typeof r !== "number" ||
      typeof c !== "number" ||
      isNaN(r) ||
      isNaN(c)
    ) {
      console.warn("fIsCellInRangeArray: Invalid input coordinates provided.");
      return false;
    }
    const rangesToCheck = Array.isArray(rangeArray) ? rangeArray : [rangeArray];
    if (rangesToCheck.length === 0 || !rangesToCheck[0]) {
      return false;
    }
    for (const rangeDef of rangesToCheck) {
      if (!fDoesObjectHaveR1C1R2C2Properties(rangeDef)) {
        console.warn(
          "fIsCellInRangeArray: Skipping invalid range definition object:",
          rangeDef
        );
        continue;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(rangeDef);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          "fIsCellInRangeArray: Skipping range due to unresolved indices:",
          rangeDef
        );
        continue;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      if (r >= rMin && r <= rMax && c >= cMin && c <= cMax) {
        return true;
      }
    }
    return false;
  } // End function fIsCellInRangeArray

  /** function fGetContrastColor
   * Purpose: Determines if black or white text has better contrast against a given background hex color.
   * Assumptions: Input is a valid hex color string (e.g., '#FF0000', '03F').
   * @param {string} hexColor - The background color.
   * @returns {string} '#000000' or '#ffffff' for the best contrast.
   */
  function fGetContrastColor(hexColor) {
    const defaultColor = "#000000";
    if (!hexColor || typeof hexColor !== "string") return defaultColor;
    try {
      let hex = hexColor.startsWith("#") ? hexColor.substring(1) : hexColor;
      if (hex.length === 3) {
        hex = hex
          .split("")
          .map((char) => char + char)
          .join("");
      } else if (hex.length !== 6) {
        return defaultColor;
      }
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      if (isNaN(r) || isNaN(g) || isNaN(b)) return defaultColor;
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.5 ? "#000000" : "#ffffff";
    } catch (e) {
      console.error("Error calculating contrast color for:", hexColor, e);
      return defaultColor;
    }
  } // End function fGetContrastColor

  /** function fGetIDFromNameID
   * Purpose: Extracts the 6-character ID from the end of a Name_ID string.
   * Assumptions: The ID is the last 6 characters following an underscore.
   * @param {string} nameIdString - The string containing the name and ID (e.g., "Long Sword_A1B2C3").
   * @returns {string | null} The 6-character ID if found, otherwise null.
   */
  function fGetIDFromNameID(nameIdString) {
    if (typeof nameIdString !== "string" || !nameIdString) {
      return null;
    }
    const lastUnderscoreIndex = nameIdString.lastIndexOf("_");
    if (
      lastUnderscoreIndex !== -1 &&
      nameIdString.length - lastUnderscoreIndex - 1 >= 6
    ) {
      const potentialId = nameIdString.substring(lastUnderscoreIndex + 1);
      if (potentialId.length === 6) {
        return potentialId;
      }
    }
    return null;
  } // End function fGetIDFromNameID

  // End - Core Utilities
  // Start - Grid Data Access

  /** function fResolveAllRanges
   * Purpose: Populates gUI.resolvedRanges by converting all string tags in gUI.range to numeric indices.
   * Assumptions: This function is called once at startup after `fBuildTagObject` has run.
   * Notes: This is a key step for performance, allowing the app to use direct numeric indices instead of string lookups at runtime.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fResolveAllRanges() {
    const funcName = "fResolveAllRanges";
    fMyConsoleLog(
      `⚙️ ${funcName}: Resolving all configured ranges to numeric indices...`
    );
    gUI.resolvedRanges = {};

    const resolveSingleRange = (rangeDef) => {
      if (fDoesObjectHaveR1C1R2C2Properties(rangeDef)) {
        return fConvertsR1C1R2C2TagOrNumToIndices(rangeDef);
      }
      return rangeDef; // Return as-is if not a standard range object
    };

    for (const key in gUI.range) {
      if (Object.hasOwnProperty.call(gUI.range, key)) {
        const originalValue = gUI.range[key];
        if (Array.isArray(originalValue)) {
          gUI.resolvedRanges[key] = originalValue.map(resolveSingleRange);
        } else if (
          typeof originalValue === "object" &&
          originalValue !== null
        ) {
          gUI.resolvedRanges[key] = resolveSingleRange(originalValue);
        } else {
          gUI.resolvedRanges[key] = originalValue;
        }
      }
    }

    fMyConsoleLog(
      `✅ ${funcName}: All ranges resolved and stored in gUI.resolvedRanges.`
    );
  } // End function fResolveAllRanges

  /** function fGetGridValue
   * Purpose: Retrieves a value from gUI.arr using tags or indices.
   * Assumptions: gUI.arr, gUI.rowTag, and gUI.colTag are populated.
   * @param {string | number} rowRef - Row tag or 0-based index.
   * @param {string | number} colRef - Column tag or 0-based index.
   * @param {boolean} [asNumber=false] - If true, attempt to parse value as a Number.
   * @returns {any} The value from the grid, potentially coerced to a Number.
   */
  function fGetGridValue(rowRef, colRef, asNumber = false) {
    const r = fResolveRow(rowRef);
    const c = fResolveCol(colRef);
    if (isNaN(r) || isNaN(c)) {
      console.warn(
        `fGetGridValue: Could not resolve (${rowRef}, ${colRef}) to valid indices.`
      );
      return NaN;
    }
    const value = gUI.arr?.[r]?.[c];
    if (value === undefined || value === null || value === "") {
      return asNumber ? 0 : undefined;
    }
    if (asNumber) {
      const numValue = Number(value);
      if (isNaN(numValue)) {
        console.warn(
          `fGetGridValue: Value at (${rowRef}, ${colRef}) -> [${r}, ${c}] ("${value}") is not a valid number.`
        );
        return NaN;
      }
      return numValue;
    }
    return value;
  } // End function fGetGridValue

  /** function fSetGridValue
   * Purpose -> Updates a value in the data model (gUI.arr) and the corresponding DOM cell.
   * Assumptions: The grid is rendered. gUI.headerButtonCoords is populated.
   * @param {string|number} rowRef - Row tag or 0-based index.
   * @param {string|number} colRef - Column tag or 0-based index.
   * @param {any} newValue - The new value to set.
   * @returns {boolean} True if the update was successful, false if resolution failed.
   */
  function fSetGridValue(rowRef, colRef, newValue) {
    const r = fResolveRow(rowRef);
    const c = fResolveCol(colRef);
    if (isNaN(r) || isNaN(c)) {
      console.warn(
        `fSetGridValue: Could not resolve (${rowRef}, ${colRef}) to valid indices [${r}, ${c}].`
      );
      return false;
    }
    if (gUI.headerButtonCoords.has(`${r},${c}`)) {
      return true;
    }
    if (!gUI.arr?.[r]) {
      console.warn(`fSetGridValue: Row ${r} does not exist in gUI.arr.`);
      return false;
    }
    gUI.arr[r][c] = newValue;
    const cell = gUI.grid2D?.[r]?.[c];
    if (!cell) {
      console.warn(
        `fSetGridValue: Cell element not found at [${r}, ${c}]. Data model updated, DOM not.`
      );
      return true;
    }
    const valueStr = String(newValue ?? "").trim();
    const isUrl =
      valueStr.startsWith("http://") || valueStr.startsWith("https://");
    if (isUrl) {
      cell.classList.add("url-link");
      cell.dataset.url = valueStr;
      const driveMatch = valueStr.match(
        /drive\.google\.com\/file\/d\/([-\w]+)/
      );
      const imgExts = /\.(png|jpg|jpeg|gif|webp|svg)$/i;
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        const imageUrl = "https://drive.google.com/uc?export=view&id=" + fileId;
        cell.classList.add("image-link");
        cell.dataset.imageSrc = imageUrl;
      } else if (imgExts.test(valueStr)) {
        cell.classList.add("image-link");
        cell.dataset.imageSrc = valueStr;
      } else {
        cell.classList.remove("image-link");
        delete cell.dataset.imageSrc;
      }
    } else {
      cell.classList.remove("url-link", "image-link");
      delete cell.dataset.url;
      delete cell.dataset.imageSrc;
    }
    const checkbox = cell.querySelector('input[type="checkbox"]');
    const dropdown = cell.querySelector("select.grid-dropdown");
    if (checkbox) {
      const valUpper = String(newValue).toUpperCase();
      checkbox.checked = newValue === true || valUpper === "TRUE";
    } else if (dropdown) {
      dropdown.value = String(newValue ?? "");
    } else {
      const idPattern = /\s{2,}_\w{6}$/;
      const text =
        typeof newValue === "string" && idPattern.test(newValue)
          ? newValue.replace(idPattern, "")
          : newValue;
      cell.innerHTML = "";
      const textSpan = document.createElement("span");
      textSpan.textContent = text ?? "";
      cell.appendChild(textSpan);
    }
    return true;
  } // End function fSetGridValue

  /** function fSetRangeOfGridValues
   * Purpose: Updates values in a specified grid range (data and DOM).
   * Assumptions: The grid is rendered and gUI objects are populated.
   * @param {string | number} r1Ref - Starting row tag or 0-based index.
   * @param {string | number} c1Ref - Starting column tag or 0-based index.
   * @param {string | number} r2Ref - Ending row tag or 0-based index.
   * @param {string | number} c2Ref - Ending column tag or 0-based index.
   * @param {any[] | any} valueOrArray - 1D/2D array or a single value to fill.
   * @returns {boolean} True if all updates were successful, false otherwise.
   */
  function fSetRangeOfGridValues(r1Ref, c1Ref, r2Ref, c2Ref, valueOrArray) {
    fMyConsoleLog(
      `⚙️ Setting range values: ${r1Ref},${c1Ref} to ${r2Ref},${c2Ref}...`
    );
    const r1 = fResolveRow(r1Ref);
    const c1 = fResolveCol(c1Ref);
    const r2 = fResolveRow(r2Ref);
    const c2 = fResolveCol(c2Ref);
    if ([r1, c1, r2, c2].some(isNaN)) {
      console.warn(
        `fSetRangeOfGridValues: Could not resolve one or more references: (${r1Ref}, ${c1Ref}, ${r2Ref}, ${c2Ref}) -> (${r1}, ${c1}, ${r2}, ${c2}).`
      );
      fMyConsoleLog(
        `❌ fSetRangeOfGridValues failed: Invalid range references.`
      );
      return false;
    }
    const isSingleValueFill = !Array.isArray(valueOrArray);
    const singleFillValue = isSingleValueFill ? valueOrArray : null;
    const newValArr = isSingleValueFill ? null : valueOrArray;
    if (isSingleValueFill) {
      fMyConsoleLog(`   -> Mode: Single value fill ('${singleFillValue}')`);
    } else {
      fMyConsoleLog(`   -> Mode: Array mapping`);
    }
    const rMin = Math.min(r1, r2);
    const rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2);
    const cMax = Math.max(c1, c2);
    const rangeRows = rMax - rMin + 1;
    const rangeCols = cMax - cMin + 1;
    if (!isSingleValueFill) {
      let arrRows = 0;
      let arrCols = 0;
      if (newValArr.length > 0) {
        const isInputArray2D = Array.isArray(newValArr[0]);
        if (isInputArray2D) {
          arrRows = newValArr.length;
          arrCols = newValArr[0]?.length || 0;
          if (
            !newValArr.every(
              (row) => Array.isArray(row) && row.length === arrCols
            )
          ) {
            console.warn(
              `fSetRangeOfGridValues: Input 2D array has inconsistent column lengths.`
            );
            fMyConsoleLog(
              `❌ fSetRangeOfGridValues failed: Input 2D array malformed.`
            );
            return false;
          }
        } else {
          if (rangeRows === 1) {
            arrRows = 1;
            arrCols = newValArr.length;
          } else if (rangeCols === 1) {
            arrRows = newValArr.length;
            arrCols = 1;
          } else {
            if (rangeCols >= rangeRows) {
              arrRows = 1;
              arrCols = newValArr.length;
            } else {
              arrRows = newValArr.length;
              arrCols = 1;
            }
            console.warn(
              `fSetRangeOfGridValues: Ambiguous 1D array input for multi-dimensional range (${rangeRows}x${rangeCols}). Assuming ${arrRows}x${arrCols}.`
            );
          }
        }
      }
      if (rangeRows !== arrRows || rangeCols !== arrCols) {
        console.warn(
          `fSetRangeOfGridValues: Dimension mismatch. Range: ${rangeRows}x${rangeCols}, Array: ${arrRows}x${arrCols}.`
        );
        fMyConsoleLog(`❌ fSetRangeOfGridValues failed: Dimension mismatch.`);
        return false;
      }
    }
    let updateCount = 0;
    let updateErrors = 0;
    for (let r = rMin; r <= rMax; r++) {
      if (!gUI.arr[r] || !gUI.grid2D[r]) {
        console.warn(
          `fSetRangeOfGridValues: Row ${r} does not exist in gUI.arr or gUI.grid2D. Skipping row.`
        );
        updateErrors += rangeCols;
        continue;
      }
      for (let c = cMin; c <= cMax; c++) {
        let newValue;
        if (isSingleValueFill) {
          newValue = singleFillValue;
        } else {
          const arrRowIdx = rangeRows === 1 ? 0 : r - rMin;
          const arrColIdx = rangeCols === 1 ? 0 : c - cMin;
          newValue = Array.isArray(newValArr[0])
            ? newValArr[arrRowIdx]?.[arrColIdx]
            : rangeCols === 1
            ? newValArr[arrRowIdx]
            : newValArr[arrColIdx];
        }
        if (!fSetGridValue(r, c, newValue)) {
          updateErrors++;
        } else {
          updateCount++;
        }
      }
    }
    fMyConsoleLog(
      `✅ fSetRangeOfGridValues: ${
        isSingleValueFill ? "Filled" : "Updated"
      } ${updateCount} cells. ${
        updateErrors > 0 ? `(${updateErrors} errors)` : ""
      }`
    );
    return updateErrors === 0;
  } // End function fSetRangeOfGridValues

  /** function fGetVal_GUICache
   * Purpose: Retrieves a value from a cached FSData object using sheet tags or absolute indices.
   * Assumptions: The dataCacheObject is a valid FSData object structure.
   * @param {string | number} rRef - Row tag or 0-based absolute index from original sheet.
   * @param {string | number} cRef - Column tag or 0-based absolute index from original sheet.
   * @param {object} dataCacheObject - The cached FSData object.
   * @returns {any | undefined} The value found, or undefined if not found or on error.
   */
  function fGetVal_GUICache(rRef, cRef, dataCacheObject) {
    const funcName = "fGetVal_GUICache";
    if (
      !dataCacheObject ||
      typeof dataCacheObject !== "object" ||
      !dataCacheObject.text ||
      !Array.isArray(dataCacheObject.text) ||
      !dataCacheObject.rowTagsMap ||
      typeof dataCacheObject.rowTagsMap !== "object" ||
      !dataCacheObject.colTagsMap ||
      typeof dataCacheObject.colTagsMap !== "object"
    ) {
      console.warn(
        `${funcName}: Invalid or incomplete dataCacheObject provided.`
      );
      fMyConsoleLog(`⚠️ ${funcName}: Invalid dataCacheObject input.`);
      return undefined;
    }
    const { text, rowTagsMap, colTagsMap } = dataCacheObject;
    let absolute_r = NaN;
    let absolute_c = NaN;
    if (typeof rRef === "string") {
      absolute_r = rowTagsMap[rRef];
      if (absolute_r === undefined) {
        return undefined;
      }
    } else if (typeof rRef === "number" && !isNaN(rRef) && rRef >= 0) {
      absolute_r = rRef;
    } else {
      return undefined;
    }
    if (typeof cRef === "string") {
      absolute_c = colTagsMap[cRef];
      if (absolute_c === undefined) {
        return undefined;
      }
    } else if (typeof cRef === "number" && !isNaN(cRef) && cRef >= 0) {
      absolute_c = cRef;
    } else {
      return undefined;
    }
    if (isNaN(absolute_r) || isNaN(absolute_c)) {
      return undefined;
    }
    const value = text?.[absolute_r]?.[absolute_c];
    return value;
  } // End function fGetVal_GUICache

  /** function fShowMessage
   * Purpose: Displays the message modal and returns a Promise that resolves on close.
   * Assumptions: The modal HTML exists in the DOM.
   * @param {string} message - The text or HTML to display.
   * @returns {Promise<void>} A Promise that resolves when the modal is hidden.
   */
  async function fShowMessage(message) {
    const overlay = document.getElementById("messageModal");
    const textElement = document.getElementById("messageText");
    const closeButton = document.getElementById("closeMessageModal");
    if (!overlay || !textElement || !closeButton) {
      console.error(
        "fShowMessage: One or more modal elements not found in DOM!"
      );
      alert(
        "Error: Message display component is missing.\n\n" +
          message.replace(/<br\s*\/?>/gi, "\n")
      );
      return Promise.reject(new Error("Message modal elements not found."));
    }
    gUI.isCurrentMessageModalUserCloseable = true;
    closeButton.style.display = "";
    textElement.innerHTML = message;
    overlay.style.display = "flex";
    fMyConsoleLog(
      `💬 Displayed user-closeable message: "${String(message).substring(
        0,
        50
      )}..."`
    );
    return new Promise((resolve) => {
      gUI.messagePromiseResolve = resolve;
    });
  } // End function fShowMessage

  /** function fShowMessageNoClose
   * Purpose: Displays the message modal without a close button.
   * Assumptions: The modal HTML exists in the DOM. Must be closed programmatically.
   * @param {string} message - The text or HTML to display.
   * @returns {void}
   */
  function fShowMessageNoClose(message) {
    const overlay = document.getElementById("messageModal");
    const textElement = document.getElementById("messageText");
    const closeButton = document.getElementById("closeMessageModal");
    if (!overlay || !textElement || !closeButton) {
      console.error(
        "fShowMessageNoClose: One or more modal elements not found in DOM!"
      );
      alert(
        "Error: Message display component is missing.\n\n(NC) " +
          message.replace(/<br\s*\/?>/gi, "\n")
      );
      return;
    }
    gUI.isCurrentMessageModalUserCloseable = false;
    closeButton.style.display = "none";
    textElement.innerHTML = message;
    overlay.style.display = "flex";
    fMyConsoleLog(
      `🔒 Displayed non-closeable message: "${String(message).substring(
        0,
        50
      )}..."`
    );
  } // End function fShowMessageNoClose

  /** function fHideMessage
   * Purpose: Hides the message modal and resolves any pending Promise.
   * Assumptions: Modal may or may not be visible.
   * @param {}
   * @returns {void}
   */
  function fHideMessage() {
    const overlay = document.getElementById("messageModal");
    const closeButton = document.getElementById("closeMessageModal");
    if (overlay) {
      overlay.style.display = "none";
    } else {
      console.error(
        "fHideMessage: Message modal overlay element (#messageModal) not found."
      );
    }
    if (closeButton) {
      closeButton.style.display = "";
    }
    gUI.isCurrentMessageModalUserCloseable = true;
    if (typeof gUI.messagePromiseResolve === "function") {
      gUI.messagePromiseResolve();
      gUI.messagePromiseResolve = null;
    }
    fMyConsoleLog("Message modal hidden and state reset.");
  } // End function fHideMessage

  /** function fSetupMessageModalListeners
   * Purpose: Sets up event listeners for closing the message modal.
   * Assumptions: The modal HTML exists in the DOM.
   * @param {}
   * @returns {void}
   */
  function fSetupMessageModalListeners() {
    fMyConsoleLog("🖱️ Setting up Message Modal Listeners...");
    const overlayElement = document.getElementById("messageModal");
    const closeButtonElement = document.getElementById("closeMessageModal");
    if (!overlayElement) {
      console.error(
        "Setup failed: Message modal overlay element (#messageModal) not found *during listener setup*."
      );
      fMyConsoleLog(
        "⚠️ Message Modal Listeners NOT Attached (overlay missing)."
      );
      return;
    }
    if (!closeButtonElement) {
      console.error(
        "Setup failed: Message modal close button (#closeMessageModal) not found *during listener setup*."
      );
      fMyConsoleLog(
        "⚠️ Message Modal Listeners NOT Attached (button missing)."
      );
      return;
    }
    closeButtonElement.addEventListener("click", fHideMessage);
    overlayElement.addEventListener("click", (event) => {
      if (!gUI.isCurrentMessageModalUserCloseable) return;
      if (event.target === overlayElement) {
        fHideMessage();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (!gUI.isCurrentMessageModalUserCloseable) return;
      if (overlayElement.style.display !== "none" && event.key === "Escape") {
        fHideMessage();
      }
    });
    fMyConsoleLog("✅ Message Modal Listeners Attached.");
  } // End function fSetupMessageModalListeners

  /** function fShowPrompt
   * Purpose: Displays the prompt modal and returns a Promise resolving with a boolean.
   * Assumptions: The modal HTML exists in the DOM.
   * @param {string} message - The text or HTML question to display.
   * @returns {Promise<boolean>} A Promise resolving true for 'Yes', false for 'No'.
   */
  async function fShowPrompt(message) {
    if (!gUI.promptModalOverlay)
      gUI.promptModalOverlay = document.getElementById("promptModal");
    if (!gUI.promptModalText)
      gUI.promptModalText = document.getElementById("promptText");
    if (!gUI.promptModalOverlay || !gUI.promptModalText) {
      console.error("Prompt modal elements not cached or found in the DOM!");
      if (!gUI.promptModalOverlay) console.error("Missing: #promptModal");
      if (!gUI.promptModalText) console.error("Missing: #promptText");
      return Promise.reject(new Error("Prompt modal elements not found."));
    }
    gUI.promptModalText.innerHTML = message;
    gUI.promptModalOverlay.style.display = "flex";
    return new Promise((resolve, reject) => {
      gUI.promptPromiseResolve = resolve;
      gUI.promptPromiseReject = reject;
    });
  } // End function fShowPrompt

  /** function fHandlePromptResponse
   * Purpose: Hides the prompt modal and resolves the pending Promise.
   * Assumptions: Called by event listeners in fSetupPromptModalListeners.
   * @param {boolean} userResponse - The user's choice (true/false).
   * @returns {void}
   */
  function fHandlePromptResponse(userResponse) {
    if (gUI.promptModalOverlay) {
      gUI.promptModalOverlay.style.display = "none";
    } else {
      console.error(
        "Prompt modal overlay element (#promptModal) not found when trying to hide."
      );
    }
    if (typeof gUI.promptPromiseResolve === "function") {
      gUI.promptPromiseResolve(userResponse);
      fMyConsoleLog(`Prompt Promise Resolved with: ${userResponse}`);
    } else {
      console.error(
        "Prompt promise resolve function not found when trying to resolve."
      );
    }
    gUI.promptPromiseResolve = null;
    gUI.promptPromiseReject = null;
  } // End function fHandlePromptResponse

  /** function fSetupPromptModalListeners
   * Purpose: Sets up event listeners for the prompt modal 'Yes' and 'No' buttons.
   * Assumptions: The modal HTML exists in the DOM.
   * @param {}
   * @returns {void}
   */
  function fSetupPromptModalListeners() {
    fMyConsoleLog("🖱️ Setting up Prompt Modal Listeners...");
    if (!gUI.promptYesButton)
      gUI.promptYesButton = document.getElementById("promptYesButton");
    if (!gUI.promptNoButton)
      gUI.promptNoButton = document.getElementById("promptNoButton");
    if (!gUI.promptYesButton) {
      console.error(
        "Setup failed: Prompt 'Yes' button (#promptYesButton) not found *during listener setup*."
      );
      fMyConsoleLog(
        "⚠️ Prompt Modal Listeners NOT Attached (Yes button missing)."
      );
      return;
    }
    if (!gUI.promptNoButton) {
      console.error(
        "Setup failed: Prompt 'No' button (#promptNoButton) not found *during listener setup*."
      );
      fMyConsoleLog(
        "⚠️ Prompt Modal Listeners NOT Attached (No button missing)."
      );
      return;
    }
    gUI.promptYesButton.addEventListener("click", () =>
      fHandlePromptResponse(true)
    );
    gUI.promptNoButton.addEventListener("click", () =>
      fHandlePromptResponse(false)
    );
    fMyConsoleLog("✅ Prompt Modal Listeners Attached.");
  } // End function fSetupPromptModalListeners

  /** function fShowInputPrompt
   * Purpose: Displays a custom modal with a text input and returns a Promise.
   * Assumptions: The modal HTML exists in the DOM.
   * Notes: It focuses the 'Save' button by default to fix a browser rendering bug.
   * @param {string} title - The title to display in the modal.
   * @param {string} [prefillText=""] - The initial text for the input field.
   * @returns {Promise<string | object | null>} A Promise resolving with the result.
   */
  async function fShowInputPrompt(title, prefillText = "") {
    const overlay = document.getElementById("inputPromptModal");
    const titleEl = document.getElementById("inputPromptTitle");
    const inputEl = document.getElementById("inputPromptText");
    const saveBtn = document.getElementById("inputPromptSaveButton");
    if (!overlay || !titleEl || !inputEl || !saveBtn) {
      console.error("Input prompt modal elements not found in DOM!");
      return Promise.reject(
        new Error("Input prompt modal elements not found.")
      );
    }
    titleEl.textContent = title;
    inputEl.value = prefillText;
    overlay.style.display = "flex";
    setTimeout(() => {
      saveBtn.focus();
    }, 0);
    return new Promise((resolve) => {
      gUI.promptPromiseResolve = resolve;
    });
  } // End function fShowInputPrompt

  /** function fHandleInputPromptResponse
   * Purpose: Hides the input prompt modal and resolves the pending Promise.
   * Assumptions: Called by event listeners in fSetupInputPromptModalListeners.
   * @param {string | object | null} response - The user's response (text, clear object, or null).
   * @returns {void}
   */
  function fHandleInputPromptResponse(response) {
    const overlay = document.getElementById("inputPromptModal");
    if (overlay) {
      overlay.style.display = "none";
    } else {
      console.error(
        "Input prompt modal overlay element (#inputPromptModal) not found when trying to hide."
      );
    }
    if (typeof gUI.promptPromiseResolve === "function") {
      gUI.promptPromiseResolve(response);
      fMyConsoleLog(`Input Prompt Promise Resolved.`);
    } else {
      console.error(
        "Input prompt promise resolve function not found when trying to resolve."
      );
    }
    gUI.promptPromiseResolve = null;
    gUI.promptPromiseReject = null;
  } // End function fHandleInputPromptResponse

  /** function fSetupInputPromptModalListeners
   * Purpose: Sets up event listeners for the custom input prompt modal buttons.
   * Assumptions: Modal HTML and fHandleInputPromptResponse exist.
   * @param {}
   * @returns {void}
   */
  function fSetupInputPromptModalListeners() {
    fMyConsoleLog("🖱️ Setting up Input Prompt Modal Listeners...");
    const saveBtn = document.getElementById("inputPromptSaveButton");
    const clearBtn = document.getElementById("inputPromptClearButton");
    const cancelBtn = document.getElementById("inputPromptCancelButton");
    const inputEl = document.getElementById("inputPromptText");
    if (!saveBtn || !clearBtn || !cancelBtn || !inputEl) {
      console.error("Input prompt modal buttons or input field not found.");
      return;
    }
    saveBtn.addEventListener("click", () =>
      fHandleInputPromptResponse(inputEl.value)
    );
    clearBtn.addEventListener("click", () =>
      fHandleInputPromptResponse({ clear: true })
    );
    cancelBtn.addEventListener("click", () => fHandleInputPromptResponse(null));
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        fHandleInputPromptResponse(inputEl.value);
      } else if (event.key === "Escape") {
        event.preventDefault();
        fHandleInputPromptResponse(null);
      }
    });
    fMyConsoleLog("✅ Input Prompt Modal Listeners Attached.");
  } // End function fSetupInputPromptModalListeners
</script>
