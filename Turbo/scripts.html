<script>
  // scripts.html //

  // ==========================================================================
  // === Core Cell Creation Helpers       (End of Low-Level Utilities) ===
  // ==========================================================================

  /** function fMakeCorrectCheckBoxType
   * Purpose: Creates a checkbox element with appropriate state and attributes for a grid cell.
   * Assumptions: Disables the checkbox if the cell background is not white.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {HTMLInputElement} The configured checkbox element.
   */
  function fMakeCorrectCheckBoxType(r, c) {
    const value = gUI.arr[r]?.[c];
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.dataset.r = r;
    checkbox.dataset.c = c;
    const bgColor = gUI.format?.bg?.[r]?.[c];
    const isNonWhite =
      bgColor &&
      bgColor.toLowerCase() !== "#ffffff" &&
      bgColor.toLowerCase() !== "#fff";
    checkbox.disabled = isNonWhite;
    const valStr = String(value).toUpperCase();
    checkbox.checked = value === true || valStr === "TRUE";
    if (fIsSkRadioGroupMember(r, c)) {
      checkbox.dataset.skGroup = "true";
    }
    return checkbox;
  } // End function fMakeCorrectCheckBoxType

  /** function fCheckIfEditable
   * Purpose: Determines if a cell should be contentEditable.
   * Assumptions: gUI.headerButtonCoords has been populated. This is the primary fix for the vanishing button bug.
   * @param {number} r - 0-based row index of the cell.
   * @param {number} c - 0-based column index of the cell.
   * @param {string | null} bgColor - Background color hex string or null.
   * @param {boolean} isCheckbox - True if the cell contains a checkbox.
   * @returns {boolean} True if the cell should be editable, false otherwise.
   */
  function fCheckIfEditable(r, c, bgColor, isCheckbox) {
    if (gUI.headerButtonCoords.has(`${r},${c}`)) {
      return false;
    }
    const isMetaRange =
      gUI.range?.meta && fIsCellInRangeArray(r, c, [gUI.range.meta]);
    const isMetaChannelRange =
      gUI.range?.metaChannel &&
      fIsCellInRangeArray(r, c, [gUI.range.metaChannel]);
    if (isMetaRange || isMetaChannelRange) {
      return true;
    }
    const isWhiteBg =
      !bgColor || bgColor.toLowerCase() === "#ffffff" || bgColor === "white";
    return isWhiteBg && !isCheckbox;
  } // End function fCheckIfEditable

  /** function fCreateAndFormatCell
   * Purpose: Creates and formats a single grid cell div element.
   * Assumptions: This is the core cell creation function called during rendering.
   * Notes: Handles content (text, checkbox, dropdown), URL/image/note tags, editability, and styling. Defers creation of empty ability dropdowns by using a placeholder.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any} value - The raw value for the cell from gUI.arr.
   * @param {object} rowFormat - Formatting object for this specific row.
   * @returns {HTMLElement} The configured cell div element.
   */
  function fCreateAndFormatCell(r, c, value, rowFormat) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const originalValue = value ?? "";
    const valStr = String(originalValue).toUpperCase();
    const isCheckbox =
      value === true ||
      value === false ||
      valStr === "TRUE" ||
      valStr === "FALSE";
    const bgColor = rowFormat.bg?.[c];
    const isEditable = fCheckIfEditable(r, c, bgColor, isCheckbox);
    fSetCellAttributes(cell, r, c, isEditable);
    if (gUI.customNotes?.[r]?.[c]?.trim()) {
      cell.classList.add("has-custom-note");
    } else {
      fCheckAndTagNote(cell, r, c);
    }
    const abilityCol = fResolveCol("Ability");
    if (
      c === abilityCol &&
      typeof value === "string" &&
      value.startsWith("⚡")
    ) {
      cell.classList.add("custom-ability-cell");
    }
    const dropConfig = fFindDropdownMatch(r, c);
    if (dropConfig) {
      const isAbilityDropdown = dropConfig.gUIListKey === "myCSListFSData";
      const isEmpty = originalValue === "" || originalValue === null;
      if (isAbilityDropdown && isEmpty) {
        const placeholder = document.createElement("div");
        placeholder.className = "dropdown-placeholder";
        cell.appendChild(placeholder);
      } else {
        const select = fMakeDropdown(r, c, dropConfig, value);
        cell.appendChild(select);
      }
      cell.style.padding = "0";
      cell.style.overflow = "visible";
    } else {
      const { displayValue } = fCheckAndTagUrl(cell, originalValue);
      fPopulateCellContent(cell, r, c, displayValue, isCheckbox);
    }
    fApplyCellFormatting(cell, c, bgColor, rowFormat);
    return cell;
  } // End function fCreateAndFormatCell

  /** function fFindDropdownMatch
   * Purpose: Checks if coordinates fall within any dropdown range and returns the matching configuration.
   * Assumptions: gUI.dropDownBox contains valid dropdown configurations.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {object | null} The dropdown config object if found, otherwise null.
   */
  function fFindDropdownMatch(r, c) {
    for (const config of gUI.dropDownBox) {
      for (const range of config.ranges) {
        const r1 = fResolveRow(range.r1),
          r2 = fResolveRow(range.r2);
        const c1 = fResolveCol(range.c1),
          c2 = fResolveCol(range.c2);
        if (
          !isNaN(r1) &&
          !isNaN(r2) &&
          !isNaN(c1) &&
          !isNaN(c2) &&
          r >= Math.min(r1, r2) &&
          r <= Math.max(r1, r2) &&
          c >= Math.min(c1, c2) &&
          c <= Math.max(c1, c2)
        ) {
          return config;
        }
      }
    }
    return null;
  } // End function fFindDropdownMatch

  /** function fMakeDropdown
   * Purpose: Builds a <select> element populated with choices for a grid dropdown.
   * Assumptions: The config object and choices array are valid.
   * @param {number} r - 0-based row index for data attributes.
   * @param {number} c - 0-based column index for data attributes.
   * @param {object} config - Dropdown configuration object from gUI.dropDownBox.
   * @param {any} currentVal - The current value to pre-select.
   * @returns {HTMLSelectElement} The configured <select> element.
   */
  function fMakeDropdown(r, c, config, currentVal) {
    const select = document.createElement("select");
    select.dataset.r = r;
    select.dataset.c = c;
    for (const choice of config.choices) {
      const option = document.createElement("option");
      option.value = String(choice);
      option.textContent = String(choice);
      if (String(choice) === String(currentVal)) {
        option.selected = true;
      }
      select.appendChild(option);
    }
    select.classList.add("grid-dropdown");
    return select;
  } // End function fMakeDropdown

  /** function fSetCellAttributes
   * Purpose: Sets data attributes, contentEditable, and styles for a cell.
   * Assumptions: Prevents text-alignment styles from being applied to header button cells.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {boolean} isEditable - True if the cell should be contentEditable.
   * @returns {void}
   */
  function fSetCellAttributes(cell, r, c, isEditable) {
    cell.dataset.r = r;
    cell.dataset.c = c;
    if (isEditable) {
      cell.contentEditable = true;
      if (!gUI.headerButtonCoords.has(`${r},${c}`)) {
        cell.style.justifyContent = "flex-start";
        cell.style.textAlign = "left";
      }
    }
  } // End function fSetCellAttributes

  /** function fCheckAndTagNote
   * Purpose: Adds the 'has-note' CSS class to a cell if a corresponding note exists.
   * Assumptions: gUI.notes is populated.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {void}
   */
  function fCheckAndTagNote(cell, r, c) {
    const noteText = gUI.notes?.[r]?.[c]?.trim();
    if (noteText) {
      cell.classList.add("has-note");
    }
  } // End function fCheckAndTagNote

  /** function fCheckAndTagUrl
   * Purpose: Checks if a cell's value is a URL and tags it with appropriate classes and data attributes.
   * Assumptions: Handles standard URLs, Google Drive links, and direct image links.
   * @param {HTMLElement} cell - The cell div element.
   * @param {any} value - The raw value for the cell from gUI.arr.
   * @returns {object} An object { displayValue, isUrl }.
   */
  function fCheckAndTagUrl(cell, value) {
    const trimmed = typeof value === "string" ? value.trim() : "";
    const isUrl =
      trimmed.startsWith("http://") || trimmed.startsWith("https://");
    let displayValue = value;
    if (!isUrl) {
      return {
        displayValue,
        isUrl,
      };
    }
    cell.classList.add("url-link");
    cell.dataset.url = trimmed;
    const driveMatch = trimmed.match(/drive\.google\.com\/file\/d\/([-\w]+)/);
    const imgExts = /\.(png|jpg|jpeg|gif|webp|svg)$/i;
    if (driveMatch && driveMatch[1]) {
      const fileId = driveMatch[1];
      const imageUrl = "https://drive.google.com/uc?export=view&id=" + fileId;
      cell.classList.add("image-link");
      cell.dataset.imageSrc = imageUrl;
    } else if (imgExts.test(trimmed)) {
      cell.classList.add("image-link");
      cell.dataset.imageSrc = trimmed;
    }
    return {
      displayValue,
      isUrl,
    };
  } // End function fCheckAndTagUrl

  /** function fPopulateCellContent
   * Purpose: Populates a cell with either a checkbox or text content wrapped in a span.
   * Assumptions: Strips trailing ID patterns from text content before displaying.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any} displayValue - The value to display.
   * @param {boolean} isCheckbox - True if the cell should contain a checkbox.
   * @returns {void}
   */
  function fPopulateCellContent(cell, r, c, displayValue, isCheckbox) {
    if (isCheckbox) {
      cell.appendChild(fMakeCorrectCheckBoxType(r, c));
    } else {
      const idPattern = /\s{2,}_\w{6}$/;
      const text =
        typeof displayValue === "string" && idPattern.test(displayValue)
          ? displayValue.replace(idPattern, "")
          : displayValue;
      const textSpan = document.createElement("span");
      textSpan.textContent = text ?? "";
      cell.appendChild(textSpan);
    }
  } // End function fPopulateCellContent

  /** function fApplyCellFormatting
   * Purpose: Applies styles to a cell element based on the provided row formatting data.
   * Assumptions: The rowFormat object contains arrays of styles indexed by column.
   * @param {HTMLElement} cell - The cell div element to style.
   * @param {number} c - 0-based column index.
   * @param {string | null} bgColor - Background color hex string.
   * @param {object} rowFormat - Object containing formatting arrays for the row.
   * @returns {void}
   */
  function fApplyCellFormatting(cell, c, bgColor, rowFormat) {
    if (bgColor) {
      cell.style.backgroundColor = bgColor;
    }
    const finalFontColor = null;
    cell.style.color = finalFontColor || "";
    const { weight, fontSize, fontStyle, fontFamily, wrap } = rowFormat;
    if (weight?.[c]) cell.style.fontWeight = weight[c];
    if (fontSize?.[c]) cell.style.fontSize = `${fontSize[c]}px`;
    if (fontStyle?.[c]) cell.style.fontStyle = fontStyle[c];
    if (fontFamily?.[c]) cell.style.fontFamily = fontFamily[c];
    if (wrap?.[c]) {
      cell.classList.add("wrap");
    }
  } // End function fApplyCellFormatting

  /** function fRenderTurbosFullGrid
   * Purpose: Main controller function to render the entire grid dynamically.
   * Assumptions: Renders cells in chunks using requestAnimationFrame for performance.
   * @param {Function} callback - Function to execute after the grid is fully rendered.
   * @returns {void}
   */
  function fRenderTurbosFullGrid(callback) {
    fMyConsoleLog("⚙️ Rendering Full Grid...");
    const grid = document.getElementById("grid");
    const gameArr = gUI.arr;
    const format = gUI.format || {};
    if (!fInitGridAndSettings(grid, gameArr)) {
      return;
    }
    const numRows = gameArr.length;
    const numCols = gameArr[0].length;
    fSetGridColumnWidths(grid, format, numCols);
    fSetGridTagsFromHeaders();
    gUI.grid2D = Array.from(
      {
        length: numRows,
      },
      () => Array(numCols).fill(null)
    );
    fMyConsoleLog(`🏎️ Rendering ${numRows} rows in chunks of 50...`);
    const renderChunk = fRenderChunkFactory(
      grid,
      gameArr,
      format,
      50,
      callback
    );
    requestAnimationFrame(renderChunk);
  } // End function fRenderTurbosFullGrid

  /** function fInitGridAndSettings
   * Purpose: Validates the grid container and data array, and clears existing content.
   * Assumptions: This is the first step of rendering.
   * @param {HTMLElement} grid - The grid container element (#grid).
   * @param {any[][]} gameArr - The 2D array of grid data (gUI.arr).
   * @returns {boolean} True if grid and data are valid, false otherwise.
   */
  function fInitGridAndSettings(grid, gameArr) {
    if (!grid) {
      console.error("❌ Grid container #grid not found!");
      return false;
    }
    if (
      !Array.isArray(gameArr) ||
      gameArr.length === 0 ||
      !Array.isArray(gameArr[0])
    ) {
      console.error("❌ gUI.arr is empty or malformed. Cannot render grid.");
      grid.innerHTML =
        '<p style="color:red;">Error: Invalid data array for rendering.</p>';
      return false;
    }
    grid.innerHTML = "";
    return true;
  } // End function fInitGridAndSettings

  /** function fSetGridColumnWidths
   * Purpose: Applies the 'grid-template-columns' CSS style to the grid container.
   * Assumptions: `gUI.format.colWidths` exists and is an array of numbers.
   * @param {HTMLElement} grid - The grid container element (#grid).
   * @param {object} format - The formatting object containing 'colWidths' array.
   * @param {number} numCols - The total number of columns in the grid.
   * @returns {void}
   */
  function fSetGridColumnWidths(grid, format, numCols) {
    const colWidths = format.colWidths || [];
    const gridTemplateColumns = colWidths.map((w) => `${w || 60}px`).join(" ");
    grid.style.gridTemplateColumns = gridTemplateColumns;
    fMyConsoleLog(`📐 Applied ${numCols} column widths`);
  } // End function fSetGridColumnWidths

  /** function fBuildRowFormat
   * Purpose: Extracts and returns a formatting object specific to a single row index.
   * Assumptions: `gUI.format` is populated with arrays of formatting data.
   * @param {object} format - The main grid format object (gUI.format).
   * @param {number} rowIdx - The 0-based row index for which to extract formats.
   * @returns {object} An object containing formatting arrays for the specified row.
   */
  function fBuildRowFormat(format, rowIdx) {
    return {
      bg: format.bg?.[rowIdx],
      fontColorHex: format.fontColorHex?.[rowIdx],
      weight: format.weight?.[rowIdx],
      fontSize: format.fontSize?.[rowIdx],
      fontStyle: format.fontStyle?.[rowIdx],
      fontFamily: format.fontFamily?.[rowIdx],
      wrap: format.wrap?.[rowIdx],
    };
  } // End function fBuildRowFormat

  /** function fAppendRowCells
   * Purpose: Creates all cell elements for a single row and appends them to a document fragment.
   * Assumptions: This is called within the chunked rendering loop.
   * @param {DocumentFragment} fragment - Fragment to append created cells to.
   * @param {number} rowIdx - 0-based index of the row being rendered.
   * @param {any[]} rowData - Array of values for the current row.
   * @param {object} rowFormat - Formatting object for the current row.
   * @param {number} numCols - Total number of columns in the grid.
   * @returns {void}
   */
  function fAppendRowCells(fragment, rowIdx, rowData, rowFormat, numCols) {
    for (let c = 0; c < numCols; c++) {
      const value = rowData?.[c];
      const cell = fCreateAndFormatCell(rowIdx, c, value, rowFormat);
      gUI.grid2D[rowIdx][c] = cell;
      fragment.appendChild(cell);
    }
  } // End function fAppendRowCells

  /** function fRenderChunkFactory
   * Purpose: Creates a closure function responsible for rendering grid rows in chunks.
   * Assumptions: Called by `function fRenderTurbosFullGrid`.
   * @param {HTMLElement} grid - The grid container element.
   * @param {any[][]} gameArr - The 2D array of grid data.
   * @param {object} format - The main grid format object.
   * @param {number} chunkSize - The number of rows to render per chunk.
   * @param {Function} callback - Function to call after all chunks are rendered.
   * @returns {Function} The `renderChunk` closure function.
   */
  function fRenderChunkFactory(grid, gameArr, format, chunkSize, callback) {
    let r = 0;
    const numRows = gameArr.length;
    const numCols = gameArr[0].length;
    return function renderChunk() {
      const fragment = document.createDocumentFragment();
      const endRow = Math.min(r + chunkSize, numRows);
      for (let rowIdx = r; rowIdx < endRow; rowIdx++) {
        const rowData = gameArr[rowIdx];
        const rowFormat = fBuildRowFormat(format, rowIdx);
        fAppendRowCells(fragment, rowIdx, rowData, rowFormat, numCols);
      }
      grid.appendChild(fragment);
      r = endRow;
      if (r < numRows) {
        requestAnimationFrame(renderChunk);
      } else {
        fMyConsoleLog(`✅ Grid Rendered (${numRows} rows)`);
        if (typeof callback === "function") {
          fMyConsoleLog("🚀 Applying Post-Render Formatting...");
          setTimeout(callback, 0);
        }
      }
    };
  } // End function fRenderChunkFactory

  /** function fApplySpecialAlignments
   * Purpose: Applies specific text alignment classes to predefined cell ranges.
   * Assumptions: gUI.grid2D is populated, and the ranges are defined in gUI.range.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplySpecialAlignments() {
    fMyConsoleLog("✨ Applying Special Alignments...");
    const alignmentConfigs = [
      {
        className: "left-align-text",
        ranges: gUI.range?.abilityNameCells || [],
      },
    ];
    let cellsStyled = 0;
    alignmentConfigs.forEach((config) => {
      if (!config.className || !Array.isArray(config.ranges)) return;
      config.ranges.forEach((range) => {
        if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
          console.warn(
            "fApplySpecialAlignments: Skipping invalid range object:",
            range
          );
          return;
        }
        const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
        if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
          console.warn(
            "fApplySpecialAlignments: Skipping range due to unresolved indices:",
            range
          );
          return;
        }
        const rMin = Math.min(resolved.r1, resolved.r2);
        const rMax = Math.max(resolved.r1, resolved.r2);
        const cMin = Math.min(resolved.c1, resolved.c2);
        const cMax = Math.max(resolved.c1, resolved.c2);
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            const cell = gUI.grid2D?.[r]?.[c];
            if (cell) {
              cell.classList.add(config.className);
              cellsStyled++;
            }
          }
        }
      });
    });
    fMyConsoleLog(`✅ Special Alignments Applied to ${cellsStyled} cells.`);
  } // End function fApplySpecialAlignments

  /** function fSetTurbosGridHeaderRows
   * Purpose: Makes header rows sticky and hides utility rows.
   * Assumptions: gUI.grid2D is populated. This function applies inline styles for reliability.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Unused options placeholder.
   * @returns {boolean} True when sticky header was applied; false if grid/cells missing.
   */
  function fSetTurbosGridHeaderRows(parameter1 = "", parameter2 = {}) {
    try {
      const gridEl = document.getElementById("grid");
      const grid = gUI?.grid2D;
      const numRows = Array.isArray(grid) ? grid.length : 0;
      const numCols = numRows
        ? Array.isArray(grid[0])
          ? grid[0].length
          : 0
        : 0;
      if (!gridEl || !numRows || !numCols) return false;
      if (!gridEl.style.position) gridEl.style.position = "relative";
      if (!gridEl.style.overflowY) gridEl.style.overflowY = "auto";
      const stickyRows = [2, 3, 4];
      const belowRow = 5;
      for (let r = 2; r <= Math.min(5, numRows - 1); r++) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (!cell) continue;
          cell.classList?.remove("sticky-header", "below-sticky");
          cell.style.position = "";
          cell.style.top = "";
          cell.style.zIndex = "";
        }
      }
      for (let r = 0; r <= 1 && r < numRows; r++) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (cell) cell.style.display = "none";
        }
      }
      const getRowHeight = (rowIndex) => {
        const h = gUI?.rowHeights?.[rowIndex];
        return Number.isFinite(h) && h > 0 ? h : gUI.ROW_HEIGHT_PX || 20;
      };
      let cumulativeTop = 0;
      for (let i = 0; i < stickyRows.length; i++) {
        const r = stickyRows[i];
        const topPx = cumulativeTop;
        cumulativeTop += getRowHeight(r);
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (!cell || cell.style.display === "none") continue;
          cell.classList.add("sticky-header");
          cell.style.position = "sticky";
          cell.style.top = `${topPx}px`;
          cell.style.zIndex = "50";
          const bg = gUI?.format?.bg?.[r]?.[c];
          if (bg) cell.style.backgroundColor = bg;
        }
      }
      if (belowRow < numRows) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[belowRow]?.[c];
          if (!cell || cell.style.display === "none") continue;
          cell.classList.add("below-sticky");
        }
      }
      fMyConsoleLog?.("✅ Sticky Header Applied");
      return true;
    } catch (err) {
      console.error("fSetTurbosGridHeaderRows error:", err);
      return false;
    }
  } // End function fSetTurbosGridHeaderRows

  /** function fAppliesGridColumnOnOff
   * Purpose: Recalculates and applies the 'grid-template-columns' CSS style based on hidden columns.
   * Assumptions: gUI.hiddenColumns, gUI.format.colWidths, and gUI.arr are populated.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fAppliesGridColumnOnOff() {
    const grid = document.getElementById("grid");
    if (!grid || !gUI.format.colWidths || !gUI.arr || gUI.arr.length === 0) {
      console.error(
        "fAppliesGridColumnOnOff: Missing prerequisites (grid element, colWidths, or arr data)."
      );
      return;
    }
    const numCols = gUI.arr[0].length;
    const colWidths = gUI.format.colWidths || [];
    let templateCols = [];
    for (let c = 0; c < numCols; c++) {
      if (gUI.hiddenColumns.has(c)) {
        templateCols.push("0px");
      } else {
        const width = colWidths[c] || 60;
        templateCols.push(`${width}px`);
      }
    }
    const newTemplateString = templateCols.join(" ");
    grid.style.gridTemplateColumns = newTemplateString;
  } // End function fAppliesGridColumnOnOff

  /** function fSetsGridColumnVisibility
   * Purpose: Hides or shows a single column and updates the grid template.
   * Assumptions: Manages the column index in the gUI.hiddenColumns Set.
   * @param {number} colIndex - 0-based index of the column to modify.
   * @param {boolean} isVisible - True to show the column, false to hide it.
   * @param {boolean} [updateTemplate=true] - If true, recalculates the grid template.
   * @returns {void}
   */
  function fSetsGridColumnVisibility(
    colIndex,
    isVisible,
    updateTemplate = true
  ) {
    if (
      isNaN(colIndex) ||
      colIndex < 0 ||
      !gUI.grid2D[0] ||
      colIndex >= gUI.grid2D[0].length
    ) {
      console.warn(
        `fSetsGridColumnVisibility: Invalid column index ${colIndex}`
      );
      return;
    }
    const numRows = gUI.grid2D.length;
    const currentlyHidden = gUI.hiddenColumns.has(colIndex);
    const needsChange =
      (isVisible && currentlyHidden) || (!isVisible && !currentlyHidden);
    if (needsChange) {
      if (isVisible) {
        gUI.hiddenColumns.delete(colIndex);
      } else {
        gUI.hiddenColumns.add(colIndex);
      }
      for (let r = 0; r < numRows; r++) {
        const cell = gUI.grid2D[r]?.[colIndex];
        if (cell) {
          cell.style.visibility = isVisible ? "" : "collapse";
        }
      }
      if (updateTemplate) {
        fAppliesGridColumnOnOff();
      }
    }
  } // End function fSetsGridColumnVisibility

  /** function fSetGridRowVisibility
   * Purpose: Hides or shows a single row.
   * Assumptions: Manages the row index in the gUI.hiddenRows Set and handles sticky styles.
   * @param {number} rowIndex - 0-based index of the row to modify.
   * @param {boolean} isVisible - True to show the row, false to hide it.
   * @returns {void}
   */
  function fSetGridRowVisibility(rowIndex, isVisible) {
    if (isNaN(rowIndex) || rowIndex < 0 || rowIndex >= gUI.grid2D.length) {
      console.warn(`fSetGridRowVisibility: Invalid row index ${rowIndex}.`);
      return;
    }
    if (isVisible) {
      gUI.hiddenRows.delete(rowIndex);
    } else {
      gUI.hiddenRows.add(rowIndex);
    }
    const numCols = gUI.grid2D[0]?.length || 0;
    for (let c = 0; c < numCols; c++) {
      const cell = gUI.grid2D[rowIndex]?.[c];
      if (cell) {
        cell.style.display = isVisible ? "" : "none";
        if (!isVisible) {
          cell.classList.remove("sticky-header", "below-sticky");
          cell.style.position = "";
          cell.style.top = "";
          cell.style.zIndex = "";
        }
      }
    }
    if (isVisible && rowIndex >= 2 && rowIndex <= 5) {
      fSetTurbosGridHeaderRows();
    }
  } // End function fSetGridRowVisibility

  /** function fApplyGridDynamicMerges
   * Purpose: Applies cell merging based on the `gUI.format.merges` array.
   * Assumptions: Sets grid-column/row span on the anchor cell and hides covered cells.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridDynamicMerges() {
    fMyConsoleLog("🧩 Applying Merges...");
    const merges = gUI.format?.merges || [];
    for (const mergeInfo of merges) {
      const r = mergeInfo.row;
      const c = mergeInfo.col;
      const rs = mergeInfo.rowspan;
      const cs = mergeInfo.colspan;
      const anchor = gUI.grid2D?.[r]?.[c];
      if (!anchor) {
        console.warn(`⚠️ Merge anchor cell not found at [${r},${c}]`);
        continue;
      }
      if (cs > 1) anchor.style.gridColumn = `span ${cs}`;
      if (rs > 1) anchor.style.gridRow = `span ${rs}`;
      for (let rSub = r; rSub < r + rs; rSub++) {
        for (let cSub = c; cSub < c + cs; cSub++) {
          if (rSub === r && cSub === c) continue;
          const cellToHide = gUI.grid2D?.[rSub]?.[cSub];
          if (cellToHide) {
            cellToHide.style.display = "none";
          }
        }
      }
    }
    fMyConsoleLog("✅ Merges Applied");
  } // End function fApplyGridDynamicMerges

  /** function fApplyGridManualBorders
   * Purpose: Applies CSS border styles to cells within predefined sections.
   * Assumptions: Uses gUI.manualBorderSections. Applies top/left to all cells and right/bottom to edges.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridManualBorders() {
    fMyConsoleLog("🖌️ Applying Manual Borders...");
    let appliedCount = 0;
    gUI.manualBorderSections.forEach((section) => {
      const rowStart = fResolveRow(section.r1);
      const colStart = fResolveCol(section.c1);
      const rowEnd = fResolveRow(section.r2);
      const colEnd = fResolveCol(section.c2);
      const borderStyle = section.style || "1px solid #000";
      const edges = section.edges || "";
      if ([rowStart, colStart, rowEnd, colEnd].some((v) => isNaN(v))) {
        console.warn(
          "Skipping manual border section due to invalid tags:",
          section
        );
        return;
      }
      for (let r = rowStart; r <= rowEnd; r++) {
        for (let c = colStart; c <= colEnd; c++) {
          const cell = gUI.grid2D?.[r]?.[c];
          if (!cell || cell.style.display === "none") continue;
          let appliedThisCell = false;
          cell.style.borderTop = borderStyle;
          cell.style.borderLeft = borderStyle;
          appliedThisCell = true;
          if (edges.includes("r") && c === colEnd) {
            cell.style.borderRight = borderStyle;
          }
          if (edges.includes("b") && r === rowEnd) {
            cell.style.borderBottom = borderStyle;
          }
          if (appliedThisCell) appliedCount++;
        }
      }
    });
    fMyConsoleLog(`✅ Manual Borders Applied (${appliedCount} styles set)`);
  } // End function fApplyGridManualBorders

  /** function fApplyGridManualColoring
   * Purpose: Applies specific font colors to predefined ranges based on configuration.
   * Assumptions: Automatically applies a contrasting color if the font color matches the background. Uses `gUI.fontColorRange`, `gUI.grid2D`, `gUI.format.bg`.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridManualColoring() {
    fMyConsoleLog("🎨 Applying Manual Font Colors...");
    const colorConfigArray = gUI.fontColorRange;
    if (!Array.isArray(colorConfigArray)) {
      fMyConsoleLog(
        "ℹ️ Manual font color configuration (gUI.fontColorRange) is not an array or is missing."
      );
      return;
    }
    if (colorConfigArray.length === 0) {
      fMyConsoleLog("ℹ️ Manual font color configuration is empty.");
      return;
    }
    let colorsAppliedCount = 0;
    let contrastAppliedCount = 0;
    colorConfigArray.forEach((colorDef, index) => {
      if (
        !colorDef ||
        typeof colorDef.color !== "string" ||
        !Array.isArray(colorDef.ranges)
      ) {
        console.warn(
          `Skipping invalid color definition at index ${index}:`,
          colorDef
        );
        return;
      }
      const cssColor = colorDef.color;
      const ranges = colorDef.ranges;
      ranges.forEach((range) => {
        if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
          console.warn(
            `Skipping invalid range object for color '${cssColor}':`,
            range
          );
          return;
        }
        const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
        if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
          console.warn(
            `Could not resolve tags for range in color '${cssColor}':`,
            range
          );
          return;
        }
        const rMin = Math.min(resolved.r1, resolved.r2);
        const rMax = Math.max(resolved.r1, resolved.r2);
        const cMin = Math.min(resolved.c1, resolved.c2);
        const cMax = Math.max(resolved.c1, resolved.c2);
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            const cell = gUI.grid2D?.[r]?.[c];
            if (!cell || cell.style.display === "none") continue;
            let cellBgColor = window.getComputedStyle(cell).backgroundColor;
            if (cellBgColor && cellBgColor.startsWith("rgb")) {
              try {
                const rgb = cellBgColor.match(/\d+/g).map(Number);
                cellBgColor =
                  "#" +
                  rgb
                    .map((x) => {
                      const hex = x.toString(16);
                      return hex.length === 1 ? "0" + hex : hex;
                    })
                    .join("");
              } catch (e) {
                cellBgColor =
                  cell.style.backgroundColor ||
                  gUI.format?.bg?.[r]?.[c] ||
                  "#ffffff";
              }
            } else {
              cellBgColor =
                cell.style.backgroundColor ||
                gUI.format?.bg?.[r]?.[c] ||
                "#ffffff";
            }
            const cleanBgColor = cellBgColor.toLowerCase();
            const intendedFontColor = cssColor.toLowerCase();
            if (intendedFontColor === cleanBgColor) {
              cell.style.color = fGetContrastColor(cleanBgColor);
              contrastAppliedCount++;
            } else {
              cell.style.color = intendedFontColor;
              colorsAppliedCount++;
            }
          }
        }
      });
    });
    fMyConsoleLog(
      `✅ Manual Colors Applied (${colorsAppliedCount} direct, ${contrastAppliedCount} contrast).`
    );
  } // End function fApplyGridManualColoring

  /** function fResizeHeaderButtonImages
   * Purpose: Resizes header button images to a consistent size based on their host cell's height.
   * Assumptions: Header icons use the class 'header-button-img'; merges are already applied.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Options object: { scale, minPx, maxPx }.
   * @returns {boolean} True on completion.
   */
  function fResizeHeaderButtonImages(parameter1 = "", parameter2 = {}) {
    try {
      const scale = Math.min(
        1.0,
        Math.max(0.6, Number(parameter2?.scale) || 0.9)
      );
      const minPx = Math.max(10, Number(parameter2?.minPx) || 16);
      const maxPx = Math.max(minPx, Number(parameter2?.maxPx) || 64);
      const imgs = document.querySelectorAll("#grid .header-button-img");
      let sized = 0;
      imgs.forEach((img) => {
        const cell = img.closest(".cell");
        if (!cell) return;
        const h = Math.max(
          1,
          Math.round(
            cell.clientHeight ||
              parseInt(getComputedStyle(cell).height) ||
              gUI?.ROW_HEIGHT_PX ||
              20
          )
        );
        const target = Math.max(minPx, Math.min(maxPx, Math.round(h * scale)));
        img.style.height = `${target}px`;
        img.style.maxHeight = `${target}px`;
        img.style.width = "auto";
        img.style.maxWidth = "100%";
        img.style.margin = "1px auto";
        sized++;
      });
      fMyConsoleLog?.(
        `✅ Resized ${sized} header button image(s) to fit merged cell height (scale=${scale}).`
      );
      return true;
    } catch (e) {
      fMyConsoleLog?.(
        `⚠️ fResizeHeaderButtonImages soft-failed: ${e?.message || e}`
      );
      return false;
    }
  } // End function fResizeHeaderButtonImages

  /** function fMarkGridOverflowingCells
   * Purpose: Adds an 'overflow-left' class to cells where content is wider than the cell.
   * Assumptions: Optimized to separate DOM reads from writes for performance.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fMarkGridOverflowingCells() {
    fMyConsoleLog("↔️ Checking Cell Overflow (Optimized)...");
    const cells = document.querySelectorAll(
      '#grid .cell:not([style*="display: none"])'
    );
    let cellsToModify = [];
    cells.forEach((cell) => {
      const clientW = cell.clientWidth;
      const scrollW = cell.scrollWidth;
      const shouldOverflow = scrollW > clientW + 1;
      cellsToModify.push({
        cellElement: cell,
        shouldOverflow: shouldOverflow,
      });
    });
    let count = 0;
    cellsToModify.forEach((item) => {
      const cell = item.cellElement;
      const currentlyHasClass = cell.classList.contains("overflow-left");
      if (item.shouldOverflow && !currentlyHasClass) {
        cell.classList.add("overflow-left");
        count++;
      } else if (!item.shouldOverflow && currentlyHasClass) {
        cell.classList.remove("overflow-left");
      }
    });
    fMyConsoleLog(
      `✅ Overflow Checked (Optimized - ${count} cells newly marked)`
    );
  } // End function fMarkGridOverflowingCells

  /** function fHideGridsColumnRange
   * Purpose: Hides one or more ranges of columns.
   * Assumptions: Batches DOM updates by calling `function fAppliesGridColumnOnOff` once at the end.
   * @param {object[]} rangeArray - An array of range definition objects with c1 and c2 properties.
   * @returns {void}
   */
  function fHideGridsColumnRange(rangeArray) {
    fMyConsoleLog(`👁️ Hiding Column Ranges...`);
    if (!Array.isArray(rangeArray)) {
      console.error(
        "fHideGridsColumnRange: Invalid input - requires an array.",
        rangeArray
      );
      return;
    }
    let anyColumnsChanged = false;
    for (const range of rangeArray) {
      if (
        !range ||
        typeof range.c1 === "undefined" ||
        typeof range.c2 === "undefined"
      ) {
        console.warn(
          "fHideGridsColumnRange: Skipping invalid range object:",
          range
        );
        continue;
      }
      const startCol = fResolveCol(range.c1);
      const endCol = fResolveCol(range.c2);
      if (isNaN(startCol) || isNaN(endCol)) {
        console.warn(
          `fHideGridsColumnRange: Skipping range due to invalid tags/indices: ${range.c1}, ${range.c2}`
        );
        continue;
      }
      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);
      for (let c = cMin; c <= cMax; c++) {
        if (!gUI.hiddenColumns.has(c)) {
          fSetsGridColumnVisibility(c, false, false);
          anyColumnsChanged = true;
        }
      }
    }
    if (anyColumnsChanged) {
      fAppliesGridColumnOnOff();
      fMyConsoleLog(`✅ Column Ranges Hidden.`);
    } else {
      fMyConsoleLog(
        `ℹ️ All Specified Column Ranges Already Hidden (or no valid ranges found).`
      );
    }

  /** function fConfineNotesTooltipBox
   * Purpose: Calculates and sets the position for the tooltip, ensuring it stays within the viewport.
   * Assumptions: The tooltip element is visible but may be positioned off-screen.
   * @param {HTMLElement} tooltip - The tooltip element.
   * @param {MouseEvent} event - The mouse event that triggered the hover.
   * @returns {void}
   */
  function fConfineNotesTooltipBox(tooltip, event) {
    if (!tooltip || !event) return;
    const cursorX = event.pageX;
    const cursorY = event.pageY;
    const tooltipRect = tooltip.getBoundingClientRect();
    const tooltipWidth = tooltipRect.width;
    const tooltipHeight = tooltipRect.height;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    let newTop = cursorY + gUI.TOOLTIP_OFFSET_Y;
    let newLeft = cursorX + gUI.TOOLTIP_OFFSET_X;
    if (newLeft + tooltipWidth > viewportWidth + scrollX) {
      newLeft = cursorX - tooltipWidth - gUI.TOOLTIP_OFFSET_X;
      if (newLeft < scrollX) {
        newLeft = scrollX + 5;
      }
    }
    if (newTop + tooltipHeight > viewportHeight + scrollY) {
      newTop = cursorY - tooltipHeight - gUI.TOOLTIP_OFFSET_Y;
      if (newTop < scrollY) {
        newTop = scrollY + 5;
      }
    }
    tooltip.style.top = `${newTop}px`;
    tooltip.style.left = `${newLeft}px`;
  } // End function fConfineNotesTooltipBox

  /** function fHandleCellHover

  /** function fIsTooltipBoxNeeded
   * Purpose: Determines if a tooltip should be shown for a cell.
   * Assumptions: Checks for text overflow or the presence of sheet/custom notes.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {HTMLElement} cell - The cell element.
   * @returns {boolean} True if a tooltip is needed, false otherwise.
   */
  function fIsTooltipBoxNeeded(r, c, cell) {
    const textSpan = cell.querySelector("span");
    let isOverflowing = false;
    if (textSpan) {
      const isHorizontallyOverflowing =
        textSpan.scrollWidth > textSpan.clientWidth + 1;
      const isVerticallyOverflowing =
        textSpan.scrollHeight > textSpan.clientHeight + 1;
      isOverflowing = isHorizontallyOverflowing || isVerticallyOverflowing;
    }
    const sheetNoteText = gUI.notes?.[r]?.[c]?.trim();
    const customNoteText = gUI.customNotes?.[r]?.[c]?.trim();
    return isOverflowing || !!sheetNoteText || !!customNoteText;
  } // End function fIsTooltipBoxNeeded

  /** function fBuildsTooltipBoxesContent
   * Purpose: Constructs the HTML content for the tooltip, combining various sources of text.
   * Assumptions: Combines overflow text, sheet notes, and custom notes.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {HTMLElement} cell - The cell element.
   * @returns {string} HTML string content for the tooltip.
   */
  function fBuildsTooltipBoxesContent(r, c, cell) {
    const textSpan = cell.querySelector("span");
    const sheetNoteText = gUI.notes?.[r]?.[c]?.trim();
    const customNoteText = gUI.customNotes?.[r]?.[c]?.trim();
    let tooltipContent = "";
    let isOverflowing = false;
    if (textSpan) {
      isOverflowing =
        textSpan.scrollWidth > textSpan.clientWidth + 1 ||
        textSpan.scrollHeight > textSpan.clientHeight + 1;
    }
    if (isOverflowing && textSpan) {
      tooltipContent += textSpan.textContent.trim();
    }
    if (sheetNoteText) {
      if (tooltipContent) {
        tooltipContent += "\n---\n";
      }
      tooltipContent += `Note: ${sheetNoteText}`;
    }
    if (customNoteText) {
      if (tooltipContent) {
        tooltipContent += "\n---\n";
      }
      tooltipContent += `<span style="color: red; font-weight: bold; text-decoration: underline;">Custom Note:</span>\n${customNoteText}`;
    }
    return tooltipContent.replace(/\n/g, "<br>");
  } // End function fBuildsTooltipBoxesContent

  /** function fStartTooltipBoxDelayTimer
   * Purpose: Sets a timeout before showing the tooltip for a hovered cell.
   * Assumptions: Clears any previous timeout.
   * @param {HTMLElement} cell - The cell element being hovered over.
   * @param {MouseEvent} event - The mouse event, used for positioning.
   * @returns {void}
   */
  function fStartTooltipBoxDelayTimer(cell, event) {
    clearTimeout(gUI.tooltipTimeoutId);
    gUI.tooltipTimeoutId = setTimeout(() => {
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      if (isNaN(r) || isNaN(c)) {
        console.warn(
          "Tooltip hover: Invalid r/c data attributes.",
          cell.dataset
        );
        fHideTooltip();
        return;
      }
      if (fIsTooltipBoxNeeded(r, c, cell)) {
        gUI.tooltipElement.innerHTML = fBuildsTooltipBoxesContent(r, c, cell);
        gUI.tooltipElement.style.display = "block";
        fConfineNotesTooltipBox(gUI.tooltipElement, event);
      } else {
        fHideTooltip();
      }
    }, gUI.HOVER_DELAY_MS);
  } // End function fStartTooltipBoxDelayTimer

  /** function fHandleCellMouseOut
   * Purpose: Handles mouseout events delegated from the grid to hide the tooltip.
   * Assumptions: Clears any pending tooltip display timeout.
   * @param {MouseEvent} event - The mouseout event object.
   * @returns {void}
   */
  function fHandleCellMouseOut(event) {
    clearTimeout(gUI.tooltipTimeoutId);
    gUI.tooltipTimeoutId = null;
    if (gUI.tooltipElement) {
      gUI.tooltipElement.style.display = "none";
    }
  } // End function fHandleCellMouseOut

  /** function fCreateDropdownElement
   * Purpose: Creates an HTML select element for use within a grid cell dropdown.
   * Assumptions: Populates it with options and pre-selects the current value.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any[]} choices - Array of option values for the dropdown.
   * @param {any} currentValue - The current value from gUI.arr to pre-select.
   * @returns {HTMLSelectElement} The configured <select> element.
   */
  function fCreateDropdownElement(r, c, choices, currentValue) {
    const select = document.createElement("select");
    select.classList.add("grid-dropdown");
    select.dataset.r = r;
    select.dataset.c = c;
    const currentValStr = String(currentValue ?? "");
    choices.forEach((choice) => {
      const option = document.createElement("option");
      option.value = choice;
      option.textContent = choice;
      if (String(choice) === currentValStr) {
        option.selected = true;
      }
      select.appendChild(option);
    });
    return select;
  } // End function fCreateDropdownElement

  /** function fHandleDropdownChange
   * Purpose: Handles the 'change' event for grid dropdowns.
   * Assumptions: Updates `gUI.arr` and triggers `function fProcessAbilityChange` for ability name cells.
   * @param {Event} event - The change event object from the select element.
   * @returns {void}
   */
  function fHandleDropdownChange(event) {
    const select = event.target;
    const r = parseInt(select.dataset.r, 10);
    const c = parseInt(select.dataset.c, 10);
    const newValue = select.value;
    if (isNaN(r) || isNaN(c) || !gUI.arr?.[r]) {
      console.warn(
        `fHandleDropdownChange: Invalid coordinates [${r}, ${c}] from dataset.`
      );
      return;
    }
    const oldValue = gUI.arr[r][c];
    const originalChoice = gUI.dropDownBox
      .find((config) =>
        config.ranges.some((range) => {
          const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
          return (
            !isNaN(resolved.r1) &&
            !isNaN(resolved.c1) &&
            !isNaN(resolved.r2) &&
            !isNaN(resolved.c2) &&
            r >= Math.min(resolved.r1, resolved.r2) &&
            r <= Math.max(resolved.r1, resolved.r2) &&
            c >= Math.min(resolved.c1, resolved.c2) &&
            c <= Math.max(resolved.c1, resolved.c2)
          );
        })
      )
      ?.choices.find((choice) => String(choice) === newValue);
    const finalValue =
      typeof originalChoice === "number" ? Number(newValue) : newValue;
    if (gUI.arr[r][c] !== finalValue) {
      const isAbilityNameCell = fIsCellInRangeArray(
        r,
        c,
        gUI.range.abilNameNoNish
      );
      gUI.arr[r][c] = finalValue;
      fMyConsoleLog(
        `Dropdown [${r}, ${c}] changed to: "${finalValue}" (Type: ${typeof finalValue})`
      );
      if (isAbilityNameCell) {
        fMyConsoleLog(
          `   -> Change detected in Ability Name cell [${r}, ${c}]. Triggering processing...`
        );
        fProcessAbilityChange(r, c, finalValue, oldValue);
      }
      fHandleAutoSaveTextToFirestore();
    }
  } // End function fHandleDropdownChange

  /** function fProcessAbilityChange
   * Purpose: Handles the logic when an Ability dropdown value changes.
   * Assumptions: Dispatches to helpers for clearing or processing the new selection from caches.
   * @param {number} r - Row index of the changed ability cell.
   * @param {number} c - Column index of the changed ability cell.
   * @param {any} newValue - The new value selected in the dropdown.
   * @param {any} oldValue - The previous value in the cell.
   * @returns {void}
   */
  function fProcessAbilityChange(r, c, newValue, oldValue) {
    const funcName = "fProcessAbilityChange";
    fMyConsoleLog(
      `⚙️ ${funcName}: Processing change for Ability/Gear at row ${r}.`
    );
    const newValueStr = String(newValue ?? "").trim();
    const oldValueStr = String(oldValue ?? "").trim();
    if (newValueStr === oldValueStr) {
      fMyConsoleLog(
        `   -> No significant change detected ('${oldValueStr}' -> '${newValueStr}'). Exiting.`
      );
      return;
    }
    if (newValueStr === "") {
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
    } else {
      fHandleClearAbilityRow(r, true);
      fMyConsoleLog(
        `   -> ${funcName}: New Ability/Gear selected: "${newValueStr}". Processing caches...`
      );
      fSetGridValue(r, "Sk1", "⏳");
      const dbAbilityResult = fHandleNewAbilitySelection(
        "DB",
        "Abilities",
        r,
        newValueStr
      );
      const klKnownAbilitiesResult = fHandleNewAbilitySelection(
        "MyKL",
        "KnownAbilities",
        r,
        newValueStr
      );
      const dbGearResult = fHandleNewAbilitySelection(
        "DB",
        "Gear",
        r,
        newValueStr
      );
      if (
        dbAbilityResult === null ||
        klKnownAbilitiesResult === null ||
        dbGearResult === null
      ) {
        fMyConsoleLog(
          `--> ❌ ${funcName}: Critical error occurred during cache processing for row ${r}. Halting.`
        );
        if (fGetGridValue(r, "Sk1") === "⏳") fSetGridValue(r, "Sk1", "ERR");
        return;
      }
      fMyConsoleLog(
        `   -> ${funcName}: Cache Processing Results - DB Ability Found: ${dbAbilityResult.found}, KL KnownAbil Found: ${klKnownAbilitiesResult.found}, DB Gear Found: ${dbGearResult.found}`
      );
      const hasAbilityData =
        dbAbilityResult.found || klKnownAbilitiesResult.found;
      const hasGearData = dbGearResult.found;
      if (!hasAbilityData && !hasGearData) {
        fMyConsoleLog(
          `--> ❌ ${funcName}: Could not find ID "${newValueStr}" in DB Abilities, MyKL, or DB Gear caches for row ${r}.`
        );
        fSetGridValue(r, "Sk1", "NF");
        fShowMessage(
          `❌ Error processing selection: Could not find data in Abilities, MyAbilities, or Gear definitions.`
        ).catch((e) => console.error("ShowMessage Error:", e));
        return;
      }
      fMyConsoleLog(
        `--> ${funcName}: Cache processing complete for row ${r}. Applying data...`
      );
      fSaveNewAbilityToAbilTbl(
        r,
        dbAbilityResult,
        klKnownAbilitiesResult,
        dbGearResult
      );
      fCalculatesEnc_MR_AP();
    }
  } // End function fProcessAbilityChange

  /** function fHandleClearAbilityRow
   * Purpose: Clears relevant cells in a grid row when an ability is removed or changed.
   * Assumptions: The grid is rendered and `gUI.list` contains the column tags to be cleared.
   * @param {number} r - Row index to clear.
   * @param {boolean} [saveAbilityNameID=false] - If true, preserves the 'Ability' cell value.
   * @returns {void}
   */
  function fHandleClearAbilityRow(r, saveAbilityNameID = false) {
    const funcName = "fHandleClearAbilityRow";
    fMyConsoleLog(
      `   -> ${funcName}: Clearing row ${r}${
        saveAbilityNameID ? " (preserving Ability Name)" : ""
      }...`
    );
    gUI.list?.clearAbilityColTags_EmptyString?.forEach((tag) => {
      const c = fResolveCol(tag);
      if (isNaN(c)) return;
      if (tag === "Ability" && saveAbilityNameID) {
        fMyConsoleLog(
          `     -> Skipping clear for column '${tag}' due to saveAbilityNameID=true.`
        );
      } else if (tag === "Ability") {
        const abilityConfig = gUI.dropDownBox.find(
          (config) => config.gUIListKey === "myCSListFSData"
        );
        const cell = gUI.grid2D?.[r]?.[c];
        if (cell && abilityConfig) {
          const dropdown = fCreateDropdownElement(
            r,
            c,
            abilityConfig.choices,
            ""
          );
          cell.innerHTML = "";
          cell.appendChild(dropdown);
          cell.classList.remove("custom-ability-cell");
          cell.style.padding = "0";
          cell.style.overflow = "visible";
          gUI.arr[r][c] = "";
        } else {
          fSetGridValue(r, c, "");
        }
      } else {
        fSetGridValue(r, c, "");
      }
    });
    gUI.list?.clearAbilityColTags_False?.forEach((tag) => {
      fSetGridValue(r, tag, false);
    });
    fMyConsoleLog(
      `   -> ${funcName}: Finished attempting to clear relevant cells for row ${r}.`
    );
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleClearAbilityRow

  /** function fHandleNewAbilitySelection
   * Purpose: Fetches ability/gear data for a given ID from the appropriate pre-loaded cache.
   * Assumptions: The relevant cache objects (e.g., gUI.dbAbilitiesFSData) have been pre-loaded.
   * @param {string} workbookAbr - The workbook abbreviation ('DB' or 'MyKL').
   * @param {string} sheetName - The sheet name ('Abilities', 'KnownAbilities', or 'Gear').
   * @param {number} r - Row index in the grid where the ability was selected.
   * @param {string} newValueStr - The new ability value selected (e.g., 'Name_id').
   * @returns {object | null} An object { dataRow, headerRow, colTagsMap, found: boolean } or null on critical errors.
   */
  function fHandleNewAbilitySelection(workbookAbr, sheetName, r, newValueStr) {
    const funcName = "fHandleNewAbilitySelection";
    fMyConsoleLog(
      `   -> ${funcName}: Processing "${newValueStr}" for ${workbookAbr}/${sheetName} using CACHE...`
    );
    let targetCache = null;
    let cacheKey = "";
    const lowerWorkbookAbr = workbookAbr.toLowerCase();
    const lowerSheetName = sheetName.toLowerCase();
    if (lowerWorkbookAbr === "db" && lowerSheetName === "abilities") {
      targetCache = gUI.dbAbilitiesFSData;
      cacheKey = "gUI.dbAbilitiesFSData";
    } else if (
      lowerWorkbookAbr === "mykl" &&
      lowerSheetName === "knownabilities"
    ) {
      targetCache = gUI.myKLKnownAbilitiesFSData;
      cacheKey = "gUI.myKLKnownAbilitiesFSData";
    } else if (lowerWorkbookAbr === "db" && lowerSheetName === "gear") {
      targetCache = gUI.dbGearFSData;
      cacheKey = "gUI.dbGearFSData";
    } else {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Unsupported workbook/sheet combination: ${workbookAbr}/${sheetName}`
      );
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    if (
      !targetCache ||
      !targetCache.text ||
      !targetCache.rowTagsMap ||
      !targetCache.colTagsMap
    ) {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Required cache ${cacheKey} is not loaded or invalid.`
      );
      fShowMessage(
        `❌ Error: Required definition data (${cacheKey}) not loaded. Please reload.`
      ).catch((e) => console.error("ShowMessage Error:", e));
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    const abilID = fGetIDFromNameID(newValueStr);
    if (!abilID) {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Could not extract valid ID from selected value "${newValueStr}".`
      );
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    fMyConsoleLog(
      `       -> Extracted ID: "${abilID}" for ${workbookAbr}/${sheetName}`
    );
    const rowIndex = fResolveFSDataRow(cacheKey.replace("gUI.", ""), abilID);
    let dataRow = null;
    let found = false;
    if (isNaN(rowIndex)) {
      const isOptionalNotFound =
        (lowerWorkbookAbr === "mykl" && lowerSheetName === "knownabilities") ||
        (lowerWorkbookAbr === "db" && lowerSheetName === "gear");
      if (isOptionalNotFound) {
        if (lowerWorkbookAbr === "db" && lowerSheetName === "gear") {
          fMyConsoleLog(
            `       -> INFO: ID "${abilID}" not found in ${cacheKey}. Expected for non-gear.`
          );
        } else {
          fMyConsoleLog(
            `       -> ID "${abilID}" not found in ${cacheKey}. Expected/handled.`
          );
        }
      } else {
        fMyConsoleLog(
          `       -> ⚠️ ${funcName} Warning: ID "${abilID}" NOT found in ${cacheKey} or index invalid.`
        );
      }
      found = false;
      dataRow = null;
    } else {
      dataRow = targetCache.text[rowIndex];
      if (Array.isArray(dataRow)) {
        found = true;
        fMyConsoleLog(
          `       -> Successfully found row for ID "${abilID}" at index ${rowIndex} in ${cacheKey}.`
        );
      } else {
        fMyConsoleLog(
          `       -> ⚠️ ${funcName} Warning: Found index ${rowIndex} for ID "${abilID}", but data at index is not an array in ${cacheKey}.`
        );
        dataRow = null;
        found = false;
      }
    }
    const headerRow = targetCache.text?.[0] || [];
    const colTagsMap = targetCache.colTagsMap || {};
    return {
      dataRow: dataRow,
      headerRow: headerRow,
      colTagsMap: colTagsMap,
      found: found,
    };
  } // End function fHandleNewAbilitySelection

  /** function fSaveNewAbilityToAbilTbl
   * Purpose: Applies fetched data from various caches to the appropriate columns in a grid row.
   * Assumptions: Also sets default values and calculates derived gear properties.
   * @param {number} r - The target row index in the grid.
   * @param {object | null} dbAbilityResult - Result from DB Abilities fetch.
   * @param {object | null} klKnownAbilitiesResult - Result from KL KnownAbilities fetch.
   * @param {object | null} dbGearResult - Result from DB Gear fetch.
   * @returns {void}
   */
  function fSaveNewAbilityToAbilTbl(
    r,
    dbAbilityResult,
    klKnownAbilitiesResult,
    dbGearResult
  ) {
    const funcName = "fSaveNewAbilityToAbilTbl";
    fMyConsoleLog(
      `   -> ${funcName}: Applying fetched data to grid row ${r}...`
    );
    const dbAbilityRow = dbAbilityResult?.dataRow;
    const dbAbilityColTags = dbAbilityResult?.colTagsMap;
    const klKnownAbilitiesRow = klKnownAbilitiesResult?.dataRow;
    const klKnownAbilitiesColTags = klKnownAbilitiesResult?.colTagsMap;
    const dbGearRow = dbGearResult?.dataRow;
    const dbGearColTags = dbGearResult?.colTagsMap;
    const getValueFromSource = (sourceRow, sourceColTags, sourceTag) => {
      if (!sourceRow || !sourceColTags) return undefined;
      const sourceIndex = sourceColTags[sourceTag];
      if (
        sourceIndex !== undefined &&
        sourceIndex !== null &&
        sourceIndex < sourceRow.length
      ) {
        return sourceRow[sourceIndex];
      }
      return undefined;
    };
    const dataMappings = [
      {
        gridTag: "Sk1",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "FinalSk1",
      },
      {
        gridTag: "Sk2",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "FinalSk2",
      },
      {
        gridTag: "Ver",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Ver",
      },
      {
        gridTag: "Act",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Act",
      },
      {
        gridTag: "Dur",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Dur",
      },
      {
        gridTag: "Rng",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Rng",
      },
      {
        gridTag: "MetaCost",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Meta",
      },
      {
        gridTag: "Uses",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Uses",
      },
      {
        gridTag: "Regain",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Regain",
      },
      {
        gridTag: "Sk1Typ",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "SkTyp1",
      },
      {
        gridTag: "Sk2Typ",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "SkTyp2",
      },
      {
        gridTag: "Notes",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "Notes",
      },
      {
        gridTag: "Pic",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "Pic",
      },
    ];
    fMyConsoleLog(`     -> Applying Ability/KnownAbilities mappings...`);
    dataMappings.forEach((map) => {
      const value = getValueFromSource(
        map.sourceRow,
        map.sourceColTags,
        map.sourceTag
      );
      if (value !== undefined) {
        fSetGridValue(r, map.gridTag, value);
      } else {
        fSetGridValue(r, map.gridTag, "");
      }
    });
    if (dbGearRow && dbGearColTags) {
      fMyConsoleLog(`     -> Applying Gear mappings and calculations...`);
      const possNameVal =
        getValueFromSource(dbGearRow, dbGearColTags, "Name_ID") ?? "";
      const isArtifactVal = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "IsArtifact"
      );
      const wornEncValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "WornEnc"
      );
      const itemEncValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "ItemEnc"
      );
      const crEachValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "ItemCR"
      );
      const apEachValRaw = getValueFromSource(dbGearRow, dbGearColTags, "AP");
      const possNumVal = 1;
      fSetGridValue(r, "PossNum", 1);
      fMyConsoleLog(`       -> Set possNumVal to: ${possNumVal}`);
      const isWornVal = true;
      fSetGridValue(r, "PossWorn", true);
      fMyConsoleLog(`       -> Set isWornVal: ${isWornVal}`);
      const wornEnc = Number(wornEncValRaw) || 0;
      const itemEnc = Number(itemEncValRaw) || 0;
      const encEachVal = isWornVal && wornEncValRaw !== "" ? wornEnc : itemEnc;
      const encTotalVal = possNumVal * encEachVal;
      fMyConsoleLog(
        `       -> Enc Calc: Worn=${isWornVal}, WornEnc=${wornEnc}, ItemEnc=${itemEnc} => EncEach=${encEachVal}, TotalEnc=${encTotalVal}`
      );
      const crEachVal = Number(crEachValRaw) || 0;
      const perOffVal = "";
      fSetGridValue(r, "PossPerOff", "");
      const crTotalVal = possNumVal * crEachVal;
      fMyConsoleLog(
        `       -> CR Calc: CREach=${crEachVal}, Num=${possNumVal}, PerOff=${perOffVal} => CRTotal=${crTotalVal}`
      );
      const apEachVal = Number(apEachValRaw) || 0;
      const apTotalVal = possNumVal * apEachVal;
      fMyConsoleLog(
        `       -> AP Calc: APEach=${apEachVal}, Num=${possNumVal} => APTotal=${apTotalVal}`
      );
      fSetGridValue(r, "PossName", possNameVal);
      fSetGridValue(r, "PossEnc", encTotalVal);
      fSetGridValue(r, "PossCrEa", crEachVal);
      fSetGridValue(r, "PossCrTot", crTotalVal);
      fSetGridValue(r, "PossIsArtifact", isArtifactVal);
      fSetGridValue(r, "PossAPEa", apEachVal);
      fSetGridValue(r, "PossAPTot", apTotalVal);
    } else {
      fMyConsoleLog(
        `     -> Clearing Gear-specific fields as item not found in DB Gear.`
      );
      const gearFieldsToClear = [
        "PossNum",
        "PossName",
        "PossWorn",
        "PossEnc",
        "PossCrEa",
        "PossPerOff",
        "PossCrTot",
        "PossIsArtifact",
        "PossAPEa",
        "PossAPTot",
      ];
      gearFieldsToClear.forEach((tag) => fSetGridValue(r, tag, ""));
      fSetGridValue(r, "PossWorn", false);
      fSetGridValue(r, "PossIsArtifact", false);
    }
    fMyConsoleLog(
      `   -> ${funcName}: Finished applying data to grid row ${r}.`
    );
    fHandleAutoSaveTextToFirestore();
  } // End function fSaveNewAbilityToAbilTbl

  /** function fApplyDropdownsToGrid
   * Purpose: Replaces cell content with dropdowns based on configurations in `gUI.dropDownBox`.
   * Assumptions: Skips cells that already contain a custom (⚡) item.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyDropdownsToGrid() {
    fMyConsoleLog("🧬 Applying Dropdowns to Grid...");
    let dropdownsApplied = 0;
    const abilityListKey = "myCSListFSData";
    if (!Array.isArray(gUI.dropDownBox)) {
      fMyConsoleLog("ℹ️ No dropdown configurations found.");
      return;
    }
    gUI.dropDownBox.forEach((config) => {
      if (!config.choices || !Array.isArray(config.ranges)) {
        console.warn(
          "fApplyDropdownsToGrid: Skipping invalid dropdown config:",
          config
        );
        return;
      }
      const isAbilityDropdownConfig = config.gUIListKey === abilityListKey;
      config.ranges.forEach((range) => {
        const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
        if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN))
          return;
        const rMin = Math.min(resolved.r1, resolved.r2);
        const rMax = Math.max(resolved.r1, resolved.r2);
        const cMin = Math.min(resolved.c1, resolved.c2);
        const cMax = Math.max(resolved.c1, resolved.c2);
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            const cell = gUI.grid2D?.[r]?.[c];
            if (!cell || cell.style.display === "none") continue;
            const currentValue = gUI.arr?.[r]?.[c];
            if (
              typeof currentValue === "string" &&
              currentValue.startsWith("⚡")
            ) {
              continue;
            }
            const existingDropdown = cell.querySelector("select.grid-dropdown");
            const hasCheckbox = cell.querySelector('input[type="checkbox"]');
            const shouldApplyDropdown =
              !hasCheckbox && (!existingDropdown || isAbilityDropdownConfig);
            if (shouldApplyDropdown) {
              const dropdown = fCreateDropdownElement(
                r,
                c,
                config.choices,
                currentValue
              );
              cell.innerHTML = "";
              cell.appendChild(dropdown);
              cell.style.padding = "0";
              cell.style.overflow = "visible";
              dropdownsApplied++;
            }
          }
        }
      });
    });
    fMyConsoleLog(`✅ Applied ${dropdownsApplied} Dropdowns.`);
  } // End function fApplyDropdownsToGrid

  /** function fFetchAndApplyAbilityDropdowns
   * Purpose: Ensures the ability list from the 'MyCS/List' cache is processed and applied to the grid.
   * Assumptions: The cache `gUI.myCSListFSData` has already been loaded.
   * @param {} - No parameters.

   */
  function fFetchAndApplyAbilityDropdowns() {

    );
    if (!gUI.myCSListFSData) {
      const errorMsg = `Cannot process ability list: Required cache (gUI.myCSListFSData) was not loaded during initial setup.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);

  /** function fProcessCachedAbilityList
   * Purpose: Processes the cached MyCS/List data to build and apply the main ability dropdowns.
   * Assumptions: The cache `gUI.myCSListFSData` is valid. It finds or creates the dropdown configuration in `gUI.dropDownBox`.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fProcessCachedAbilityList() {
    const funcName = "fProcessCachedAbilityList";
    fMyConsoleLog(`   -> ${funcName}: Processing cached MyCS/List data...`);
    const listCache = gUI.myCSListFSData;
    const cacheKey = "myCSListFSData";
    const colTagForAbilities = "AbilitiesNameID";
    const startRowTag = "TableFirstRow";
    if (!listCache) {
      const errMsg = `MyCS/List cache (gUI.${cacheKey}) is missing. Cannot populate Ability dropdowns.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    const abilitiesColIndex = fResolveFSDataCol(cacheKey, colTagForAbilities);
    const startRowIndex = fResolveFSDataRow(cacheKey, startRowTag);
    if (isNaN(abilitiesColIndex)) {
      const errMsg = `Column tag '${colTagForAbilities}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    if (isNaN(startRowIndex)) {
      const errMsg = `Start row tag '${startRowTag}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    fMyConsoleLog(
      `      -> Processing list from absolute row index ${startRowIndex} ('${startRowTag}') downwards.`
    );
    fMyConsoleLog(
      `      -> Using data from column index ${abilitiesColIndex} ('${colTagForAbilities}').`
    );
    const abilityListRaw = [];
    const cachedText = listCache.text;
    const numRows = cachedText.length;
    for (let r = startRowIndex; r < numRows; r++) {
      const cellValue = cachedText[r]?.[abilitiesColIndex];
      if (cellValue !== undefined) {
        abilityListRaw.push(cellValue);
      }
    }
    fMyConsoleLog(
      `      -> Extracted ${abilityListRaw.length} potential ability names from row ${startRowIndex} onwards.`
    );
    const abilityListFiltered = abilityListRaw
      .filter(
        (name) =>
          name !== undefined && name !== null && String(name).trim() !== ""
      )
      .map((name) => String(name).trim());
    abilityListFiltered.sort((a, b) => a.localeCompare(b));
    abilityListFiltered.unshift("");
    fMyConsoleLog(
      `      -> Processed list size: ${abilityListFiltered.length} (after filter, sort, unshift).`
    );
    let abilityConfig = gUI.dropDownBox.find(
      (config) => config.gUIListKey === cacheKey
    );
    if (!abilityConfig) {
      fMyConsoleLog(`      -> Creating new dropdown config for Abilities.`);
      abilityConfig = {
        gUIListKey: cacheKey,
        choices: abilityListFiltered,
        ranges: gUI.range.abilNameNoNish,
      };
      gUI.dropDownBox.push(abilityConfig);
    } else {
      fMyConsoleLog(
        `      -> Updating existing dropdown config choices for Abilities.`
      );
      abilityConfig.choices = abilityListFiltered;
    }
    fMyConsoleLog("      -> Added/Updated Ability config in gUI.dropDownBox.");
    fApplyDropdownsToGrid();
  } // End function fProcessCachedAbilityList

   * Purpose: Clears the custom note textarea and triggers the save handler to delete the note.

  /** function fApplyInitialCustomDataIndicators
   * Purpose: Scans the grid after render and applies the custom data indicator to relevant cells.
   * Assumptions: This is called once after the grid DOM is fully rendered.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyInitialCustomDataIndicators() {
    fMyConsoleLog("Applying initial custom data indicators...");
    const numRows = gUI.arr?.length || 0;
    if (numRows === 0) return;
    const numCols = gUI.arr[0]?.length || 0;
    let cellsStyled = 0;
    for (let r = 0; r < numRows; r++) {
      for (let c = 0; c < numCols; c++) {
        const cell = gUI.grid2D?.[r]?.[c];
        if (cell) {
          const hadClass = cell.classList.contains("custom-data-cell");
          fUpdateCustomDataIndicator(r, c);
          const hasClass = cell.classList.contains("custom-data-cell");
          if (!hadClass && hasClass) {
            cellsStyled++;
          }
        }
      }
    }
    fMyConsoleLog(
      `✅ Initial Custom Data Indicators applied to ${cellsStyled} cells.`
    );
  } // End function fApplyInitialCustomDataIndicators

  /** function fIsCellInAnyDefinedTable
   * Purpose: Checks if a cell's coordinates fall within any of the major defined table ranges.
   * Assumptions: `gUI.range` contains the necessary table range definitions.
   * @param {number} r - The 0-based row index of the cell.
   * @param {number} c - The 0-based column index of the cell.
   * @returns {boolean} True if the cell is inside a defined table, false otherwise.
   */
  function fIsCellInAnyDefinedTable(r, c) {
    const tableRanges = [
      ...(gUI.range?.abilityTable || []),
      ...(gUI.range?.gearTable || []),
      gUI.range?.monsters,
      gUI.range?.meta,
      gUI.range?.metaChannel,
      gUI.range?.luckBox,
      gUI.range?.luckBoxPlus,
      gUI.range?.actTotal,
      gUI.range?.actPlus,
      gUI.range?.vit1stTo3rd,
      gUI.range?.chaosGems,
      gUI.range?.socketedGear,
      {
        r1: "GearMRTbl",
        c1: "GearMRCol1",
        r2: "GearCarryTbl",
        c2: "GearMRCol6",
      },
    ];
    return fIsCellInRangeArray(r, c, tableRanges);
  } // End function fIsCellInAnyDefinedTable

  /** function fUpdateCustomDataIndicator
   * Purpose: Adds or removes the custom data indicator for blank cells with user-entered text or notes.
   * Assumptions: The cell at (r, c) exists in the DOM. Only applies to editable cells outside of defined tables.
   * @param {number} r - The 0-based row index of the cell.
   * @param {number} c - The 0-based column index of the cell.
   * @returns {void}
   */
  function fUpdateCustomDataIndicator(r, c) {
    const cell = gUI.grid2D?.[r]?.[c];
    if (!cell) return;
    if (cell.isContentEditable && !fIsCellInAnyDefinedTable(r, c)) {
      const hasText = !!String(gUI.arr[r][c] ?? "").trim();
      const hasCustomNote = !!gUI.customNotes?.[r]?.[c]?.trim();
      if (hasText || hasCustomNote) {
        cell.classList.add("custom-data-cell");
      } else {
        cell.classList.remove("custom-data-cell");
      }
    } else {
      cell.classList.remove("custom-data-cell");
    }
  } // End function fUpdateCustomDataIndicator

  /** function fHandleCustomNoteSave
   * Purpose: Handles the save action from the custom note editor modal.
   * Assumptions: An empty note is treated as a deletion.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fHandleCustomNoteSave() {
    const modal = document.getElementById("customNoteModal");
    const textarea = document.getElementById("customNoteTextarea");
    if (!modal || !textarea) return;
    const r = parseInt(modal.dataset.r, 10);
    const c = parseInt(modal.dataset.c, 10);
    if (isNaN(r) || isNaN(c)) return;
    const newNoteText = textarea.value.trim();
    const cell = gUI.grid2D?.[r]?.[c];
    const sheetNoteExists = !!gUI.notes?.[r]?.[c]?.trim();
    gUI.customNotes[r][c] = newNoteText;
    if (cell) {
      if (newNoteText) {
        cell.classList.remove("has-note");
        cell.classList.add("has-custom-note");
      } else {
        cell.classList.remove("has-custom-note");
        if (sheetNoteExists) {
          cell.classList.add("has-note");
        }
      }
    }
    fUpdateCustomDataIndicator(r, c);
    fMyConsoleLog(
      `   -> Custom note for [${r}, ${c}] saved to memory. Length: ${newNoteText.length}.`
    );
    modal.style.display = "none";
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleCustomNoteSave

  /** function fSetupCustomNoteModalListeners
   * Purpose: Sets up event listeners for the custom note editor modal.
   * Assumptions: The modal HTML exists in ui.html.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fSetupCustomNoteModalListeners() {
    fMyConsoleLog("🖱️ Setting up Custom Note Modal Listeners...");
    const modal = document.getElementById("customNoteModal");
    const saveBtn = document.getElementById("customNoteSaveButton");
    const clearBtn = document.getElementById("customNoteClearButton");
    const cancelBtn = document.getElementById("customNoteCancelButton");
    if (!modal || !saveBtn || !clearBtn || !cancelBtn) {
      console.error(
        "Custom note modal listener setup failed: elements not found."
      );
      return;
    }
    saveBtn.addEventListener("click", fHandleCustomNoteSave);
    clearBtn.addEventListener("click", fHandleCustomNoteClear);
    cancelBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.style.display = "none";
      }
    });
    document.addEventListener("keydown", (event) => {
      if (modal.style.display !== "none" && event.key === "Escape") {
        modal.style.display = "none";
      }
    });
    fMyConsoleLog("✅ Custom Note Modal Listeners Attached.");
  } // End function fSetupCustomNoteModalListeners

  /** function fHandleGridRightClick
   * Purpose: Handles the delegated 'contextmenu' event to open the custom note editor.
   * Assumptions: The grid has a 'contextmenu' event listener attached.
   * @param {MouseEvent} event - The contextmenu event object.

  /** function fShowCustomNoteEditor
   * Purpose: Displays the custom note editor modal and populates it with the existing note.
   * Assumptions: The modal HTML exists in ui.html.
   * @param {number} r - The 0-based row index of the cell.
