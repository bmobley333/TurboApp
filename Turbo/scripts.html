  /** function fHandleGridCheckboxClick
   * Purpose: Handles delegated click events for checkboxes within the grid.
   * Assumptions: Updates the data model and handles special logic for Sk1/Sk2 and PossWorn checkboxes.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleGridCheckboxClick(event) {
    const checkbox = event.target;
    if (!fIsValidGridCheckbox(checkbox)) return;
    const r = parseInt(checkbox.dataset.r, 10);
    const c = parseInt(checkbox.dataset.c, 10);
    if (!fIsValidGridCoords(r, c)) {
      console.warn(
        "Checkbox click handler: Invalid row/column index or missing grid element.",
        checkbox.dataset
      );
      return;
    }
    const isChecked = checkbox.checked;
    const isSkGroupMember = checkbox.dataset.skGroup === "true";
    const possWornCol = fResolveCol("PossWorn");
    const oldValue = gUI.arr[r][c];
    gUI.arr[r][c] = isChecked;
    fMyConsoleLog(`Checkbox [${r}, ${c}] toggled to: ${isChecked}`);
    if (isSkGroupMember) {
      fHandleSkGroupCheckboxClickLogicOnly(r, c, isChecked, oldValue);
    }
    if (c === possWornCol) {
      fMyConsoleLog(
        `   -> PossWorn checkbox clicked [${r}, ${c}]. Triggering fCalcGearLine...`
      );
      const calcResult = await fCalcGearLine(r, c, isChecked, !isChecked);
      if (calcResult !== null) {
        fHandleAutoSaveTextToFirestore();
      } else {
        fMyConsoleLog(
          `   -> fCalcGearLine indicated failure for PossWorn click at [${r}, ${c}]. Auto-save skipped.`
        );
      }
    } else if (!isSkGroupMember) {
      fHandleAutoSaveTextToFirestore();
    }
  } // End function fHandleGridCheckboxClick

  /** function fHandleSkGroupCheckboxClickLogicOnly
   * Purpose: Handles the synchronous data updates for the Sk1/Sk2 radio group.
   * Assumptions: This function only updates the data model and tracker, not the DOM. It's called by `function fHandleGridCheckboxClick`.
   * @param {number} r - Row index of the clicked checkbox.
   * @param {number} c - Column index of the clicked checkbox.
   * @param {boolean} isChecked - The new checked state of the clicked checkbox.
   * @returns {void}
   */
  function fHandleSkGroupCheckboxClickLogicOnly(r, c, isChecked) {
    const oldR = gUI.currentSkRadioChecked.r;
    const oldC = gUI.currentSkRadioChecked.c;
    if (isChecked) {
      if (oldR !== null && oldC !== null && (oldR !== r || oldC !== c)) {
        fUncheckOldSkGroupBox(oldR, oldC);
      }
      gUI.currentSkRadioChecked = {
        r,
        c,
      };
      fMyConsoleLog(`Radio group: Checked box [${r}, ${c}]`);
    } else {
      if (oldR === r && oldC === c) {
        gUI.currentSkRadioChecked = {
          r: null,
          c: null,
        };
      }
      fMyConsoleLog(`Radio group: Unchecked box [${r}, ${c}]`);
    }
  } // End function fHandleSkGroupCheckboxClickLogicOnly

  /** function fIsValidGridCheckbox
   * Purpose: Checks if an HTML element is a valid, enabled checkbox within a grid cell.
   * Assumptions: A valid checkbox is an INPUT element of type checkbox that is not disabled.
   * @param {HTMLElement} checkbox - The element to check.
   * @returns {boolean} True if the element is a valid grid checkbox, false otherwise.
   */
  function fIsValidGridCheckbox(checkbox) {
    return (
      checkbox &&
      checkbox.tagName === "INPUT" &&
      checkbox.type === "checkbox" &&
      checkbox.closest(".cell") &&
      !checkbox.disabled
    );
  } // End function fIsValidGridCheckbox

  /** function fIsValidGridCoords
   * Purpose: Validates if row and column indices are valid numbers corresponding to existing grid rows.
   * Assumptions: Checks against the dimensions of `gUI.arr` and `gUI.grid2D`.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {boolean} True if coordinates are valid, false otherwise.
   */
  function fIsValidGridCoords(r, c) {
    return (
      !isNaN(r) && !isNaN(c) && r >= 0 && c >= 0 && gUI.arr[r] && gUI.grid2D[r]
    );
  } // End function fIsValidGridCoords

  /** function fUncheckOldSkGroupBox
   * Purpose: Finds and unchecks the previously checked Sk1/Sk2 radio group checkbox.
   * Assumptions: Updates both the DOM element and the data model (`gUI.arr`).
   * @param {number} oldR - Row index of the previously checked box.
   * @param {number} oldC - Column index of the previously checked box.
   * @returns {void}
   */
  function fUncheckOldSkGroupBox(oldR, oldC) {
    const oldCellDiv = gUI.grid2D[oldR]?.[oldC];
    const oldCheckbox = oldCellDiv?.querySelector(
      'input[data-sk-group="true"]'
    );
    if (oldCheckbox) {
      oldCheckbox.checked = false;
      gUI.arr[oldR][oldC] = false;
      fMyConsoleLog(`Radio group: Unchecked previous box [${oldR}, ${oldC}]`);
    } else {
      console.warn(
        `Radio group: Could not find previous checkbox element at [${oldR}, ${oldC}] to uncheck.`
      );
    }
  } // End function fUncheckOldSkGroupBox

  /** function fHandleGridClick
   * Purpose: Delegated click handler for the main grid that routes clicks to appropriate handlers.
   * Assumptions: Routes clicks for header buttons, checkboxes, and URL links.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleGridClick(event) {
    const target = event.target;
    const buttonImg = target.closest(".header-button-img[data-button-action]");
    if (buttonImg) {
      fHandleGridButtonClick(event, buttonImg);
      return;
    }
    const cellDiv = target.closest(".cell");
    if (!cellDiv) return;
    const r = parseInt(cellDiv.dataset.r, 10);
    const c = parseInt(cellDiv.dataset.c, 10);
    if (!isNaN(r) && !isNaN(c)) {
      gUI.cellClickInfo = {
        r,
        c,
        text: cellDiv.textContent?.trim() ?? "",
        focusText: null,
      };
      fMyConsoleLog(`🖱️ Cell Click: [${r}, ${c}]`);
    }
    if (fIsCheckboxClick(target)) {
      fHandleGridCheckboxClick(event);
    } else if (fIsUrlLinkCell(cellDiv)) {
      fHandleUrlClick(cellDiv);
    }
  } // End function fHandleGridClick

  /** function fIsCheckboxClick
   * Purpose: Helper to check if an event target is a checkbox input element.
   * Assumptions: The target is a valid HTMLElement.
   * @param {HTMLElement} target - The event target element.
   * @returns {boolean} True if target is an <input type="checkbox">.

  function fIsCheckboxClick(target) {

  /** function fIsEditableCell

  /** function fHandleUrlClick
   * Purpose: Determines the type of URL clicked and routes to the appropriate handler.
   * Assumptions: The cell element has the necessary data attributes.
   * @param {HTMLElement} cellDiv - The cell div element that was clicked.
   * @returns {void}
   */
  function fHandleUrlClick(cellDiv) {
    const originalUrl = cellDiv.dataset.url;
    if (!originalUrl) {
      console.warn(
        "Clicked URL link cell, but data-url attribute was missing.",
        cellDiv
      );
      return;
    }
    const isDrive = originalUrl.includes("drive.google.com/file/d/");
    const isImage = cellDiv.classList.contains("image-link") && !isDrive;
    const imageUrl = cellDiv.dataset.imageSrc;
    if (isDrive) {
      fHandleDriveLink(originalUrl);
    } else if (isImage && imageUrl) {
      fHandleImageModal(imageUrl);
    } else {
      fHandleWebLink(originalUrl);
    }
  } // End function fHandleUrlClick

  /** function fHandleGridCellEdit
   * Purpose: Handles the 'blur' event for contenteditable cells, with a guard to prevent execution on header buttons.
   * Assumptions: This is the primary handler for saving user-edited text.
   * Notes: This version includes a brute-force guard clause as the definitive fix for the vanishing button bug.
   * @param {FocusEvent} event - The blur event object.
   * @returns {void}
   */
  async function fHandleGridCellEdit(event) {
    const cellDiv = event.target;
    const r_check = parseInt(cellDiv?.dataset?.r, 10);
    const c_check = parseInt(cellDiv?.dataset?.c, 10);
    if (
      !isNaN(r_check) &&
      !isNaN(c_check) &&
      gUI.headerButtonCoords.has(`${r_check},${c_check}`)
    ) {
      return;
    }
    if (
      !cellDiv ||
      !cellDiv.classList.contains("cell") ||
      cellDiv.contentEditable !== "true"
    ) {
      return;
    }
    const r = parseInt(cellDiv.dataset.r, 10);
    const c = parseInt(cellDiv.dataset.c, 10);
    if (isNaN(r) || isNaN(c) || !gUI.arr[r]) {
      return;
    }
    fHideTooltip();
    const colTag = Object.keys(gUI.colTag).find((tag) => gUI.colTag[tag] === c);
    const customizableDataCols = [
      "Sk1Typ",
      "Sk1",
      "Sk2Typ",
      "Sk2",
      "Act",
      "Dur",
      "Rng",
      "Meta",
    ];
    if (colTag && customizableDataCols.includes(colTag)) {
      cellDiv.contentEditable = false;
      const newText = cellDiv.textContent.trim();
      const oldValueInModel = String(gUI.arr[r][c] ?? "");
      const validateAndGetFinalValue = (text, list) => {
        if (text === "") return "";
        if (list) {
          const lowerText = text.toLowerCase();
          const match = list.find((item) => item.toLowerCase() === lowerText);
          return match || null;
        } else {
          const num = parseInt(text, 10);
          if (!isNaN(num) && num >= 1 && String(num) === text) {
            return num;
          }
          return null;
        }
      };
      const validationList = gUI.validationLists?.[colTag];
      let finalValue = validateAndGetFinalValue(newText, validationList);
      if (colTag === "Rng" && finalValue === null) {
        const num = parseInt(newText, 10);
        if (!isNaN(num) && num >= 1 && String(num) === newText) {
          finalValue = num;
        }
      }
      if (finalValue === null) {
        cellDiv.textContent = oldValueInModel;
        return;
      }
      if (String(finalValue) === oldValueInModel) {
        cellDiv.textContent = oldValueInModel;
        return;
      }
      gUI.arr[r][c] = finalValue;
      cellDiv.textContent = finalValue;
      fFlagAbilityAsCustom(r);
      fHandleAutoSaveTextToFirestore();
      return;
    }
    const newValue = cellDiv.textContent;
    const oldValueInModel = gUI.arr[r][c];
    if (String(newValue ?? "") === String(oldValueInModel ?? "")) {
      return;
    }
    const gearColumnsToCalculate = ["PossNum", "PossWorn", "PossPerOff"];
    let finalValueToStore = newValue;
    let shouldUpdateModelAndSave = true;
    let specificCalcDone = false;
    let metaOrChannelAlertPosted = false;
    const isMetaCell =
      gUI.range?.meta && fIsCellInRangeArray(r, c, [gUI.range.meta]);
    const isMetaChannelCell =
      gUI.range?.metaChannel &&
      fIsCellInRangeArray(r, c, [gUI.range.metaChannel]);
    if (isMetaCell || isMetaChannelCell) {
      const trimmedNewValue = newValue.trim();
      let parsedNum = parseInt(trimmedNewValue, 10);
      let isValidInput = false;
      if (trimmedNewValue === "") {
        finalValueToStore = "";
        isValidInput = true;
      } else if (
        !isNaN(parsedNum) &&
        parsedNum > 0 &&
        String(parsedNum) === trimmedNewValue
      ) {
        if (isMetaCell) {
          const colorIndex = gUI.list.metaColor.findIndex(
            (tag) => gUI.colTag[tag] === c
          );
          if (
            colorIndex !== -1 &&
            gUI.list.metaFull &&
            colorIndex < gUI.list.metaFull.length
          ) {
            const maxAllowed = gUI.list.metaFull[colorIndex];
            if (parsedNum <= maxAllowed) {
              finalValueToStore = parsedNum;
              isValidInput = true;
            }
          }
        } else {
          finalValueToStore = parsedNum;
          isValidInput = true;
        }
      }
      if (!isValidInput) {
        cellDiv.textContent = String(oldValueInModel ?? "");
        shouldUpdateModelAndSave = false;
      }
      if (shouldUpdateModelAndSave && finalValueToStore !== oldValueInModel) {
        const metaType = isMetaCell ? "Meta Color" : "Meta Channel Color";
        const colorTag =
          gUI.list.metaColor.find((tag) => gUI.colTag[tag] === c) || `Col${c}`;
        const oldValueForDisplay =
          oldValueInModel === "" || oldValueInModel === 0
            ? "0"
            : String(oldValueInModel);
        const newValueForDisplay =
          finalValueToStore === "" || finalValueToStore === 0
            ? "0"
            : String(finalValueToStore);
        const alertPrefixHtml = `⚠️ <span class="red-bold">Alert:</span> `;
        const alertPrefixText = `⚠️ Alert: `;
        const alertMsgHtml = `${alertPrefixHtml}${metaType} ${colorTag} was changed from ${oldValueForDisplay} to ${newValueForDisplay}`;
        const alertMsgText = `${alertPrefixText}${metaType} ${colorTag} was changed from ${oldValueForDisplay} to ${newValueForDisplay}`;
        fPostToSidebar(alertMsgHtml, alertMsgText);
        fShowSidebar();
        metaOrChannelAlertPosted = true;
      }
      specificCalcDone = true;
    }
    if (!specificCalcDone && gearColumnsToCalculate.includes(colTag)) {
      const validatedValue = await fCalcGearLine(
        r,
        c,
        newValue,
        String(oldValueInModel ?? "")
      );
      if (validatedValue !== null) {
        finalValueToStore = validatedValue;
      } else {
        shouldUpdateModelAndSave = false;
      }
      specificCalcDone = true;
    }
    if (!specificCalcDone) {
      const isVitMaxPlus =
        gUI.range?.vitMaxPlus &&
        fIsCellInRangeArray(r, c, [gUI.range.vitMaxPlus]);
      const isVit1stTo3rd =
        gUI.range?.vit1stTo3rd &&
        fIsCellInRangeArray(r, c, [gUI.range.vit1stTo3rd]);
      if (isVitMaxPlus || isVit1stTo3rd) {
        gUI.arr[r][c] = newValue;
        await fCalc_VitMaxNowPerc();
        finalValueToStore = gUI.arr[r][c];
      }
    }
    if (shouldUpdateModelAndSave) {
      if (gUI.arr[r][c] !== finalValueToStore) {
        gUI.arr[r][c] = finalValueToStore;
        fUpdateCustomDataIndicator(r, c);
        fHandleAutoSaveTextToFirestore();
        if (metaOrChannelAlertPosted) {
          setTimeout(() => fSendLogToGMScreenAndPS(), 0);
        }
      } else if (metaOrChannelAlertPosted) {
        setTimeout(() => fSendLogToGMScreenAndPS(), 0);
      }
    } else {
      fUpdateCustomDataIndicator(r, c);
    }
  } // End function fHandleGridCellEdit

  /** function fDoesObjectHaveR1C1R2C2Properties
   * Purpose: Checks if an object has the required properties for a valid range definition.
   * Assumptions: A valid range object must have r1, c1, r2, and c2 properties.
   * @param {object} range - The object to check.
   * @returns {boolean} True if the object is a valid range definition, false otherwise.
   */
  function fDoesObjectHaveR1C1R2C2Properties(range) {
    return (
      range &&
      typeof range.r1 !== "undefined" &&
      typeof range.c1 !== "undefined" &&
      typeof range.r2 !== "undefined" &&
      typeof range.c2 !== "undefined"
    );
  } // End function fDoesObjectHaveR1C1R2C2Properties

  /** function fConvertsR1C1R2C2TagOrNumToIndices
   * Purpose: Converts tags or numbers within a range definition object into resolved 0-based indices.
   * Assumptions: The range object has r1, c1, r2, c2 properties.
   * @param {object} range - The range definition object {r1, c1, r2, c2}.
   * @returns {object} An object {r1, c1, r2, c2} with resolved numeric indices (or NaN).
   */
  function fConvertsR1C1R2C2TagOrNumToIndices(range) {
    const r1 = fResolveRow(range.r1);
    const c1 = fResolveCol(range.c1);
    const r2 = fResolveRow(range.r2);
    const c2 = fResolveCol(range.c2);
    return {
      r1,
      c1,
      r2,
      c2,
    };
  } // End function fConvertsR1C1R2C2TagOrNumToIndices

  /** function fCloseAllDropdowns
   * Purpose: Hides all open menu dropdown panels.
   * Assumptions: Open menus have the 'show' class.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fCloseAllDropdowns() {
    const dropdowns = document.getElementsByClassName("dropdown-content");
    for (let i = 0; i < dropdowns.length; i++) {
      const panel = dropdowns[i];
      panel.classList.remove("show");
      if (
        !panel.classList.contains("sub-menu") &&
        panel.style.overflowY === "visible"
      ) {
        panel.style.overflowY = "auto";
      }
    }
  } // End function fCloseAllDropdowns

  /** function fPostToSidebar
   * Purpose: Prepends a message to the sidebar and the plain text log array.
   * Assumptions: The sidebar DOM element exists.
   * @param {string} htmlMessage - The HTML content to display in the sidebar.
   * @param {string | null} plainTextMessage - The plain text version for the log array. Defaults to a stripped version of htmlMessage.
   * @returns {void}
   */
  function fPostToSidebar(htmlMessage, plainTextMessage = null) {
    const sidebarContent = document.getElementById("sidebar-content");
    if (!sidebarContent) {
      console.error(
        "fPostToSidebar: Cannot find sidebar content element (#sidebar-content)."
      );
      return;
    }

    const placeholder = sidebarContent.querySelector("p");
    if (
      placeholder &&
      placeholder.textContent === "Roll log entries will appear here..."
    ) {
      placeholder.remove();
    }

    const newEntry = document.createElement("p");
    newEntry.innerHTML = htmlMessage;
    sidebarContent.prepend(newEntry);
    sidebarContent.scrollTop = 0;

    const textToLog =
      plainTextMessage !== null
        ? plainTextMessage
        : htmlMessage
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<[^>]+>/g, "")
            .trim();

    // Prepend the new entry to the start of the array to maintain correct order
    gUI.plainTextLogEntries.unshift(textToLog);

    fHandleAutoSaveTextToFirestore();
  } // End function fPostToSidebar

  /** function fHandleApplyWoundsClick
   * Purpose: Handles clicks on the "Apply" wounds button in the sidebar.
   * Assumptions: Reads wound amount from the button's data attribute and applies it to 1st Degree Wounds.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleApplyWoundsClick(event) {
    const button = event.target;
    if (!button || !button.classList.contains("apply-wounds-btn")) {
      return;
    }
    fMyConsoleLog(`🖱️ Sidebar 'Apply Wounds' Button Clicked...`);
    if (button.disabled) {
      fMyConsoleLog("   -> Button already disabled. Ignoring click.");
      return;
    }
    button.disabled = true;
    button.textContent = "Applied";
    const woundAmountStr = button.dataset.woundAmount;
    const woundAmount = Number(woundAmountStr);
    if (isNaN(woundAmount) || woundAmount < 0) {
      console.error(`Invalid wound amount stored on button: ${woundAmountStr}`);
      fMyConsoleLog(
        `❌ Error applying wounds: Invalid amount '${woundAmountStr}'.`
      );
      await fShowMessage(
        "Error: Could not read a valid wound amount from the button."
      );
      return;
    }
    fMyConsoleLog(`   -> Wound Amount to Apply: ${woundAmount}`);
    const targetRow = "VitTbl";
    const targetCol = "vit1st";
    let currentVit1st = fGetGridValue(targetRow, targetCol, true);
    if (isNaN(currentVit1st)) {
      fMyConsoleLog(
        `   -> Warning: Current value in ('${targetRow}', '${targetCol}') is not a number. Treating as 0.`
      );
      currentVit1st = 0;
    }
    fMyConsoleLog(`   -> Current 1st Degree Wounds: ${currentVit1st}`);
    const newWoundValue = Math.round(currentVit1st + woundAmount);
    fMyConsoleLog(`   -> Calculated New 1st Degree Wounds: ${newWoundValue}`);
    if (!fSetGridValue(targetRow, targetCol, newWoundValue)) {
      fMyConsoleLog(
        `❌ Error applying wounds: fSetGridValue failed for ('${targetRow}', '${targetCol}').`
      );
      await fShowMessage("Error: Failed to update the 1st Degree Wounds cell.");
      return;
    }
    fMyConsoleLog("   -> Recalculating Vit Now & Percent...");
    await fVitNowNPercent_Calc();
    fHandleAutoSaveTextToFirestore();
    fMyConsoleLog("✅ Wounds Applied Successfully.");
    await fShowMessage("✅ Wounds Applied Successfully.");
  } // End function fHandleApplyWoundsClick

  /** function fSetupSidebarActionListeners
   * Purpose: Sets up a delegated event listener on the sidebar to handle clicks on interactive elements.
   * Assumptions: The sidebar content element exists.
   * @param {} - No parameters.

  function fSetupSidebarActionListeners() {
    fMyConsoleLog("🖱️ Setting up Sidebar Action Listeners...");
    const sidebarContent = document.getElementById("sidebar-content");
    if (!sidebarContent) {

  /** function fSetupMenuButtonListeners
   * Purpose -> Adds click event listeners to the main menu bar buttons, defining the logic for each click.
   * Assumptions: The button and dropdown elements exist in the DOM.
   * @param {HTMLElement} btnNish - The Nish button.
   * @param {HTMLElement} btnRoll - The Roll button.
   * @param {HTMLElement} btnFree - The Free button.
   * @param {HTMLElement} btnLuck - The Luck button.
   * @param {HTMLElement} btnGame - The Game menu button.
   * @param {HTMLElement} dropdownGame - The Game dropdown panel.
   * @param {HTMLElement} btnGear - The Gear menu button.
   * @param {HTMLElement} dropdownGear - The Gear dropdown panel.
   * @returns {void}
   */
  function fSetupMenuButtonListeners(
    btnNish,
    btnRoll,
    btnFree,
    btnLuck,
    btnGame,
    dropdownGame,
    btnGear,
    dropdownGear
  ) {
    btnNish.addEventListener("click", fHandleNishButtonClick);

    btnRoll.addEventListener("click", async (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Roll");

      const { r: lastClickR, c: lastClickC } = gUI.cellClickInfo;
      const { r: checked_r, c: checked_c } = gUI.currentSkRadioChecked;
      let handled = false;

      // Combine the specific ability and gear table ranges for a precise context check.
      const abilityContextRanges = [
        ...(gUI.range?.abilityTable || []),
        ...(gUI.range?.gearTable || []),
      ];

      if (lastClickR === null || lastClickC === null) {
        if (checked_r !== null) {
          fMyConsoleLog(
            "   -> <Roll> Click: No cell focus, but an ability is checked. Running ability roll..."
          );
          await fMain_AbilityRoll();
          handled = true;
        }
      } else {
        const isAbilityOrGearTableClick = fIsCellInRangeArray(
          lastClickR,
          lastClickC,
          abilityContextRanges
        );
        const isChaosTableClick = fIsCellInRangeArray(
          lastClickR,
          lastClickC,
          gUI.range.chaosGems
        );

        // --- Precedence 1: Ability/Gear Table Context ---
        if (isAbilityOrGearTableClick) {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Ability/Gear Table [${lastClickR}, ${lastClickC}]. Ad-hoc roll is disabled.`
          );
          if (checked_r !== null) {
            fMyConsoleLog(
              `   -> Active Sk checkbox found [${checked_r}, ${checked_c}]. Running ability roll...`
            );
            await fMain_AbilityRoll();
            handled = true;
          } else {
            await fShowMessage(
              "ℹ️ Please select an ability checkbox (Sk1 or Sk2) to roll."
            );
            handled = true;
            fSetButtonOrMenuState(null);
          }
        }
        // --- Precedence 2: Chaos Gem Context ---
        else if (isChaosTableClick) {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Chaos Gem Table [${lastClickR}, ${lastClickC}].`
          );
          handled = await fHandleChaosGemClick(lastClickR, lastClickC);
          if (handled) fSetButtonOrMenuState(null);
        }
        // --- Precedence 3: Ad-Hoc Context (with fallback) ---
        else {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Ad-Hoc [${lastClickR}, ${lastClickC}]. Attempting ad-hoc roll...`
          );
          const cellElement = gUI.grid2D?.[lastClickR]?.[lastClickC];
          if (cellElement) {
            const currentCellTextForAdHoc =
              cellElement.textContent?.trim() ?? "";
            gUI.cellClickInfo.focusText = currentCellTextForAdHoc;
            handled = await fHandleAdHocRoll(currentCellTextForAdHoc);

            if (!handled && checked_r !== null) {
              fMyConsoleLog(
                `   -> Ad-Hoc roll failed for "${currentCellTextForAdHoc}". Falling back to checked ability [${checked_r}, ${checked_c}].`
              );
              await fMain_AbilityRoll();
              handled = true;
            } else if (handled) {
              fSetButtonOrMenuState(null);
            }
          }
        }
      }

      if (!handled) {
        fMyConsoleLog(
          "   -> <Roll> Click: No valid action could be determined."
        );
        const adHocAttemptedButFailed = gUI.cellClickInfo.focusText !== null;
        if (adHocAttemptedButFailed) {
          await fShowMessage(
            `ℹ️ Nothing rollable found in cell "${
              gUI.cellClickInfo.focusText || ""
            }"`
          );
        } else {
          await fShowMessage(
            "ℹ️ Please click a cell to establish context for the roll, or check an ability box."
          );
        }
        fSetButtonOrMenuState(null);
      }
    });

    btnFree.addEventListener("click", (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Free");
      fMain_AbilityRoll();
    });

    btnLuck.addEventListener("click", (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Luck");
      fMain_AbilityRoll();
    });

    btnGame.addEventListener("click", (event) => {
      event.stopPropagation();
      const currentlyShown = dropdownGame.classList.contains("show");
      fCloseAllDropdowns();
      if (!currentlyShown) {
        dropdownGame.classList.add("show");
      }
    });

    btnGear.addEventListener("click", (event) => {
      event.stopPropagation();
      const currentlyShown = dropdownGear.classList.contains("show");
      fCloseAllDropdowns();
      if (!currentlyShown) {
        dropdownGear.classList.add("show");
      }
    });
  } // End function fSetupMenuButtonListeners

  /** function fSetButtonOrMenuState
   * Purpose: Sets state flags in `gUI.buttonOrMenu` to track the source of a roll action.
   * Assumptions: Resets all flags before setting the specified one.
   * @param {string | null} buttonType - Type name ('Nish', 'Roll', 'Free', 'Luck') or null to reset.
   * @returns {void}
   */
  function fSetButtonOrMenuState(buttonType) {
    const validTypes = {
      Nish: "isNish",
      Roll: "isRoll",
      Free: "isFree",
      Luck: "isLuck",
    };
    for (const key in gUI.buttonOrMenu) {
      if (Object.hasOwnProperty.call(gUI.buttonOrMenu, key)) {
        gUI.buttonOrMenu[key] = false;
      }
    }
    if (buttonType && validTypes[buttonType]) {
      const flagToSet = validTypes[buttonType];
      gUI.buttonOrMenu[flagToSet] = true;
      fMyConsoleLog(`🚦 Button/Menu State Set: ${flagToSet} = true`);
    } else if (buttonType === null) {
      fMyConsoleLog("🚦 Button/Menu State Reset (all flags false).");
    } else {
      console.warn(
        `fSetButtonOrMenuState: Invalid buttonType provided: ${buttonType}`
      );
      fMyConsoleLog(
        `🚦 Button/Menu State: Invalid type '${buttonType}', all flags remain false.`
      );
    }
  } // End function fSetButtonOrMenuState

  /** function fSetupWindowClickListener
   * Purpose: Adds a global click listener to close dropdowns when clicking outside the menu.
   * Assumptions: The menu structure uses the '.menu-item' class.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fSetupWindowClickListener() {
    window.addEventListener("click", (event) => {
      if (
        event.target &&
        !event.target.closest(".menu-item") &&
        !event.target.closest("#menu-bar > button")
      ) {
        fCloseAllDropdowns();
      }
    });
  } // End function fSetupWindowClickListener

  /** function fSetupSubMenuHover
   * Purpose: Sets up hover event listeners for all submenu items to manage their visibility.
   * Assumptions: Submenus have the class '.sub-menu-item'.
   * @param {HTMLElement} menuBar - The main menu bar container element.
   * @returns {void}
   */
  function fSetupSubMenuHover(menuBar) {
    if (!menuBar) return;
    const subMenuItems = menuBar.querySelectorAll(".sub-menu-item");

  /** function fClearSubMenuHideTimeout
   * Purpose: Clears any active 'hide' timeout associated with a submenu panel.
   * Assumptions: The timeout ID is stored in the panel's dataset.
   * @param {HTMLElement} panel - The submenu panel element.
   * @returns {void}
   */
  function fClearSubMenuHideTimeout(panel) {
    const timeoutId = parseInt(panel.dataset.hideTimeoutId || "0");
    if (timeoutId) {
      clearTimeout(timeoutId);
      panel.dataset.hideTimeoutId = "";
    }
  } // End function fClearSubMenuHideTimeout

  /** function fIsAnySiblingSubmenuOpen
   * Purpose: Checks if any sibling submenu items have their panels open.
   * Assumptions: Open submenus have the 'show' class.
   * @param {HTMLElement} item - The reference submenu item element.
   * @returns {boolean} True if any sibling submenu is open, false otherwise.
   */
  function fIsAnySiblingSubmenuOpen(item) {
    const parent = item.parentElement;
    if (!parent) return false;
    const siblings = Array.from(parent.children).filter(
      (el) => el !== item && el.classList.contains("sub-menu-item")
    );
    return siblings.some((sibling) => {
      const siblingPanel = sibling.querySelector(".dropdown-content.sub-menu");
      return siblingPanel && siblingPanel.classList.contains("show");
    });
  } // End function fIsAnySiblingSubmenuOpen

  /** function fStartSubMenuHideTimeout
   * Purpose: Sets a timeout to hide a submenu panel, managing parent overflow styles.
   * Assumptions: The submenu panel is currently visible or scheduled to be.
   * @param {HTMLElement} item - The submenu item element.
   * @param {HTMLElement} panel - The submenu panel element to hide.
   * @param {HTMLElement | null} mainDropdown - The parent dropdown panel element.
   * @param {number} [delayMs=250] - Delay in milliseconds before hiding.
   * @returns {void}
   */
  function fStartSubMenuHideTimeout(item, panel, mainDropdown, delayMs = 250) {
    fClearSubMenuHideTimeout(panel);
    const timeoutId = setTimeout(() => {
      if (mainDropdown && !fIsAnySiblingSubmenuOpen(item)) {
        mainDropdown.style.overflowY = "auto";
      }
      panel.classList.remove("show");
    }, delayMs);
    panel.dataset.hideTimeoutId = timeoutId;
  } // End function fStartSubMenuHideTimeout

  /** function fSetupSingleSubMenuItem
   * Purpose: Attaches mouseenter/mouseleave listeners to a single submenu item to manage visibility.
   * Assumptions: The item contains a link and a submenu panel.
   * @param {HTMLElement} item - The submenu item element (.sub-menu-item).
   * @param {number} index - Index of the item (for logging/debugging).
   * @returns {void}
   */
  function fSetupSingleSubMenuItem(item, index) {
    const triggerLink = item.querySelector("a");
    const subMenuPanel = item.querySelector(".dropdown-content.sub-menu");
    const mainDropdown = item.closest(".dropdown-content:not(.sub-menu)");
    if (!subMenuPanel) return;
    if (!mainDropdown && triggerLink) {
      console.warn(
        `fSetupSingleSubMenuItem Item ${index} (${triggerLink?.textContent}): Could not find parent main dropdown!`
      );
    }
    item.addEventListener("mouseenter", () => {
      fClearSubMenuHideTimeout(subMenuPanel);
      if (mainDropdown) mainDropdown.style.overflowY = "visible";
      subMenuPanel.classList.add("show");
    });
    item.addEventListener("mouseleave", () => {
      fStartSubMenuHideTimeout(item, subMenuPanel, mainDropdown);
    });
    subMenuPanel.addEventListener("mouseenter", () => {
      fClearSubMenuHideTimeout(subMenuPanel);
    });
    subMenuPanel.addEventListener("mouseleave", () => {
      fStartSubMenuHideTimeout(item, subMenuPanel, mainDropdown);
    });
  } // End function fSetupSingleSubMenuItem

  /** function fSendLogToGMScreenAndPS
   * Purpose: Sends bundled log and header data sequentially to the GMScreen and PartyLog sheets via the server.
   * Assumptions: gUI state is populated. A lock (gUI.isSendingLog) prevents concurrent sends.
   * @returns {Promise<boolean>} Resolves true on success, false on failure or if skipped. Rejects on critical prep errors.
   */
  async function fSendLogToGMScreenAndPS() {
    if (gUI.isSendingLog) {
      fMyConsoleLog("📤 Log & Header send already in progress, skipping.");
      return false;
    }

    const slotNum = gUI.characterInfo?.slotNum;
    if (
      !slotNum ||
      typeof slotNum !== "string" ||
      !slotNum.startsWith("Slot")
    ) {
      const msg = `Cannot send Log & Headers: Invalid or missing slotNum ('${slotNum}').`;
      fMyConsoleLog(`📤 ${msg}`);
      return false;
    }

    gUI.isSendingLog = true;
    fMyConsoleLog(
      `📤 Preparing to send Log & Header data for ${slotNum} (Lock Acquired)...`
    );

    return new Promise((resolve, reject) => {
      try {
        // The gUI.plainTextLogEntries array is now pre-sorted (newest first).
        // No reversal is needed. Join with a separator that forces Google Sheets to render blank lines.
        const combinedLog = gUI.plainTextLogEntries.join("\n \n \n");

        const truncatedLog = combinedLog.substring(
          0,
          gUI.GMSCREEN_LOG_MAX_CHARS
        );
        fMyConsoleLog(
          `   -> Log Content Prepared (Entries: ${gUI.plainTextLogEntries.length}, Length: ${truncatedLog.length})`
        );

        const vitMax = fGetGridValue("VitTbl", "vitMax") ?? "?";
        const vitNow = fGetGridValue("VitTbl", "vitNow") ?? "?";
        const vitPercent = fGetGridValue("VitTbl", "VitNowPercent") ?? "?%";
        const vitString = `${vitNow} of ${vitMax} (${vitPercent})`;
        const nishValue = fGetGridValue("Nish", "Nish") ?? "";
        const { raceClass, level, playerName, charName } =
          gUI.characterInfo || {};
        const playerCharString = `${playerName || "?"} (${charName || "?"})`;
        const characterUrl =
          "https://docs.google.com/spreadsheets/d/" + gIndex.CSID + "/";

        const dataBundle = {
          log: truncatedLog,
          vit: vitString,
          nish: nishValue,
          url: characterUrl,
          raceClass: raceClass || "",
          level: level || "",
          playerChar: playerCharString,
          slotNum: slotNum,
        };

        fMyConsoleLog(
          `   -> Calling fSrvSaveURLtoNamesAndLogToDBandPS with bundled data...`
        );
        google.script.run
          .withSuccessHandler((success) => {
            if (success) {
              fMyConsoleLog(
                "   -> ✅ Log & Headers updated successfully on server targets."
              );
            } else {
              fMyConsoleLog(
                "   -> ⚠️ Log & Headers update partially failed on server. Check server logs."
              );
              fShowMessage(
                "⚠️ Warning: Update failed for one or more target sheets."
              ).catch((e) => console.error("Error showing message:", e));
            }
            gUI.isSendingLog = false;
            fMyConsoleLog("   -> Lock Released.");
            resolve(success);
          })
          .withFailureHandler((error) => {
            const errorMsg = error?.message || "Unknown server error";
            console.error(
              `fSendLogToGMScreenAndPS Failure: ${errorMsg}`,
              error
            );
            fMyConsoleLog(`   -> ❌ Error sending Log & Headers: ${errorMsg}`);
            gUI.isSendingLog = false;
            fMyConsoleLog("   -> Lock Released due to error.");
            fShowMessage(`❌ Error: Could not send updates: ${errorMsg}`).catch(
              (e) => console.error("Error showing message:", e)
            );
            resolve(false);
          })
          .fSrvSaveURLtoNamesAndLogToDBandPS(dataBundle);
      } catch (err) {
        console.error(
          "Synchronous error in fSendLogToGMScreenAndPS preparation:",
          err
        );
        fMyConsoleLog(
          `   -> ❌ Synchronous error preparing log send: ${err.message}`
        );
        gUI.isSendingLog = false;
        fMyConsoleLog("   -> Lock Released due to synchronous error.");
        reject(err);
      }
    });
  } // End function fSendLogToGMScreenAndPS

   * Purpose: Handles the "Update (Level, Slot, Names)" menu action.
   * Assumptions: Relies on a chain of async helper functions for cache refreshing and grid updates.
   * Notes: Force-refreshes user-specific caches, validates data, sends a log, and re-processes the grid.
   * @returns {Promise<void>} Resolves after completing actions or handling errors.
   */
  async function fHandleNewLevelSlotName() {
    const funcName = "fHandleNewLevelSlotName";
    fMyConsoleLog(`⚙️ Menu Action: ${funcName} Triggered...`);
    fShowMessageNoClose(
      "⏳ Refreshing Caches, Sending Log & Updating Grid...<br><br>This may take a minute.<br><br>Please wait."
    );
    try {
      const userCachesToRefresh = [
        {
          workbookAbr: "MyCS",
          sheetName: "RaceClass",
          gUIKey: "myCSRaceClassFSData",
        },
        {
          workbookAbr: "MyCS",
          sheetName: "List",
          gUIKey: "myCSListFSData",
        },
        {
          workbookAbr: "MyKL",
          sheetName: "KnownAbilities",
          gUIKey: "myKLKnownAbilitiesFSData",
        },
      ];
      const refreshPromises = userCachesToRefresh.map((config) =>
        fRefreshAndCacheOneFSData(
          config.workbookAbr,
          config.sheetName,
          config.gUIKey
        )
      );
      fMyConsoleLog(
        `   -> Starting parallel refresh for ${userCachesToRefresh.length} user caches...`
      );
      const results = await Promise.allSettled(refreshPromises);
      fMyConsoleLog(`   -> Parallel cache refreshes completed.`);
      let allRefreshesSucceeded = true;
      let firstErrorMessage = null;
      for (let i = 0; i < results.length; i++) {
        const result = results[i];
        const config = userCachesToRefresh[i];
        if (result.status === "rejected" || result.value === false) {
          allRefreshesSucceeded = false;
          firstErrorMessage =
            result.reason?.message || `Refresh failed for ${config.gUIKey}.`;
          fMyConsoleLog(
            `      -> ❌ Refresh FAILED for ${config.gUIKey}: ${firstErrorMessage}`
          );
          break;
        } else {
          fMyConsoleLog(`      -> ✅ Refresh SUCCEEDED for ${config.gUIKey}.`);
        }
      }
      if (!allRefreshesSucceeded) {
        throw new Error(
          firstErrorMessage || `One or more cache refreshes failed.`
        );
      }
      fMyConsoleLog(`   -> All user cache refreshes successful.`);
      fMyConsoleLog(
        "   -> Updating Ability Dropdowns based on refreshed List cache..."
      );
      fProcessCachedAbilityList();
      fMyConsoleLog("      -> ✅ Ability Dropdowns updated.");
      fMyConsoleLog("   -> Validating Slot Number from refreshed data...");
      const currentSlot = gUI.characterInfo?.slotNum;
      const slotRegex = /^Slot([1-9])$/i;
      if (!currentSlot || !slotRegex.test(currentSlot)) {
        const invalidSlotMsg = `Invalid or missing Slot # ("${
          currentSlot || "null"
        }") after cache refresh.`;
        throw new Error(invalidSlotMsg);
      }
      fMyConsoleLog(`      -> Slot validated: ${currentSlot}`);
      fMyConsoleLog("   -> Sending log update...");
      await fSendLogToGMScreenAndPS();
      fMyConsoleLog("      -> ✅ Log send successful.");
      fMyConsoleLog("   -> Refreshing grid rows (Abilities/Gear)...");
      await fTotalRereshOfAllAbilitiesAndAllGear();
      fMyConsoleLog("      -> ✅ Grid row refresh complete.");
      fMyConsoleLog(`✅ ${funcName} Completed Successfully.`);
      fHideMessage();
    } catch (error) {
      fHideMessage();
      const errorMsg = `❌ Error during Update (Level, Slot, Names): ${
        error?.message || error
      }`;
      console.error(errorMsg, error);
      fMyConsoleLog(`   -> ❌ ${errorMsg}`);
      await fShowMessage(errorMsg);
    }
  } // End function fHandleNewLevelSlotName

  async function fHandleGMAward() {
    const funcName = "fHandleGMAward";
    fMyConsoleLog(`⚙️ Menu Action: ${funcName} Triggered...`);
    const cacheKey = "dbCritFSData";
    if (!gUI[cacheKey]) {
      console.error(`${funcName}: Cache object gUI['${cacheKey}'] is missing.`);
      return;
    }
    const gmawardColTag = "GMAward";
    const startRowTag = "RowBeforeFirstDataRow";
    const gmawardColIndex = fResolveFSDataCol(cacheKey, gmawardColTag);
    const startRowIndex = fResolveFSDataRow(cacheKey, startRowTag) + 1;
    if (isNaN(gmawardColIndex) || isNaN(startRowIndex)) {
      return;
    }
    const awardsList = [];

      if (trimmedValue !== "") {
        awardsList.push(trimmedValue);
      }

      fMyConsoleLog(
        `   -> ${funcName}: No valid GM Awards found in '${gmawardColTag}' column starting from row '${startRowTag}'. Skipping display.`

  /** function fMetaFlood
   * Purpose: Handles the "Meta Flood" menu action.
   * Assumptions: gUI.range.meta and gUI.list.metaFull are correctly defined.
   * Notes: Randomly selects a Meta column, increases its value and preceding values, caps them, and logs.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fMetaFlood() {
    fMyConsoleLog("⚙️ Menu Action: Meta Flood...");
    const metaRangeDef = gUI.range?.meta;
    const metaCaps = gUI.list?.metaFull;
    const metaColorTags = gUI.list?.metaColor;
    let errorMsg = "";
    if (!metaRangeDef || !fDoesObjectHaveR1C1R2C2Properties(metaRangeDef))
      errorMsg = "Meta range definition missing or invalid.";
    else if (!Array.isArray(metaCaps) || metaCaps.length === 0)
      errorMsg = "Meta caps list (gUI.list.metaFull) missing or invalid.";
    if (errorMsg) {
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const metaRowTag = metaRangeDef.r1;
    const startCol = fResolveCol(metaRangeDef.c1);
    const endCol = fResolveCol(metaRangeDef.c2);
    if ([startCol, endCol].some(isNaN)) {
      errorMsg = `Could not resolve Meta column tags: ${metaRangeDef.c1}, ${metaRangeDef.c2}.`;
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const numMetaCols = Math.abs(endCol - startCol) + 1;
    if (metaCaps.length > 0 && numMetaCols !== metaCaps.length) {
      errorMsg = `Mismatch between number of Meta columns (${numMetaCols}) and Meta caps (${metaCaps.length}).`;
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const selectedIndex = Math.floor(Math.random() * numMetaCols);
    const selectedColIndex = startCol + selectedIndex;
    const selectedColTag =
      metaColorTags?.[selectedIndex] ?? `Index ${selectedIndex}`;
    fMyConsoleLog(
      `   -> Selected Meta Index: ${selectedIndex} (Column ${selectedColIndex} - Tag: ${selectedColTag})`
    );
    const finalValues = [];
    let amountToAdd = 1;
    for (let i = selectedIndex; i >= 0; i--) {
      const currentColIndex = startCol + i;
      const currentColTag = metaColorTags?.[i] ?? `Index ${i}`;
      const currentVal = fGetGridValue(metaRowTag, currentColIndex, true) || 0;
      const newValRaw = currentVal + amountToAdd;
      const cap =
        metaCaps && metaCaps[i] !== undefined ? metaCaps[i] : Infinity;
      const finalVal = Math.min(newValRaw, cap);
      fMyConsoleLog(
        `      -> Index ${i} (${currentColTag}): Current=${currentVal}, Add=${amountToAdd}, Raw=${newValRaw}, Cap=${
          cap === Infinity ? "N/A" : cap
        } => Final=${finalVal}`
      );
      finalValues.unshift(finalVal);
      amountToAdd++;
    }
    fMyConsoleLog(
      `   -> Updating Meta columns ${startCol} to ${selectedColIndex} with final values: [${finalValues.join(
        ", "
      )}]`
    );
    const success = fSetRangeOfGridValues(
      metaRowTag,
      startCol,
      metaRowTag,
      selectedColIndex,
      finalValues
    );
    if (!success) {
      errorMsg = `fSetRangeOfGridValues failed to update Meta grid.`;
      fMyConsoleLog(`   -> ⚠️ Meta Flood Error: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
    } else {
      fMyConsoleLog("✅ Meta Flood Update Complete.");
      const sidebarMsgHtml = `<span class="blue-bold">ℹ️ Meta Flood (Rolled ${selectedColTag}):</span>`;
      const sidebarMsgText = `ℹ️ Meta Flood (Rolled ${selectedColTag}):`;
      fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
      fShowSidebar();
      setTimeout(() => fSendLogToGMScreenAndPS(), 0);
    }
  } // End function fMetaFlood

  /** function fMetaChannel
   * Purpose: Handles the Meta Channeling calculation.
   * Assumptions: gUI.range.metaChannel and gUI.list.metaColor are correctly defined.
   * Notes: Randomly selects a Meta Channel column, increments its value, updates the grid, and logs the action.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fMetaChannel() {
    fMyConsoleLog("⚙️ Calculating Meta Channel...");
    const channelRangeDef = gUI.range?.metaChannel;
    const metaColorTags = gUI.list?.metaColor;
    let errorMsg = "";
    if (!channelRangeDef || !fDoesObjectHaveR1C1R2C2Properties(channelRangeDef))
      errorMsg = "Meta Channel range definition missing or invalid.";
    if (errorMsg) {
      console.warn(`fMetaChannel: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Channel failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const channelRowTag = channelRangeDef.r1;
    const startCol = fResolveCol(channelRangeDef.c1);
    const endCol = fResolveCol(channelRangeDef.c2);
    if ([startCol, endCol].some(isNaN)) {
      errorMsg = `Could not resolve Meta Channel column tags: ${channelRangeDef.c1}, ${channelRangeDef.c2}.`;

      fMyConsoleLog(`⚠️ Meta Channel failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const numMetaCols = Math.abs(endCol - startCol) + 1;
    const roll1 = Math.floor(Math.random() * numMetaCols);
    const roll2 = Math.floor(Math.random() * numMetaCols);
    const lowestSelectedIndex = Math.min(roll1, roll2);
    const finalColIndex = startCol + lowestSelectedIndex;
    const selectedColTag =
      metaColorTags?.[lowestSelectedIndex] ?? `Index ${lowestSelectedIndex}`;
    fMyConsoleLog(
      `   -> Meta Channel Rolls: ${roll1}, ${roll2}. Lowest Index: ${lowestSelectedIndex} (Column ${finalColIndex} - Tag: ${selectedColTag})`
    );
    const currentVal = fGetGridValue(channelRowTag, finalColIndex, true) || 0;
    const newValue = currentVal + 1;
    fMyConsoleLog(
      `      -> Index ${lowestSelectedIndex} (${selectedColTag}): Current=${currentVal}, Add=1 => New=${newValue}`
    );
    const success = fSetGridValue(channelRowTag, finalColIndex, newValue);
    if (!success) {
      errorMsg = `fSetGridValue failed to update Meta Channel grid cell [${channelRowTag}, ${finalColIndex}].`;
      fMyConsoleLog(`   -> ⚠️ Meta Channel Error: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
    } else {
      fMyConsoleLog("✅ Meta Channel Update Complete.");

  /** function fIsOn_NewNishSet
   * Purpose: Processes the 'Is On' / 'Duration' columns at the start of a Nish turn.
   * Assumptions: gUI.range.isONDur contains valid range definitions.
   * Notes: Decrements positive integer durations by 1 and clears specific non-numeric states (e.g., 'i', 'p').
   * @returns {Promise<void>} Resolves after processing all defined ranges.
   */
  async function fIsOn_NewNishSet() {
    fMyConsoleLog("⚙️ Processing 'Is On/Duration' cells for Nish turn...");
    const rangeDefs = gUI.range?.isONDur;
    if (!Array.isArray(rangeDefs) || rangeDefs.length === 0) {
      fMyConsoleLog(
        "⚠️ Cannot process 'Is On': Range definitions missing or empty in gUI.range.isONDur."
      );
      return;
    }
    let cellsProcessed = 0;
    let cellsChanged = 0;
    let errorsEncountered = false;
    for (const range of rangeDefs) {
      if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
        console.warn("fIsOn_NewNishSet: Skipping invalid range object", range);
        errorsEncountered = true;
        continue;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          "fIsOn_NewNishSet: Skipping range due to unresolved indices",
          range
        );
        errorsEncountered = true;
        continue;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          cellsProcessed++;
          const currentValue = fGetGridValue(r, c);
          let newValue = currentValue;
          if (currentValue === null || typeof currentValue === "undefined") {
            newValue = "";
          } else {
            const currentValueStrLower = String(currentValue).toLowerCase();
            if (
              currentValueStrLower === "i" ||
              currentValueStrLower === "p" ||
              currentValueStrLower === "n"
            ) {
              newValue = "";
            } else {
              const numericValue = Number(currentValue);
              if (!isNaN(numericValue)) {
                if (numericValue > 0) {
                  newValue = numericValue - 1;
                  if (newValue === 0) {
                    newValue = "";
                  }
                } else if (numericValue === 0) {
                  newValue = "";
                }
              }
            }
          }
          if (newValue !== currentValue) {
            if (fSetGridValue(r, c, newValue)) {
              cellsChanged++;
            } else {
              errorsEncountered = true;
            }
          }
        }
      }
    }
    fMyConsoleLog(
      `✅ 'Is On/Duration' Processing Complete. Processed: ${cellsProcessed}, Changed: ${cellsChanged}${
        errorsEncountered ? " (with errors)" : ""
      }.`
    );
  } // End function fIsOn_NewNishSet

  /** function fProcessWoundHealing
   * Purpose: Calculates and applies healing for a specific wound degree.
   * Assumptions: Called by function fCalc_NaturalHealing.
   * Notes: This is a helper function for the natural healing process.
   * @param {string} woundRangeTag - Tag for the specific wound cell.
   * @param {number} vitMax - Character's maximum vitality.
   * @param {number} divisor - Divisor for Vit Max to determine healing die size.
   * @param {string} degreeLabel - Label for logging ('1st', '2nd', '3rd').
   * @returns {Promise<number | null>} The amount healed, or null on error.
   */
  async function fProcessWoundHealing(
    woundRangeTag,
    vitMax,
    divisor,
    degreeLabel
  ) {
    fMyConsoleLog(`      -> Processing ${degreeLabel} Degree wounds...`);
    const woundRange = gUI.range?.[woundRangeTag];
    if (!woundRange || !woundRange.r1 || !woundRange.c1) {
      const msg = `Wound range definition missing for tag: ${woundRangeTag}.`;
      console.warn(`fProcessWoundHealing: ${msg}`);
      fMyConsoleLog(`         -> ⚠️ Error: ${msg}`);
      await fShowMessage(`❌ Error processing ${degreeLabel} wounds: ${msg}`);
      return null;
    }
    let currentWounds = Math.max(
      0,
      fGetGridValue(woundRange.r1, woundRange.c1, true) || 0
    );
    if (isNaN(currentWounds)) {
      fMyConsoleLog(
        `         -> Warning: Invalid current wound value for ${degreeLabel}. Assuming 0.`
      );
      currentWounds = 0;
    }
    const healingDieSize = Math.max(1, Math.round(vitMax / divisor));
    const healingRoll = fdRoll(healingDieSize);
    fMyConsoleLog(
      `         -> Healing roll (${degreeLabel}): d${healingDieSize} = ${healingRoll}`
    );
    const newWounds = Math.max(0, currentWounds - healingRoll);
    const actualHealed = currentWounds - newWounds;
    fMyConsoleLog(
      `         -> Wounds: ${currentWounds} -> ${newWounds} (Healed: ${actualHealed})`
    );
    if (!fSetGridValue(woundRange.r1, woundRange.c1, newWounds)) {
      const msg = `Failed to update grid for ${degreeLabel} wounds.`;
      console.warn(`fProcessWoundHealing: ${msg}`);
      fMyConsoleLog(`         -> ⚠️ Error: ${msg}`);
      await fShowMessage(`❌ Error updating ${degreeLabel} wounds: ${msg}`);
      return null;
    }
    return actualHealed;
  } // End function fProcessWoundHealing

  /** function fCalc_VitMaxNowPerc
   * Purpose: Handles the "Set Vit Max" menu action by recalculating derived vitality values.
   * Assumptions: gUI.range definitions for Vit and Fortitude are correct.
   * Notes: Calculates and updates Vit Max, Vit Now, and Vit Now Percent based on Fortitude and bonuses.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fCalc_VitMaxNowPerc() {
    fMyConsoleLog("⚙️ Menu Action: Setting Vit to Max...");
    const fortitudeRange = gUI.range?.fortitudeSk1;
    const vitMaxRange = gUI.range?.vitMax;
    const vitMaxPlusRange = gUI.range?.vitMaxPlus;
    let errorMsg = "";
    if (!fortitudeRange || !fortitudeRange.r1 || !fortitudeRange.c1)
      errorMsg = "Fortitude range definition missing.";
    else if (!vitMaxRange || !vitMaxRange.r1 || !vitMaxRange.c1)
      errorMsg = "Vit Max range definition missing.";
    else if (!vitMaxPlusRange || !vitMaxPlusRange.r1 || !vitMaxPlusRange.c1)
      errorMsg = "Vit Max Plus range definition missing.";
    if (errorMsg) {
      console.warn(`fCalc_VitMaxNowPerc: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Cannot set Vit to max: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const fortitudeValueRaw = fGetGridValue(
      fortitudeRange.r1,
      fortitudeRange.c1
    );
    const fortitudeValue = Number(fortitudeValueRaw);
    if (isNaN(fortitudeValue)) {
      errorMsg = `Fortitude Sk1 value ('${fortitudeValueRaw}') is not a valid number.`;
      console.warn(`fCalc_VitMaxNowPerc: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Cannot set Vit to max: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(`   -> Fortitude Sk1 value: ${fortitudeValue}`);
    const vitMaxPlusValueRaw = fGetGridValue(
      vitMaxPlusRange.r1,
      vitMaxPlusRange.c1
    );
    let vitMaxPlusBonus = 0;
    if (
      vitMaxPlusValueRaw !== null &&
      vitMaxPlusValueRaw !== "" &&
      !isNaN(Number(vitMaxPlusValueRaw))
    ) {
      vitMaxPlusBonus = Math.round(Number(vitMaxPlusValueRaw));
      fMyConsoleLog(
        `   -> Vit Max Plus Bonus found: ${vitMaxPlusValueRaw} -> Rounded: ${vitMaxPlusBonus}`
      );
    } else {
      fMyConsoleLog(`   -> No valid Vit Max Plus Bonus found. Using 0.`);
    }
    const newVitMax = Math.round(fortitudeValue + vitMaxPlusBonus);
    fMyConsoleLog(
      `   -> Calculated New Vit Max: ${fortitudeValue} (For) + ${vitMaxPlusBonus} (Bonus) = ${newVitMax}`
    );
    const setMaxSuccess = fSetGridValue(
      vitMaxRange.r1,
      vitMaxRange.c1,
      newVitMax
    );
    if (!setMaxSuccess) {
      fMyConsoleLog(
        `⚠️ Failed to set Vit Max value (${newVitMax}) in cell (${vitMaxRange.r1}, ${vitMaxRange.c1}). Aborting further updates.`
      );
      await fShowMessage(
        `❌ Error: Failed to update the Vit Max value in the grid.`
      );
      return;
    }
    fMyConsoleLog(`   -> Successfully set Vit Max to ${newVitMax}.`);
    await fVitNowNPercent_Calc();
    fMyConsoleLog("✅ Vit Set to Max sequence complete.");
    fMyConsoleLog(
      "   -> Calling function fSendLogToGMScreenAndPS from function fCalc_VitMaxNowPerc..."
    );
    setTimeout(() => fSendLogToGMScreenAndPS(), 0);
  } // End function fCalc_VitMaxNowPerc

  /** function fVitNowNPercent_Calc
   * Purpose: Calculates 'Vit Now' and 'Vit Now Percent' and updates the grid.
   * Assumptions: Called after Vit Max or Wounds have changed. gUI.range definitions are correct.
   * Notes: This is a helper function to keep derived vitality fields synchronized.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fVitNowNPercent_Calc() {
    fMyConsoleLog("   -> Calculating Vit Now & Percent...");
    const vitMaxRange = gUI.range?.vitMax;
    const vit1stRange = gUI.range?.vit1stWnds;
    const vit2ndRange = gUI.range?.vit2ndWnds;
    const vit3rdRange = gUI.range?.vit3rdWnds;
    const vitNowRange = gUI.range?.vitNow;
    const vitNowPercentRange = gUI.range?.vitNowPercent;
    let errorMsg = "";
    if (!vitMaxRange || !vitMaxRange.r1 || !vitMaxRange.c1)
      errorMsg = "Vit Max range definition missing.";
    else if (!vit1stRange || !vit1stRange.r1 || !vit1stRange.c1)
      errorMsg = "Vit 1st Wounds range definition missing.";
    else if (!vit2ndRange || !vit2ndRange.r1 || !vit2ndRange.c1)
      errorMsg = "Vit 2nd Wounds range definition missing.";
    else if (!vit3rdRange || !vit3rdRange.r1 || !vit3rdRange.c1)
      errorMsg = "Vit 3rd Wounds range definition missing.";
    else if (!vitNowRange || !vitNowRange.r1 || !vitNowRange.c1)
      errorMsg = "Vit Now range definition missing.";
    else if (
      !vitNowPercentRange ||
      !vitNowPercentRange.r1 ||
      !vitNowPercentRange.c1
    )
      errorMsg = "Vit Now Percent range definition missing.";
    if (errorMsg) {
      console.warn(`fVitNowNPercent_Calc: ${errorMsg}`);
      fMyConsoleLog(`   -> ⚠️ Calculation aborted: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const currentVitMaxRaw = fGetGridValue(vitMaxRange.r1, vitMaxRange.c1);
    const currentVitMax = Number(currentVitMaxRaw);
    if (isNaN(currentVitMax)) {
      errorMsg = `Vit Max value ('${currentVitMaxRaw}') needed for calculation is not a number.`;
      console.warn(`fVitNowNPercent_Calc: ${errorMsg}`);
      fMyConsoleLog(`   -> ⚠️ Calculation aborted: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const getWoundVal = (range) => {
      const raw = fGetGridValue(range.r1, range.c1);
      return raw !== null && raw !== "" && !isNaN(Number(raw))
        ? Math.round(Number(raw))
        : 0;
    };
    const wounds1st = getWoundVal(vit1stRange);
    const wounds2nd = getWoundVal(vit2ndRange);
    const wounds3rd = getWoundVal(vit3rdRange);
    const totalWounds = wounds1st + wounds2nd + wounds3rd;
    fMyConsoleLog(
      `      -> Wounds: ${wounds1st}(1st) + ${wounds2nd}(2nd) + ${wounds3rd}(3rd) = ${totalWounds}`
    );
    const newVitNow = Math.round(currentVitMax - totalWounds);
    fMyConsoleLog(
      `      -> Calculated Vit Now: ${currentVitMax} (Max) - ${totalWounds} (Wounds) = ${newVitNow}`
    );
    const setNowSuccess = fSetGridValue(
      vitNowRange.r1,
      vitNowRange.c1,
      newVitNow
    );
    if (!setNowSuccess) {
      fMyConsoleLog(`   -> ⚠️ Failed to set Vit Now value (${newVitNow}).`);
      await fShowMessage(`❌ Error: Failed to update the Vit Now value.`);
    }
    const percent =
      currentVitMax === 0 ? 0 : Math.round((newVitNow / currentVitMax) * 100);
    const percentString = percent + "%";
    fMyConsoleLog(`      -> Calculated Vit Now Percent: ${percentString}`);
    const setPercentSuccess = fSetGridValue(
      vitNowPercentRange.r1,
      vitNowPercentRange.c1,
      percentString
    );
    if (!setPercentSuccess) {
      fMyConsoleLog(
        `   -> ⚠️ Failed to set Vit Now Percent value (${percentString}).`
      );
      await fShowMessage(
        `❌ Error: Failed to update the Vit Now Percent value.`
      );
    }
    fMyConsoleLog("   -> Vit Now & Percent Calculation complete.");
  } // End function fVitNowNPercent_Calc

  function fToggleGearColumns() {

        "fToggleGearColumns: gUI.gearTblCols is not a valid array or is empty."
      );
      fMyConsoleLog("❌ Error: Gear column definition missing or invalid.");
      return;
    }
    let isCurrentlyVisible = false;
    for (const range of gearRanges) {
      if (
        !range ||
        typeof range.c1 === "undefined" ||
        typeof range.c2 === "undefined"
      ) {
        console.warn(
          "fToggleGearColumns: Skipping invalid range object:",
          range
        );
        continue;
      }
      const startCol = fResolveCol(range.c1);
      const endCol = fResolveCol(range.c2);
      if (isNaN(startCol) || isNaN(endCol)) {
        console.warn(
          `fToggleGearColumns: Skipping gear range due to invalid tags/indices: ${range.c1}, ${range.c2}`
        );
        continue;
      }
      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);
      for (let c = cMin; c <= cMax; c++) {
        if (!gUI.hiddenColumns.has(c)) {
          isCurrentlyVisible = true;
          break;
        }
      }
      if (isCurrentlyVisible) break;
    }
    if (isCurrentlyVisible) {
      fMyConsoleLog("⚙️ Toggling Gear: Currently Visible -> Hiding...");
      fHideGridsColumnRange(gearRanges);
    } else {
      fMyConsoleLog("⚙️ Toggling Gear: Currently Hidden -> Showing...");

   * Purpose: Rolls 1d12 to randomly trigger a specific type of loot roll.
   * Assumptions: Relies on other fLoot_* functions to handle the specific loot types.
   * Notes: This acts as a dispatcher for the random treasure feature.
   * @returns {void}
   */
  function fLoot_RollRndTreasure() {
    const funcName = "fLoot_RollRndTreasure";
    fMyConsoleLog(`⚙️ ${funcName}: Rolling for random treasure type...`);
    const roll = fdRoll(12);
    fMyConsoleLog(`   -> Random Treasure Roll (d12): ${roll}`);
    switch (true) {
      case roll <= 2:
        fLoot_RollValuables(true);
        break;
      case roll <= 4:
        fLoot_RollGear(true);
        break;
      case roll <= 6:
        fLoot_ChaosCrystal(true);
        break;
      case roll <= 8:
        fLoot_RollSocketGem(true);
        break;
      case roll <= 10:
        fLoot_RollArtifact(true);
        break;
      default:
        fLoot_RollSockets(true);
    }
  } // End function fLoot_RollRndTreasure

    const lootType = "Artifact";
    fMyConsoleLog(
      `⚙️ ${funcName}: Triggered placeholder for ${lootType} (isRandomRoll: ${isRandomRoll})...`
    );
    const charLvl = Number(gUI.characterInfo?.level) || 0;
    const cacheKey = "dbGearFSData";
    const gearCache = gUI[cacheKey];
    if (
      !gearCache ||
      !gearCache.text ||
      !Array.isArray(gearCache.text) ||
      !gearCache.colTagsMap ||
      typeof gearCache.colTagsMap !== "object" ||
      !gearCache.rowTagsMap ||
      typeof gearCache.rowTagsMap !== "object"
    ) {
      const errorMsg = `Required cache ${cacheKey} is not loaded or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      await fShowMessage(`Error: ${errorMsg}`);
      return;
    }
    const isArtifact_C = fResolveFSDataCol(cacheKey, "IsArtifact");
    const artName_C = fResolveFSDataCol(cacheKey, "Name");
    const apCost_C = fResolveFSDataCol(cacheKey, "AP");
    const artDataFirst_R = fResolveFSDataRow(cacheKey, "RowBeforeFirstDataRow");
    const firstDataRowIndex = artDataFirst_R + 1;
    const artDataLast_R = gearCache.text.length - 1;
    const failedTags = [];
    if (isNaN(isArtifact_C)) failedTags.push("IsArtifact");
    if (isNaN(artName_C)) failedTags.push("Name");
    if (isNaN(apCost_C)) failedTags.push("AP");
    if (isNaN(artDataFirst_R))
      failedTags.push("RowBeforeFirstDataRow (start row)");
    if (failedTags.length > 0) {
      const errorMsg = `Could not resolve required tags in ${cacheKey}: ${failedTags.join(
        ", "
      )}.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      await fShowMessage(`Error: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(
      `   -> Resolved Tags: IsArtifact=${isArtifact_C}, Name=${artName_C}, AP=${apCost_C}. Data Range: ${firstDataRowIndex}-${artDataLast_R}. CharLvl=${charLvl}.`
    );
    const artifactRows = [];
    for (let r = firstDataRowIndex; r <= artDataLast_R; r++) {
      const rowData = gearCache.text[r];
      if (!Array.isArray(rowData)) continue;
      const isArtifactVal = rowData[isArtifact_C];
      const isTrulyArtifact =
        isArtifactVal === true ||
        String(isArtifactVal).toUpperCase() === "TRUE";
      if (isTrulyArtifact) {
        artifactRows.push({
          index: r,
          data: rowData,
        });
      }
    }
    if (artifactRows.length === 0) {
      const errorMsg = `No items marked as Artifact found in ${cacheKey}.`;
      fMyConsoleLog(`   -> ⚠️ ${funcName} Warning: ${errorMsg}`);
      await fShowMessage(`Warning: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(`   -> Found ${artifactRows.length} total artifacts.`);
    const maxAPCost = Math.max(5, charLvl);
    fMyConsoleLog(
      `   -> Filtering artifacts by Max AP Cost <= ${maxAPCost} (based on charLvl ${charLvl}).`
    );
    const eligibleArtifacts = artifactRows.filter((artifact) => {
      const apCost = Number(artifact.data[apCost_C]) || Infinity;
      return apCost <= maxAPCost;
    });
    if (eligibleArtifacts.length === 0) {
      const errorMsg = `No artifacts found with AP Cost <= ${maxAPCost}.`;
      fMyConsoleLog(`   -> ⚠️ ${funcName} Warning: ${errorMsg}`);
      const userMsg = `No artifacts found suitable for character level ${charLvl} (Max AP Cost: ${maxAPCost}).`;
      await fShowMessage(userMsg);
      return;
    }
    fMyConsoleLog(
      `   -> Found ${eligibleArtifacts.length} eligible artifacts.`
    );
    const randomIndex = Math.floor(Math.random() * eligibleArtifacts.length);
    const selectedArtifact = eligibleArtifacts[randomIndex];
    const selectedRowData = selectedArtifact.data;
    const artName = String(
      selectedRowData[artName_C] || "Unknown Artifact"
    ).trim();
    const apCost = selectedRowData[apCost_C] ?? "?";
    fMyConsoleLog(
      `   -> Selected Artifact: "${artName}" (AP: ${apCost}) at original index ${selectedArtifact.index}.`
    );
    let titleHtml, titleText;
    if (isRandomRoll) {
      titleHtml = `<span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `Loot ${lootType}:`;
    } else {
      titleHtml = `<span class="red-bold">SPECIFIC</span> <span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `SPECIFIC Loot ${lootType}:`;
    }
    const messageBodyHtml = `${artName} (${apCost}AP)`;
    const messageBodyText = `${artName} (${apCost}AP)`;
    const sidebarMsgHtml = `${titleHtml}<br>${messageBodyHtml}`;
    const sidebarMsgText = `${titleText}\n${messageBodyText}`;
    fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
    fShowSidebar();
    setTimeout(() => fSendLogToGMScreenAndPS(), 0);
    fMyConsoleLog(`✅ ${funcName}: Artifact loot posted.`);
  } // End function fLoot_RollArtifact

  /** function fLoot_RollSockets
   * Purpose: Rolls a random socketed item type, number of sockets, and socket colors.
   * Assumptions: gUI.characterInfo and gUI.list.metaColor are populated.
   * Notes: Logs the result to the sidebar.
   * @param {boolean} [isRandomRoll=false] - True if called via function fLoot_RollRndTreasure.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fLoot_RollSockets(isRandomRoll = false) {
    const funcName = "fLoot_RollSockets";

      `⚙️ ${funcName}: Triggered for ${lootType} (isRandomRoll: ${isRandomRoll})...`
    );

    const socketColors = gUI.list?.metaColor;
    if (!Array.isArray(socketColors) || socketColors.length !== 5) {
      const errorMsg = `Socket color list (gUI.list.metaColor) is missing or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      await fShowMessage(`Error: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(
      `   -> CharLvl=${charLvl}. Socket Colors: ${socketColors.join(",")}`
    );
    let maxGemColorIndexBase;
    if (charLvl <= 4) maxGemColorIndexBase = 2;
    else if (charLvl <= 9) maxGemColorIndexBase = 3;
    else maxGemColorIndexBase = 4;
    const maxGemSlots = Math.max(1, Math.floor(Math.cbrt(charLvl)));
    const numGemSlots = Math.min(fdRoll(maxGemSlots), fdRoll(maxGemSlots));
    fMyConsoleLog(
      `   -> Max Slots based on Level ${charLvl}: ${maxGemSlots}. Actual Slots Rolled: ${numGemSlots}.`
    );
    const slotColorArr = [];
    fMyConsoleLog(
      `   -> Determining ${numGemSlots} slot color(s) (Max Base Index: ${maxGemColorIndexBase})...`
    );
    for (let i = 0; i < numGemSlots; i++) {
      const roll1 = fdRoll(maxGemColorIndexBase + 1);
      const roll2 = fdRoll(maxGemColorIndexBase + 1);
      let colorIndex = Math.min(roll1, roll2) - 1;
      colorIndex = Math.max(0, colorIndex);
      slotColorArr.push(socketColors[colorIndex]);
      fMyConsoleLog(
        `      -> Slot ${
          i + 1
        }: Rolls=(${roll1}, ${roll2}) => Index=${colorIndex} => Color=${
          socketColors[colorIndex]
        }`
      );
    }
    const slotColorsText = slotColorArr.join(", ");
    const weaponArr = [
      "Rnd Owned Body Weapon",
      "Selected Body Weapon",
      "Rnd Owned Melee Weapon",
      "Selected Melee Weapon",
      "Rnd Owned Hurled Weapon",
      "Selected Hurled Weapon",
      "Rnd Owned Ranged Weapon",
      "Selected Ranged Weapon",
    ];
    const itemArr = [
      "Boots",
      "Gloves",
      "Gauntlet",
      "Rnd Owned Armor",
      "Selected Armor",
      "Pants",
      "Belt",
      "Tunic/Shirt",
      "Ring",
      "Arm Band",
      "Helmet",
      "Tiara",
      "Necklace",
      "Amulet",
      "Pendant/Broach",
    ];
    const itemTypeRoll = fdRoll(3);
    const selectedArray = itemTypeRoll === 1 ? weaponArr : itemArr;
    const itemRolled =
      selectedArray[Math.floor(Math.random() * selectedArray.length)];
    fMyConsoleLog(
      `   -> Selected Item Type Roll (d3=${itemTypeRoll}): "${itemRolled}"`
    );
    let titleHtml, titleText;
    if (isRandomRoll) {
      titleHtml = `<span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `Loot ${lootType}:`;
    } else {
      titleHtml = `<span class="red-bold">SPECIFIC</span> <span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `SPECIFIC Loot ${lootType}:`;
    }
    const slotLabel = numGemSlots === 1 ? "slot" : "slots";
    const messageBodyHtml = `${itemRolled} with ${slotColorsText} ${slotLabel}`;
    const messageBodyText = `${itemRolled} with ${slotColorsText} ${slotLabel}`;
    const sidebarMsgHtml = `${titleHtml}<br>${messageBodyHtml}`;
    const sidebarMsgText = `${titleText}\n${messageBodyText}`;
    fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
    fShowSidebar();
    setTimeout(() => fSendLogToGMScreenAndPS(), 0);
