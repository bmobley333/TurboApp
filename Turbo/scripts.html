<script>
  // scripts.html //

  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  // End - n/a
  // Start - Core Rendering Pipeline
  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

  /** function fRenderTurbosFullGrid
   * Purpose: Main controller function to render the entire grid dynamically.
   * Assumptions: Renders cells in chunks using requestAnimationFrame for performance.
   * @param {Function} callback - Function to execute after the grid is fully rendered.
   * @returns {void}
   */
  function fRenderTurbosFullGrid(callback) {
    fMyConsoleLog("⚙️ Rendering Full Grid...");
    const grid = document.getElementById("grid");
    const gameArr = gUI.arr;
    const format = gUI.format || {};
    if (!fInitGridAndSettings(grid, gameArr)) {
      return;
    }
    const numRows = gameArr.length;
    const numCols = gameArr[0].length;
    fSetGridColumnWidths(grid, format, numCols);
    fSetGridTagsFromHeaders();
    gUI.grid2D = Array.from(
      {
        length: numRows,
      },
      () => Array(numCols).fill(null)
    );
    fMyConsoleLog(`🏎️ Rendering ${numRows} rows in chunks of 50...`);
    const renderChunk = fRenderChunkFactory(
      grid,
      gameArr,
      format,
      50,
      callback
    );
    requestAnimationFrame(renderChunk);
  } // End function fRenderTurbosFullGrid

  /** function fRenderChunkFactory
   * Purpose: Creates a closure function responsible for rendering grid rows in chunks.
   * Assumptions: Called by `function fRenderTurbosFullGrid`.
   * @param {HTMLElement} grid - The grid container element.
   * @param {any[][]} gameArr - The 2D array of grid data.
   * @param {object} format - The main grid format object.
   * @param {number} chunkSize - The number of rows to render per chunk.
   * @param {Function} callback - Function to call after all chunks are rendered.
   * @returns {Function} The `renderChunk` closure function.
   */
  function fRenderChunkFactory(grid, gameArr, format, chunkSize, callback) {
    let r = 0;
    const numRows = gameArr.length;
    const numCols = gameArr[0].length;
    return function renderChunk() {
      const fragment = document.createDocumentFragment();
      const endRow = Math.min(r + chunkSize, numRows);
      for (let rowIdx = r; rowIdx < endRow; rowIdx++) {
        const rowData = gameArr[rowIdx];
        const rowFormat = fBuildRowFormat(format, rowIdx);
        fAppendRowCells(fragment, rowIdx, rowData, rowFormat, numCols);
      }
      grid.appendChild(fragment);
      r = endRow;
      if (r < numRows) {
        requestAnimationFrame(renderChunk);
      } else {
        fMyConsoleLog(`✅ Grid Rendered (${numRows} rows)`);
        if (typeof callback === "function") {
          fMyConsoleLog("🚀 Applying Post-Render Formatting...");
          setTimeout(callback, 0);
        }
      }
    };
  } // End function fRenderChunkFactory

  /** function fInitGridAndSettings
   * Purpose: Validates the grid container and data array, and clears existing content.
   * Assumptions: This is the first step of rendering.
   * @param {HTMLElement} grid - The grid container element (#grid).
   * @param {any[][]} gameArr - The 2D array of grid data (gUI.arr).
   * @returns {boolean} True if grid and data are valid, false otherwise.
   */
  function fInitGridAndSettings(grid, gameArr) {
    if (!grid) {
      console.error("❌ Grid container #grid not found!");
      return false;
    }
    if (
      !Array.isArray(gameArr) ||
      gameArr.length === 0 ||
      !Array.isArray(gameArr[0])
    ) {
      console.error("❌ gUI.arr is empty or malformed. Cannot render grid.");
      grid.innerHTML =
        '<p style="color:red;">Error: Invalid data array for rendering.</p>';
      return false;
    }
    grid.innerHTML = "";
    return true;
  } // End function fInitGridAndSettings

  /** function fSetGridColumnWidths
   * Purpose: Applies the 'grid-template-columns' CSS style to the grid container.
   * Assumptions: `gUI.format.colWidths` exists and is an array of numbers.
   * @param {HTMLElement} grid - The grid container element (#grid).
   * @param {object} format - The formatting object containing 'colWidths' array.
   * @param {number} numCols - The total number of columns in the grid.
   * @returns {void}
   */
  function fSetGridColumnWidths(grid, format, numCols) {
    const colWidths = format.colWidths || [];
    const gridTemplateColumns = colWidths.map((w) => `${w || 60}px`).join(" ");
    grid.style.gridTemplateColumns = gridTemplateColumns;
    fMyConsoleLog(`📐 Applied ${numCols} column widths`);
  } // End function fSetGridColumnWidths

  /** function fSetGridTagsFromHeaders
   * Purpose: Populates gUI.rowTag and gUI.colTag maps by reading from gUI.arr.
   * Assumptions: gUI.arr is populated with sheet data, with tags in row 0 and column 0.
   * @param {}
   * @returns {void}
   */
  function fSetGridTagsFromHeaders() {
    fMyConsoleLog("⚙️ Parsing Grid Tags...");
    gUI.rowTag = {};
    gUI.colTag = {};
    const gameArr = gUI.arr;
    if (!gameArr || gameArr.length === 0 || !gameArr[0]) {
      console.warn(
        "fSetGridTagsFromHeaders: Cannot parse tags, gUI.arr is empty or malformed."
      );
      fMyConsoleLog("⚠️ Grid Tags: Data empty.");
      return;
    }
    const rows = gameArr.length;
    const cols = gameArr[0].length;
    for (let r = 0; r < rows; r++) {
      const rowCell = gameArr[r]?.[0];
      if (typeof rowCell === "string" && rowCell) {
        rowCell.split(",").forEach((tag) => {
          const trimmedTag = tag.trim();
          if (trimmedTag) gUI.rowTag[trimmedTag] = r;
        });
      }
    }
    const colHeaderRow = gameArr[0];
    if (colHeaderRow) {
      for (let c = 0; c < cols; c++) {
        const colCell = colHeaderRow[c];
        if (typeof colCell === "string" && colCell) {
          colCell.split(",").forEach((tag) => {
            const trimmedTag = tag.trim();
            if (trimmedTag) gUI.colTag[trimmedTag] = c;
          });
        }
      }
    }
    fMyConsoleLog("✅ Grid Tags Parsed");
  } // End function fSetGridTagsFromHeaders

  /** function fBuildRowFormat
   * Purpose: Extracts and returns a formatting object specific to a single row index.
   * Assumptions: `gUI.format` is populated with arrays of formatting data.
   * @param {object} format - The main grid format object (gUI.format).
   * @param {number} rowIdx - The 0-based row index for which to extract formats.
   * @returns {object} An object containing formatting arrays for the specified row.
   */
  function fBuildRowFormat(format, rowIdx) {
    return {
      bg: format.bg?.[rowIdx],
      fontColorHex: format.fontColorHex?.[rowIdx],
      weight: format.weight?.[rowIdx],
      fontSize: format.fontSize?.[rowIdx],
      fontStyle: format.fontStyle?.[rowIdx],
      fontFamily: format.fontFamily?.[rowIdx],
      wrap: format.wrap?.[rowIdx],
    };
  } // End function fBuildRowFormat

  /** function fAppendRowCells
   * Purpose: Creates all cell elements for a single row and appends them to a document fragment.
   * Assumptions: This is called within the chunked rendering loop.
   * @param {DocumentFragment} fragment - Fragment to append created cells to.
   * @param {number} rowIdx - 0-based index of the row being rendered.
   * @param {any[]} rowData - Array of values for the current row.
   * @param {object} rowFormat - Formatting object for the current row.
   * @param {number} numCols - Total number of columns in the grid.
   * @returns {void}
   */
  function fAppendRowCells(fragment, rowIdx, rowData, rowFormat, numCols) {
    for (let c = 0; c < numCols; c++) {
      const value = rowData?.[c];
      const cell = fCreateAndFormatCell(rowIdx, c, value, rowFormat);
      gUI.grid2D[rowIdx][c] = cell;
      fragment.appendChild(cell);
    }
  } // End function fAppendRowCells

  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  // End - Core Rendering Pipeline
  // Start - Low-Level Cell Creation
  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

  /** function fCheckAndTagNote
   * Purpose: Adds the 'has-note' CSS class to a cell if a corresponding note exists.
   * Assumptions: gUI.notes is populated.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {void}
   */
  function fCheckAndTagNote(cell, r, c) {
    const noteText = gUI.notes?.[r]?.[c]?.trim();
    if (noteText) {
      cell.classList.add("has-note");
    }
  } // End function fCheckAndTagNote

  /** function fCreateAndFormatCell
   * Purpose: Creates and formats a single grid cell div element.
   * Assumptions: This is the core cell creation function called during rendering.
   * Notes: Handles content (text, checkbox, dropdown), URL/image/note tags, editability, and styling. Defers creation of empty ability dropdowns by using a placeholder.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any} value - The raw value for the cell from gUI.arr.
   * @param {object} rowFormat - Formatting object for this specific row.
   * @returns {HTMLElement} The configured cell div element.
   */
  function fCreateAndFormatCell(r, c, value, rowFormat) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const originalValue = value ?? "";
    const valStr = String(originalValue).toUpperCase();
    const isCheckbox =
      value === true ||
      value === false ||
      valStr === "TRUE" ||
      valStr === "FALSE";
    const bgColor = rowFormat.bg?.[c];
    const isEditable = fCheckIfEditable(r, c, bgColor, isCheckbox);
    fSetCellAttributes(cell, r, c, isEditable);
    if (gUI.customNotes?.[r]?.[c]?.trim()) {
      cell.classList.add("has-custom-note");
    } else {
      fCheckAndTagNote(cell, r, c);
    }
    const abilityCol = tag.cs.game.c.Ability.index;
    if (
      c === abilityCol &&
      typeof value === "string" &&
      value.startsWith("⚡")
    ) {
      cell.classList.add("custom-ability-cell");
    }
    const dropConfig = fFindDropdownMatch(r, c);
    const isAbilityDropdown = dropConfig?.gUIListKey === "myCSListFSData";
    const isEmptyAbilityCell =
      isAbilityDropdown && (originalValue === "" || originalValue === null);
    if (isEmptyAbilityCell) {
      const placeholder = document.createElement("div");
      placeholder.className = "dropdown-placeholder";
      cell.appendChild(placeholder);
      cell.style.padding = "0";
      cell.style.overflow = "visible";
    } else {
      const { displayValue } = fCheckAndTagUrl(cell, originalValue);
      fPopulateCellContent(cell, r, c, displayValue, isCheckbox);
    }
    fApplyCellFormatting(cell, c, bgColor, rowFormat);
    return cell;
  } // End function fCreateAndFormatCell

  /** function fSetCellAttributes
   * Purpose: Sets data attributes, contentEditable, and styles for a cell.
   * Assumptions: Prevents text-alignment styles from being applied to header button cells.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {boolean} isEditable - True if the cell should be contentEditable.
   * @returns {void}
   */
  function fSetCellAttributes(cell, r, c, isEditable) {
    cell.dataset.r = r;
    cell.dataset.c = c;
    if (isEditable) {
      cell.contentEditable = true;
      if (!gUI.headerButtonCoords.has(`${r},${c}`)) {
        cell.style.justifyContent = "flex-start";
        cell.style.textAlign = "left";
      }
    }
  } // End function fSetCellAttributes

  /** function fPopulateCellContent
   * Purpose: Populates a cell with either a checkbox or text content wrapped in a span.
   * Assumptions: Strips trailing ID patterns from text content before displaying.
   * @param {HTMLElement} cell - The cell div element.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any} displayValue - The value to display.
   * @param {boolean} isCheckbox - True if the cell should contain a checkbox.
   * @returns {void}
   */
  function fPopulateCellContent(cell, r, c, displayValue, isCheckbox) {
    if (isCheckbox) {
      cell.appendChild(fMakeCorrectCheckBoxType(r, c));
    } else {
      const idPattern = /\s{2,}_\w{6}$/;
      const text =
        typeof displayValue === "string" && idPattern.test(displayValue)
          ? displayValue.replace(idPattern, "")
          : displayValue;
      const textSpan = document.createElement("span");
      textSpan.textContent = text ?? "";
      cell.appendChild(textSpan);
    }
  } // End function fPopulateCellContent

  /** function fApplyCellFormatting
   * Purpose: Applies styles to a cell element based on the provided row formatting data.
   * Assumptions: The rowFormat object contains arrays of styles indexed by column.
   * @param {HTMLElement} cell - The cell div element to style.
   * @param {number} c - 0-based column index.
   * @param {string | null} bgColor - Background color hex string.
   * @param {object} rowFormat - Object containing formatting arrays for the row.
   * @returns {void}
   */
  function fApplyCellFormatting(cell, c, bgColor, rowFormat) {
    if (bgColor) {
      cell.style.backgroundColor = bgColor;
    }
    const finalFontColor = null;
    cell.style.color = finalFontColor || "";
    const { weight, fontSize, fontStyle, fontFamily, wrap } = rowFormat;
    if (weight?.[c]) cell.style.fontWeight = weight[c];
    if (fontSize?.[c]) cell.style.fontSize = `${fontSize[c]}px`;
    if (fontStyle?.[c]) cell.style.fontStyle = fontStyle[c];
    if (fontFamily?.[c]) cell.style.fontFamily = fontFamily[c];
    if (wrap?.[c]) {
      cell.classList.add("wrap");
    }
  } // End function fApplyCellFormatting

  /** function fCheckIfEditable
   * Purpose: Determines if a cell should be contentEditable.
   * Assumptions: gUI.headerButtonCoords has been populated. This is the primary fix for the vanishing button bug.
   * @param {number} r - 0-based row index of the cell.
   * @param {number} c - 0-based column index of the cell.
   * @param {string | null} bgColor - Background color hex string or null.
   * @param {boolean} isCheckbox - True if the cell contains a checkbox.
   * @returns {boolean} True if the cell should be editable, false otherwise.
   */
  function fCheckIfEditable(r, c, bgColor, isCheckbox) {
    if (gUI.headerButtonCoords.has(`${r},${c}`)) {
      return false;
    }
    const isMetaRange =
      gUI.resolvedRanges?.meta &&
      fIsCellInRangeArray(r, c, [gUI.resolvedRanges.meta]);
    const isMetaChannelRange =
      gUI.resolvedRanges?.metaChannel &&
      fIsCellInRangeArray(r, c, [gUI.resolvedRanges.metaChannel]);
    if (isMetaRange || isMetaChannelRange) {
      return true;
    }
    const isWhiteBg =
      !bgColor || bgColor.toLowerCase() === "#ffffff" || bgColor === "white";
    return isWhiteBg && !isCheckbox;
  } // End function fCheckIfEditable

  /** function fMakeCorrectCheckBoxType
   * Purpose: Creates a checkbox element with appropriate state and attributes for a grid cell.
   * Assumptions: Disables the checkbox if the cell background is not white.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {HTMLInputElement} The configured checkbox element.
   */
  function fMakeCorrectCheckBoxType(r, c) {
    const value = gUI.arr[r]?.[c];
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.dataset.r = r;
    checkbox.dataset.c = c;
    const bgColor = gUI.format?.bg?.[r]?.[c];
    const isNonWhite =
      bgColor &&
      bgColor.toLowerCase() !== "#ffffff" &&
      bgColor.toLowerCase() !== "#fff";
    checkbox.disabled = isNonWhite;
    const valStr = String(value).toUpperCase();
    checkbox.checked = value === true || valStr === "TRUE";
    if (fIsSkRadioGroupMember(r, c)) {
      checkbox.dataset.skGroup = "true";
    }
    return checkbox;
  } // End function fMakeCorrectCheckBoxType

  /** function fIsSkRadioGroupMember
   * Purpose: Checks if a cell is part of the Sk1/Sk2 checkbox 'radio group'.
   * Assumptions: gUI.resolvedRanges.sk1sk2CheckBoxes is a valid array of range objects.
   * @param {number} r - The 0-based row index.
   * @param {number} c - The 0-based column index.
   * @returns {boolean} True if the cell is within a defined Sk checkbox range.
   */
  function fIsSkRadioGroupMember(r, c) {
    const ranges = gUI.resolvedRanges.sk1sk2CheckBoxes;

    if (!Array.isArray(ranges)) {
      console.warn(
        "fIsSkRadioGroupMember: gUI.resolvedRanges.sk1sk2CheckBoxes is not a valid array."
      );
      return false;
    }

    if (
      typeof r !== "number" ||
      typeof c !== "number" ||
      isNaN(r) ||
      isNaN(c)
    ) {
      console.warn(
        `fIsSkRadioGroupMember: Invalid input coordinates (${r}, ${c})`
      );
      return false;
    }

    for (const range of ranges) {
      if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
        console.warn(
          "fIsSkRadioGroupMember: Skipping invalid range object",
          range
        );
        continue;
      }

      const resolved = range; // Ranges are already resolved
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          "fIsSkRadioGroupMember: Skipping range due to unresolved indices",
          range
        );
        continue;
      }

      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);

      if (r >= rMin && r <= rMax && c >= cMin && c <= cMax) {
        return true;
      }
    }

    return false;
  } // End function fIsSkRadioGroupMember

  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  // End - Low-Level Cell Creation
  // Start - Post-Render Formatting
  ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

  /** function fRunPostRenderFormatting
   * Purpose: Orchestrates all post-render formatting and setup steps for the grid.
   * Assumptions: `gUI.grid2D` is populated with DOM elements.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Unused options placeholder.
   * @returns {boolean} True on completion.
   */
  function fRunPostRenderFormatting(parameter1 = "", parameter2 = {}) {
    fMyConsoleLog("🚀 Applying Post-Render Formatting...");
    fApplyGridDynamicMerges();
    fAddGridsHeaderRowButtons();
    fResizeHeaderButtonImages("", { scale: 0.9, minPx: 16, maxPx: 64 });
    fApplyGridManualBorders();
    fApplyGridColAndRowInitialVisibility();
    fApplyGridManualColoring();
    fApplySpecialAlignments();
    fSetTurbosGridHeaderRows();
    fApplyInitialCustomDataIndicators();
    fApplyDropdownsToGrid();
    fFetchAndApplyAbilityDropdowns();
    fClearSk1Sk2Checkboxes();
    const gridElement = document.getElementById("grid");
    fAttachGridListeners(gridElement);
    if (fModalElementsAvailable()) {
      fSetupModalListeners();
    }
    fCalculatesEnc_MR_AP();
    setTimeout(() => fMarkGridOverflowingCells(), 500);
    fMyConsoleLog("✅ All Post-Render Formatting Done!");
    fHideMessage();
    return true;
  } // End function fRunPostRenderFormatting

  /** function fApplyGridDynamicMerges
   * Purpose: Applies cell merging based on the `gUI.format.merges` array.
   * Assumptions: Sets grid-column/row span on the anchor cell and hides covered cells.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridDynamicMerges() {
    fMyConsoleLog("🧩 Applying Merges...");
    const merges = gUI.format?.merges || [];
    for (const mergeInfo of merges) {
      const r = mergeInfo.row;
      const c = mergeInfo.col;
      const rs = mergeInfo.rowspan;
      const cs = mergeInfo.colspan;
      const anchor = gUI.grid2D?.[r]?.[c];
      if (!anchor) {
        console.warn(`⚠️ Merge anchor cell not found at [${r},${c}]`);
        continue;
      }
      if (cs > 1) anchor.style.gridColumn = `span ${cs}`;
      if (rs > 1) anchor.style.gridRow = `span ${rs}`;
      for (let rSub = r; rSub < r + rs; rSub++) {
        for (let cSub = c; cSub < c + cs; cSub++) {
          if (rSub === r && cSub === c) continue;
          const cellToHide = gUI.grid2D?.[rSub]?.[cSub];
          if (cellToHide) {
            cellToHide.style.display = "none";
          }
        }
      }
    }
    fMyConsoleLog("✅ Merges Applied");
  } // End function fApplyGridDynamicMerges

  /** function fAddGridsHeaderRowButtons
   * Purpose: Inserts configured image buttons into designated header cells.
   * Assumptions: Populates `gUI.headerButtonCoords` with the button locations. `gUI.grid2D` and `tag` object are populated.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fAddGridsHeaderRowButtons() {
    fMyConsoleLog("⚙️ Adding Header Buttons...");
    let buttonsAdded = 0;
    const headerButtonConfigs = [
      {
        r: tag.cs.game.r.Button_R.index,
        c: tag.cs.game.c.DieButtonC.index,
        action: "action-rollDice",
        imageUrl:
          "https://raw.githubusercontent.com/bmobley333/TurboApp/main/Pics/Buttons/Button_d20.png",
        altText: "Roll Dice",
        titleText: "Roll Dice",
      },
      {
        r: tag.cs.game.r.Button_R.index,
        c: tag.cs.game.c.RefreshButtonC.index,
        action: "action-refreshData",
        imageUrl:
          "https://raw.githubusercontent.com/bmobley333/TurboApp/main/Pics/Buttons/Button_Refresh.png",
        altText: "Refresh Data",
        titleText: "Refresh Data",
      },
      {
        r: tag.cs.game.r.Button_R.index,
        c: tag.cs.game.c.UpArrowButtonC.index,
        action: "action-jumpTop",
        imageUrl:
          "https://raw.githubusercontent.com/bmobley333/TurboApp/main/Pics/Buttons/Button_UpArrow.png",
        altText: "Jump to Top",
        titleText: "Jump to Top",
      },
      {
        r: tag.cs.game.r.Button_R.index,
        c: tag.cs.game.c.DownArrowButtonC.index,
        action: "action-jumpBottom",
        imageUrl:
          "https://raw.githubusercontent.com/bmobley333/TurboApp/main/Pics/Buttons/Button_DownArrow.png",
        altText: "Jump to Bottom",
        titleText: "Jump to Bottom",
      },
      {
        r: tag.cs.game.r.Button_R.index,
        c: tag.cs.game.c.MonsterButtonC.index,
        action: "action-showMonsters",
        imageUrl:
          "https://raw.githubusercontent.com/bmobley333/TurboApp/main/Pics/Buttons/Button_Monster.png",
        altText: "Show Monsters",
        titleText: "Show Monsters",
      },
    ];
    headerButtonConfigs.forEach((config) => {
      const { r, c } = config;
      if (typeof r !== "number" || typeof c !== "number") {
        console.warn(`Could not resolve coords for button: ${config.action}`);
        return;
      }
      gUI.headerButtonCoords.add(`${r},${c}`);
      const cell = gUI.grid2D?.[r]?.[c];
      if (!cell) return;
      const img = fCreateGridHeaderRowButtonImage(config);
      fApplyGridButtonToCell(cell, img);
      buttonsAdded++;
    });
    fMyConsoleLog(
      buttonsAdded > 0
        ? `✅ Added ${buttonsAdded} Header Button(s) and recorded their coordinates.`
        : `ℹ️ No valid Header Buttons found or added.`
    );
  } // End function fAddGridsHeaderRowButtons

  /** function fResizeHeaderButtonImages
   * Purpose: Resizes header button images to a consistent size based on their host cell's height.
   * Assumptions: Header icons use the class 'header-button-img'; merges are already applied.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Options object: { scale, minPx, maxPx }.
   * @returns {boolean} True on completion.
   */
  function fResizeHeaderButtonImages(parameter1 = "", parameter2 = {}) {
    try {
      const scale = Math.min(
        1.0,
        Math.max(0.6, Number(parameter2?.scale) || 0.9)
      );
      const minPx = Math.max(10, Number(parameter2?.minPx) || 16);
      const maxPx = Math.max(minPx, Number(parameter2?.maxPx) || 64);
      const imgs = document.querySelectorAll("#grid .header-button-img");
      let sized = 0;
      imgs.forEach((img) => {
        const cell = img.closest(".cell");
        if (!cell) return;
        const h = Math.max(
          1,
          Math.round(
            cell.clientHeight ||
              parseInt(getComputedStyle(cell).height) ||
              gUI?.ROW_HEIGHT_PX ||
              20
          )
        );
        const target = Math.max(minPx, Math.min(maxPx, Math.round(h * scale)));
        img.style.height = `${target}px`;
        img.style.maxHeight = `${target}px`;
        img.style.width = "auto";
        img.style.maxWidth = "100%";
        img.style.margin = "1px auto";
        sized++;
      });
      fMyConsoleLog?.(
        `✅ Resized ${sized} header button image(s) to fit merged cell height (scale=${scale}).`
      );
      return true;
    } catch (e) {
      fMyConsoleLog?.(
        `⚠️ fResizeHeaderButtonImages soft-failed: ${e?.message || e}`
      );
      return false;
    }
  } // End function fResizeHeaderButtonImages

  /** function fApplyGridManualBorders
   * Purpose: Applies CSS border styles to cells within predefined sections.
   * Assumptions: Uses gUI.manualBorderSections. Applies top/left to all cells and right/bottom to edges.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridManualBorders() {
    fMyConsoleLog("🖌️ Applying Manual Borders...");
    let appliedCount = 0;
    gUI.manualBorderSections.forEach((section) => {
      const rowStart = fResolveRow(section.r1);
      const colStart = fResolveCol(section.c1);
      const rowEnd = fResolveRow(section.r2);
      const colEnd = fResolveCol(section.c2);
      const borderStyle = section.style || "1px solid #000";
      const edges = section.edges || "";
      if ([rowStart, colStart, rowEnd, colEnd].some((v) => isNaN(v))) {
        console.warn(
          "Skipping manual border section due to invalid tags:",
          section
        );
        return;
      }
      for (let r = rowStart; r <= rowEnd; r++) {
        for (let c = colStart; c <= colEnd; c++) {
          const cell = gUI.grid2D?.[r]?.[c];
          if (!cell || cell.style.display === "none") continue;
          let appliedThisCell = false;
          cell.style.borderTop = borderStyle;
          cell.style.borderLeft = borderStyle;
          appliedThisCell = true;
          if (edges.includes("r") && c === colEnd) {
            cell.style.borderRight = borderStyle;
          }
          if (edges.includes("b") && r === rowEnd) {
            cell.style.borderBottom = borderStyle;
          }
          if (appliedThisCell) appliedCount++;
        }
      }
    });
    fMyConsoleLog(`✅ Manual Borders Applied (${appliedCount} styles set)`);
  } // End function fApplyGridManualBorders

  /** function fApplyGridManualColoring
   * Purpose: Applies specific font colors to predefined ranges based on configuration.
   * Assumptions: Automatically applies a contrasting color if the font color matches the background. Uses `gUI.fontColorRange`, `gUI.grid2D`, `gUI.format.bg`.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyGridManualColoring() {
    fMyConsoleLog("🎨 Applying Manual Font Colors...");
    const colorConfigArray = gUI.fontColorRange;
    if (!Array.isArray(colorConfigArray)) {
      fMyConsoleLog(
        "ℹ️ Manual font color configuration (gUI.fontColorRange) is not an array or is missing."
      );
      return;
    }
    if (colorConfigArray.length === 0) {
      fMyConsoleLog("ℹ️ Manual font color configuration is empty.");
      return;
    }
    let colorsAppliedCount = 0;
    let contrastAppliedCount = 0;
    colorConfigArray.forEach((colorDef, index) => {
      if (
        !colorDef ||
        typeof colorDef.color !== "string" ||
        !Array.isArray(colorDef.ranges)
      ) {
        console.warn(
          `Skipping invalid color definition at index ${index}:`,
          colorDef
        );
        return;
      }
      const cssColor = colorDef.color;
      const ranges = colorDef.ranges;
      ranges.forEach((range) => {
        if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
          console.warn(
            `Skipping invalid range object for color '${cssColor}':`,
            range
          );
          return;
        }
        const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
        if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
          console.warn(
            `Could not resolve tags for range in color '${cssColor}':`,
            range
          );
          return;
        }
        const rMin = Math.min(resolved.r1, resolved.r2);
        const rMax = Math.max(resolved.r1, resolved.r2);
        const cMin = Math.min(resolved.c1, resolved.c2);
        const cMax = Math.max(resolved.c1, resolved.c2);
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            const cell = gUI.grid2D?.[r]?.[c];
            if (!cell || cell.style.display === "none") continue;
            let cellBgColor = window.getComputedStyle(cell).backgroundColor;
            if (cellBgColor && cellBgColor.startsWith("rgb")) {
              try {
                const rgb = cellBgColor.match(/\d+/g).map(Number);
                cellBgColor =
                  "#" +
                  rgb
                    .map((x) => {
                      const hex = x.toString(16);
                      return hex.length === 1 ? "0" + hex : hex;
                    })
                    .join("");
              } catch (e) {
                cellBgColor =
                  cell.style.backgroundColor ||
                  gUI.format?.bg?.[r]?.[c] ||
                  "#ffffff";
              }
            } else {
              cellBgColor =
                cell.style.backgroundColor ||
                gUI.format?.bg?.[r]?.[c] ||
                "#ffffff";
            }
            const cleanBgColor = cellBgColor.toLowerCase();
            const intendedFontColor = cssColor.toLowerCase();
            if (intendedFontColor === cleanBgColor) {
              cell.style.color = fGetContrastColor(cleanBgColor);
              contrastAppliedCount++;
            } else {
              cell.style.color = intendedFontColor;
              colorsAppliedCount++;
            }
          }
        }
      });
    });
    fMyConsoleLog(
      `✅ Manual Colors Applied (${colorsAppliedCount} direct, ${contrastAppliedCount} contrast).`
    );
  } // End function fApplyGridManualColoring

  /** function fSetTurbosGridHeaderRows
   * Purpose: Makes header rows sticky and hides utility rows.
   * Assumptions: gUI.grid2D is populated. This function applies inline styles for reliability.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Unused options placeholder.
   * @returns {boolean} True when sticky header was applied; false if grid/cells missing.
   */
  function fSetTurbosGridHeaderRows(parameter1 = "", parameter2 = {}) {
    try {
      const gridEl = document.getElementById("grid");
      const grid = gUI?.grid2D;
      const numRows = Array.isArray(grid) ? grid.length : 0;
      const numCols = numRows
        ? Array.isArray(grid[0])
          ? grid[0].length
          : 0
        : 0;
      if (!gridEl || !numRows || !numCols) return false;
      if (!gridEl.style.position) gridEl.style.position = "relative";
      if (!gridEl.style.overflowY) gridEl.style.overflowY = "auto";
      const stickyRows = [2, 3, 4];
      const belowRow = 5;
      for (let r = 2; r <= Math.min(5, numRows - 1); r++) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (!cell) continue;
          cell.classList?.remove("sticky-header", "below-sticky");
          cell.style.position = "";
          cell.style.top = "";
          cell.style.zIndex = "";
        }
      }
      for (let r = 0; r <= 1 && r < numRows; r++) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (cell) cell.style.display = "none";
        }
      }
      const getRowHeight = (rowIndex) => {
        const h = gUI?.rowHeights?.[rowIndex];
        return Number.isFinite(h) && h > 0 ? h : gUI.ROW_HEIGHT_PX || 20;
      };
      let cumulativeTop = 0;
      for (let i = 0; i < stickyRows.length; i++) {
        const r = stickyRows[i];
        const topPx = cumulativeTop;
        cumulativeTop += getRowHeight(r);
        for (let c = 0; c < numCols; c++) {
          const cell = grid[r]?.[c];
          if (!cell || cell.style.display === "none") continue;
          cell.classList.add("sticky-header");
          cell.style.position = "sticky";
          cell.style.top = `${topPx}px`;
          cell.style.zIndex = "50";
          const bg = gUI?.format?.bg?.[r]?.[c];
          if (bg) cell.style.backgroundColor = bg;
        }
      }
      if (belowRow < numRows) {
        for (let c = 0; c < numCols; c++) {
          const cell = grid[belowRow]?.[c];
          if (!cell || cell.style.display === "none") continue;
          cell.classList.add("below-sticky");
        }
      }
      fMyConsoleLog?.("✅ Sticky Header Applied");
      return true;
    } catch (err) {
      console.error("fSetTurbosGridHeaderRows error:", err);
      return false;
    }
  } // End function fSetTurbosGridHeaderRows

  /** function fMarkGridOverflowingCells
   * Purpose: Adds an 'overflow-left' class to cells where content is wider than the cell.
   * Assumptions: Optimized to separate DOM reads from writes for performance.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fMarkGridOverflowingCells() {
    fMyConsoleLog("↔️ Checking Cell Overflow (Optimized)...");
    const cells = document.querySelectorAll(
      '#grid .cell:not([style*="display: none"])'
    );
    let cellsToModify = [];
    cells.forEach((cell) => {
      const clientW = cell.clientWidth;
      const scrollW = cell.scrollWidth;
      const shouldOverflow = scrollW > clientW + 1;
      cellsToModify.push({
        cellElement: cell,
        shouldOverflow: shouldOverflow,
      });
    });
    let count = 0;
    cellsToModify.forEach((item) => {
      const cell = item.cellElement;
      const currentlyHasClass = cell.classList.contains("overflow-left");
      if (item.shouldOverflow && !currentlyHasClass) {
        cell.classList.add("overflow-left");
        count++;
      } else if (!item.shouldOverflow && currentlyHasClass) {
        cell.classList.remove("overflow-left");
      }
    });
    fMyConsoleLog(
      `✅ Overflow Checked (Optimized - ${count} cells newly marked)`
    );
  } // End function fMarkGridOverflowingCells

  /** function fGetGridCellFromRTagCTag
   * Purpose: Retrieves a cell DOM element from gUI.grid2D using row and column tags.
   * Assumptions: gUI.grid2D is populated and tags are valid.

   * @param {string} colTag - The column tag to resolve.
   * @returns {HTMLElement | null} The cell element if found, otherwise null.
   */
  function fGetGridCellFromRTagCTag(rowTag, colTag) {
    const r = fResolveRow(rowTag);

  /** function fTogglePermMorphColumns
   * Purpose: Handles the 'Perm Morphs (Show/Hide)' menu action.
   * Assumptions: gUI.permMorphCols contains an array of valid permanent morph column range definitions.
   * Notes: Toggles the visibility of all defined permanent morph columns.
   * @returns {void}
   */
  function fTogglePermMorphColumns() {
    const permMorphRanges = gUI.permMorphCols;
    if (!Array.isArray(permMorphRanges) || permMorphRanges.length === 0) {
      console.error(
        "fTogglePermMorphColumns: gUI.permMorphCols is not a valid array or is empty."
      );
      fMyConsoleLog(
        "❌ Error: Permanent Morph column definition missing or invalid."
      );
      return;
    }
    let isCurrentlyVisible = false;
    for (const range of permMorphRanges) {
      if (
        !range ||
        typeof range.c1 === "undefined" ||
        typeof range.c2 === "undefined"
      ) {
        console.warn(
          "fTogglePermMorphColumns: Skipping invalid range object:",
          range
        );
        continue;
      }
      const startCol = fResolveCol(range.c1);
      const endCol = fResolveCol(range.c2);
      if (isNaN(startCol) || isNaN(endCol)) {
        console.warn(
          `fTogglePermMorphColumns: Skipping range due to invalid tags/indices: ${range.c1}, ${range.c2}`
        );
        continue;
      }
      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);
      for (let c = cMin; c <= cMax; c++) {
        if (!gUI.hiddenColumns.has(c)) {
          isCurrentlyVisible = true;
          break;
        }
      }
      if (isCurrentlyVisible) break;
    }
    if (isCurrentlyVisible) {
      fMyConsoleLog("⚙️ Toggling Perm Morphs: Currently Visible -> Hiding...");
      fHideGridsColumnRange(permMorphRanges);
    } else {
      fMyConsoleLog("⚙️ Toggling Perm Morphs: Currently Hidden -> Showing...");
      fShowGridsColumnRange(permMorphRanges);
    }
  } // End function fTogglePermMorphColumns

  /** function fAppliesGridColumnOnOff
   * Purpose: Recalculates and applies the 'grid-template-columns' CSS style based on hidden columns.
   * Assumptions: gUI.hiddenColumns, gUI.format.colWidths, and gUI.arr are populated.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fAppliesGridColumnOnOff() {
    const grid = document.getElementById("grid");
    if (!grid || !gUI.format.colWidths || !gUI.arr || gUI.arr.length === 0) {
      console.error(
        "fAppliesGridColumnOnOff: Missing prerequisites (grid element, colWidths, or arr data)."
      );
      return;
    }
    const numCols = gUI.arr[0].length;
    const colWidths = gUI.format.colWidths || [];
    let templateCols = [];
    for (let c = 0; c < numCols; c++) {
      if (gUI.hiddenColumns.has(c)) {
        templateCols.push("0px");
      } else {
        const width = colWidths[c] || 60;
        templateCols.push(`${width}px`);
      }
    }
    const newTemplateString = templateCols.join(" ");
    grid.style.gridTemplateColumns = newTemplateString;
  } // End function fAppliesGridColumnOnOff

  /** function fSetsGridColumnVisibility
   * Purpose: Hides or shows a single column and updates the grid template.
   * Assumptions: Manages the column index in the gUI.hiddenColumns Set.
   * @param {number} colIndex - 0-based index of the column to modify.
   * @param {boolean} isVisible - True to show the column, false to hide it.
   * @param {boolean} [updateTemplate=true] - If true, recalculates the grid template.
   * @returns {void}
   */
  function fSetsGridColumnVisibility(
    colIndex,
    isVisible,
    updateTemplate = true
  ) {
    if (
      isNaN(colIndex) ||
      colIndex < 0 ||
      !gUI.grid2D[0] ||
      colIndex >= gUI.grid2D[0].length
    ) {
      console.warn(
        `fSetsGridColumnVisibility: Invalid column index ${colIndex}`
      );
      return;
    }
    const numRows = gUI.grid2D.length;
    const currentlyHidden = gUI.hiddenColumns.has(colIndex);
    const needsChange =
      (isVisible && currentlyHidden) || (!isVisible && !currentlyHidden);
    if (needsChange) {
      if (isVisible) {
        gUI.hiddenColumns.delete(colIndex);
      } else {
        gUI.hiddenColumns.add(colIndex);
      }
      for (let r = 0; r < numRows; r++) {
        const cell = gUI.grid2D[r]?.[colIndex];
        if (cell) {
          cell.style.visibility = isVisible ? "" : "collapse";
        }
      }
      if (updateTemplate) {
        fAppliesGridColumnOnOff();
      }
    }
  } // End function fSetsGridColumnVisibility

  /** function fApplyVisibilityToColumnRange
   * Purpose: Centralized helper to hide or show one or more ranges of columns.
   * Assumptions: Batches DOM updates by calling `function fAppliesGridColumnOnOff` once at the end.
   * @param {object[]} rangeArray - An array of range definition objects with c1 and c2 properties.
   * @param {boolean} isVisible - True to show the columns, false to hide them.
   * @returns {void}
   */
  function fApplyVisibilityToColumnRange(rangeArray, isVisible) {
    const action = isVisible ? "Showing" : "Hiding";
    fMyConsoleLog(`👁️ ${action} Column Ranges...`);
    if (!Array.isArray(rangeArray)) {
      console.error(
        `fApplyVisibilityToColumnRange: Invalid input - requires an array.`
      );
      return;
    }

    let anyColumnsChanged = false;
    for (const range of rangeArray) {
      if (
        !range ||
        typeof range.c1 === "undefined" ||
        typeof range.c2 === "undefined"
      ) {
        console.warn(
          `fApplyVisibilityToColumnRange: Skipping invalid range object:`,
          range
        );
        continue;
      }
      const startCol = fResolveCol(range.c1);
      const endCol = fResolveCol(range.c2);
      if (isNaN(startCol) || isNaN(endCol)) {
        console.warn(
          `fApplyVisibilityToColumnRange: Skipping range due to invalid tags/indices: ${range.c1}, ${range.c2}`
        );
        continue;
      }

      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);
      for (let c = cMin; c <= cMax; c++) {
        const isCurrentlyHidden = gUI.hiddenColumns.has(c);
        // We need to make a change if we want to show a hidden column OR hide a visible column.
        const needsChange =
          (isVisible && isCurrentlyHidden) ||
          (!isVisible && !isCurrentlyHidden);
        if (needsChange) {
          fSetsGridColumnVisibility(c, isVisible, false); // Pass false to prevent immediate template update
          anyColumnsChanged = true;
        }
      }
    }

    if (anyColumnsChanged) {
      fAppliesGridColumnOnOff(); // Update the grid template once after all changes are staged
      fMyConsoleLog(`✅ Column Ranges ${isVisible ? "Shown" : "Hidden"}.`);
    } else {
      fMyConsoleLog(
        `ℹ️ All Specified Column Ranges Already ${
          isVisible ? "Visible" : "Hidden"
        }.`
      );
    }
  } // End function fApplyVisibilityToColumnRange

  /** function fHideGridsColumnRange
   * Purpose: Hides one or more ranges of columns by calling the central helper.
   * Assumptions: This is a wrapper for `function fApplyVisibilityToColumnRange`.
   * @param {object[]} rangeArray - An array of range definition objects with c1 and c2 properties.
   * @returns {void}
   */
  function fHideGridsColumnRange(rangeArray) {
    fApplyVisibilityToColumnRange(rangeArray, false);
  } // End function fHideGridsColumnRange

  /** function fShowGridsColumnRange
   * Purpose: Shows one or more ranges of columns by calling the central helper.
   * Assumptions: This is a wrapper for `function fApplyVisibilityToColumnRange`.
   * @param {object[]} rangeArray - An array of range definition objects with c1 and c2 properties.
   * @returns {void}
   */
  function fShowGridsColumnRange(rangeArray) {
    fApplyVisibilityToColumnRange(rangeArray, true);

  /** function fTotalRereshOfAllAbilitiesAndAllGear
   * Purpose: Performs a full refresh of all non-custom Ability and Gear rows.
   * Assumptions: `gUI.resolvedRanges` and all necessary caches are populated.
   * Notes: Skips custom rows (⚡), clears invalid rows, and re-fetches data for valid rows.
   * @returns {Promise<void>} Resolves after the refresh is complete.
   */
  async function fTotalRereshOfAllAbilitiesAndAllGear() {
    const funcName = "fTotalRereshOfAllAbilitiesAndAllGear";
    fMyConsoleLog(`🔄 ${funcName}: Starting Full Ability/Gear Refresh...`);
    const abilityGearRanges = gUI.resolvedRanges?.entireAbilityNGearTables;
    const listCache = gUI.myCSListFSData;
    if (
      !Array.isArray(abilityGearRanges) ||
      abilityGearRanges.length === 0 ||
      !listCache
    ) {
      await fShowMessage(
        "Error: Cannot perform refresh due to missing cache or range definitions."
      );
      return;
    }
    const listCacheKey = "myCSListFSData";
    const listColTag = "AbilitiesNameID";
    const abilitiesNameIdColIndex = listCache.colTagsMap?.[listColTag];
    if (isNaN(abilitiesNameIdColIndex)) {
      await fShowMessage(
        `Error: Column tag '${listColTag}' not found in List cache.`
      );
      return;
    }
    let rowsProcessed = 0;
    let rowsCleared = 0;
    let rowsRefreshed = 0;
    for (const range of abilityGearRanges) {
      const resolved = range; // Already resolved
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN))
        continue;
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      for (let r = rMin; r <= rMax; r++) {
        const abilityName = fGetGridValue(r, "Ability");
        if (typeof abilityName === "string" && abilityName.startsWith("⚡")) {
          fMyConsoleLog(
            `   -> Row ${r}: Skipping refresh for custom item "${abilityName}".`
          );
          continue;
        }
        rowsProcessed++;
        let rowShouldBeCleared = false;
        let abilID = null;
        const abilityNameId = fGetGridValue(r, "Ability");
        if (!abilityNameId) {
          const sk1Val = fGetGridValue(r, "Sk1");
          if (sk1Val) rowShouldBeCleared = true;
        } else {
          abilID = fGetIDFromNameID(abilityNameId);
          if (!abilID) {
            rowShouldBeCleared = true;
          } else {
            const foundInList = listCache.text.some(
              (row) => abilID === fGetIDFromNameID(row[abilitiesNameIdColIndex])
            );
            if (!foundInList) rowShouldBeCleared = true;
          }
        }
        if (rowShouldBeCleared) {
          fHandleClearAbilityRow(r);
          rowsCleared++;
          continue;
        }
        if (!abilID) continue;
        rowsRefreshed++;
        const dbAbilityResult = fHandleNewAbilitySelection(
          "DB",
          "Abilities",
          r,
          abilityNameId
        );
        const klKnownAbilitiesResult = fHandleNewAbilitySelection(
          "MyKL",
          "KnownAbilities",
          r,
          abilityNameId
        );
        const dbGearResult = fHandleNewAbilitySelection(
          "DB",
          "Gear",
          r,
          abilityNameId
        );
        if (dbAbilityResult && klKnownAbilitiesResult && dbGearResult) {
          fSaveNewAbilityToAbilTbl(
            r,
            dbAbilityResult,
            klKnownAbilitiesResult,
            dbGearResult
          );
        }
      }
    }
    fMyConsoleLog(
      `   -> Refresh loop complete. Triggering final calculations and save...`
    );
    await fCalculatesEnc_MR_AP();
    fHandleAutoSaveTextToFirestore();
    fMyConsoleLog(
      `✅ ${funcName} Complete. Processed: ${rowsProcessed}, Cleared: ${rowsCleared}, Refreshed: ${rowsRefreshed}.`
    );
  } // End function fTotalRereshOfAllAbilitiesAndAllGear

  /** function fHandleGridCellEdit
   * Purpose: Handles the 'blur' event for contenteditable cells, with a guard to prevent execution on header buttons.
   * Assumptions: This is the primary handler for saving user-edited text.
   * Notes: This version includes a brute-force guard clause as the definitive fix for the vanishing button bug.
   * @param {FocusEvent} event - The blur event object.
   * @returns {void}
   */
  async function fHandleGridCellEdit(event) {
    const cellDiv = event.target;
    const r_check = parseInt(cellDiv?.dataset?.r, 10);
    const c_check = parseInt(cellDiv?.dataset?.c, 10);
    if (
      !isNaN(r_check) &&
      !isNaN(c_check) &&
      gUI.headerButtonCoords.has(`${r_check},${c_check}`)
    ) {
      return;
    }
    if (
      !cellDiv ||
      !cellDiv.classList.contains("cell") ||
      cellDiv.contentEditable !== "true"
    ) {
      return;
    }
    const r = parseInt(cellDiv.dataset.r, 10);
    const c = parseInt(cellDiv.dataset.c, 10);
    if (isNaN(r) || isNaN(c) || !gUI.arr[r]) {
      return;
    }
    fHideTooltip();
    const colTag = Object.keys(gUI.colTag).find((tag) => gUI.colTag[tag] === c);
    const customizableDataCols = [
      "Sk1Typ",
      "Sk1",
      "Sk2Typ",
      "Sk2",
      "Act",
      "Dur",
      "Rng",
      "Meta",
    ];
    if (colTag && customizableDataCols.includes(colTag)) {
      cellDiv.contentEditable = false;
      const newText = cellDiv.textContent.trim();
      const oldValueInModel = String(gUI.arr[r][c] ?? "");
      const validateAndGetFinalValue = (text, list) => {
        if (text === "") return "";
        if (list) {
          const lowerText = text.toLowerCase();
          const match = list.find((item) => item.toLowerCase() === lowerText);
          return match || null;
        } else {
          const num = parseInt(text, 10);
          if (!isNaN(num) && num >= 1 && String(num) === text) {
            return num;
          }
          return null;
        }
      };
      const validationList = gUI.validationLists?.[colTag];
      let finalValue = validateAndGetFinalValue(newText, validationList);
      if (colTag === "Rng" && finalValue === null) {
        const num = parseInt(newText, 10);
        if (!isNaN(num) && num >= 1 && String(num) === newText) {
          finalValue = num;
        }
      }
      if (finalValue === null) {
        cellDiv.textContent = oldValueInModel;
        return;
      }
      if (String(finalValue) === oldValueInModel) {
        cellDiv.textContent = oldValueInModel;
        return;
      }
      gUI.arr[r][c] = finalValue;
      cellDiv.textContent = finalValue;
      fFlagAbilityAsCustom(r);
      fHandleAutoSaveTextToFirestore();
      return;
    }
    const newValue = cellDiv.textContent;
    const oldValueInModel = gUI.arr[r][c];
    if (String(newValue ?? "") === String(oldValueInModel ?? "")) {
      return;
    }
    const gearColumnsToCalculate = ["PossNum", "PossWorn", "PossPerOff"];
    let finalValueToStore = newValue;
    let shouldUpdateModelAndSave = true;
    let specificCalcDone = false;
    let metaOrChannelAlertPosted = false;
    const isMetaCell =
      gUI.range?.meta && fIsCellInRangeArray(r, c, [gUI.range.meta]);
    const isMetaChannelCell =
      gUI.range?.metaChannel &&
      fIsCellInRangeArray(r, c, [gUI.range.metaChannel]);
    if (isMetaCell || isMetaChannelCell) {
      const trimmedNewValue = newValue.trim();
      let parsedNum = parseInt(trimmedNewValue, 10);
      let isValidInput = false;
      if (trimmedNewValue === "") {
        finalValueToStore = "";
        isValidInput = true;
      } else if (
        !isNaN(parsedNum) &&
        parsedNum > 0 &&
        String(parsedNum) === trimmedNewValue
      ) {
        if (isMetaCell) {
          const colorIndex = gUI.list.metaColor.findIndex(
            (tag) => gUI.colTag[tag] === c
          );
          if (
            colorIndex !== -1 &&
            gUI.list.metaFull &&
            colorIndex < gUI.list.metaFull.length
          ) {
            const maxAllowed = gUI.list.metaFull[colorIndex];
            if (parsedNum <= maxAllowed) {
              finalValueToStore = parsedNum;
              isValidInput = true;
            }
          }
        } else {
          finalValueToStore = parsedNum;
          isValidInput = true;
        }
      }
      if (!isValidInput) {
        cellDiv.textContent = String(oldValueInModel ?? "");
        shouldUpdateModelAndSave = false;
      }
      if (shouldUpdateModelAndSave && finalValueToStore !== oldValueInModel) {
        const metaType = isMetaCell ? "Meta Color" : "Meta Channel Color";
        const colorTag =
          gUI.list.metaColor.find((tag) => gUI.colTag[tag] === c) || `Col${c}`;
        const oldValueForDisplay =
          oldValueInModel === "" || oldValueInModel === 0
            ? "0"
            : String(oldValueInModel);
        const newValueForDisplay =
          finalValueToStore === "" || finalValueToStore === 0
            ? "0"
            : String(finalValueToStore);
        const alertPrefixHtml = `⚠️ <span class="red-bold">Alert:</span> `;
        const alertPrefixText = `⚠️ Alert: `;
        const alertMsgHtml = `${alertPrefixHtml}${metaType} ${colorTag} was changed from ${oldValueForDisplay} to ${newValueForDisplay}`;
        const alertMsgText = `${alertPrefixText}${metaType} ${colorTag} was changed from ${oldValueForDisplay} to ${newValueForDisplay}`;
        fPostToSidebar(alertMsgHtml, alertMsgText);
        fShowSidebar();
        metaOrChannelAlertPosted = true;
      }
      specificCalcDone = true;
    }
    if (!specificCalcDone && gearColumnsToCalculate.includes(colTag)) {
      const validatedValue = await fCalcGearLine(
        r,
        c,
        newValue,
        String(oldValueInModel ?? "")
      );
      if (validatedValue !== null) {
        finalValueToStore = validatedValue;
      } else {
        shouldUpdateModelAndSave = false;
      }
      specificCalcDone = true;
    }
    if (!specificCalcDone) {
      const isVitMaxPlus =
        gUI.range?.vitMaxPlus &&
        fIsCellInRangeArray(r, c, [gUI.range.vitMaxPlus]);
      const isVit1stTo3rd =
        gUI.range?.vit1stTo3rd &&
        fIsCellInRangeArray(r, c, [gUI.range.vit1stTo3rd]);
      if (isVitMaxPlus || isVit1stTo3rd) {
        gUI.arr[r][c] = newValue;
        await fCalc_VitMaxNowPerc();
        finalValueToStore = gUI.arr[r][c];
      }
    }
    if (shouldUpdateModelAndSave) {
      if (gUI.arr[r][c] !== finalValueToStore) {
        gUI.arr[r][c] = finalValueToStore;
        fUpdateCustomDataIndicator(r, c);
        fHandleAutoSaveTextToFirestore();
        if (metaOrChannelAlertPosted) {
          setTimeout(() => fSendLogToGMScreenAndPS(), 0);
        }
      } else if (metaOrChannelAlertPosted) {
        setTimeout(() => fSendLogToGMScreenAndPS(), 0);
      }
    } else {
      fUpdateCustomDataIndicator(r, c);
    }
  } // End function fHandleGridCellEdit

  /** function fValidateMonsterUpdateInputs
   * Purpose: Validates all inputs for the monster table update process.
   * Assumptions: Helper for fUpdateMonsterTable.
   * @param {any[][]} gmDataArray - 2D array of monster data.
   * @param {object} gmColTags - Map of GM Screen column tags.
   * @param {object} gmRowTags - Map of GM Screen row tags.
   * @returns {Promise<object>} An object with { success, errorMsg, turboMon_R_start, turboMon_R_end }.
   */
  async function fValidateMonsterUpdateInputs(
    gmDataArray,
    gmColTags,
    gmRowTags
  ) {
    if (!Array.isArray(gmDataArray)) {
      return {
        success: false,
        errorMsg: "Error: Invalid monster data received (not an array).",
      };
    }
    if (typeof gmColTags !== "object" || gmColTags === null) {
      return {
        success: false,
        errorMsg: "Error: Invalid column tag mapping received.",
      };
    }
    if (typeof gmRowTags !== "object" || gmRowTags === null) {
      return {
        success: false,
        errorMsg: "Error: Invalid row tag mapping received.",
      };
    }

    const turboRangeDef = gUI.resolvedRanges?.monsters;
    if (!turboRangeDef || !fDoesObjectHaveR1C1R2C2Properties(turboRangeDef)) {
      return {
        success: false,
        errorMsg: "Error: Turbo monster table range definition is missing.",
      };
    }

    const { r1: turboMon_R_start, r2: turboMon_R_end } = turboRangeDef;
    if ([turboMon_R_start, turboMon_R_end].some(isNaN)) {
      return {
        success: false,
        errorMsg: "Error: Could not resolve Turbo monster table boundaries.",
      };
    }

    return { success: true, turboMon_R_start, turboMon_R_end };
  } // End function fValidateMonsterUpdateInputs

  /** function fResolveGMMonsterColumnTags
   * Purpose: Resolves required GM Screen monster column tags to their indices.
   * Assumptions: Helper for fUpdateMonsterTable.
   * @param {object} gmColTags - The map of GM Screen column tags to indices.
   * @returns {object|null} An object of resolved indices, or null if a tag is missing.
   */
  function fResolveGMMonsterColumnTags(gmColTags) {
    const requiredGmColTags = [
      "ActiveMonTF",
      "MonCustName",
      "MonName",
      "Vit",
      "Atk",
      "Dmg",
      "Def",
      "Ar",
      "Pic",
      "Notes",
    ];
    const resolvedGmColIndices = {};

    for (const tag of requiredGmColTags) {
      const index = gmColTags?.[tag];
      if (typeof index !== "number" || isNaN(index)) {
        fMyConsoleLog(
          `❌ fResolveGMMonsterColumnTags Error: Missing or invalid index for required tag: '${tag}'.`
        );
        return null;
      }
      resolvedGmColIndices[tag] = index;
    }
    fMyConsoleLog(
      `   -> Resolved GM Column Indices: ${JSON.stringify(
        resolvedGmColIndices
      )}`
    );
    return resolvedGmColIndices;
  } // End function fResolveGMMonsterColumnTags

  /** function fExtractAndProcessGMMonsterData
   * Purpose: Extracts and processes data for a single monster row from the GM Screen data.
   * Assumptions: Helper for fUpdateMonsterTable.
   * @param {any[]} dbMon_R - A single row of monster data from the GM Screen array.
   * @param {object} colIndices - The resolved map of GM column tags to indices.
   * @param {object} gmRowTags - The map of GM Screen row tags.
   * @returns {object} A structured object with processed monster data and a shouldProcess flag.
   */
  function fExtractAndProcessGMMonsterData(dbMon_R, colIndices, gmRowTags) {
    const isActiveVal = dbMon_R?.[colIndices["ActiveMonTF"]];
    const isActive =
      isActiveVal === true || String(isActiveVal).toUpperCase() === "TRUE";
    if (!isActive) {
      return { shouldProcess: false };
    }

    const monCustName = String(dbMon_R[colIndices["MonCustName"]] ?? "").trim();
    const monName = String(dbMon_R[colIndices["MonName"]] ?? "").trim();

    // Custom monster logic can be added here if needed using gmRowTags

    if (!monCustName && !monName) {
      return { shouldProcess: false };
    }

    let finalMonsterName = monCustName || monName;
    const namePrefix = "Mon: ";
    if (finalMonsterName.startsWith(namePrefix)) {
      finalMonsterName = finalMonsterName.substring(namePrefix.length);
    }
    const underscoreIndex = finalMonsterName.indexOf(" _");
    if (underscoreIndex !== -1) {
      finalMonsterName = finalMonsterName.substring(0, underscoreIndex);
    }

    const notes = String(dbMon_R[colIndices["Notes"]] ?? "");
    let size = "";
    const sizePrefix = "SIZE: ";
    const sizeIndex = notes.toUpperCase().indexOf(sizePrefix);
    if (sizeIndex !== -1) {
      const lineEndIndex = notes.indexOf("\n", sizeIndex);
      size = (
        lineEndIndex === -1
          ? notes.substring(sizeIndex + sizePrefix.length)
          : notes.substring(sizeIndex + sizePrefix.length, lineEndIndex)
      ).trim();
    }

    return {
      shouldProcess: true,
      name: finalMonsterName,
      vit: dbMon_R[colIndices["Vit"]],
      atk: dbMon_R[colIndices["Atk"]],
      dmg: dbMon_R[colIndices["Dmg"]],
      def: dbMon_R[colIndices["Def"]],
      ar: dbMon_R[colIndices["Ar"]],
      pic: dbMon_R[colIndices["Pic"]],
      size: size,
    };
  } // End function fExtractAndProcessGMMonsterData

  /** function fPopulateTurboMonsterRow
   * Purpose: Populates a single row in the Turbo monster table with processed data.
   * Assumptions: Helper for fUpdateMonsterTable.
   * @param {number} turboMon_R - The target row index in the Turbo grid.
   * @param {object} monsterData - The processed monster data object.
   * @returns {boolean} True if all values were set successfully, false otherwise.
   */
  function fPopulateTurboMonsterRow(turboMon_R, monsterData) {
    let rowUpdateSuccess = true;
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonName", monsterData.name);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonVit", monsterData.vit);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonAtk", monsterData.atk);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonDmg", monsterData.dmg);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonDef", monsterData.def);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonAR", monsterData.ar);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonPic", monsterData.pic);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "MonSize", monsterData.size);
    rowUpdateSuccess &&= fSetGridValue(turboMon_R, "NumMon", ""); // Clear NumMon for fresh input

    if (!rowUpdateSuccess) {
      fMyConsoleLog(
        `      -> ⚠️ Error setting some values for Turbo monster row ${turboMon_R}.`
      );
    }
    return rowUpdateSuccess;
  } // End function fPopulateTurboMonsterRow

  /** function fUpdateMonsterTable
   * Purpose: Controller to process GM Screen monster data and populate the Turbo monster table.
   * Assumptions: Orchestrates validation, data extraction, and grid updates via helper functions.
   * @param {any[][]} gmDataArray - 2D array of monster data from the GM Screen.
   * @param {object} gmColTags - Map of GM Screen column tags to indices.
   * @param {object} gmRowTags - Map of GM Screen row tags to indices.
   * @returns {Promise<void>} Resolves after the update is complete.
   */
  async function fUpdateMonsterTable(gmDataArray, gmColTags, gmRowTags) {
    fMyConsoleLog("🧬 Processing GM Monster Data for Turbo Table...");

    const validation = await fValidateMonsterUpdateInputs(
      gmDataArray,
      gmColTags,
      gmRowTags
    );
    if (!validation.success) {
      await fShowMessage(validation.errorMsg);
      return;
    }

    const resolvedGmColIndices = fResolveGMMonsterColumnTags(gmColTags);
    if (!resolvedGmColIndices) {
      await fShowMessage(
        "❌ Error: GM Screen data is missing expected column tags."
      );
      return;
    }

    const { turboMon_R_start, turboMon_R_end } = validation;
    const turboTableAvailableRows = turboMon_R_end - (turboMon_R_start + 1) + 1;
    let turboMon_R = turboMon_R_start + 1;
    let monstersAdded = 0;
    let errorsSettingValue = 0;

    for (const dbMon_R of gmDataArray) {
      const monsterData = fExtractAndProcessGMMonsterData(
        dbMon_R,
        resolvedGmColIndices,
        gmRowTags
      );
      if (!monsterData.shouldProcess) continue;

      if (turboMon_R > turboMon_R_end) {
        const message = `⚠️ Too many active monsters on GM Screen!<br>Only the first ${turboTableAvailableRows} could be loaded.`;
        fMyConsoleLog(
          `   -> Turbo table overflow detected. Max rows: ${turboTableAvailableRows}.`
        );
        await fShowMessage(message);
        break;
      }

      if (fPopulateTurboMonsterRow(turboMon_R, monsterData)) {
        monstersAdded++;
      } else {
        errorsSettingValue++;
      }
      turboMon_R++;
    }

    fMyConsoleLog(
      `✅ Monster Table Update Complete. Added: ${monstersAdded} monsters.${
        errorsSettingValue > 0 ? ` (${errorsSettingValue} value errors)` : ""
      }`
    );
  } // End function fUpdateMonsterTable

  /** function fRefreshMonsterData
   * Purpose: Handles the 'Show Monsters' button by fetching fresh monster data from the GM Screen DB.
   * Assumptions: gUI.range and gUI.rangeDB definitions are correct.
   * @returns {Promise<void>} Resolves after the refresh attempt is complete.
   */
  async function fRefreshMonsterData() {
    fMyConsoleLog("⚙️ Refreshing Monster Data from GM Screen DB...");
    fShowMessageNoClose(
      "⏳ Monster Data Loading...<br><br>This may take a minute.<br><br>Please wait."
    );
    const turboMonsterRangeDef = gUI.range?.monsters;
    if (
      !turboMonsterRangeDef ||
      !fDoesObjectHaveR1C1R2C2Properties(turboMonsterRangeDef)
    ) {
      const msg =
        "Turbo Monster range definition (gUI.range.monsters) is missing or invalid.";
      fHideMessage();
      await fShowMessage(`❌ Error: ${msg}`);
      return;
    }
    const gmMonsterRangeDef = gUI.rangeDB?.monstersDB;
    if (
      !gmMonsterRangeDef ||
      !fDoesObjectHaveR1C1R2C2Properties(gmMonsterRangeDef)
    ) {
      const msg =
        "GM Screen DB Monster range definition (gUI.rangeDB.monstersDB) is missing or invalid.";
      fHideMessage();
      await fShowMessage(`❌ Error: ${msg}`);
      return;
    }
    fMyConsoleLog(`   -> Clearing local Turbo monster table...`);
    fClearMonsters();
    fMyConsoleLog(
      `   -> Fetching GM monster data using key 'db', sheet 'GMScreen', range: ${JSON.stringify(
        gmMonsterRangeDef
      )}`
    );
    google.script.run
      .withSuccessHandler((response) => {
        fHideMessage();
        fMyConsoleLog(`   -> Received response from server.`);
        if (
          !response ||
          typeof response !== "object" ||
          response.error ||
          !response.hasOwnProperty("data") ||
          !response.hasOwnProperty("colTags") ||
          !response.hasOwnProperty("rowTags")
        ) {
          const errMsg =
            "Received invalid data structure from server for monsters.";
          fShowMessage(`❌ Error: ${errMsg}`);
          return;
        }
        const {
          data: gmDataArray,
          colTags: gmColTags,
          rowTags: gmRowTags,
        } = response;
        fMyConsoleLog(
          `   -> Server returned Data (${
            Array.isArray(gmDataArray) ? gmDataArray.length : "N/A"
          }), ColTags (${Object.keys(gmColTags).length}), RowTags (${
            Object.keys(gmRowTags).length
          }).`
        );
        fUpdateMonsterTable(gmDataArray, gmColTags, gmRowTags);
      })
      .withFailureHandler((error) => {
        fHideMessage();
        const errorMsgFromServer = error.message || "Unknown server error";
        const finalErrorMsg = `Failed to fetch monster data from server: ${errorMsgFromServer}`;
        fShowMessage(`❌ Error: ${finalErrorMsg}`);
      })
      .fSrvGetSheetRangeDataNTags("db", "GMScreen", gmMonsterRangeDef);
  } // End function fRefreshMonsterData

   * Assumptions: The grid element exists.

   * @returns {void}

  function fScrollGridToTop(grid) {

  /** function fScrollGridToBottom
   * Purpose: Scrolls the grid container smoothly to center the Gear Table in view.
   * Assumptions: The grid element and the 'GearTblHeaderStartR' tag exist.
   * @param {HTMLElement} grid - The grid container element (#grid).
   * @returns {void}
   */
  function fScrollGridToBottom(grid) {
    if (!grid) {
      console.warn(
        "fScrollGridToBottom: Could not find #grid element to scroll."
      );
      return;
    }
    const targetRowTag = "GearTblHeaderStartR";
    const targetRowIndex = fResolveRow(targetRowTag);
    if (isNaN(targetRowIndex)) {
      console.warn(
        `fScrollGridToBottom: Could not resolve row tag '${targetRowTag}' for scrolling.`
      );
      return;
    }
    const targetCell = gUI.grid2D?.[targetRowIndex]?.[0];
    if (!targetCell) {
      console.warn(
        `fScrollGridToBottom: Could not find cell element for row ${targetRowIndex} (Tag: ${targetRowTag})`
      );
      return;
    }
    const scrollTop =
      targetCell.offsetTop -
      grid.clientHeight / 2 +
      targetCell.offsetHeight / 2;
    grid.scrollTo({ top: scrollTop, behavior: "smooth" });
    fMyConsoleLog(
      `Scrolling grid to center row ${targetRowIndex} (Tag: ${targetRowTag})`
    );
  } // End function fScrollGridToBottom

  /** function fHandleGridCheckboxClick
   * Purpose: Handles delegated click events for checkboxes within the grid.
   * Assumptions: Updates the data model and handles special logic for Sk1/Sk2 and PossWorn checkboxes.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleGridCheckboxClick(event) {
    const checkbox = event.target;
    if (!fIsValidGridCheckbox(checkbox)) return;
    const r = parseInt(checkbox.dataset.r, 10);
    const c = parseInt(checkbox.dataset.c, 10);
    if (!fIsValidGridCoords(r, c)) {
      console.warn(
        "Checkbox click handler: Invalid row/column index or missing grid element.",
        checkbox.dataset
      );
      return;
    }
    const isChecked = checkbox.checked;
    const isSkGroupMember = checkbox.dataset.skGroup === "true";
    const possWornCol = tag.cs.game.c.PossWorn.index;
    const oldValue = gUI.arr[r][c];
    gUI.arr[r][c] = isChecked;
    fMyConsoleLog(`Checkbox [${r}, ${c}] toggled to: ${isChecked}`);
    if (isSkGroupMember) {
      fHandleSkGroupCheckboxClickLogicOnly(r, c, isChecked, oldValue);
    }
    if (c === possWornCol) {
      fMyConsoleLog(
        `   -> PossWorn checkbox clicked [${r}, ${c}]. Triggering fCalcGearLine...`
      );
      const calcResult = await fCalcGearLine(r, c, isChecked, !isChecked);
      if (calcResult !== null) {
        fHandleAutoSaveTextToFirestore();
      } else {
        fMyConsoleLog(
          `   -> fCalcGearLine indicated failure for PossWorn click at [${r}, ${c}]. Auto-save skipped.`
        );
      }
    } else if (!isSkGroupMember) {
      fHandleAutoSaveTextToFirestore();
    }
  } // End function fHandleGridCheckboxClick

  /** function fHandleSkGroupCheckboxClickLogicOnly
   * Purpose: Handles the synchronous data updates for the Sk1/Sk2 radio group.
   * Assumptions: This function only updates the data model and tracker, not the DOM. It's called by `function fHandleGridCheckboxClick`.
   * @param {number} r - Row index of the clicked checkbox.
   * @param {number} c - Column index of the clicked checkbox.
   * @param {boolean} isChecked - The new checked state of the clicked checkbox.
   * @returns {void}
   */
  function fHandleSkGroupCheckboxClickLogicOnly(r, c, isChecked) {
    const oldR = gUI.currentSkRadioChecked.r;
    const oldC = gUI.currentSkRadioChecked.c;
    if (isChecked) {
      if (oldR !== null && oldC !== null && (oldR !== r || oldC !== c)) {
        fUncheckOldSkGroupBox(oldR, oldC);
      }
      gUI.currentSkRadioChecked = {
        r,
        c,
      };
      fMyConsoleLog(`Radio group: Checked box [${r}, ${c}]`);
    } else {
      if (oldR === r && oldC === c) {
        gUI.currentSkRadioChecked = {
          r: null,
          c: null,
        };
      }
      fMyConsoleLog(`Radio group: Unchecked box [${r}, ${c}]`);
    }
  } // End function fHandleSkGroupCheckboxClickLogicOnly

  /** function fUncheckOldSkGroupBox
   * Purpose: Finds and unchecks the previously checked Sk1/Sk2 radio group checkbox.
   * Assumptions: Updates both the DOM element and the data model (`gUI.arr`).
   * @param {number} oldR - Row index of the previously checked box.
   * @param {number} oldC - Column index of the previously checked box.
   * @returns {void}
   */
  function fUncheckOldSkGroupBox(oldR, oldC) {
    const oldCellDiv = gUI.grid2D[oldR]?.[oldC];
    const oldCheckbox = oldCellDiv?.querySelector(
      'input[data-sk-group="true"]'
    );
    if (oldCheckbox) {
      oldCheckbox.checked = false;
      gUI.arr[oldR][oldC] = false;
      fMyConsoleLog(`Radio group: Unchecked previous box [${oldR}, ${oldC}]`);
    } else {
      console.warn(
        `Radio group: Could not find previous checkbox element at [${oldR}, ${oldC}] to uncheck.`
      );
    }
  } // End function fUncheckOldSkGroupBox

  /** function fIsValidGridCheckbox
   * Purpose: Checks if an HTML element is a valid, enabled checkbox within a grid cell.
   * Assumptions: A valid checkbox is an INPUT element of type checkbox that is not disabled.
   * @param {HTMLElement} checkbox - The element to check.
   * @returns {boolean} True if the element is a valid grid checkbox, false otherwise.
   */
  function fIsValidGridCheckbox(checkbox) {
    return (
      checkbox &&
      checkbox.tagName === "INPUT" &&
      checkbox.type === "checkbox" &&
      checkbox.closest(".cell") &&
      !checkbox.disabled
    );
  } // End function fIsValidGridCheckbox

  /** function fIsValidGridCoords
   * Purpose: Validates if row and column indices are valid numbers corresponding to existing grid rows.
   * Assumptions: Checks against the dimensions of `gUI.arr` and `gUI.grid2D`.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {boolean} True if coordinates are valid, false otherwise.
   */
  function fIsValidGridCoords(r, c) {
    return (
      !isNaN(r) && !isNaN(c) && r >= 0 && c >= 0 && gUI.arr[r] && gUI.grid2D[r]
    );
  } // End function fIsValidGridCoords

  /** function fIsCheckboxClick
   * Purpose: Helper to check if an event target is a checkbox input element.
   * Assumptions: The target is a valid HTMLElement.
   * @param {HTMLElement} target - The event target element.
   * @returns {boolean} True if target is an <input type="checkbox">.
   */
  function fIsCheckboxClick(target) {
    return target.tagName === "INPUT" && target.type === "checkbox";
  } // End function fIsCheckboxClick

  /** function fHandleUrlClick
   * Purpose: Determines the type of URL clicked and routes to the appropriate handler.
   * Assumptions: The cell element has the necessary data attributes.
   * @param {HTMLElement} cellDiv - The cell div element that was clicked.
   * @returns {void}
   */
  function fHandleUrlClick(cellDiv) {
    const originalUrl = cellDiv.dataset.url;
    if (!originalUrl) {
      console.warn(
        "Clicked URL link cell, but data-url attribute was missing.",
        cellDiv
      );
      return;
    }
    const isDrive = originalUrl.includes("drive.google.com/file/d/");
    const isImage = cellDiv.classList.contains("image-link") && !isDrive;
    const imageUrl = cellDiv.dataset.imageSrc;
    if (isDrive) {
      fHandleDriveLink(originalUrl);
    } else if (isImage && imageUrl) {
      fHandleImageModal(imageUrl);
    } else {
      fHandleWebLink(originalUrl);
    }
  } // End function fHandleUrlClick

  /** function fCheckAndTagUrl
   * Purpose: Checks if a cell's value is a URL and tags it with appropriate classes and data attributes.
   * Assumptions: Handles standard URLs, Google Drive links, and direct image links.
   * @param {HTMLElement} cell - The cell div element.
   * @param {any} value - The raw value for the cell from gUI.arr.
   * @returns {object} An object { displayValue, isUrl }.
   */
  function fCheckAndTagUrl(cell, value) {
    const trimmed = typeof value === "string" ? value.trim() : "";
    const isUrl =
      trimmed.startsWith("http://") || trimmed.startsWith("https://");
    let displayValue = value;
    if (!isUrl) {
      return {
        displayValue,
        isUrl,
      };
    }
    cell.classList.add("url-link");
    cell.dataset.url = trimmed;
    const driveMatch = trimmed.match(/drive\.google\.com\/file\/d\/([-\w]+)/);
    const imgExts = /\.(png|jpg|jpeg|gif|webp|svg)$/i;
    if (driveMatch && driveMatch[1]) {
      const fileId = driveMatch[1];
      const imageUrl = "https://drive.google.com/uc?export=view&id=" + fileId;
      cell.classList.add("image-link");
      cell.dataset.imageSrc = imageUrl;
    } else if (imgExts.test(trimmed)) {
      cell.classList.add("image-link");
      cell.dataset.imageSrc = trimmed;
    }
    return {
      displayValue,
      isUrl,
    };
  } // End function fCheckAndTagUrl

  function fIsUrlLinkCell(cellDiv) {

  /** function fSetupGridHoverListeners
   * Purpose: Attaches delegated hover listeners to the grid for tooltip functionality.
   * Assumptions: The gridElement exists and the global gUI.tooltipElement has been cached.
   * @param {HTMLElement} gridElement - The grid container element.

  function fSetupGridHoverListeners(gridElement) {

        "fSetupGridHoverListeners: Cannot setup hover listeners - Grid element not provided."
      );
      return;
    }
