  /** function fHandleCellHover
   * Purpose: Delegated mouseover handler for grid cells that starts a timer to show a tooltip.
   * Assumptions: `gUI.tooltipElement` is cached.
   * @param {MouseEvent} event - The mouseover event.
   * @returns {void}
   */
  function fHandleCellHover(event) {
    if (!gUI.tooltipElement) return;
    const cell = fGetValidTargetCell(event);
    if (!cell) {
      fHideTooltip();
      return;
    }
    fStartTooltipBoxDelayTimer(cell, event);
  } // End function fHandleCellHover

  /** function fHandleCellMouseOut
   * Purpose: Handles mouseout events delegated from the grid to hide the tooltip.
   * Assumptions: Clears any pending tooltip display timeout.
   * @param {MouseEvent} event - The mouseout event object.
   * @returns {void}
   */
  function fHandleCellMouseOut(event) {
    clearTimeout(gUI.tooltipTimeoutId);
    gUI.tooltipTimeoutId = null;
    if (gUI.tooltipElement) {
      gUI.tooltipElement.style.display = "none";
    }
  } // End function fHandleCellMouseOut

  /** function fStartTooltipBoxDelayTimer
   * Purpose: Sets a timeout before showing the tooltip for a hovered cell.
   * Assumptions: Clears any previous timeout.
   * @param {HTMLElement} cell - The cell element being hovered over.
   * @param {MouseEvent} event - The mouse event, used for positioning.
   * @returns {void}
   */
  function fStartTooltipBoxDelayTimer(cell, event) {
    clearTimeout(gUI.tooltipTimeoutId);
    gUI.tooltipTimeoutId = setTimeout(() => {
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      if (isNaN(r) || isNaN(c)) {
        console.warn(
          "Tooltip hover: Invalid r/c data attributes.",
          cell.dataset
        );
        fHideTooltip();
        return;
      }
      if (fIsTooltipBoxNeeded(r, c, cell)) {
        gUI.tooltipElement.innerHTML = fBuildsTooltipBoxesContent(r, c, cell);
        gUI.tooltipElement.style.display = "block";
        fConfineNotesTooltipBox(gUI.tooltipElement, event);
      } else {
        fHideTooltip();
      }
    }, gUI.HOVER_DELAY_MS);
  } // End function fStartTooltipBoxDelayTimer

  /** function fHideTooltip
   * Purpose: Clears any pending tooltip timer and hides the tooltip element.
   * Assumptions: `gUI.tooltipElement` is cached.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fHideTooltip() {
    clearTimeout(gUI.tooltipTimeoutId);
    gUI.tooltipTimeoutId = null;
    if (gUI.tooltipElement) {
      gUI.tooltipElement.style.display = "none";
    }
  } // End function fHideTooltip

  /** function fConfineNotesTooltipBox
   * Purpose: Calculates and sets the position for the tooltip, ensuring it stays within the viewport.
   * Assumptions: The tooltip element is visible but may be positioned off-screen.
   * @param {HTMLElement} tooltip - The tooltip element.
   * @param {MouseEvent} event - The mouse event that triggered the hover.
   * @returns {void}
   */
  function fConfineNotesTooltipBox(tooltip, event) {
    if (!tooltip || !event) return;
    const cursorX = event.pageX;
    const cursorY = event.pageY;
    const tooltipRect = tooltip.getBoundingClientRect();
    const tooltipWidth = tooltipRect.width;
    const tooltipHeight = tooltipRect.height;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    let newTop = cursorY + gUI.TOOLTIP_OFFSET_Y;
    let newLeft = cursorX + gUI.TOOLTIP_OFFSET_X;
    if (newLeft + tooltipWidth > viewportWidth + scrollX) {
      newLeft = cursorX - tooltipWidth - gUI.TOOLTIP_OFFSET_X;
      if (newLeft < scrollX) {
        newLeft = scrollX + 5;
      }
    }
    if (newTop + tooltipHeight > viewportHeight + scrollY) {
      newTop = cursorY - tooltipHeight - gUI.TOOLTIP_OFFSET_Y;
      if (newTop < scrollY) {
        newTop = scrollY + 5;
      }
    }
    tooltip.style.top = `${newTop}px`;
    tooltip.style.left = `${newLeft}px`;
  } // End function fConfineNotesTooltipBox

  /** function fBuildsTooltipBoxesContent
   * Purpose: Constructs the HTML content for the tooltip, combining various sources of text.
   * Assumptions: Combines overflow text, sheet notes, and custom notes.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {HTMLElement} cell - The cell element.
   * @returns {string} HTML string content for the tooltip.
   */
  function fBuildsTooltipBoxesContent(r, c, cell) {
    const textSpan = cell.querySelector("span");
    const sheetNoteText = gUI.notes?.[r]?.[c]?.trim();
    const customNoteText = gUI.customNotes?.[r]?.[c]?.trim();
    let tooltipContent = "";
    let isOverflowing = false;
    if (textSpan) {
      isOverflowing =
        textSpan.scrollWidth > textSpan.clientWidth + 1 ||
        textSpan.scrollHeight > textSpan.clientHeight + 1;
    }
    if (isOverflowing && textSpan) {
      tooltipContent += textSpan.textContent.trim();
    }
    if (sheetNoteText) {
      if (tooltipContent) {
        tooltipContent += "\n---\n";
      }
      tooltipContent += `Note: ${sheetNoteText}`;
    }
    if (customNoteText) {
      if (tooltipContent) {
        tooltipContent += "\n---\n";
      }
      tooltipContent += `<span style="color: red; font-weight: bold; text-decoration: underline;">Custom Note:</span>\n${customNoteText}`;
    }
    return tooltipContent.replace(/\n/g, "<br>");
  } // End function fBuildsTooltipBoxesContent

  /** function fIsTooltipBoxNeeded
   * Purpose: Determines if a tooltip should be shown for a cell.
   * Assumptions: Checks for text overflow or the presence of sheet/custom notes.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {HTMLElement} cell - The cell element.
   * @returns {boolean} True if a tooltip is needed, false otherwise.
   */
  function fIsTooltipBoxNeeded(r, c, cell) {
    const textSpan = cell.querySelector("span");
    let isOverflowing = false;
    if (textSpan) {
      const isHorizontallyOverflowing =
        textSpan.scrollWidth > textSpan.clientWidth + 1;
      const isVerticallyOverflowing =
        textSpan.scrollHeight > textSpan.clientHeight + 1;
      isOverflowing = isHorizontallyOverflowing || isVerticallyOverflowing;
    }
    const sheetNoteText = gUI.notes?.[r]?.[c]?.trim();
    const customNoteText = gUI.customNotes?.[r]?.[c]?.trim();
    return isOverflowing || !!sheetNoteText || !!customNoteText;
  } // End function fIsTooltipBoxNeeded

  /** function fHandleCustomNoteSave
   * Purpose: Handles the save action from the custom note editor modal.
   * Assumptions: An empty note is treated as a deletion.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fHandleCustomNoteSave() {
    const modal = document.getElementById("customNoteModal");
    const textarea = document.getElementById("customNoteTextarea");
    if (!modal || !textarea) return;
    const r = parseInt(modal.dataset.r, 10);
    const c = parseInt(modal.dataset.c, 10);
    if (isNaN(r) || isNaN(c)) return;
    const newNoteText = textarea.value.trim();
    const cell = gUI.grid2D?.[r]?.[c];
    const sheetNoteExists = !!gUI.notes?.[r]?.[c]?.trim();
    gUI.customNotes[r][c] = newNoteText;
    if (cell) {
      if (newNoteText) {
        cell.classList.remove("has-note");
        cell.classList.add("has-custom-note");
      } else {
        cell.classList.remove("has-custom-note");
        if (sheetNoteExists) {
          cell.classList.add("has-note");
        }
      }
    }
    fUpdateCustomDataIndicator(r, c);
    fMyConsoleLog(
      `   -> Custom note for [${r}, ${c}] saved to memory. Length: ${newNoteText.length}.`
    );
    modal.style.display = "none";
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleCustomNoteSave

  /** function fHandleCustomNoteClear
   * Purpose: Clears the custom note textarea and triggers the save handler to delete the note.
   * Assumptions: The custom note modal is open and its elements are available.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fHandleCustomNoteClear() {
    const textarea = document.getElementById("customNoteTextarea");
    if (textarea) {
      textarea.value = "";
      fHandleCustomNoteSave();
    }
  } // End function fHandleCustomNoteClear

  /** function fSetupCustomNoteModalListeners
   * Purpose: Sets up event listeners for the custom note editor modal.
   * Assumptions: The modal HTML exists in ui.html.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fSetupCustomNoteModalListeners() {
    fMyConsoleLog("🖱️ Setting up Custom Note Modal Listeners...");
    const modal = document.getElementById("customNoteModal");
    const saveBtn = document.getElementById("customNoteSaveButton");
    const clearBtn = document.getElementById("customNoteClearButton");
    const cancelBtn = document.getElementById("customNoteCancelButton");
    if (!modal || !saveBtn || !clearBtn || !cancelBtn) {
      console.error(
        "Custom note modal listener setup failed: elements not found."
      );
      return;
    }
    saveBtn.addEventListener("click", fHandleCustomNoteSave);
    clearBtn.addEventListener("click", fHandleCustomNoteClear);

        modal.style.display = "none";
      }
    });

      if (modal.style.display !== "none" && event.key === "Escape") {
        modal.style.display = "none";
      }
    });
    fMyConsoleLog("✅ Custom Note Modal Listeners Attached.");
  } // End function fSetupCustomNoteModalListeners

  /** function fApplyDropdownsToGrid
   * Purpose: Replaces cell content with dropdowns based on configurations in `gUI.dropDownBox`.
   * Assumptions: Skips cells that already contain a custom (⚡) item.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fApplyDropdownsToGrid() {
    fMyConsoleLog("🧬 Applying Dropdowns to Grid...");
    let dropdownsApplied = 0;
    const abilityListKey = "myCSListFSData";
    if (!Array.isArray(gUI.dropDownBox)) {
      fMyConsoleLog("ℹ️ No dropdown configurations found.");
      return;
    }
    gUI.dropDownBox.forEach((config) => {
      if (!config.choices || !Array.isArray(config.ranges)) {
        console.warn(
          "fApplyDropdownsToGrid: Skipping invalid dropdown config:",
          config
        );
        return;
      }
      const isAbilityDropdownConfig = config.gUIListKey === abilityListKey;
      config.ranges.forEach((range) => {
        const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
        if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN))
          return;
        const rMin = Math.min(resolved.r1, resolved.r2);
        const rMax = Math.max(resolved.r1, resolved.r2);
        const cMin = Math.min(resolved.c1, resolved.c2);
        const cMax = Math.max(resolved.c1, resolved.c2);
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            const cell = gUI.grid2D?.[r]?.[c];
            if (!cell || cell.style.display === "none") continue;
            const currentValue = gUI.arr?.[r]?.[c];
            if (
              typeof currentValue === "string" &&
              currentValue.startsWith("⚡")
            ) {
              continue;
            }
            const existingDropdown = cell.querySelector("select.grid-dropdown");
            const hasCheckbox = cell.querySelector('input[type="checkbox"]');
            const shouldApplyDropdown =
              !hasCheckbox && (!existingDropdown || isAbilityDropdownConfig);
            if (shouldApplyDropdown) {
              const dropdown = fCreateDropdownElement(
                r,
                c,
                config.choices,
                currentValue
              );
              cell.innerHTML = "";
              cell.appendChild(dropdown);
              cell.style.padding = "0";
              cell.style.overflow = "visible";
              dropdownsApplied++;
            }
          }
        }
      });
    });
    fMyConsoleLog(`✅ Applied ${dropdownsApplied} Dropdowns.`);
  } // End function fApplyDropdownsToGrid

  /** function fFetchAndApplyAbilityDropdowns
   * Purpose: Ensures the ability list from the 'MyCS/List' cache is processed and applied to the grid.
   * Assumptions: The cache `gUI.myCSListFSData` has already been loaded.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fFetchAndApplyAbilityDropdowns() {
    const funcName = "fFetchAndApplyAbilityDropdowns";
    fMyConsoleLog(
      `⚙️ ${funcName}: Triggering processing of cached Ability List...`
    );
    if (!gUI.myCSListFSData) {
      const errorMsg = `Cannot process ability list: Required cache (gUI.myCSListFSData) was not loaded during initial setup.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);

        console.error("ShowMessage Error:", e)
      );
      return;
    }

  } // End function fFetchAndApplyAbilityDropdowns

  /** function fProcessCachedAbilityList
   * Purpose: Processes the cached MyCS/List data to build and apply the main ability dropdowns.
   * Assumptions: The cache `gUI.myCSListFSData` is valid. It finds or creates the dropdown configuration in `gUI.dropDownBox`.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fProcessCachedAbilityList() {
    const funcName = "fProcessCachedAbilityList";
    fMyConsoleLog(`   -> ${funcName}: Processing cached MyCS/List data...`);
    const listCache = gUI.myCSListFSData;
    const cacheKey = "myCSListFSData";
    const colTagForAbilities = "AbilitiesNameID";
    const startRowTag = "TableFirstRow";
    if (!listCache) {
      const errMsg = `MyCS/List cache (gUI.${cacheKey}) is missing. Cannot populate Ability dropdowns.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    const abilitiesColIndex = fResolveFSDataCol(cacheKey, colTagForAbilities);
    const startRowIndex = fResolveFSDataRow(cacheKey, startRowTag);
    if (isNaN(abilitiesColIndex)) {
      const errMsg = `Column tag '${colTagForAbilities}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    if (isNaN(startRowIndex)) {
      const errMsg = `Start row tag '${startRowTag}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errMsg}`);
      fShowMessage(`❌ Error: ${errMsg}`).catch((e) =>
        console.error("ShowMessage Error:", e)
      );
      return;
    }
    fMyConsoleLog(
      `      -> Processing list from absolute row index ${startRowIndex} ('${startRowTag}') downwards.`
    );
    fMyConsoleLog(
      `      -> Using data from column index ${abilitiesColIndex} ('${colTagForAbilities}').`
    );
    const abilityListRaw = [];
    const cachedText = listCache.text;
    const numRows = cachedText.length;
    for (let r = startRowIndex; r < numRows; r++) {
      const cellValue = cachedText[r]?.[abilitiesColIndex];
      if (cellValue !== undefined) {
        abilityListRaw.push(cellValue);
      }
    }
    fMyConsoleLog(
      `      -> Extracted ${abilityListRaw.length} potential ability names from row ${startRowIndex} onwards.`
    );
    const abilityListFiltered = abilityListRaw
      .filter(
        (name) =>
          name !== undefined && name !== null && String(name).trim() !== ""
      )
      .map((name) => String(name).trim());
    abilityListFiltered.sort((a, b) => a.localeCompare(b));
    abilityListFiltered.unshift("");
    fMyConsoleLog(
      `      -> Processed list size: ${abilityListFiltered.length} (after filter, sort, unshift).`
    );
    let abilityConfig = gUI.dropDownBox.find(
      (config) => config.gUIListKey === cacheKey
    );
    if (!abilityConfig) {
      fMyConsoleLog(`      -> Creating new dropdown config for Abilities.`);
      abilityConfig = {
        gUIListKey: cacheKey,
        choices: abilityListFiltered,
        ranges: gUI.range.abilNameNoNish,
      };
      gUI.dropDownBox.push(abilityConfig);
    } else {
      fMyConsoleLog(
        `      -> Updating existing dropdown config choices for Abilities.`
      );
      abilityConfig.choices = abilityListFiltered;
    }
    fMyConsoleLog("      -> Added/Updated Ability config in gUI.dropDownBox.");
    fApplyDropdownsToGrid();
  } // End function fProcessCachedAbilityList

  /** function fHandleDropdownChange
   * Purpose: Handles the 'change' event for grid dropdowns.
   * Assumptions: Updates `gUI.arr` and triggers `function fProcessAbilityChange` for ability name cells.
   * @param {Event} event - The change event object from the select element.
   * @returns {void}
   */
  function fHandleDropdownChange(event) {
    const select = event.target;
    const r = parseInt(select.dataset.r, 10);
    const c = parseInt(select.dataset.c, 10);
    const newValue = select.value;
    if (isNaN(r) || isNaN(c) || !gUI.arr?.[r]) {
      console.warn(
        `fHandleDropdownChange: Invalid coordinates [${r}, ${c}] from dataset.`
      );
      return;
    }
    const oldValue = gUI.arr[r][c];
    const originalChoice = gUI.dropDownBox
      .find((config) =>
        config.ranges.some((range) => {
          const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
          return (
            !isNaN(resolved.r1) &&
            !isNaN(resolved.c1) &&
            !isNaN(resolved.r2) &&
            !isNaN(resolved.c2) &&
            r >= Math.min(resolved.r1, resolved.r2) &&
            r <= Math.max(resolved.r1, resolved.r2) &&
            c >= Math.min(resolved.c1, resolved.c2) &&
            c <= Math.max(resolved.c1, resolved.c2)
          );
        })
      )
      ?.choices.find((choice) => String(choice) === newValue);
    const finalValue =
      typeof originalChoice === "number" ? Number(newValue) : newValue;
    if (gUI.arr[r][c] !== finalValue) {
      const isAbilityNameCell = fIsCellInRangeArray(
        r,
        c,
        gUI.resolvedRanges.abilNameNoNish
      );
      gUI.arr[r][c] = finalValue;
      fMyConsoleLog(
        `Dropdown [${r}, ${c}] changed to: "${finalValue}" (Type: ${typeof finalValue})`
      );
      if (isAbilityNameCell) {
        fMyConsoleLog(
          `   -> Change detected in Ability Name cell [${r}, ${c}]. Triggering processing...`
        );
        fProcessAbilityChange(r, c, finalValue, oldValue);
      }
      fHandleAutoSaveTextToFirestore();
    }
  } // End function fHandleDropdownChange

  /** function fCreateDropdownElement
   * Purpose: Creates an HTML select element for use within a grid cell dropdown.
   * Assumptions: Populates it with options and pre-selects the current value.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @param {any[]} choices - Array of option values for the dropdown.
   * @param {any} currentValue - The current value from gUI.arr to pre-select.
   * @returns {HTMLSelectElement} The configured <select> element.
   */
  function fCreateDropdownElement(r, c, choices, currentValue) {
    const select = document.createElement("select");
    select.classList.add("grid-dropdown");
    select.dataset.r = r;
    select.dataset.c = c;
    const currentValStr = String(currentValue ?? "");
    choices.forEach((choice) => {
      const option = document.createElement("option");
      option.value = choice;
      option.textContent = choice;
      if (String(choice) === currentValStr) {
        option.selected = true;
      }
      select.appendChild(option);
    });
    return select;
  } // End function fCreateDropdownElement

  /** function fFindDropdownMatch
   * Purpose: Checks if coordinates fall within any dropdown range and returns the matching configuration.
   * Assumptions: gUI.dropDownBox contains valid dropdown configurations.
   * @param {number} r - 0-based row index.
   * @param {number} c - 0-based column index.
   * @returns {object | null} The dropdown config object if found, otherwise null.
   */
  function fFindDropdownMatch(r, c) {
    for (const config of gUI.dropDownBox) {
      for (const range of config.ranges) {
        const r1 = fResolveRow(range.r1),
          r2 = fResolveRow(range.r2);
        const c1 = fResolveCol(range.c1),
          c2 = fResolveCol(range.c2);
        if (
          !isNaN(r1) &&
          !isNaN(r2) &&
          !isNaN(c1) &&
          !isNaN(c2) &&
          r >= Math.min(r1, r2) &&
          r <= Math.max(r1, r2) &&
          c >= Math.min(c1, c2) &&
          c <= Math.max(c1, c2)
        ) {
          return config;
        }
      }
    }
    return null;
  } // End function fFindDropdownMatch

  /** function fProcessAbilityChange
   * Purpose: Handles the logic when an Ability dropdown value changes.
   * Assumptions: Dispatches to helpers for clearing or processing the new selection from caches.
   * @param {number} r - Row index of the changed ability cell.
   * @param {number} c - Column index of the changed ability cell.
   * @param {any} newValue - The new value selected in the dropdown.
   * @param {any} oldValue - The previous value in the cell.
   * @returns {void}
   */
  function fProcessAbilityChange(r, c, newValue, oldValue) {
    const funcName = "fProcessAbilityChange";
    fMyConsoleLog(
      `⚙️ ${funcName}: Processing change for Ability/Gear at row ${r}.`
    );
    const newValueStr = String(newValue ?? "").trim();
    const oldValueStr = String(oldValue ?? "").trim();
    if (newValueStr === oldValueStr) {
      fMyConsoleLog(
        `   -> No significant change detected ('${oldValueStr}' -> '${newValueStr}'). Exiting.`
      );
      return;
    }
    if (newValueStr === "") {
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
    } else {
      fHandleClearAbilityRow(r, true);
      fMyConsoleLog(
        `   -> ${funcName}: New Ability/Gear selected: "${newValueStr}". Processing caches...`
      );
      fSetGridValue(r, "Sk1", "⏳");
      const dbAbilityResult = fHandleNewAbilitySelection(
        "DB",
        "Abilities",
        r,
        newValueStr
      );
      const klKnownAbilitiesResult = fHandleNewAbilitySelection(
        "MyKL",
        "KnownAbilities",
        r,
        newValueStr
      );
      const dbGearResult = fHandleNewAbilitySelection(
        "DB",
        "Gear",
        r,
        newValueStr
      );
      if (
        dbAbilityResult === null ||
        klKnownAbilitiesResult === null ||
        dbGearResult === null
      ) {
        fMyConsoleLog(
          `--> ❌ ${funcName}: Critical error occurred during cache processing for row ${r}. Halting.`
        );
        if (fGetGridValue(r, "Sk1") === "⏳") fSetGridValue(r, "Sk1", "ERR");
        return;
      }
      fMyConsoleLog(
        `   -> ${funcName}: Cache Processing Results - DB Ability Found: ${dbAbilityResult.found}, KL KnownAbil Found: ${klKnownAbilitiesResult.found}, DB Gear Found: ${dbGearResult.found}`
      );
      const hasAbilityData =
        dbAbilityResult.found || klKnownAbilitiesResult.found;
      const hasGearData = dbGearResult.found;
      if (!hasAbilityData && !hasGearData) {
        fMyConsoleLog(
          `--> ❌ ${funcName}: Could not find ID "${newValueStr}" in DB Abilities, MyKL, or DB Gear caches for row ${r}.`
        );
        fSetGridValue(r, "Sk1", "NF");
        fShowMessage(
          `❌ Error processing selection: Could not find data in Abilities, MyAbilities, or Gear definitions.`
        ).catch((e) => console.error("ShowMessage Error:", e));
        return;
      }
      fMyConsoleLog(
        `--> ${funcName}: Cache processing complete for row ${r}. Applying data...`
      );
      fSaveNewAbilityToAbilTbl(
        r,
        dbAbilityResult,
        klKnownAbilitiesResult,
        dbGearResult
      );
      fCalculatesEnc_MR_AP();
    }
  } // End function fProcessAbilityChange

  /** function fHandleNewAbilitySelection
   * Purpose: Fetches ability/gear data for a given ID from the appropriate pre-loaded cache.
   * Assumptions: The relevant cache objects (e.g., gUI.dbAbilitiesFSData) have been pre-loaded.
   * @param {string} workbookAbr - The workbook abbreviation ('DB' or 'MyKL').
   * @param {string} sheetName - The sheet name ('Abilities', 'KnownAbilities', or 'Gear').
   * @param {number} r - Row index in the grid where the ability was selected.
   * @param {string} newValueStr - The new ability value selected (e.g., 'Name_id').
   * @returns {object | null} An object { dataRow, headerRow, colTagsMap, found: boolean } or null on critical errors.
   */
  function fHandleNewAbilitySelection(workbookAbr, sheetName, r, newValueStr) {
    const funcName = "fHandleNewAbilitySelection";
    fMyConsoleLog(
      `   -> ${funcName}: Processing "${newValueStr}" for ${workbookAbr}/${sheetName} using CACHE...`
    );
    let targetCache = null;
    let cacheKey = "";
    const lowerWorkbookAbr = workbookAbr.toLowerCase();
    const lowerSheetName = sheetName.toLowerCase();
    if (lowerWorkbookAbr === "db" && lowerSheetName === "abilities") {
      targetCache = gUI.dbAbilitiesFSData;
      cacheKey = "gUI.dbAbilitiesFSData";
    } else if (
      lowerWorkbookAbr === "mykl" &&
      lowerSheetName === "knownabilities"
    ) {
      targetCache = gUI.myKLKnownAbilitiesFSData;
      cacheKey = "gUI.myKLKnownAbilitiesFSData";
    } else if (lowerWorkbookAbr === "db" && lowerSheetName === "gear") {
      targetCache = gUI.dbGearFSData;
      cacheKey = "gUI.dbGearFSData";
    } else {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Unsupported workbook/sheet combination: ${workbookAbr}/${sheetName}`
      );
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    if (
      !targetCache ||
      !targetCache.text ||
      !targetCache.rowTagsMap ||
      !targetCache.colTagsMap
    ) {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Required cache ${cacheKey} is not loaded or invalid.`
      );
      fShowMessage(
        `❌ Error: Required definition data (${cacheKey}) not loaded. Please reload.`
      ).catch((e) => console.error("ShowMessage Error:", e));
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    const abilID = fGetIDFromNameID(newValueStr);
    if (!abilID) {
      fMyConsoleLog(
        `      -> ❌ ${funcName} Error: Could not extract valid ID from selected value "${newValueStr}".`
      );
      fSetGridValue(r, "Sk1", "ERR");
      return null;
    }
    fMyConsoleLog(
      `       -> Extracted ID: "${abilID}" for ${workbookAbr}/${sheetName}`
    );
    const rowIndex = fResolveFSDataRow(cacheKey.replace("gUI.", ""), abilID);
    let dataRow = null;
    let found = false;
    if (isNaN(rowIndex)) {
      const isOptionalNotFound =
        (lowerWorkbookAbr === "mykl" && lowerSheetName === "knownabilities") ||
        (lowerWorkbookAbr === "db" && lowerSheetName === "gear");
      if (isOptionalNotFound) {
        if (lowerWorkbookAbr === "db" && lowerSheetName === "gear") {
          fMyConsoleLog(
            `       -> INFO: ID "${abilID}" not found in ${cacheKey}. Expected for non-gear.`
          );
        } else {
          fMyConsoleLog(
            `       -> ID "${abilID}" not found in ${cacheKey}. Expected/handled.`
          );
        }
      } else {
        fMyConsoleLog(
          `       -> ⚠️ ${funcName} Warning: ID "${abilID}" NOT found in ${cacheKey} or index invalid.`
        );
      }
      found = false;
      dataRow = null;
    } else {
      dataRow = targetCache.text[rowIndex];
      if (Array.isArray(dataRow)) {
        found = true;
        fMyConsoleLog(
          `       -> Successfully found row for ID "${abilID}" at index ${rowIndex} in ${cacheKey}.`
        );
      } else {
        fMyConsoleLog(
          `       -> ⚠️ ${funcName} Warning: Found index ${rowIndex} for ID "${abilID}", but data at index is not an array in ${cacheKey}.`
        );
        dataRow = null;
        found = false;
      }
    }
    const headerRow = targetCache.text?.[0] || [];
    const colTagsMap = targetCache.colTagsMap || {};
    return {
      dataRow: dataRow,
      headerRow: headerRow,
      colTagsMap: colTagsMap,
      found: found,
    };
  } // End function fHandleNewAbilitySelection

  /** function fSaveNewAbilityToAbilTbl
   * Purpose: Applies fetched data from various caches to the appropriate columns in a grid row.
   * Assumptions: Also sets default values and calculates derived gear properties.
   * @param {number} r - The target row index in the grid.
   * @param {object | null} dbAbilityResult - Result from DB Abilities fetch.
   * @param {object | null} klKnownAbilitiesResult - Result from KL KnownAbilities fetch.
   * @param {object | null} dbGearResult - Result from DB Gear fetch.
   * @returns {void}
   */
  function fSaveNewAbilityToAbilTbl(
    r,
    dbAbilityResult,
    klKnownAbilitiesResult,
    dbGearResult
  ) {
    const funcName = "fSaveNewAbilityToAbilTbl";
    fMyConsoleLog(
      `   -> ${funcName}: Applying fetched data to grid row ${r}...`
    );
    const dbAbilityRow = dbAbilityResult?.dataRow;
    const dbAbilityColTags = dbAbilityResult?.colTagsMap;
    const klKnownAbilitiesRow = klKnownAbilitiesResult?.dataRow;
    const klKnownAbilitiesColTags = klKnownAbilitiesResult?.colTagsMap;
    const dbGearRow = dbGearResult?.dataRow;
    const dbGearColTags = dbGearResult?.colTagsMap;
    const getValueFromSource = (sourceRow, sourceColTags, sourceTag) => {
      if (!sourceRow || !sourceColTags) return undefined;
      const sourceIndex = sourceColTags[sourceTag];
      if (
        sourceIndex !== undefined &&
        sourceIndex !== null &&
        sourceIndex < sourceRow.length
      ) {
        return sourceRow[sourceIndex];
      }
      return undefined;
    };
    const dataMappings = [
      {
        gridTag: "Sk1",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "FinalSk1",
      },
      {
        gridTag: "Sk2",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "FinalSk2",
      },
      {
        gridTag: "Ver",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Ver",
      },
      {
        gridTag: "Act",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Act",
      },
      {
        gridTag: "Dur",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Dur",
      },
      {
        gridTag: "Rng",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Rng",
      },
      {
        gridTag: "MetaCost",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Meta",
      },
      {
        gridTag: "Uses",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Uses",
      },
      {
        gridTag: "Regain",
        sourceRow: klKnownAbilitiesRow,
        sourceColTags: klKnownAbilitiesColTags,
        sourceTag: "Regain",
      },
      {
        gridTag: "Sk1Typ",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "SkTyp1",
      },
      {
        gridTag: "Sk2Typ",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "SkTyp2",
      },
      {
        gridTag: "Notes",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "Notes",
      },
      {
        gridTag: "Pic",
        sourceRow: dbAbilityRow,
        sourceColTags: dbAbilityColTags,
        sourceTag: "Pic",
      },
    ];
    fMyConsoleLog(`     -> Applying Ability/KnownAbilities mappings...`);
    dataMappings.forEach((map) => {
      const value = getValueFromSource(
        map.sourceRow,
        map.sourceColTags,
        map.sourceTag
      );
      if (value !== undefined) {
        fSetGridValue(r, map.gridTag, value);
      } else {
        fSetGridValue(r, map.gridTag, "");
      }
    });
    if (dbGearRow && dbGearColTags) {
      fMyConsoleLog(`     -> Applying Gear mappings and calculations...`);
      const possNameVal =
        getValueFromSource(dbGearRow, dbGearColTags, "Name_ID") ?? "";
      const isArtifactVal = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "IsArtifact"
      );
      const wornEncValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "WornEnc"
      );
      const itemEncValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "ItemEnc"
      );
      const crEachValRaw = getValueFromSource(
        dbGearRow,
        dbGearColTags,
        "ItemCR"
      );
      const apEachValRaw = getValueFromSource(dbGearRow, dbGearColTags, "AP");
      const possNumVal = 1;
      fSetGridValue(r, "PossNum", 1);
      fMyConsoleLog(`       -> Set possNumVal to: ${possNumVal}`);
      const isWornVal = true;
      fSetGridValue(r, "PossWorn", true);
      fMyConsoleLog(`       -> Set isWornVal: ${isWornVal}`);
      const wornEnc = Number(wornEncValRaw) || 0;
      const itemEnc = Number(itemEncValRaw) || 0;
      const encEachVal = isWornVal && wornEncValRaw !== "" ? wornEnc : itemEnc;
      const encTotalVal = possNumVal * encEachVal;
      fMyConsoleLog(
        `       -> Enc Calc: Worn=${isWornVal}, WornEnc=${wornEnc}, ItemEnc=${itemEnc} => EncEach=${encEachVal}, TotalEnc=${encTotalVal}`
      );
      const crEachVal = Number(crEachValRaw) || 0;
      const perOffVal = "";
      fSetGridValue(r, "PossPerOff", "");
      const crTotalVal = possNumVal * crEachVal;
      fMyConsoleLog(
        `       -> CR Calc: CREach=${crEachVal}, Num=${possNumVal}, PerOff=${perOffVal} => CRTotal=${crTotalVal}`
      );
      const apEachVal = Number(apEachValRaw) || 0;
      const apTotalVal = possNumVal * apEachVal;
      fMyConsoleLog(
        `       -> AP Calc: APEach=${apEachVal}, Num=${possNumVal} => APTotal=${apTotalVal}`
      );
      fSetGridValue(r, "PossName", possNameVal);
      fSetGridValue(r, "PossEnc", encTotalVal);
      fSetGridValue(r, "PossCrEa", crEachVal);
      fSetGridValue(r, "PossCrTot", crTotalVal);
      fSetGridValue(r, "PossIsArtifact", isArtifactVal);
      fSetGridValue(r, "PossAPEa", apEachVal);
      fSetGridValue(r, "PossAPTot", apTotalVal);
    } else {
      fMyConsoleLog(
        `     -> Clearing Gear-specific fields as item not found in DB Gear.`
      );
      const gearFieldsToClear = [
        "PossNum",
        "PossName",
        "PossWorn",
        "PossEnc",
        "PossCrEa",
        "PossPerOff",
        "PossCrTot",
        "PossIsArtifact",
        "PossAPEa",
        "PossAPTot",
      ];
      gearFieldsToClear.forEach((tag) => fSetGridValue(r, tag, ""));
      fSetGridValue(r, "PossWorn", false);
      fSetGridValue(r, "PossIsArtifact", false);
    }
    fMyConsoleLog(
      `   -> ${funcName}: Finished applying data to grid row ${r}.`
    );
    fHandleAutoSaveTextToFirestore();
  } // End function fSaveNewAbilityToAbilTbl

  /** function fHandleClearAbilityRow
   * Purpose: Clears relevant cells in a grid row when an ability is removed or changed.
   * Assumptions: The grid is rendered and `gUI.list` contains the column tags to be cleared.
   * @param {number} r - Row index to clear.
   * @param {boolean} [saveAbilityNameID=false] - If true, preserves the 'Ability' cell value.
   * @returns {void}
   */
  function fHandleClearAbilityRow(r, saveAbilityNameID = false) {
    const funcName = "fHandleClearAbilityRow";
    fMyConsoleLog(
      `   -> ${funcName}: Clearing row ${r}${
        saveAbilityNameID ? " (preserving Ability Name)" : ""
      }...`
    );
    gUI.list?.clearAbilityColTags_EmptyString?.forEach((tag) => {
      const c = fResolveCol(tag);
      if (isNaN(c)) return;
      if (tag === "Ability" && saveAbilityNameID) {
        fMyConsoleLog(
          `     -> Skipping clear for column '${tag}' due to saveAbilityNameID=true.`
        );
      } else if (tag === "Ability") {
        const abilityConfig = gUI.dropDownBox.find(
          (config) => config.gUIListKey === "myCSListFSData"
        );
        const cell = gUI.grid2D?.[r]?.[c];
        if (cell && abilityConfig) {
          const dropdown = fCreateDropdownElement(
            r,
            c,
            abilityConfig.choices,
            ""
          );
          cell.innerHTML = "";
          cell.appendChild(dropdown);
          cell.classList.remove("custom-ability-cell");
          cell.style.padding = "0";
          cell.style.overflow = "visible";
          gUI.arr[r][c] = "";
        } else {
          fSetGridValue(r, c, "");
        }
      } else {
        fSetGridValue(r, c, "");
      }
    });
    gUI.list?.clearAbilityColTags_False?.forEach((tag) => {
      fSetGridValue(r, tag, false);
    });
    fMyConsoleLog(
      `   -> ${funcName}: Finished attempting to clear relevant cells for row ${r}.`
    );
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleClearAbilityRow

  /** function fHandleAbilityNameEdit
   * Purpose: Processes the result from the ability name edit prompt.
   * Assumptions: Called after the promise from `function fShowInputPrompt` resolves.
   * @param {number} r - The 0-based row index of the edited cell.
   * @param {number} c - The 0-based column index of the edited cell.
   * @param {string | object | null} result - The result from the prompt.
   * @returns {void}
   */
  function fHandleAbilityNameEdit(r, c, result) {
    if (result === null) {
      fMyConsoleLog(`   -> User cancelled ability name edit for [${r}, ${c}].`);
      return;
    }
    const cell = gUI.grid2D?.[r]?.[c];
    if (!cell) return;
    if (typeof result === "object" && result.clear === true) {
      fMyConsoleLog(
        `   -> User chose to clear ability for [${r}, ${c}]. Clearing row...`
      );
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
      return;
    }
    const trimmedNewName = String(result).trim();
    if (trimmedNewName === "") {
      fMyConsoleLog(
        `   -> User saved an empty name for [${r}, ${c}]. Clearing row...`
      );
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
      return;
    }
    const finalValueToStore = "⚡" + trimmedNewName;
    fMyConsoleLog(
      `   -> User set new ability name for [${r}, ${c}] to: "${finalValueToStore}"`
    );
    gUI.arr[r][c] = finalValueToStore;
    cell.innerHTML = "";
    const textSpan = document.createElement("span");
    textSpan.textContent = finalValueToStore;
    cell.appendChild(textSpan);
    cell.classList.add("custom-ability-cell");
    cell.style.padding = "";
    cell.style.overflow = "";
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleAbilityNameEdit

  /** function fTransformAbilityCellToInput
   * Purpose: Transforms an 'Ability' cell into a contentEditable text input.
   * Assumptions: The cell element is a valid grid cell.
   * @param {HTMLElement} cell - The cell element to transform.
   * @returns {void}
   */
  function fTransformAbilityCellToInput(cell) {
    const funcName = "fTransformAbilityCellToInput";
    if (!cell || !cell.classList.contains("cell")) {
      console.warn(`${funcName}: Invalid cell element provided.`);
      return;
    }
    const selectElement = cell.querySelector("select.grid-dropdown");
    let currentText = "";
    if (selectElement) {
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      currentText = selectedOption ? selectedOption.textContent : "";
    } else {
      currentText = cell.textContent;
    }
    cell.innerHTML = "";
    cell.textContent = currentText;
    cell.contentEditable = true;
    cell.classList.add("left-align-text");
    cell.focus();
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(cell);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    fMyConsoleLog(
      `   -> Transformed cell [${cell.dataset.r}, ${cell.dataset.c}] to input.`
    );
  } // End function fTransformAbilityCellToInput

  /** function fShowValidationTooltip
   * Purpose: Displays a validation tooltip with allowed values for an editable cell.
   * Assumptions: `gUI.tooltipElement` and `gUI.validationLists` are available.
   * @param {HTMLElement} cell - The editable cell element.
   * @param {string} colTag - The column tag of the cell.
   * @param {MouseEvent} event - The dblclick event object for positioning.
   * @returns {void}
   */
  function fShowValidationTooltip(cell, colTag, event) {
    const funcName = "fShowValidationTooltip";
    if (!gUI.tooltipElement || !cell || !colTag || !event) return;
    let tooltipText = "<b>Allowed:</b> ";
    const validationList = gUI.validationLists?.[colTag];
    if (validationList && validationList.length > 0) {
      tooltipText += "Blank, " + validationList.join(", ");
      if (colTag === "Rng") {
        tooltipText += ", or any Integer ≥ 1";
      }
    } else if (colTag === "Sk1" || colTag === "Sk2") {
      tooltipText += "Blank or Integer ≥ 1";
    } else {
      console.warn(
        `${funcName}: No validation list found for tag '${colTag}'. Please check the 'MyCS/List' sheet for valid data under the corresponding header.`
      );
      return;
    }
    const tooltip = gUI.tooltipElement;
    tooltip.innerHTML = tooltipText;
    tooltip.style.visibility = "hidden";
    tooltip.style.display = "block";
    setTimeout(() => {
      if (document.activeElement !== cell) {
        tooltip.style.display = "none";
        tooltip.style.visibility = "visible";
        return;
      }
      fConfineNotesTooltipBox(tooltip, event);
      tooltip.style.visibility = "visible";
      cell.addEventListener("blur", fHideTooltip, { once: true });
      fMyConsoleLog(`   -> ${funcName}: Showing tooltip for '${colTag}'.`);
    }, 10);
  } // End function fShowValidationTooltip

  /** function fFlagAbilityAsCustom
   * Purpose: Flags a standard item as custom (⚡) when one of its data cells is modified.
   * Assumptions: Replaces the cell's dropdown with plain text.
   * @param {number} r - The 0-based row index of the item to flag.
   * @returns {void}
   */
  function fFlagAbilityAsCustom(r) {
    const funcName = "fFlagAbilityAsCustom";
    const abilityCol = tag.cs.game.c.Ability.index;
    if (typeof abilityCol !== "number") return;

    const cell = gUI.grid2D?.[r]?.[abilityCol];
    const currentName = String(gUI.arr[r]?.[abilityCol] ?? "");

    if (!cell || currentName.startsWith("⚡")) {
      return;
    }

    fMyConsoleLog(
      `   -> ${funcName}: Auto-flagging item in row ${r} as custom...`
    );

    const newCustomName = "⚡" + currentName;
    gUI.arr[r][abilityCol] = newCustomName;
    cell.innerHTML = "";
    cell.textContent = newCustomName;
    cell.style.padding = "";
    cell.style.overflow = "";
    fMyConsoleLog(`   -> Row ${r} name changed to: "${newCustomName}"`);
  } // End function fFlagAbilityAsCustom

  /** function fUpdateCustomDataIndicator
   * Purpose: Adds or removes the custom data indicator for blank cells with user-entered text or notes.
   * Assumptions: The cell at (r, c) exists in the DOM. Only applies to editable cells outside of defined tables.
   * @param {number} r - The 0-based row index of the cell.
   * @param {number} c - The 0-based column index of the cell.
   * @returns {void}
   */
  function fUpdateCustomDataIndicator(r, c) {
    const cell = gUI.grid2D?.[r]?.[c];
    if (!cell) return;
    if (cell.contentEditable === "true" && !fIsCellInAnyDefinedTable(r, c)) {
      const hasText = !!String(gUI.arr[r][c] ?? "").trim();
      const hasCustomNote = !!gUI.customNotes?.[r]?.[c]?.trim();
      if (hasText || hasCustomNote) {
        cell.classList.add("custom-data-cell");
      } else {
        cell.classList.remove("custom-data-cell");
      }
    } else {
      cell.classList.remove("custom-data-cell");
    }
  } // End function fUpdateCustomDataIndicator

  /** function fIsCellInAnyDefinedTable
   * Purpose: Checks if a cell's coordinates fall within any of the major defined table ranges.
   * Assumptions: `gUI.resolvedRanges` contains the necessary table range definitions.
   * @param {number} r - The 0-based row index of the cell.
   * @param {number} c - The 0-based column index of the cell.
   * @returns {boolean} True if the cell is inside a defined table, false otherwise.
   */
  function fIsCellInAnyDefinedTable(r, c) {
    const tableRanges = [
      ...(gUI.resolvedRanges?.abilityTable || []),
      ...(gUI.resolvedRanges?.gearTable || []),
      gUI.resolvedRanges?.monsters,
      gUI.resolvedRanges?.meta,
      gUI.resolvedRanges?.metaChannel,
      gUI.resolvedRanges?.luckBox,
      gUI.resolvedRanges?.luckBoxPlus,
      gUI.resolvedRanges?.actTotal,
      gUI.resolvedRanges?.actPlus,
      gUI.resolvedRanges?.vit1stTo3rd,
      gUI.resolvedRanges?.chaosGems,
      gUI.resolvedRanges?.socketedGear,
      {
        r1: tag.cs.game.r.GearMRTbl.index,
        c1: tag.cs.game.c.GearMRCol1.index,
        r2: tag.cs.game.r.GearCarryTbl.index,
        c2: tag.cs.game.c.GearMRCol6.index,
      },
    ];
    return fIsCellInRangeArray(r, c, tableRanges);
  } // End function fIsCellInAnyDefinedTable

   * Purpose: Toggles the visibility of the Roll Log sidebar.
   * Assumptions: The sidebar element with ID 'roll-log-sidebar' exists in the DOM.
   * Notes: Checks for the 'show' class to determine the current state and calls the appropriate handler.

  function fToggleSidebar() {

    if (!sidebar) {
      console.error(
        "fToggleSidebar: Cannot find sidebar element (#roll-log-sidebar) to toggle."
      );
      return;

    const isVisible = sidebar.classList.contains("show");
    if (isVisible) {

  /** function fPostToSidebar
   * Purpose: Prepends a message to the sidebar and the plain text log array.
   * Assumptions: The sidebar DOM element exists.
   * @param {string} htmlMessage - The HTML content to display in the sidebar.
   * @param {string | null} plainTextMessage - The plain text version for the log array. Defaults to a stripped version of htmlMessage.
   * @returns {void}
   */
  function fPostToSidebar(htmlMessage, plainTextMessage = null) {
    const sidebarContent = document.getElementById("sidebar-content");
    if (!sidebarContent) {
      console.error(
        "fPostToSidebar: Cannot find sidebar content element (#sidebar-content)."
      );
      return;
    }

    const placeholder = sidebarContent.querySelector("p");
    if (
      placeholder &&
      placeholder.textContent === "Roll log entries will appear here..."
    ) {
      placeholder.remove();
    }

    const newEntry = document.createElement("p");
    newEntry.innerHTML = htmlMessage;
    sidebarContent.prepend(newEntry);
    sidebarContent.scrollTop = 0;

    const textToLog =
      plainTextMessage !== null
        ? plainTextMessage
        : htmlMessage
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<[^>]+>/g, "")
            .trim();

    // Prepend the new entry to the start of the array to maintain correct order
    gUI.plainTextLogEntries.unshift(textToLog);

    fHandleAutoSaveTextToFirestore();
  } // End function fPostToSidebar

  /** function fPrep_SwitchActiveCheckbox
   * Purpose: Switches the active checkbox for an ability from Sk1 to Sk2.
   * Assumptions: This is a helper for fHandlePrepARClick and fHandlePrepDmgClick.
   * @param {number} abilityRowIndex - The 0-based row index of the ability.
   * @returns {Promise<boolean>} True if the switch was successful, false otherwise.
   */
  async function fPrep_SwitchActiveCheckbox(abilityRowIndex) {
    const funcName = "fPrep_SwitchActiveCheckbox";
    const originalSk1Col = tag.cs.game.c.Sk1ChkBox.index;
    const targetSk2Col = tag.cs.game.c.Sk2ChkBox.index;

    if (
      typeof originalSk1Col !== "number" ||
      typeof targetSk2Col !== "number"
    ) {
      const missingTag =
        typeof originalSk1Col !== "number" ? "Sk1ChkBox" : "Sk2ChkBox";
      await fShowMessage(
        `❌ Error: Could not resolve column tag '${missingTag}'.`
      );
      return false;
    }

    // Uncheck the original Sk1 box
    const oldCellDiv = gUI.grid2D?.[abilityRowIndex]?.[originalSk1Col];
    const oldCheckbox = oldCellDiv?.querySelector('input[type="checkbox"]');
    if (oldCheckbox && oldCheckbox.checked) {
      oldCheckbox.checked = false;
      gUI.arr[abilityRowIndex][originalSk1Col] = false;
    }

    // Check the new Sk2 box and update the global tracker
    const targetCellDiv = gUI.grid2D?.[abilityRowIndex]?.[targetSk2Col];
    const targetCheckbox = targetCellDiv?.querySelector(
      'input[type="checkbox"]'
    );
    if (targetCheckbox) {
      targetCheckbox.checked = true;
      gUI.arr[abilityRowIndex][targetSk2Col] = true;
      const { r: currentlyCheckedR, c: currentlyCheckedC } =
        gUI.currentSkRadioChecked;
      if (
        currentlyCheckedR !== null &&
        (currentlyCheckedR !== abilityRowIndex ||
          currentlyCheckedC !== targetSk2Col)
      ) {
        fUncheckOldSkGroupBox(currentlyCheckedR, currentlyCheckedC);
      }
      gUI.currentSkRadioChecked = { r: abilityRowIndex, c: targetSk2Col };
      fMyConsoleLog(
        `   -> Switched active checkbox to Sk2 at [${abilityRowIndex}, ${targetSk2Col}].`
      );
      return true;
    } else {
      await fShowMessage(
        "❌ Error: Could not find the target (Sk2) checkbox element."
      );
      return false;
    }
  } // End function fPrep_SwitchActiveCheckbox

  /** function fHandleApplyWoundsClick
   * Purpose: Handles clicks on the "Apply" wounds button in the sidebar.
   * Assumptions: Reads wound amount from the button's data attribute and applies it to 1st Degree Wounds.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleApplyWoundsClick(event) {
    const button = event.target;
    if (!button || !button.classList.contains("apply-wounds-btn")) {
      return;
    }
    fMyConsoleLog(`🖱️ Sidebar 'Apply Wounds' Button Clicked...`);
    if (button.disabled) {
      fMyConsoleLog("   -> Button already disabled. Ignoring click.");
      return;
    }
    button.disabled = true;
    button.textContent = "Applied";
    const woundAmountStr = button.dataset.woundAmount;
    const woundAmount = Number(woundAmountStr);
    if (isNaN(woundAmount) || woundAmount < 0) {
      console.error(`Invalid wound amount stored on button: ${woundAmountStr}`);
      fMyConsoleLog(
        `❌ Error applying wounds: Invalid amount '${woundAmountStr}'.`
      );
      await fShowMessage(
        "Error: Could not read a valid wound amount from the button."
      );
      return;
    }
    fMyConsoleLog(`   -> Wound Amount to Apply: ${woundAmount}`);
    const targetRowIndex = tag.cs.game.r.VitTbl.index;
    const targetColIndex = tag.cs.game.c.vit1st.index;
    let currentVit1st = fGetGridValue(targetRowIndex, targetColIndex, true);
    if (isNaN(currentVit1st)) {
      fMyConsoleLog(
        `   -> Warning: Current value in ('VitTbl', 'vit1st') is not a number. Treating as 0.`
      );
      currentVit1st = 0;
    }
    fMyConsoleLog(`   -> Current 1st Degree Wounds: ${currentVit1st}`);
    const newWoundValue = Math.round(currentVit1st + woundAmount);
    fMyConsoleLog(`   -> Calculated New 1st Degree Wounds: ${newWoundValue}`);
    if (!fSetGridValue(targetRowIndex, targetColIndex, newWoundValue)) {
      fMyConsoleLog(
        `❌ Error applying wounds: fSetGridValue failed for ('VitTbl', 'vit1st').`
      );
      await fShowMessage("Error: Failed to update the 1st Degree Wounds cell.");
      return;
    }
    fMyConsoleLog("   -> Recalculating Vit Now & Percent...");
    await fVitNowNPercent_Calc();
    fHandleAutoSaveTextToFirestore();
    fMyConsoleLog("✅ Wounds Applied Successfully.");
    await fShowMessage("✅ Wounds Applied Successfully.");
  } // End function fHandleApplyWoundsClick

  /** function fHandlePrepARClick
   * Purpose: Handles clicks on the "Prep AR" button in the sidebar.
   * Assumptions: Sets up the monster grid for an Armor (AR) roll based on defense failures.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandlePrepARClick(event) {
    const button = event.target;
    if (!button || !button.classList.contains("prep-ar-btn") || button.disabled)
      return;
    fMyConsoleLog(`🖱️ Sidebar 'Prep AR' Button Clicked...`);
    button.disabled = true;

    const rollId = button.dataset.rollId;
    const rollData = await fPrep_GetAndValidateRollData(button, rollId);
    if (!rollData) return;

    const {
      results: failureResults,
      originalAbilityRow,
      allTargetedRows_R,
    } = rollData;
    const cNumMon = fResolveCol("NumMon");
    if (isNaN(cNumMon)) {
      await fShowMessage(
        "❌ Error: Could not find the 'NumMon' column in the grid."
      );
      button.textContent = "Error";
      return;
    }

    const failureMap = new Map();
    failureResults.forEach((res) => failureMap.set(res.mon_R, res.numFailures));
    allTargetedRows_R.forEach((target_mon_R) => {
      const numFailures = failureMap.get(target_mon_R);
      const valueToSet = numFailures > 0 ? numFailures : "";
      fSetGridValue(target_mon_R, cNumMon, valueToSet);
    });

    const switchSuccess = await fPrep_SwitchActiveCheckbox(originalAbilityRow);
    if (switchSuccess) {
      button.textContent = "AR Prep Done";
      fHandleAutoSaveTextToFirestore();
      try {
        delete gUI.monsterRollResultsHistory[rollId];
      } catch (e) {}
    } else {
      button.textContent = "Done (CB Fail)";
    }
    fMyConsoleLog("✅ Prep AR action completed.");
  } // End function fHandlePrepARClick

  /** function fHandleNishButtonClick
   * Purpose: Handles the click event for the main 'Nish' button.
   * Assumptions: Sets state, checks the Nish checkbox, executes the Nish sequence, and triggers a roll.
   * @param {MouseEvent} event - The click event object.
   * @returns {void}
   */
  async function fHandleNishButtonClick(event) {
    fMyConsoleLog("🖱️ Nish Button Clicked...");
    if (event) event.stopPropagation();
    fCloseAllDropdowns();
    fSetButtonOrMenuState("Nish");

    const r = tag.cs.game.r.NishAtr_R.index;
    const c = tag.cs.game.c.Sk1ChkBox.index;

    if (typeof r !== "number" || typeof c !== "number") {
      console.error(
        `fHandleNishButtonClick: Could not resolve Nish checkbox coordinates.`
      );
      await fShowMessage(`❌ Error: Cannot find Nish checkbox definition.`);
      fSetButtonOrMenuState(null);
      return;
    }

    const currentChecked = gUI.currentSkRadioChecked;
    if (
      currentChecked.r !== null &&
      currentChecked.c !== null &&
      (currentChecked.r !== r || currentChecked.c !== c)
    ) {
      fUncheckOldSkGroupBox(currentChecked.r, currentChecked.c);
    }

    const nishCellDiv = gUI.grid2D?.[r]?.[c];
    const nishCheckbox = nishCellDiv?.querySelector(
      'input[data-sk-group="true"]'
    );

    if (nishCheckbox) {
      nishCheckbox.checked = true;
      gUI.arr[r][c] = true;
      gUI.currentSkRadioChecked = { r, c };
      fMyConsoleLog(
        `   -> Programmatically checked Nish checkbox [${r}, ${c}].`
      );
    } else {
      console.error(
        `fHandleNishButtonClick: Could not find Nish checkbox DOM element at [${r}, ${c}].`
      );
      await fShowMessage(`❌ Error: Cannot find Nish checkbox element.`);
      fSetButtonOrMenuState(null);
      return;
    }

    await fExecuteNishSequence();
    fMyConsoleLog("   -> Triggering fMain_AbilityRoll for Nish ability...");
    await fMain_AbilityRoll();
  } // End function fHandleNishButtonClick

  /** function fSetupMenuButtonListeners
   * Purpose -> Adds click event listeners to the main menu bar buttons, defining the logic for each click.
   * Assumptions: The button and dropdown elements exist in the DOM.
   * @param {HTMLElement} btnNish - The Nish button.
   * @param {HTMLElement} btnRoll - The Roll button.
   * @param {HTMLElement} btnFree - The Free button.
   * @param {HTMLElement} btnLuck - The Luck button.
   * @param {HTMLElement} btnGame - The Game menu button.
   * @param {HTMLElement} dropdownGame - The Game dropdown panel.
   * @param {HTMLElement} btnGear - The Gear menu button.
   * @param {HTMLElement} dropdownGear - The Gear dropdown panel.
   * @returns {void}
   */
  function fSetupMenuButtonListeners(
    btnNish,
    btnRoll,
    btnFree,
    btnLuck,
    btnGame,
    dropdownGame,
    btnGear,
    dropdownGear
  ) {
    btnNish.addEventListener("click", fHandleNishButtonClick);

    btnRoll.addEventListener("click", async (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Roll");

      const { r: lastClickR, c: lastClickC } = gUI.cellClickInfo;
      const { r: checked_r, c: checked_c } = gUI.currentSkRadioChecked;
      let handled = false;

      // Combine the specific ability and gear table ranges for a precise context check.
      const abilityContextRanges = [
        ...(gUI.range?.abilityTable || []),
        ...(gUI.range?.gearTable || []),
      ];

      if (lastClickR === null || lastClickC === null) {
        if (checked_r !== null) {
          fMyConsoleLog(
            "   -> <Roll> Click: No cell focus, but an ability is checked. Running ability roll..."
          );
          await fMain_AbilityRoll();
          handled = true;
        }
      } else {
        const isAbilityOrGearTableClick = fIsCellInRangeArray(
          lastClickR,
          lastClickC,
          abilityContextRanges
        );
        const isChaosTableClick = fIsCellInRangeArray(
          lastClickR,
          lastClickC,
          gUI.range.chaosGems
        );

        // --- Precedence 1: Ability/Gear Table Context ---
        if (isAbilityOrGearTableClick) {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Ability/Gear Table [${lastClickR}, ${lastClickC}]. Ad-hoc roll is disabled.`
          );
          if (checked_r !== null) {
            fMyConsoleLog(
              `   -> Active Sk checkbox found [${checked_r}, ${checked_c}]. Running ability roll...`
            );
            await fMain_AbilityRoll();
            handled = true;
          } else {
            await fShowMessage(
              "ℹ️ Please select an ability checkbox (Sk1 or Sk2) to roll."
            );
            handled = true;
            fSetButtonOrMenuState(null);
          }
        }
        // --- Precedence 2: Chaos Gem Context ---
        else if (isChaosTableClick) {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Chaos Gem Table [${lastClickR}, ${lastClickC}].`
          );
          handled = await fHandleChaosGemClick(lastClickR, lastClickC);
          if (handled) fSetButtonOrMenuState(null);
        }
        // --- Precedence 3: Ad-Hoc Context (with fallback) ---
        else {
          fMyConsoleLog(
            `   -> <Roll> Click: Context is Ad-Hoc [${lastClickR}, ${lastClickC}]. Attempting ad-hoc roll...`
          );
          const cellElement = gUI.grid2D?.[lastClickR]?.[lastClickC];
          if (cellElement) {
            const currentCellTextForAdHoc =
              cellElement.textContent?.trim() ?? "";
            gUI.cellClickInfo.focusText = currentCellTextForAdHoc;
            handled = await fHandleAdHocRoll(currentCellTextForAdHoc);

            if (!handled && checked_r !== null) {
              fMyConsoleLog(
                `   -> Ad-Hoc roll failed for "${currentCellTextForAdHoc}". Falling back to checked ability [${checked_r}, ${checked_c}].`
              );
              await fMain_AbilityRoll();
              handled = true;
            } else if (handled) {
              fSetButtonOrMenuState(null);
            }
          }
        }
      }

      if (!handled) {
        fMyConsoleLog(
          "   -> <Roll> Click: No valid action could be determined."
        );
        const adHocAttemptedButFailed = gUI.cellClickInfo.focusText !== null;
        if (adHocAttemptedButFailed) {
          await fShowMessage(
            `ℹ️ Nothing rollable found in cell "${
              gUI.cellClickInfo.focusText || ""
            }"`
          );
        } else {
          await fShowMessage(
            "ℹ️ Please click a cell to establish context for the roll, or check an ability box."
          );
        }
        fSetButtonOrMenuState(null);
      }
    });

    btnFree.addEventListener("click", (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Free");
      fMain_AbilityRoll();
    });

    btnLuck.addEventListener("click", (event) => {
      event.stopPropagation();
      fCloseAllDropdowns();
      fSetButtonOrMenuState("Luck");
      fMain_AbilityRoll();
    });

    btnGame.addEventListener("click", (event) => {
      event.stopPropagation();
      const currentlyShown = dropdownGame.classList.contains("show");
      fCloseAllDropdowns();
      if (!currentlyShown) {
        dropdownGame.classList.add("show");
      }
    });

    btnGear.addEventListener("click", (event) => {
      event.stopPropagation();
      const currentlyShown = dropdownGear.classList.contains("show");
      fCloseAllDropdowns();
      if (!currentlyShown) {
        dropdownGear.classList.add("show");
      }
    });
  } // End function fSetupMenuButtonListeners

  /** function fSetupMenuActionClickListener
   * Purpose: Sets up a single event listener on the menu bar to handle clicks on menu items.
   * Assumptions: Uses event delegation and `data-action` attributes.
   * @param {} - No parameters.
   * @returns {void}
   */
  function fSetupMenuActionClickListener() {
    const menuBar = document.getElementById("menu-bar");
    if (!menuBar) {
      console.error("Setup failed: Menu bar (#menu-bar) not found.");
      fMyConsoleLog(
        "❌ ERROR: Menu bar element not found for action listener setup."
      );
      return;
    }
    menuBar.addEventListener("click", (event) => {
      const target = event.target.closest("a[data-action]");
      if (!target) return;
      event.preventDefault();
      const action = target.dataset.action;
      fMyConsoleLog(`🎬 Menu Action Clicked: ${action}`);
      fCloseAllDropdowns();
      switch (action) {
        case "game-nishStartEnd":
          fHandleNishStartOrEnd();
          break;
        case "game-toggleSidebar":
          fToggleSidebar();
          break;
        case "game-togglePermMorphs":
          fTogglePermMorphColumns();
          break;
        case "game-updateLevelSlotName":
          fHandleNewLevelSlotName();
          break;
        case "game-gmAward":
          fHandleGMAward();
          break;
        case "game-metaFlood":
          fMetaFlood();
          break;
        case "game-healingNatural":
          fCalc_NaturalHealing();

  function fCloseAllDropdowns() {

  /** function fSetupSubMenuHover
   * Purpose: Sets up hover event listeners for all submenu items to manage their visibility.
   * Assumptions: Submenus have the class '.sub-menu-item'.
   * @param {HTMLElement} menuBar - The main menu bar container element.

   */
  function fSetupSubMenuHover(menuBar) {
    if (!menuBar) return;
    const subMenuItems = menuBar.querySelectorAll(".sub-menu-item");
    subMenuItems.forEach((item, index) => {
      fSetupSingleSubMenuItem(item, index);
    });

  /** function fSetupSingleSubMenuItem
   * Purpose: Attaches mouseenter/mouseleave listeners to a single submenu item to manage visibility.
   * Assumptions: The item contains a link and a submenu panel.
   * @param {HTMLElement} item - The submenu item element (.sub-menu-item).
   * @param {number} index - Index of the item (for logging/debugging).
   * @returns {void}
   */
  function fSetupSingleSubMenuItem(item, index) {
    const triggerLink = item.querySelector("a");
    const subMenuPanel = item.querySelector(".dropdown-content.sub-menu");
    const mainDropdown = item.closest(".dropdown-content:not(.sub-menu)");
    if (!subMenuPanel) return;
    if (!mainDropdown && triggerLink) {
      console.warn(
        `fSetupSingleSubMenuItem Item ${index} (${triggerLink?.textContent}): Could not find parent main dropdown!`
      );
    }
    item.addEventListener("mouseenter", () => {
      fClearSubMenuHideTimeout(subMenuPanel);
      if (mainDropdown) mainDropdown.style.overflowY = "visible";
      subMenuPanel.classList.add("show");
    });
    item.addEventListener("mouseleave", () => {
      fStartSubMenuHideTimeout(item, subMenuPanel, mainDropdown);
    });
    subMenuPanel.addEventListener("mouseenter", () => {
      fClearSubMenuHideTimeout(subMenuPanel);
    });
    subMenuPanel.addEventListener("mouseleave", () => {
      fStartSubMenuHideTimeout(item, subMenuPanel, mainDropdown);
    });
  } // End function fSetupSingleSubMenuItem

  /** function fStartSubMenuHideTimeout
   * Purpose: Sets a timeout to hide a submenu panel, managing parent overflow styles.
   * Assumptions: The submenu panel is currently visible or scheduled to be.
   * @param {HTMLElement} item - The submenu item element.
   * @param {HTMLElement} panel - The submenu panel element to hide.
   * @param {HTMLElement | null} mainDropdown - The parent dropdown panel element.
   * @param {number} [delayMs=250] - Delay in milliseconds before hiding.
   * @returns {void}
   */
  function fStartSubMenuHideTimeout(item, panel, mainDropdown, delayMs = 250) {
    fClearSubMenuHideTimeout(panel);
    const timeoutId = setTimeout(() => {
      if (mainDropdown && !fIsAnySiblingSubmenuOpen(item)) {
        mainDropdown.style.overflowY = "auto";
      }
      panel.classList.remove("show");
    }, delayMs);
    panel.dataset.hideTimeoutId = timeoutId;
  } // End function fStartSubMenuHideTimeout

  /** function fClearSubMenuHideTimeout
   * Purpose: Clears any active 'hide' timeout associated with a submenu panel.
   * Assumptions: The timeout ID is stored in the panel's dataset.
   * @param {HTMLElement} panel - The submenu panel element.
   * @returns {void}
   */
  function fClearSubMenuHideTimeout(panel) {
    const timeoutId = parseInt(panel.dataset.hideTimeoutId || "0");
    if (timeoutId) {
      clearTimeout(timeoutId);
      panel.dataset.hideTimeoutId = "";
    }
  } // End function fClearSubMenuHideTimeout

  /** function fIsAnySiblingSubmenuOpen
   * Purpose: Checks if any sibling submenu items have their panels open.
   * Assumptions: Open submenus have the 'show' class.
   * @param {HTMLElement} item - The reference submenu item element.
   * @returns {boolean} True if any sibling submenu is open, false otherwise.
   */
  function fIsAnySiblingSubmenuOpen(item) {
    const parent = item.parentElement;
    if (!parent) return false;
    const siblings = Array.from(parent.children).filter(
      (el) => el !== item && el.classList.contains("sub-menu-item")
    );
    return siblings.some((sibling) => {
      const siblingPanel = sibling.querySelector(".dropdown-content.sub-menu");
      return siblingPanel && siblingPanel.classList.contains("show");
    });
  } // End function fIsAnySiblingSubmenuOpen

  /** function fHandleAutoSaveTextToFirestore
   * Purpose: Orchestrates the saving of grid data and custom notes to Firestore.
   * Assumptions: `gUI.arr`, `gUI.customNotes`, `gIndex.CSID`, and `gIndex.Email` are populated.
   * Notes: This is the primary trigger for persisting user changes.
   * @returns {void}
   */
  function fHandleAutoSaveTextToFirestore() {
    fMyConsoleLog("💾 Handling Auto-Save Data (Grid & Custom Notes)...");
    if (!gUI.arr || !Array.isArray(gUI.arr) || gUI.arr.length === 0) {
      fMyConsoleLog("   -> No grid data (gUI.arr) found to save. Skipping.");
      return;
    }
    if (!gUI.customNotes || !Array.isArray(gUI.customNotes)) {
      fMyConsoleLog(
        "   -> No custom notes data (gUI.customNotes) found to save. Skipping."
      );
      return;
    }
    if (!gIndex.CSID || typeof gIndex.CSID !== "string") {
      console.error(
        "fHandleAutoSaveTextToFirestore: Missing gIndex.CSID on client."
      );
      fMyConsoleLog("   -> ❌ Auto-save aborted: Missing CS ID.");
      return;
    }
    if (!gIndex.Email || typeof gIndex.Email !== "string") {
      console.error(
        "fHandleAutoSaveTextToFirestore: Missing gIndex.Email on client."
      );
      fMyConsoleLog("   -> ❌ Auto-save aborted: Missing User Email.");
      return;
    }
    fMyConsoleLog(
      "   -> Calling server function fSrvSaveTurboDataToFirestore..."
    );
    google.script.run
      .withSuccessHandler(fHandleAutoSaveToFirestoreSuccess)
      .withFailureHandler(fHandleAutoSaveToFirestoreFailure)
      .fSrvSaveTurboDataToFirestore(gIndex, gUI.arr, gUI.customNotes, null);
  } // End function fHandleAutoSaveTextToFirestore

  /** function fHandleAutoSaveToFirestoreSuccess
   * Purpose: Handles the success callback for the Firestore save operation.
   * Assumptions: Called by `google.script.run`.
   * @param {object} result - The object returned from the server, expected to indicate success.
   * @returns {void}
   */
  function fHandleAutoSaveToFirestoreSuccess(result) {
    if (result && result.success) {
      fMyConsoleLog("   -> ✅ Auto-save successful (Server confirmed).");
    } else {
      fMyConsoleLog(
        "   -> ✅ Auto-save call completed (Server response did not explicitly indicate failure)."
      );

  } // End function fHandleAutoSaveToFirestoreSuccess

  /** function fHandleAutoSaveToFirestoreFailure
   * Purpose: Handles the failure callback for the Firestore save operation.
   * Assumptions: Called by `google.script.run`.
   * Notes: Logs the error but avoids showing a disruptive UI message for background saves.
   * @param {Error} error - The error object from the failed server call.

  function fHandleAutoSaveToFirestoreFailure(error) {

  /** function fSendLogToGMScreenAndPS
   * Purpose: Sends bundled log and header data sequentially to the GMScreen and PartyLog sheets via the server.
   * Assumptions: gUI state is populated. A lock (gUI.isSendingLog) prevents concurrent sends.
   * @returns {Promise<boolean>} Resolves true on success, false on failure or if skipped. Rejects on critical prep errors.
   */
  async function fSendLogToGMScreenAndPS() {
    if (gUI.isSendingLog) {
      fMyConsoleLog("📤 Log & Header send already in progress, skipping.");
      return false;
    }

    const slotNum = gUI.characterInfo?.slotNum;
    if (
      !slotNum ||
      typeof slotNum !== "string" ||
      !slotNum.startsWith("Slot")
    ) {
      const msg = `Cannot send Log & Headers: Invalid or missing slotNum ('${slotNum}').`;
      fMyConsoleLog(`📤 ${msg}`);
      return false;
    }

    gUI.isSendingLog = true;
    fMyConsoleLog(
      `📤 Preparing to send Log & Header data for ${slotNum} (Lock Acquired)...`
    );

    return new Promise((resolve, reject) => {
      try {
        // The gUI.plainTextLogEntries array is now pre-sorted (newest first).
        // No reversal is needed. Join with a separator that forces Google Sheets to render blank lines.
        const combinedLog = gUI.plainTextLogEntries.join("\n \n \n");

        const truncatedLog = combinedLog.substring(
          0,
          gUI.GMSCREEN_LOG_MAX_CHARS
        );
        fMyConsoleLog(
          `   -> Log Content Prepared (Entries: ${gUI.plainTextLogEntries.length}, Length: ${truncatedLog.length})`
        );

        const vitMax = fGetGridValue("VitTbl", "vitMax") ?? "?";
        const vitNow = fGetGridValue("VitTbl", "vitNow") ?? "?";
        const vitPercent = fGetGridValue("VitTbl", "VitNowPercent") ?? "?%";
        const vitString = `${vitNow} of ${vitMax} (${vitPercent})`;
        const nishValue = fGetGridValue("Nish", "Nish") ?? "";
        const { raceClass, level, playerName, charName } =
          gUI.characterInfo || {};
        const playerCharString = `${playerName || "?"} (${charName || "?"})`;
        const characterUrl =
          "https://docs.google.com/spreadsheets/d/" + gIndex.CSID + "/";

        const dataBundle = {
          log: truncatedLog,
          vit: vitString,
          nish: nishValue,
          url: characterUrl,
          raceClass: raceClass || "",
          level: level || "",
          playerChar: playerCharString,
          slotNum: slotNum,
        };

        fMyConsoleLog(
          `   -> Calling fSrvSaveURLtoNamesAndLogToDBandPS with bundled data...`
        );
        google.script.run
          .withSuccessHandler((success) => {
            if (success) {
              fMyConsoleLog(
                "   -> ✅ Log & Headers updated successfully on server targets."
              );
            } else {
              fMyConsoleLog(
                "   -> ⚠️ Log & Headers update partially failed on server. Check server logs."
              );
              fShowMessage(
                "⚠️ Warning: Update failed for one or more target sheets."
              ).catch((e) => console.error("Error showing message:", e));
            }
            gUI.isSendingLog = false;
            fMyConsoleLog("   -> Lock Released.");
            resolve(success);
          })
          .withFailureHandler((error) => {
            const errorMsg = error?.message || "Unknown server error";
            console.error(
              `fSendLogToGMScreenAndPS Failure: ${errorMsg}`,
              error
            );
            fMyConsoleLog(`   -> ❌ Error sending Log & Headers: ${errorMsg}`);
            gUI.isSendingLog = false;
            fMyConsoleLog("   -> Lock Released due to error.");
            fShowMessage(`❌ Error: Could not send updates: ${errorMsg}`).catch(
              (e) => console.error("Error showing message:", e)
            );
            resolve(false);
          })
          .fSrvSaveURLtoNamesAndLogToDBandPS(dataBundle);
      } catch (err) {
        console.error(
          "Synchronous error in fSendLogToGMScreenAndPS preparation:",
          err
        );
        fMyConsoleLog(
          `   -> ❌ Synchronous error preparing log send: ${err.message}`
        );
        gUI.isSendingLog = false;
        fMyConsoleLog("   -> Lock Released due to synchronous error.");
        reject(err);
      }
    });
  } // End function fSendLogToGMScreenAndPS

  /** function fFetchAndApplyUserFirestoreData
   * Purpose: Fetches and applies the user's saved gUI.arr and customNotes from Firestore.
   * Assumptions: Skips if user email or CSID are missing.
   * @returns {Promise<void>} Resolves after the Firestore check is complete.
   */
  async function fFetchAndApplyUserFirestoreData() {
    fMyConsoleLog(
      "⚙️ Checking Firestore for saved Grid (gUI.arr) and Custom Notes data..."
    );

    if (!gIndex.Email || !gIndex.CSID) {
      fMyConsoleLog(
        "   -> ⚠️ Skipping Firestore data check: Missing Email or CSID."
      );
      return;
    }

    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((firestoreResponse) => {
          if (firestoreResponse?.success) {
            if (firestoreResponse.firestoreArr) {
              fMyConsoleLog(
                "   -> ✅ Firestore Grid data found. Overwriting gUI.arr."
              );
              gUI.arr = firestoreResponse.firestoreArr;
            }
            if (firestoreResponse.customNotes) {
              fMyConsoleLog(
                "   -> ✅ Firestore Custom Notes found. Overwriting gUI.customNotes."
              );
              gUI.customNotes = firestoreResponse.customNotes;
            }
          } else {
            const reason = firestoreResponse?.message || "Reason unknown.";
            fMyConsoleLog(
              `   -> ℹ️ Firestore data check returned false (${reason}). Using template/Sheet data.`
            );
          }
          resolve();
        })
        .withFailureHandler((error) => {
          const errorMsg = `Error checking Firestore for data: ${error.message}`;
          console.error(errorMsg, error);
          fMyConsoleLog(
            `   -> ❌ ${errorMsg}. Using template/Sheet data as fallback.`
          );
          resolve(); // Resolve anyway to not halt the app on this failure
        })
        .fSrvCheckAndLoadFirestoreGUIarrAs2D(gIndex);
    });
  } // End function fFetchAndApplyUserFirestoreData

  /** function fOnCSGameDataLoaded
   * Purpose: Main controller for the application's data loading and rendering pipeline.
   * Assumptions: This is the primary success handler after the initial data fetch.
   * @param {object} response - The wrapper object from the server containing data and source info.
   * @returns {Promise<void>} Resolves after the entire load and render process is complete.

  async function fOnCSGameDataLoaded(response) {

    fInitializeCustomNotesArray();

  /** function fStoreAndValidateData
   * Purpose: Validates and stores the initial data payload from the server into the gUI object.
   * Assumptions: The data object has a specific structure.
   * @param {object} data - The data object received from the server { arr, format, notesArr }.
   * @returns {boolean} True if data is valid and stored, false otherwise.
   */
  function fStoreAndValidateData(data) {
    if (
      !data ||
      typeof data !== "object" ||
      !data.arr ||
      !data.format ||
      !data.notesArr ||
      data.error ||
      data instanceof Error
    ) {
      console.error("Error or invalid data structure received:", data);
      fMyConsoleLog("❌ Error or invalid data structure received.");
      return false;
    }
    gUI.arr = data.arr;
    gUI.format = data.format;
    gUI.notes = data.notesArr || [];
    if (gUI.arr.length === 0 || !gUI.arr[0] || gUI.arr[0].length === 0) {
      fMyConsoleLog("⚠️ Data array received is empty.");
      gUI.notes = [];
      return false;
    }
    const container = document.getElementById("grid");
    if (!container) {
      console.error("❌ Grid container #grid not found!");
      fMyConsoleLog("❌ Grid container #grid not found!");
      return false;
    }
    container.innerHTML = "";
    return true;
  } // End function fStoreAndValidateData

  /** function fInitializeCustomNotesArray
   * Purpose: Initializes gUI.customNotes with the same dimensions as gUI.arr.
   * Assumptions: This should be called after gUI.arr is populated.
   * Notes: Ensures the custom notes array always matches the grid structure.
   * @returns {void}
   */
  function fInitializeCustomNotesArray() {
    const numRows = gUI.arr?.length || 0;
    const numCols = gUI.arr?.[0]?.length || 0;
    if (numRows > 0 && numCols > 0) {
      gUI.customNotes = Array.from({ length: numRows }, () =>
        Array(numCols).fill("")
      );
      fMyConsoleLog(
        `   -> Initialized gUI.customNotes array with dimensions ${numRows}x${numCols}.`
      );
    } else {
      gUI.customNotes = [];
      fMyConsoleLog(
        "   -> gUI.arr is empty; gUI.customNotes initialized as empty array."
      );
    }
  } // End function fInitializeCustomNotesArray
