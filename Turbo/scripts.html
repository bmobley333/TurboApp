  /** function fCalculatesEnc_MR_AP
   * Purpose: Calculates Movement Rate (MR) and Carry Capacity, updates the grid, and recalculates total AP.
   * Assumptions: Relies on various values and range definitions in the gUI object.
   * Notes: This is a core calculation function triggered after gear or stat changes.
   * @returns {Promise<void>} Resolves when calculations and updates are complete.
   */
  async function fCalculatesEnc_MR_AP() {
    fMyConsoleLog("⚙️ Calculating Movement Rate and Encumbrance...");
    const movementMultipliers = [1, 0.9, 0.8, 0.65, 0.5, 0.25];
    const carryMultipliers = [1, 2, 4, 8, 12, 16];
    const mrColumnTags = [
      "GearMRCol1",
      "GearMRCol2",
      "GearMRCol3",
      "GearMRCol4",
      "GearMRCol5",
      "GearMRCol6",
    ];
    const MR_TABLE_ROW = "GearMRTbl";
    const CARRY_TABLE_ROW = "GearCarryTbl";
    const CHECKBOX_ROW = "GearMRCheckBox";
    let errorMsg = "";
    const agilityValue = fGetGridValue("Agi", "Sk1", true);
    const strengthValue = fGetGridValue("Str", "Sk1", true);
    const plusMRValue = fGetGridValue("GearPlusMR", "GearPlusMR", true) || 0;
    const plusCarryValue =
      fGetGridValue("GearPlusCarry", "GearPlusCarry", true) || 0;
    const currentEncumbrance = fCalcTotalEnc() || 0;
    if (isNaN(agilityValue))
      errorMsg += "Agility ('Agi', 'Sk1') is not a valid number. ";
    if (isNaN(strengthValue))
      errorMsg += "Strength ('Str', 'Sk1') is not a valid number. ";
    if (isNaN(currentEncumbrance))
      errorMsg +=
        "Current Encumbrance ('PossEncTot', 'PossEncTot') is not a valid number.";
    if (errorMsg) {
      console.error(
        `fCalculatesEnc_MR_AP: Input validation failed: ${errorMsg}`
      );
      fMyConsoleLog(`❌ MR/Enc Calc Failed: ${errorMsg}`);
      await fShowMessage(`❌ Error calculating MR/Enc: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(
      `   -> Inputs: Agi=${agilityValue}, Str=${strengthValue}, +MR=${plusMRValue}, +Carry=${plusCarryValue}, CurrentEnc=${currentEncumbrance}`
    );
    let updateSuccess = true;
    updateSuccess &&= fSetGridValue("GearSpe", "GearSpeAndStr", agilityValue);
    updateSuccess &&= fSetGridValue("GearStr", "GearSpeAndStr", strengthValue);
    if (!updateSuccess) {
      fMyConsoleLog(
        "   -> ⚠️ Warning: Failed to update GearSpe/GearStr overview cells."
      );
    }
    let foundActiveMRLevel = false;
    let finalMovementRate = 0;
    let calculationErrors = false;
    for (let i = 0; i < mrColumnTags.length; i++) {
      const colTag = mrColumnTags[i];
      const movementRate = Math.round(
        (6 + agilityValue / 5 + plusMRValue) * movementMultipliers[i]
      );
      const carryCapacity = Math.round(
        (50 + strengthValue + plusCarryValue) * carryMultipliers[i]
      );
      let mrSet = fSetGridValue(MR_TABLE_ROW, colTag, movementRate);
      let carrySet = fSetGridValue(CARRY_TABLE_ROW, colTag, carryCapacity);
      let cbSetInitial = fSetGridValue(CHECKBOX_ROW, colTag, false);
      if (!mrSet || !carrySet || !cbSetInitial) {
        fMyConsoleLog(
          `   -> ⚠️ Error setting MR/Carry/Checkbox values for column ${colTag}.`
        );
        calculationErrors = true;
      }
      if (!foundActiveMRLevel && currentEncumbrance <= carryCapacity) {
        fMyConsoleLog(
          `   -> Active MR Level Found: Col '${colTag}' (Enc ${currentEncumbrance} <= Carry ${carryCapacity})`
        );
        if (!fSetGridValue(CHECKBOX_ROW, colTag, true)) {
          fMyConsoleLog(
            `   -> ⚠️ Error setting Checkbox to TRUE for column ${colTag}.`
          );
          calculationErrors = true;
        } else {
          foundActiveMRLevel = true;
          finalMovementRate = movementRate;
          fMyConsoleLog(`   -> Final MR set to: ${finalMovementRate}`);
        }
      }
    }
    if (!fSetGridValue("MR", "MR", finalMovementRate)) {
      fMyConsoleLog("   -> ⚠️ Error setting final MR value in ('MR', 'MR').");
      calculationErrors = true;
    }
    if (!foundActiveMRLevel || finalMovementRate === 0) {
      fMyConsoleLog("   -> 🚨 Character is over-encumbered!");
      await fShowMessage("⚠️ You are over encumbered, MR is 0.");
    }
    fCalcTotalAP();
    if (calculationErrors) {
      fMyConsoleLog("❌ MR/Enc/AP Calc Completed with errors.");
    } else {
      fMyConsoleLog("✅ MR/Enc/AP Calc Completed successfully.");
    }
  } // End function fCalculatesEnc_MR_AP

  /** function fCalcTotalEnc
   * Purpose: Calculates total encumbrance from gear and updates the grid.
   * Assumptions: gUI.range.gearEncCol and gUI.range.currentEnc are defined.
   * Notes: Sums values from all defined encumbrance columns.
   * @returns {number} The calculated and rounded total encumbrance, or 0 on error.
   */
  function fCalcTotalEnc() {
    const funcName = "fCalcTotalEnc";
    fMyConsoleLog(`⚖️ Calculating Total Encumbrance...`);
    let totalEnc = 0;
    let errorsOccurred = false;
    const encRangeDefs = gUI.range?.gearEncCol;
    const targetCellDef = gUI.range?.currentEnc;
    if (!Array.isArray(encRangeDefs) || encRangeDefs.length === 0) {
      console.error(
        `${funcName}: Encumbrance source range definition (gUI.range.gearEncCol) is missing or invalid.`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Encumbrance source range definition missing.`
      );
      errorsOccurred = true;
    }
    if (
      !targetCellDef ||
      typeof targetCellDef.r1 === "undefined" ||
      typeof targetCellDef.c1 === "undefined"
    ) {
      console.error(
        `${funcName}: Target cell definition (gUI.range.currentEnc is "${gUI.range.currentEnc}") is missing or invalid (requires r1, c1).`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Target cell definition missing or invalid.`
      );
      errorsOccurred = true;
    }
    if (errorsOccurred) return 0;
    encRangeDefs.forEach((rangeDef, index) => {
      if (!fDoesObjectHaveR1C1R2C2Properties(rangeDef)) {
        console.warn(
          `${funcName}: Skipping invalid range object at index ${index}:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(rangeDef);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          `${funcName}: Skipping range at index ${index} due to unresolved indices:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          const value = fGetGridValue(r, c);
          const numericValue = Number(value) || 0;
          totalEnc += numericValue;
        }
      }
    });
    const roundedTotalEnc = Math.round(totalEnc * 100) / 100;
    fMyConsoleLog(
      `   -> Raw Total Enc: ${totalEnc}, Rounded: ${roundedTotalEnc}`
    );
    const targetR = fResolveRow(targetCellDef.r1);
    const targetC = fResolveCol(targetCellDef.c1);
    if (isNaN(targetR) || isNaN(targetC)) {
      console.error(
        `${funcName}: Could not resolve target cell coordinates from gUI.range.currentEnc:`,
        targetCellDef
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Could not resolve target cell coordinates.`
      );
      errorsOccurred = true;
    } else {
      if (!fSetGridValue(targetR, targetC, roundedTotalEnc)) {
        fMyConsoleLog(
          `   -> ⚠️ Warning: Failed to update target cell [${targetR}, ${targetC}] with total encumbrance.`
        );
        errorsOccurred = true;
      } else {
        fMyConsoleLog(
          `   -> Target cell [${targetR}, ${targetC}] updated with: ${roundedTotalEnc}`
        );
      }
    }
    fMyConsoleLog(
      `✅ ${funcName} finished ${
        errorsOccurred ? "with errors" : "successfully"
      }. Returning: ${roundedTotalEnc}`
    );
    return roundedTotalEnc;
  } // End function fCalcTotalEnc

  /** function fCalcTotalAP
   * Purpose: Calculates total Action Points from gear and updates the grid.
   * Assumptions: gUI.range.gearApTotalCol and gUI.range.gearAPTotal are defined.
   * Notes: Sums values from all defined AP Total columns.
   * @returns {number} The calculated total Action Points from gear, or 0 on error.
   */
  function fCalcTotalAP() {
    const funcName = "fCalcTotalAP";
    fMyConsoleLog(`⚙️ Calculating Total Action Points from Gear...`);
    let apTotal = 0;
    let errorsOccurred = false;
    const apSourceRangeDefs = gUI.range?.gearApTotalCol;
    const targetCellDef = gUI.range?.gearAPTotal;
    if (!Array.isArray(apSourceRangeDefs) || apSourceRangeDefs.length === 0) {
      console.error(
        `${funcName}: AP source range definition (gUI.range.gearApTotalCol) is missing or invalid.`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: AP source range definition missing.`
      );
      errorsOccurred = true;
    }
    if (
      !targetCellDef ||
      typeof targetCellDef.r1 === "undefined" ||
      typeof targetCellDef.c1 === "undefined"
    ) {
      console.error(
        `${funcName}: Target cell definition (gUI.range.gearAPTotal) is missing or invalid (requires r1, c1).`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Target cell definition missing or invalid.`
      );
      errorsOccurred = true;
    }
    if (errorsOccurred) return 0;
    apSourceRangeDefs.forEach((rangeDef, index) => {
      if (!fDoesObjectHaveR1C1R2C2Properties(rangeDef)) {
        console.warn(
          `${funcName}: Skipping invalid range object at index ${index}:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(rangeDef);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          `${funcName}: Skipping range at index ${index} due to unresolved indices:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          const value = fGetGridValue(r, c, true);
          if (!isNaN(value)) {
            apTotal += value;
          }
        }
      }
    });
    const roundedTotalAp = Math.round(apTotal);
    fMyConsoleLog(`   -> Raw Total AP: ${apTotal}, Rounded: ${roundedTotalAp}`);
    const targetR = fResolveRow(targetCellDef.r1);
    const targetC = fResolveCol(targetCellDef.c1);
    if (isNaN(targetR) || isNaN(targetC)) {
      console.error(
        `${funcName}: Could not resolve target cell coordinates from gUI.range.gearAPTotal:`,
        targetCellDef
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Could not resolve target cell coordinates.`
      );
      errorsOccurred = true;
    } else {
      if (!fSetGridValue(targetR, targetC, roundedTotalAp)) {
        fMyConsoleLog(

  /** function fTotalRereshOfAllAbilitiesAndAllGear
   * Purpose: Performs a full refresh of all non-custom Ability and Gear rows.
   * Assumptions: `gUI.range` and all necessary caches are populated.
   * Notes: Skips custom rows (⚡), clears invalid rows, and re-fetches data for valid rows.
   * @returns {Promise<void>} Resolves after the refresh is complete.
   */
  async function fTotalRereshOfAllAbilitiesAndAllGear() {
    const funcName = "fTotalRereshOfAllAbilitiesAndAllGear";
    fMyConsoleLog(`🔄 ${funcName}: Starting Full Ability/Gear Refresh...`);
    const abilityGearRanges = gUI.range?.entireAbilityNGearTables;
    const listCache = gUI.myCSListFSData;
    if (
      !Array.isArray(abilityGearRanges) ||
      abilityGearRanges.length === 0 ||
      !listCache
    ) {
      await fShowMessage(
        "Error: Cannot perform refresh due to missing cache or range definitions."
      );
      return;
    }
    const listCacheKey = "myCSListFSData";
    const listColTag = "AbilitiesNameID";
    const abilitiesNameIdColIndex = listCache.colTagsMap?.[listColTag];
    if (isNaN(abilitiesNameIdColIndex)) {
      await fShowMessage(
        `Error: Column tag '${listColTag}' not found in List cache.`
      );
      return;
    }
    let rowsProcessed = 0;
    let rowsCleared = 0;
    let rowsRefreshed = 0;
    for (const range of abilityGearRanges) {
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN))
        continue;
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      for (let r = rMin; r <= rMax; r++) {
        const abilityName = fGetGridValue(r, "Ability");
        if (typeof abilityName === "string" && abilityName.startsWith("⚡")) {
          fMyConsoleLog(
            `   -> Row ${r}: Skipping refresh for custom item "${abilityName}".`
          );
          continue;
        }
        rowsProcessed++;
        let rowShouldBeCleared = false;
        let abilID = null;
        const abilityNameId = fGetGridValue(r, "Ability");
        if (!abilityNameId) {
          const sk1Val = fGetGridValue(r, "Sk1");
          if (sk1Val) rowShouldBeCleared = true;
        } else {
          abilID = fGetIDFromNameID(abilityNameId);
          if (!abilID) {
            rowShouldBeCleared = true;
          } else {
            const foundInList = listCache.text.some(
              (row) => abilID === fGetIDFromNameID(row[abilitiesNameIdColIndex])
            );
            if (!foundInList) rowShouldBeCleared = true;
          }
        }
        if (rowShouldBeCleared) {
          fHandleClearAbilityRow(r);
          rowsCleared++;
          continue;
        }
        if (!abilID) continue;
        rowsRefreshed++;
        const dbAbilityResult = fHandleNewAbilitySelection(
          "DB",
          "Abilities",
          r,
          abilityNameId
        );
        const klKnownAbilitiesResult = fHandleNewAbilitySelection(
          "MyKL",
          "KnownAbilities",
          r,
          abilityNameId
        );
        const dbGearResult = fHandleNewAbilitySelection(
          "DB",
          "Gear",
          r,
          abilityNameId
        );
        if (dbAbilityResult && klKnownAbilitiesResult && dbGearResult) {
          fSaveNewAbilityToAbilTbl(
            r,
            dbAbilityResult,
            klKnownAbilitiesResult,
            dbGearResult
          );
        }
      }
    }
    fMyConsoleLog(
      `   -> Refresh loop complete. Triggering final calculations and save...`
    );
    await fCalculatesEnc_MR_AP();
    fHandleAutoSaveTextToFirestore();
    fMyConsoleLog(
      `✅ ${funcName} Complete. Processed: ${rowsProcessed}, Cleared: ${rowsCleared}, Refreshed: ${rowsRefreshed}.`
    );
  } // End function fTotalRereshOfAllAbilitiesAndAllGear

   * @param {object} response - The wrapper object from the server containing data and source info.
   * @returns {Promise<void>} Resolves after the entire load and render process is kicked off.
   */
  async function fOnCSGameDataLoaded(response) {
    const source = response?.source || "Unknown";
    if (source === "Firestore") {
      fMyConsoleLog("✅ Initial Game UI Data loaded from Firestore");
    } else {
      fMyConsoleLog("✅ Initial Game tab Data loaded from Google Sheets");
      const gameVerMajor = String(gIndex.GameVer).trim().split(".")[0];
      fMyConsoleLog(
        `💾 Creating and Saving "v${gameVerMajor} Game UI" to Firestore...`
      );
    }
    const dataPayload = response?.data;
    const isSheetDataValid = fStoreAndValidateData(dataPayload);
    if (!isSheetDataValid) {
      fMyConsoleLog("❌ Initial data invalid or empty. Halting load process.");
      fHideMessage();
      return;
    }
    fMyConsoleLog("   -> Stored initial data into gUI.");
    fInitializeCustomNotesArray();
    fMyConsoleLog(
      "⚙️ Checking Firestore for saved Grid (gUI.arr) and Custom Notes data..."
    );
    if (!gIndex.Email || !gIndex.CSID) {
      fMyConsoleLog(
        "   -> ⚠️ Skipping Firestore data check: Missing Email or CSID."
      );
      fSetupTooltipAndModal();
      fMyConsoleLog("   -> Proceeding to fetch background caches...");
      const cachesLoaded = await fBulkCacheFSData();
      if (cachesLoaded) {
        fRenderGridWithFinalData();
      } else {
        fMyConsoleLog(
          "❌ Background cache loading failed. Halting further rendering."
        );
        fHideMessage();
      }
      return;
    }
    google.script.run
      .withSuccessHandler(async (firestoreResponse) => {
        if (firestoreResponse?.success) {
          if (firestoreResponse.firestoreArr) {
            fMyConsoleLog(
              "   -> ✅ Firestore Grid data found. Overwriting gUI.arr."
            );
            gUI.arr = firestoreResponse.firestoreArr;
          }
          if (firestoreResponse.customNotes) {
            fMyConsoleLog(
              "   -> ✅ Firestore Custom Notes found. Overwriting gUI.customNotes."
            );
            gUI.customNotes = firestoreResponse.customNotes;
          }
        } else {
          const reason = firestoreResponse?.message || "Reason unknown.";
          fMyConsoleLog(
            `   -> ℹ️ Firestore data check returned false (${reason}). Using template/Sheet data.`
          );
        }
        fSetupTooltipAndModal();
        fMyConsoleLog("   -> Proceeding to fetch background caches...");
        const cachesLoaded = await fBulkCacheFSData();
        if (cachesLoaded) {
          fRenderGridWithFinalData();
        } else {
          fMyConsoleLog(
            "❌ Background cache loading failed. Halting further rendering."
          );
          fHideMessage();
        }
      })
      .withFailureHandler(async (error) => {
        const errorMsg = `Error checking Firestore for data: ${error.message}`;
        console.error(errorMsg, error);
        fMyConsoleLog(
          `   -> ❌ ${errorMsg}. Using template/Sheet data as fallback.`
        );
        fSetupTooltipAndModal();
        fMyConsoleLog(
          "   -> Proceeding to fetch background caches (Firestore check failed)..."
        );
        const cachesLoaded = await fBulkCacheFSData();
        if (cachesLoaded) {
          fRenderGridWithFinalData();
        } else {
          fMyConsoleLog(
            "❌ Background cache loading failed. Halting further rendering."
          );
          fHideMessage();
        }
      })
      .fSrvCheckAndLoadFirestoreGUIarrAs2D(gIndex);
  } // End function fOnCSGameDataLoaded

  /** function fCreateValidationListsFromCache
   * Purpose: Creates and caches lists of valid inputs for customizable data columns.
   * Assumptions: `gUI.myCSListFSData` is fully loaded and valid.
   * @returns {boolean} True if lists were created successfully, false otherwise.
   */
  function fCreateValidationListsFromCache() {
    const funcName = "fCreateValidationListsFromCache";
    fMyConsoleLog(`⚙️ ${funcName}: Caching validation lists...`);
    const listCache = gUI.myCSListFSData;
    if (
      !listCache ||
      !listCache.text ||
      !listCache.colTagsMap ||
      !listCache.rowTagsMap
    ) {
      fMyConsoleLog(
        `   -> ❌ ${funcName}: myCSListFSData cache is not available or invalid.`
      );
      return false;
    }
    const startRowTag = "TableFirstRow";
    const startRowIndex = listCache.rowTagsMap[startRowTag];
    if (typeof startRowIndex !== "number") {
      fMyConsoleLog(
        `   -> ❌ ${funcName}: Could not resolve start row tag '${startRowTag}'.`
      );
      return false;
    }
    const extractList = (colTag) => {
      const colIndex = listCache.colTagsMap[colTag];
      if (typeof colIndex !== "number") {
        fMyConsoleLog(
          `   -> ⚠️ ${funcName}: Could not resolve column tag '${colTag}'. Skipping list creation.`
        );
        return [];
      }
      const valueSet = new Set();
      for (let r = startRowIndex; r < listCache.text.length; r++) {
        const value = listCache.text[r]?.[colIndex];
        const trimmedValue = String(value ?? "").trim();
        if (trimmedValue) {
          valueSet.add(trimmedValue);
        }
      }
      return [...valueSet];
    };
    gUI.validationLists = {
      Sk1Typ: extractList("SkTyp"),
      Sk2Typ: extractList("SkTyp"),
      Act: extractList("Act"),
      Dur: extractList("Dur"),
      Rng: extractList("Rng"),
      Meta: extractList("Meta"),
    };
    fMyConsoleLog(
      `   -> ✅ Validation lists created for: ${Object.keys(
        gUI.validationLists
      ).join(", ")}`
    );
    return true;
  } // End function fCreateValidationListsFromCache

  /** function fBulkCacheFSData
   * Purpose: Loads all required background data caches in a single bulk request to the server.
   * Assumptions: `gUI.cachesToLoadOnStartup` is defined.
   * @param {string} [ignored=""] - Unused placeholder for signature stability.
   * @param {object} [opts={}] - Unused options placeholder.
   * @returns {Promise<boolean>} Resolves true if all critical caches were loaded, false otherwise.
   */
  function fBulkCacheFSData(ignored = "", opts = {}) {
    const log = (m) => fMyConsoleLog(m);
    return new Promise(async (resolve) => {
      try {
        log(
          "⚙️ fBulkCacheFSData: Requesting all background caches in a single call..."
        );
        const targets = gUI.cachesToLoadOnStartup || [];
        if (targets.length === 0) {
          log("   -> No caches defined. Skipping.");
          return resolve(true);
        }
        if (!window.google || !google.script || !google.script.run) {
          log(
            "   -> google.script.run not available. Skipping server cache checks."
          );
          return resolve(true);
        }
        const response = await new Promise((res, rej) => {
          google.script.run
            .withSuccessHandler(res)
            .withFailureHandler(rej)
            .fSrvGetRequiredCaches(targets, gIndex);
        });
        if (!response || !response.success || !response.caches) {
          throw new Error(
            response.message ||
              "Invalid or failed response from server bulk cache loader."
          );
        }
        log(
          "   -> ✅ Received bulk cache response from server. Populating gUI object..."
        );
        let allCriticalCachesLoaded = true;
        for (const target of targets) {
          const cacheData = response.caches[target.key];
          if (cacheData) {
            gUI[target.key] = cacheData;
            log(`      -> Loaded '${target.key}' into gUI.`);
          } else {
            log(
              `      -> ⚠️ WARNING: Cache for '${target.key}' was not returned from server.`
            );
            if (
              target.key.startsWith("myCS") ||
              target.key.startsWith("myKL")
            ) {
              allCriticalCachesLoaded = false;
              await fShowMessage(
                `❌ CRITICAL ERROR: Failed to load essential user cache: ${target.key}. Please reload.`
              );
            }
          }
        }
        if (!allCriticalCachesLoaded) {
          log(
            `   -> ❌ One or more critical user caches failed to load. Halting.`
          );
          return resolve(false);
        }
        if (gUI.myCSRaceClassFSData) {
          log("      -> Triggering fPopulateGuiCharacterInfo...");
          if (!fPopulateGuiCharacterInfo()) {
            log(`   -> ❌ Critical error populating character info. Halting.`);
            await fShowMessage(
              "❌ CRITICAL ERROR: Could not populate character info from cache."
            );
            return resolve(false);
          }
          log("         -> ✅ Successfully populated character info.");
        }
        if (!fCreateValidationListsFromCache()) {
          log(`   -> ❌ Critical error creating validation lists. Halting.`);
          await fShowMessage(
            `❌ CRITICAL ERROR: Could not create validation lists from cache.`
          );
          return resolve(false);
        }
        log("   -> ✅ Background cache loading completed.");
        resolve(true);
      } catch (e) {
        const errorMsg = `Critical error during fBulkCacheFSData: ${
          e.message || e
        }`;
        console.error(errorMsg, e);
        fMyConsoleLog(`❌ ${errorMsg}`);
        await fShowMessage(errorMsg);
        resolve(false);
      }
    });
  } // End function fBulkCacheFSData

  /** function fRefreshAndCacheOneFSData
   * Purpose: Refreshes a single cache from Firestore or Google Sheets.
   * Assumptions: Server functions for cache management exist.
   * Notes: Implements a fast path (read from FS) and a slow path (Sheet -> FS -> read from FS).
   * @param {string} workbookAbr - The workbook abbreviation ('DB', 'MyCS', 'MyKL').
   * @param {string} sheetName - The specific sheet name.
   * @param {string} gUIKey - The key in the gUI object where the cache data is stored.
   * @returns {Promise<boolean>} Resolves true on success, false on failure.
   */
  async function fRefreshAndCacheOneFSData(workbookAbr, sheetName, gUIKey) {
    const funcName = "fRefreshAndCacheOneFSData";
    const cacheDesc = `${gUIKey} (${workbookAbr}/${sheetName})`;
    if (!workbookAbr || !sheetName || !gUIKey) {
      const errorMsg = `Invalid input parameters provided to ${funcName}.`;
      console.error(`${funcName}: ${errorMsg}`, {
        workbookAbr,
        sheetName,
        gUIKey,
      });
      fMyConsoleLog(`❌ ${funcName}: ${errorMsg}`);
      await fShowMessage(errorMsg);
      return false;
    }
    fMyConsoleLog(`⚙️ ${funcName}: Starting refresh for ${cacheDesc}...`);
    try {
      let fsData = null;
      fMyConsoleLog(`   -> Checking if ${cacheDesc} exists in Firestore...`);
      const cacheExists = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .fSrvVerifyFirestorePathExists(workbookAbr, sheetName, gIndex);
      });
      if (cacheExists) {
        fMyConsoleLog(
          `   -> ✅ Cache exists. Reading directly from Firestore.`
        );
        try {
          const response = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvGetFirestoreFSData(workbookAbr, sheetName, gIndex);
          });
          if (response.success && response.FSData) {
            fsData = response.FSData;
            fMyConsoleLog(
              `      -> ✅ Successfully read ${cacheDesc} from Firestore.`
            );
          } else {
            throw new Error(
              response.message ||
                `Invalid FSData structure returned for ${cacheDesc}.`
            );
          }
        } catch (error) {
          throw new Error(
            `Failed to load cache ${cacheDesc}: ${
              error.message || "Unknown server error."
            }`
          );
        }
      } else {
        fMyConsoleLog(
          `   -> ℹ️ Cache not found in Firestore. Forcing refresh from Sheet...`
        );
        let loadedData = null;
        try {
          fMyConsoleLog(
            `      -> A. Loading Sheet: ${workbookAbr}/${sheetName}`
          );
          loadedData = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvLoadFullGoogleSheetAndTags(
                workbookAbr,
                sheetName,
                gIndex.CSID
              );
          });
          if (
            !loadedData ||
            !loadedData.ColTags ||
            !loadedData.RowTags ||
            !loadedData.sheetText2D
          ) {
            throw new Error(
              `Invalid data structure loaded from Sheet for ${workbookAbr}/${sheetName}.`
            );
          }
          fMyConsoleLog(
            `         -> ✅ Successfully loaded ${cacheDesc} from Sheet.`
          );
        } catch (error) {
          throw new Error(
            `Failed to load data from Sheet for ${cacheDesc}: ${
              error.message || "Unknown server error."
            }`
          );
        }
        try {
          fMyConsoleLog(`      -> B. 💾 Saving ${cacheDesc} to Firestore...`);
          const saveResult = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvSaveFullSheetTextAndTagsToFirestore(
                gIndex,
                workbookAbr,
                sheetName,
                loadedData
              );
          });
          if (!saveResult || !saveResult.success) {
            throw new Error(
              saveResult?.message ||
                `Unknown error saving ${cacheDesc} to Firestore.`
            );
          }
          fMyConsoleLog(
            `         -> ✅ Successfully saved ${cacheDesc} to Firestore.`
          );
        } catch (error) {
          throw new Error(
            `Failed to save ${cacheDesc} to Firestore: ${
              error.message || "Unknown server error."
            }`
          );
        }
        try {
          fMyConsoleLog(
            `      -> C. Reading ${cacheDesc} back from Firestore...`
          );
          const response = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvGetFirestoreFSData(workbookAbr, sheetName, gIndex);
          });
          if (response.success && response.FSData) {
            fsData = response.FSData;
            fMyConsoleLog(
              `         -> ✅ Successfully read ${cacheDesc} back from Firestore.`
            );
          } else {
            throw new Error(
              response.message ||
                `Invalid FSData structure returned for ${cacheDesc} after update.`
            );
          }
        } catch (error) {
          throw new Error(
            `Failed to read ${cacheDesc} from Firestore after update: ${
              error.message || "Unknown server error."
            }`
          );
        }
      }
      gUI[gUIKey] = fsData;
      fMyConsoleLog(`   -> Updated gUI cache key: ${gUIKey}`);
      if (gUIKey === "myCSRaceClassFSData") {
        fMyConsoleLog("      -> Triggering fPopulateGuiCharacterInfo...");
        const populateSuccess = fPopulateGuiCharacterInfo();
        if (!populateSuccess) {
          throw new Error(
            "Failed to populate gUI.characterInfo after updating RaceClass cache."
          );
        }
        fMyConsoleLog("         -> ✅ Successfully populated character info.");
      }
      fMyConsoleLog(`✅ ${funcName}: Successfully refreshed ${cacheDesc}.`);
      return true;
    } catch (error) {
      const errorMsg = `Error during ${funcName} for ${cacheDesc}: ${
        error.message || "Unknown error"
      }`;
      console.error(errorMsg, error);
      fMyConsoleLog(`❌ ${errorMsg}`);
      await fShowMessage(
        `❌ Error refreshing ${cacheDesc}:<br>${
          error.message || "Unknown error"
        }`
      );
      return false;
    }
  } // End function fRefreshAndCacheOneFSData

  /** function fPopulateGuiCharacterInfo
   * Purpose: Populates the `gUI.characterInfo` object from the `gUI.myCSRaceClassFSData` cache.
   * Assumptions: `gUI.myCSRaceClassFSData` has been loaded.
   * @returns {boolean} True if population is successful, false otherwise.
   */
  function fPopulateGuiCharacterInfo() {
    const funcName = "fPopulateGuiCharacterInfo";
    fMyConsoleLog(
      `   -> ${funcName}: Populating gUI.characterInfo from cache...`
    );
    const cacheKey = "myCSRaceClassFSData";
    const cache = gUI[cacheKey];
    if (!cache || !cache.text || !Array.isArray(cache.text)) {
      const errorMsg = `Cannot populate Character Info: Required cache ${cacheKey} is not loaded or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errorMsg}`);
      return false;
    }
    const requiredColTag = "Val";
    const colValIndex = fResolveFSDataCol(cacheKey, requiredColTag);
    const rowRCIndex = fResolveFSDataRow(cacheKey, "RC");
    const rowLevelIndex = fResolveFSDataRow(cacheKey, "level");
    const rowPlayerNameIndex = fResolveFSDataRow(cacheKey, "playerName");
    const rowCharNameIndex = fResolveFSDataRow(cacheKey, "charName");
    const rowSlotIndex = fResolveFSDataRow(cacheKey, "slot");
    const failedTags = [];
    if (isNaN(colValIndex)) failedTags.push("Val");
    if (isNaN(rowRCIndex)) failedTags.push("RC");
    if (isNaN(rowLevelIndex)) failedTags.push("level");
    if (isNaN(rowPlayerNameIndex)) failedTags.push("playerName");
    if (isNaN(rowCharNameIndex)) failedTags.push("charName");
    if (isNaN(rowSlotIndex)) failedTags.push("slot");
    if (failedTags.length > 0) {
      const errorMsg = `Cannot populate Character Info: Required tag(s) '${failedTags.join(
        ", "
      )}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errorMsg}`);
      return false;
    }
    fMyConsoleLog(`      -> All required tags resolved in ${cacheKey}.`);
    const rawRC = cache.text?.[rowRCIndex]?.[colValIndex];
    const rawLevel = cache.text?.[rowLevelIndex]?.[colValIndex];
    const rawPlayerName = cache.text?.[rowPlayerNameIndex]?.[colValIndex];
    const rawCharName = cache.text?.[rowCharNameIndex]?.[colValIndex];
    const rawSlot = cache.text?.[rowSlotIndex]?.[colValIndex];
    const raceClass = String(rawRC ?? "").trim();
    const level = String(rawLevel ?? "").trim();
    const playerName =
      String(rawPlayerName ?? "")
        .trim()
        .split(" ")[0] || "";
    const charName =
      String(rawCharName ?? "")
        .trim()
        .split(" ")[0] || "";
    let slotNum = null;
    const slotString = String(rawSlot ?? "").trim();
    const slotRegex = /^Slot\s+([1-9])$/i;
    const match = slotString.match(slotRegex);
    if (match && match[1]) {
      slotNum = `Slot${match[1]}`;
    } else if (slotString !== "") {
      fMyConsoleLog(
        `      -> ⚠️ ${funcName}: Invalid Slot format found in cache: "${slotString}". Storing null.`
      );
    }
    gUI.characterInfo = {
      slotNum: slotNum,
      raceClass: raceClass,
      level: level,
      playerName: playerName,
      charName: charName,
    };
    fMyConsoleLog(
      `   -> ✅ Successfully populated gUI.characterInfo: ${JSON.stringify(
        gUI.characterInfo
      )}`
    );
    return true;
  } // End function fPopulateGuiCharacterInfo

  /** function fStoreAndValidateData
   * Purpose: Validates and stores the initial data payload from the server into the gUI object.
   * Assumptions: The data object has a specific structure.
   * @param {object} data - The data object received from the server { arr, format, notesArr }.
   * @returns {boolean} True if data is valid and stored, false otherwise.
   */
  function fStoreAndValidateData(data) {
    if (
      !data ||
      typeof data !== "object" ||
      !data.arr ||
      !data.format ||
      !data.notesArr ||
      data.error ||
      data instanceof Error
    ) {
      console.error("Error or invalid data structure received:", data);
      fMyConsoleLog("❌ Error or invalid data structure received.");
      return false;
    }
    gUI.arr = data.arr;
    gUI.format = data.format;
    gUI.notes = data.notesArr || [];
    if (gUI.arr.length === 0 || !gUI.arr[0] || gUI.arr[0].length === 0) {
      fMyConsoleLog("⚠️ Data array received is empty.");
      gUI.notes = [];
      return false;
    }
    const container = document.getElementById("grid");
    if (!container) {
      console.error("❌ Grid container #grid not found!");
      fMyConsoleLog("❌ Grid container #grid not found!");
      return false;
    }
    container.innerHTML = "";
    return true;
  } // End function fStoreAndValidateData

  /** function fTransformAbilityCellToInput
   * Purpose: Transforms an 'Ability' cell into a contentEditable text input.
   * Assumptions: The cell element is a valid grid cell.
   * @param {HTMLElement} cell - The cell element to transform.
   * @returns {void}
   */
  function fTransformAbilityCellToInput(cell) {
    const funcName = "fTransformAbilityCellToInput";
    if (!cell || !cell.classList.contains("cell")) {
      console.warn(`${funcName}: Invalid cell element provided.`);
      return;
    }
    const selectElement = cell.querySelector("select.grid-dropdown");
    let currentText = "";
    if (selectElement) {
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      currentText = selectedOption ? selectedOption.textContent : "";
    } else {
      currentText = cell.textContent;
    }
    cell.innerHTML = "";
    cell.textContent = currentText;
    cell.contentEditable = true;
    cell.classList.add("left-align-text");
    cell.focus();
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(cell);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    fMyConsoleLog(
      `   -> Transformed cell [${cell.dataset.r}, ${cell.dataset.c}] to input.`
    );
  } // End function fTransformAbilityCellToInput

  /** function fShowValidationTooltip
   * Purpose: Displays a validation tooltip with allowed values for an editable cell.
   * Assumptions: `gUI.tooltipElement` and `gUI.validationLists` are available.
   * @param {HTMLElement} cell - The editable cell element.
   * @param {string} colTag - The column tag of the cell.
   * @param {MouseEvent} event - The dblclick event object for positioning.
   * @returns {void}
   */
  function fShowValidationTooltip(cell, colTag, event) {
    const funcName = "fShowValidationTooltip";
    if (!gUI.tooltipElement || !cell || !colTag || !event) return;
    let tooltipText = "<b>Allowed:</b> ";
    const validationList = gUI.validationLists?.[colTag];
    if (validationList && validationList.length > 0) {
      tooltipText += "Blank, " + validationList.join(", ");
      if (colTag === "Rng") {
        tooltipText += ", or any Integer ≥ 1";
      }
    } else if (colTag === "Sk1" || colTag === "Sk2") {
      tooltipText += "Blank or Integer ≥ 1";
    } else {
      console.warn(
        `${funcName}: No validation list found for tag '${colTag}'. Please check the 'MyCS/List' sheet for valid data under the corresponding header.`
      );
      return;
    }
    const tooltip = gUI.tooltipElement;
    tooltip.innerHTML = tooltipText;
    tooltip.style.visibility = "hidden";
    tooltip.style.display = "block";
    setTimeout(() => {
      if (document.activeElement !== cell) {
        tooltip.style.display = "none";
        tooltip.style.visibility = "visible";
        return;
      }
      fConfineNotesTooltipBox(tooltip, event);
      tooltip.style.visibility = "visible";
      cell.addEventListener("blur", fHideTooltip, { once: true });
      fMyConsoleLog(`   -> ${funcName}: Showing tooltip for '${colTag}'.`);
    }, 10);
  } // End function fShowValidationTooltip

  /** function fHandleGridDblClick
   * Purpose: Handles the delegated 'dblclick' event to enable editing for specific cells.
   * Assumptions: The grid and its cells have correct data attributes.
   * @param {MouseEvent} event - The dblclick event object.
   * @returns {void}
   */
  async function fHandleGridDblClick(event) {
    const cell = event.target.closest(".cell");
    if (!cell) return;
    const r = parseInt(cell.dataset.r, 10);
    const c = parseInt(cell.dataset.c, 10);
    if (isNaN(r) || isNaN(c)) return;
    const editableCols = [
      "Ability",
      "Sk1Typ",
      "Sk1",
      "Sk2Typ",
      "Sk2",
      "Act",
      "Dur",
      "Rng",
      "Meta",
    ];
    const colTag = Object.keys(gUI.colTag).find((tag) => gUI.colTag[tag] === c);
    if (!editableCols.includes(colTag)) {
      return;
    }
    event.preventDefault();
    if (colTag === "Ability") {
      fMyConsoleLog(`⚡ Edit Name Prompt triggered for cell [${r}, ${c}]`);
      const currentName = String(gUI.arr[r]?.[c] ?? "")
        .replace(/^⚡\s*/, "")
        .trim();
      try {
        const result = await fShowInputPrompt(
          "Enter new custom ability/gear name:",
          currentName
        );
        fHandleAbilityNameEdit(r, c, result);
      } catch (error) {
        console.error("Error showing input prompt:", error);
      }
    } else {
      const abilityName = fGetGridValue(r, "Ability");
      if (!String(abilityName || "").trim()) {
        fShowMessage("⚠️ Empty ability name. Please edit a named ability.");
        return;
      }
      fMyConsoleLog(`⚡ Edit Mode triggered for ${colTag} cell [${r}, ${c}]`);
      fTransformAbilityCellToInput(cell);
      fShowValidationTooltip(cell, colTag, event);
    }
  } // End function fHandleGridDblClick

  /** function fHandleAbilityNameEdit
   * Purpose: Processes the result from the ability name edit prompt.
   * Assumptions: Called after the promise from `function fShowInputPrompt` resolves.
   * @param {number} r - The 0-based row index of the edited cell.
   * @param {number} c - The 0-based column index of the edited cell.
   * @param {string | object | null} result - The result from the prompt.
   * @returns {void}
   */
  function fHandleAbilityNameEdit(r, c, result) {
    if (result === null) {
      fMyConsoleLog(`   -> User cancelled ability name edit for [${r}, ${c}].`);
      return;
    }
    const cell = gUI.grid2D?.[r]?.[c];
    if (!cell) return;
    if (typeof result === "object" && result.clear === true) {
      fMyConsoleLog(
        `   -> User chose to clear ability for [${r}, ${c}]. Clearing row...`
      );
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
      return;
    }
    const trimmedNewName = String(result).trim();
    if (trimmedNewName === "") {
      fMyConsoleLog(
        `   -> User saved an empty name for [${r}, ${c}]. Clearing row...`
      );
      fHandleClearAbilityRow(r);
      fCalculatesEnc_MR_AP();
      return;
    }
    const finalValueToStore = "⚡" + trimmedNewName;
    fMyConsoleLog(
      `   -> User set new ability name for [${r}, ${c}] to: "${finalValueToStore}"`
    );
    gUI.arr[r][c] = finalValueToStore;
    cell.innerHTML = "";
    const textSpan = document.createElement("span");
    textSpan.textContent = finalValueToStore;
    cell.appendChild(textSpan);
    cell.classList.add("custom-ability-cell");
    cell.style.padding = "";
    cell.style.overflow = "";
    fHandleAutoSaveTextToFirestore();
  } // End function fHandleAbilityNameEdit

  /** function fHandleGridKeyDown
   * Purpose: Handles 'keydown' events on the grid to confirm edits with the Enter key.
   * Assumptions: The event target is within the grid.
   * @param {KeyboardEvent} event - The keydown event object.
   * @returns {void}
   */
  function fHandleGridKeyDown(event) {
    if (event.key !== "Enter") return;
    const cell = event.target.closest('.cell[contenteditable="true"]');
    if (cell) {
      event.preventDefault();
      cell.blur();
    }
  } // End function fHandleGridKeyDown

  /** function fRunPostRenderFormatting
   * Purpose: Orchestrates all post-render formatting and setup steps for the grid.
   * Assumptions: `gUI.grid2D` is populated with DOM elements.
   * @param {string} [parameter1=""] - Unused placeholder for signature stability.
   * @param {object} [parameter2={}] - Unused options placeholder.
   * @returns {boolean} True on completion.
   */
  function fRunPostRenderFormatting(parameter1 = "", parameter2 = {}) {
    fMyConsoleLog("🚀 Applying Post-Render Formatting...");
    fApplyGridDynamicMerges();
    fAddGridsHeaderRowButtons();
    fResizeHeaderButtonImages("", { scale: 0.9, minPx: 16, maxPx: 64 });
    fApplyGridManualBorders();
    fApplyGridColAndRowInitialVisibility();
    fApplyGridManualColoring();
    fApplySpecialAlignments();
    fSetTurbosGridHeaderRows();
    fApplyInitialCustomDataIndicators();
    fApplyDropdownsToGrid();
    fFetchAndApplyAbilityDropdowns();
    fClearSk1Sk2Checkboxes();
    const gridElement = document.getElementById("grid");
    fAttachGridListeners(gridElement);
    if (fModalElementsAvailable()) {
      fSetupModalListeners();
    }
    fCalculatesEnc_MR_AP();
    setTimeout(() => fMarkGridOverflowingCells(), 500);
    fMyConsoleLog("✅ All Post-Render Formatting Done!");
    fHideMessage();
    return true;
  } // End function fRunPostRenderFormatting

  /** function fLoadGameSheet
   * Purpose: Initiates the process of loading and displaying the game sheet data.
   * Assumptions: `gIndex.CSID` is available.
   * @returns {void}
   */
  function fLoadGameSheet() {
    gUI.startTime = performance.now();
    gUI.lastLogTime = gUI.startTime;
    fMyConsoleLog("🚀 Requesting GSheet Data...");
    console.log("Sheet ID:", gIndex.CSID);
    if (!gIndex.CSID) {
      const errorMsg = "❌ No Sheet ID found. Cannot load data.";
      console.error(errorMsg);
      fMyConsoleLog(errorMsg);
      const gridDiv = document.getElementById("grid");
      if (gridDiv)
        gridDiv.innerHTML = `<p style="color:red;">${errorMsg} Check URL parameter.</p>`;
      fHideMessage();
      return;
    }
    google.script.run
      .withSuccessHandler(fOnCSGameDataLoaded)
      .withFailureHandler((error) => {
        const errorMsg = `❌ Failed to call server: ${error.message}`;
        console.error(errorMsg, error);
        fMyConsoleLog(errorMsg);
        const gridDiv = document.getElementById("grid");
        if (gridDiv)
          gridDiv.innerHTML = `<p style="color:red;">${errorMsg}</p>`;
        fHideMessage();
      })
      .fSrvGetInitialGridData(gIndex);
  } // End function fLoadGameSheet

  /**
   * Purpose: Main entry point for client-side script execution.
   * Assumptions: The DOM is fully loaded and parsed.
   * Notes: Kicks off data loading and sets up all initial UI event listeners.
   */
  window.addEventListener("DOMContentLoaded", () => {
    fShowMessageNoClose(
      "⏳ Turbo is Loading...<br><br>This may take a minute.<br><br>Please wait."
    );
    fLoadGameSheet();
    fSetupMenuInteractivity();
    fSetupMessageModalListeners();
    fSetupPromptModalListeners();
    fSetupInputPromptModalListeners();
    fSetupCustomNoteModalListeners();
    fSetupSidebarActionListeners();
  }); // End DOMContentLoaded listener

  /** function fBootstrapClientRuntime
   * Purpose: Performs lightweight, non-blocking, client-side setup on script load.
   * Assumptions: The basic DOM structure exists.
   * Notes: Caches the tooltip element and initializes performance timers.
   * @returns {void}
   */
  (function fBootstrapClientRuntime() {
    try {
      gUI.startTime =
        typeof performance !== "undefined" ? performance.now() : Date.now();
      gUI.lastLogTime = gUI.startTime;
      gUI.tooltipElement = document.getElementById("cell-tooltip") || null;
      fMyConsoleLog("✅ Client bootstrap complete.");
    } catch (e) {
      console.error("Bootstrap error:", e);
    }
  })(); // End fBootstrapClientRuntime
</script>
