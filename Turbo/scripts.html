   * Purpose: Loads all required background data caches in a single bulk request to the server.
   * Assumptions: `gUI.cachesToLoadOnStartup` is defined.
   * @param {string} [ignored=""] - Unused placeholder for signature stability.
   * @param {object} [opts={}] - Unused options placeholder.
   * @returns {Promise<boolean>} Resolves true if all critical caches were loaded, false otherwise.
   */
  function fBulkCacheFSData(ignored = "", opts = {}) {
    const log = (m) => fMyConsoleLog(m);
    return new Promise(async (resolve) => {
      try {
        log(
          "⚙️ fBulkCacheFSData: Requesting all background caches in a single call..."
        );
        const targets = gUI.cachesToLoadOnStartup || [];
        if (targets.length === 0) {
          log("   -> No caches defined. Skipping.");
          return resolve(true);
        }
        if (!window.google || !google.script || !google.script.run) {
          log(
            "   -> google.script.run not available. Skipping server cache checks."
          );
          return resolve(true);
        }
        const response = await new Promise((res, rej) => {
          google.script.run
            .withSuccessHandler(res)
            .withFailureHandler(rej)
            .fSrvGetRequiredCaches(targets, gIndex);
        });
        if (!response || !response.success || !response.caches) {
          throw new Error(
            response.message ||
              "Invalid or failed response from server bulk cache loader."
          );
        }
        log(
          "   -> ✅ Received bulk cache response from server. Populating gUI object..."
        );
        let allCriticalCachesLoaded = true;
        for (const target of targets) {
          const cacheData = response.caches[target.key];
          if (cacheData) {
            gUI[target.key] = cacheData;
            log(`      -> Loaded '${target.key}' into gUI.`);
          } else {
            log(
              `      -> ⚠️ WARNING: Cache for '${target.key}' was not returned from server.`
            );
            if (
              target.key.startsWith("myCS") ||
              target.key.startsWith("myKL")
            ) {
              allCriticalCachesLoaded = false;
              await fShowMessage(
                `❌ CRITICAL ERROR: Failed to load essential user cache: ${target.key}. Please reload.`
              );
            }
          }
        }
        if (!allCriticalCachesLoaded) {
          log(
            `   -> ❌ One or more critical user caches failed to load. Halting.`
          );
          return resolve(false);
        }
        if (gUI.myCSRaceClassFSData) {
          log("      -> Triggering fPopulateGuiCharacterInfo...");
          if (!fPopulateGuiCharacterInfo()) {
            log(`   -> ❌ Critical error populating character info. Halting.`);
            await fShowMessage(
              "❌ CRITICAL ERROR: Could not populate character info from cache."
            );
            return resolve(false);
          }
          log("         -> ✅ Successfully populated character info.");
        }
        if (!fCreateValidationListsFromCache()) {
          log(`   -> ❌ Critical error creating validation lists. Halting.`);
          await fShowMessage(
            `❌ CRITICAL ERROR: Could not create validation lists from cache.`
          );
          return resolve(false);
        }
        log("   -> ✅ Background cache loading completed.");
        resolve(true);
      } catch (e) {
        const errorMsg = `Critical error during fBulkCacheFSData: ${
          e.message || e
        }`;
        console.error(errorMsg, e);
        fMyConsoleLog(`❌ ${errorMsg}`);
        await fShowMessage(errorMsg);
        resolve(false);
      }
    });
  } // End function fBulkCacheFSData

  /** function fRefreshAndCacheOneFSData
   * Purpose: Refreshes a single cache from Firestore or Google Sheets.
   * Assumptions: Server functions for cache management exist.
   * Notes: Implements a fast path (read from FS) and a slow path (Sheet -> FS -> read from FS).
   * @param {string} workbookAbr - The workbook abbreviation ('DB', 'MyCS', 'MyKL').
   * @param {string} sheetName - The specific sheet name.
   * @param {string} gUIKey - The key in the gUI object where the cache data is stored.
   * @returns {Promise<boolean>} Resolves true on success, false on failure.
   */
  async function fRefreshAndCacheOneFSData(workbookAbr, sheetName, gUIKey) {
    const funcName = "fRefreshAndCacheOneFSData";
    const cacheDesc = `${gUIKey} (${workbookAbr}/${sheetName})`;
    if (!workbookAbr || !sheetName || !gUIKey) {
      const errorMsg = `Invalid input parameters provided to ${funcName}.`;
      console.error(`${funcName}: ${errorMsg}`, {
        workbookAbr,
        sheetName,
        gUIKey,
      });
      fMyConsoleLog(`❌ ${funcName}: ${errorMsg}`);
      await fShowMessage(errorMsg);
      return false;
    }
    fMyConsoleLog(`⚙️ ${funcName}: Starting refresh for ${cacheDesc}...`);
    try {
      let fsData = null;
      fMyConsoleLog(`   -> Checking if ${cacheDesc} exists in Firestore...`);
      const cacheExists = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .fSrvVerifyFirestorePathExists(workbookAbr, sheetName, gIndex);
      });
      if (cacheExists) {
        fMyConsoleLog(
          `   -> ✅ Cache exists. Reading directly from Firestore.`
        );
        try {
          const response = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvGetFirestoreFSData(workbookAbr, sheetName, gIndex);
          });
          if (response.success && response.FSData) {
            fsData = response.FSData;
            fMyConsoleLog(
              `      -> ✅ Successfully read ${cacheDesc} from Firestore.`
            );
          } else {
            throw new Error(
              response.message ||
                `Invalid FSData structure returned for ${cacheDesc}.`
            );
          }
        } catch (error) {
          throw new Error(
            `Failed to load cache ${cacheDesc}: ${
              error.message || "Unknown server error."
            }`
          );
        }
      } else {
        fMyConsoleLog(
          `   -> ℹ️ Cache not found in Firestore. Forcing refresh from Sheet...`
        );
        let loadedData = null;
        try {
          fMyConsoleLog(
            `      -> A. Loading Sheet: ${workbookAbr}/${sheetName}`
          );
          loadedData = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvLoadFullGoogleSheetAndTags(
                workbookAbr,
                sheetName,
                gIndex.CSID
              );
          });
          if (
            !loadedData ||
            !loadedData.ColTags ||
            !loadedData.RowTags ||
            !loadedData.sheetText2D
          ) {
            throw new Error(
              `Invalid data structure loaded from Sheet for ${workbookAbr}/${sheetName}.`
            );
          }
          fMyConsoleLog(
            `         -> ✅ Successfully loaded ${cacheDesc} from Sheet.`
          );
        } catch (error) {
          throw new Error(
            `Failed to load data from Sheet for ${cacheDesc}: ${
              error.message || "Unknown server error."
            }`
          );
        }
        try {
          fMyConsoleLog(`      -> B. 💾 Saving ${cacheDesc} to Firestore...`);
          const saveResult = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvSaveFullSheetTextAndTagsToFirestore(
                gIndex,
                workbookAbr,
                sheetName,
                loadedData
              );
          });
          if (!saveResult || !saveResult.success) {
            throw new Error(
              saveResult?.message ||
                `Unknown error saving ${cacheDesc} to Firestore.`
            );
          }
          fMyConsoleLog(
            `         -> ✅ Successfully saved ${cacheDesc} to Firestore.`
          );
        } catch (error) {
          throw new Error(
            `Failed to save ${cacheDesc} to Firestore: ${
              error.message || "Unknown server error."
            }`
          );
        }
        try {
          fMyConsoleLog(
            `      -> C. Reading ${cacheDesc} back from Firestore...`
          );
          const response = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .fSrvGetFirestoreFSData(workbookAbr, sheetName, gIndex);
          });
          if (response.success && response.FSData) {
            fsData = response.FSData;
            fMyConsoleLog(
              `         -> ✅ Successfully read ${cacheDesc} back from Firestore.`
            );
          } else {
            throw new Error(
              response.message ||
                `Invalid FSData structure returned for ${cacheDesc} after update.`
            );
          }
        } catch (error) {
          throw new Error(
            `Failed to read ${cacheDesc} from Firestore after update: ${
              error.message || "Unknown server error."
            }`
          );
        }
      }
      gUI[gUIKey] = fsData;
      fMyConsoleLog(`   -> Updated gUI cache key: ${gUIKey}`);
      if (gUIKey === "myCSRaceClassFSData") {
        fMyConsoleLog("      -> Triggering fPopulateGuiCharacterInfo...");
        const populateSuccess = fPopulateGuiCharacterInfo();
        if (!populateSuccess) {
          throw new Error(
            "Failed to populate gUI.characterInfo after updating RaceClass cache."
          );
        }
        fMyConsoleLog("         -> ✅ Successfully populated character info.");
      }
      fMyConsoleLog(`✅ ${funcName}: Successfully refreshed ${cacheDesc}.`);
      return true;
    } catch (error) {
      const errorMsg = `Error during ${funcName} for ${cacheDesc}: ${
        error.message || "Unknown error"
      }`;
      console.error(errorMsg, error);
      fMyConsoleLog(`❌ ${errorMsg}`);
      await fShowMessage(
        `❌ Error refreshing ${cacheDesc}:<br>${
          error.message || "Unknown error"
        }`
      );
      return false;
    }
  } // End function fRefreshAndCacheOneFSData

  /** function fPopulateGuiCharacterInfo
   * Purpose: Populates the `gUI.characterInfo` object from the `gUI.myCSRaceClassFSData` cache.
   * Assumptions: `gUI.myCSRaceClassFSData` has been loaded.
   * @returns {boolean} True if population is successful, false otherwise.
   */
  function fPopulateGuiCharacterInfo() {
    const funcName = "fPopulateGuiCharacterInfo";
    fMyConsoleLog(
      `   -> ${funcName}: Populating gUI.characterInfo from cache...`
    );
    const cacheKey = "myCSRaceClassFSData";
    const cache = gUI[cacheKey];
    if (!cache || !cache.text || !Array.isArray(cache.text)) {
      const errorMsg = `Cannot populate Character Info: Required cache ${cacheKey} is not loaded or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errorMsg}`);
      return false;
    }
    const requiredColTag = "Val";
    const colValIndex = fResolveFSDataCol(cacheKey, requiredColTag);
    const rowRCIndex = fResolveFSDataRow(cacheKey, "RC");
    const rowLevelIndex = fResolveFSDataRow(cacheKey, "level");
    const rowPlayerNameIndex = fResolveFSDataRow(cacheKey, "playerName");
    const rowCharNameIndex = fResolveFSDataRow(cacheKey, "charName");
    const rowSlotIndex = fResolveFSDataRow(cacheKey, "slot");
    const failedTags = [];
    if (isNaN(colValIndex)) failedTags.push("Val");
    if (isNaN(rowRCIndex)) failedTags.push("RC");
    if (isNaN(rowLevelIndex)) failedTags.push("level");
    if (isNaN(rowPlayerNameIndex)) failedTags.push("playerName");
    if (isNaN(rowCharNameIndex)) failedTags.push("charName");
    if (isNaN(rowSlotIndex)) failedTags.push("slot");
    if (failedTags.length > 0) {
      const errorMsg = `Cannot populate Character Info: Required tag(s) '${failedTags.join(
        ", "
      )}' not found or invalid in ${cacheKey} maps.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`      -> ❌ ${funcName} Error: ${errorMsg}`);
      return false;
    }
    fMyConsoleLog(`      -> All required tags resolved in ${cacheKey}.`);
    const rawRC = cache.text?.[rowRCIndex]?.[colValIndex];
    const rawLevel = cache.text?.[rowLevelIndex]?.[colValIndex];
    const rawPlayerName = cache.text?.[rowPlayerNameIndex]?.[colValIndex];
    const rawCharName = cache.text?.[rowCharNameIndex]?.[colValIndex];
    const rawSlot = cache.text?.[rowSlotIndex]?.[colValIndex];
    const raceClass = String(rawRC ?? "").trim();
    const level = String(rawLevel ?? "").trim();
    const playerName =
      String(rawPlayerName ?? "")
        .trim()
        .split(" ")[0] || "";
    const charName =
      String(rawCharName ?? "")
        .trim()
        .split(" ")[0] || "";
    let slotNum = null;
    const slotString = String(rawSlot ?? "").trim();
    const slotRegex = /^Slot\s+([1-9])$/i;
    const match = slotString.match(slotRegex);
    if (match && match[1]) {
      slotNum = `Slot${match[1]}`;
    } else if (slotString !== "") {
      fMyConsoleLog(
        `      -> ⚠️ ${funcName}: Invalid Slot format found in cache: "${slotString}". Storing null.`
      );
    }
    gUI.characterInfo = {
      slotNum: slotNum,
      raceClass: raceClass,
      level: level,
      playerName: playerName,
      charName: charName,
    };
    fMyConsoleLog(
      `   -> ✅ Successfully populated gUI.characterInfo: ${JSON.stringify(
        gUI.characterInfo
      )}`
    );
    return true;
  } // End function fPopulateGuiCharacterInfo

  /** function fCreateValidationListsFromCache
   * Purpose: Creates and caches lists of valid inputs for customizable data columns.
   * Assumptions: `gUI.myCSListFSData` is fully loaded and valid.
   * @returns {boolean} True if lists were created successfully, false otherwise.
   */
  function fCreateValidationListsFromCache() {
    const funcName = "fCreateValidationListsFromCache";
    fMyConsoleLog(`⚙️ ${funcName}: Caching validation lists...`);
    const listCache = gUI.myCSListFSData;
    if (
      !listCache ||
      !listCache.text ||
      !listCache.colTagsMap ||
      !listCache.rowTagsMap
    ) {
      fMyConsoleLog(
        `   -> ❌ ${funcName}: myCSListFSData cache is not available or invalid.`
      );
      return false;
    }
    const startRowTag = "TableFirstRow";
    const startRowIndex = listCache.rowTagsMap[startRowTag];
    if (typeof startRowIndex !== "number") {
      fMyConsoleLog(
        `   -> ❌ ${funcName}: Could not resolve start row tag '${startRowTag}'.`
      );
      return false;
    }
    const extractList = (colTag) => {
      const colIndex = listCache.colTagsMap[colTag];
      if (typeof colIndex !== "number") {
        fMyConsoleLog(
          `   -> ⚠️ ${funcName}: Could not resolve column tag '${colTag}'. Skipping list creation.`
        );
        return [];
      }
      const valueSet = new Set();
      for (let r = startRowIndex; r < listCache.text.length; r++) {
        const value = listCache.text[r]?.[colIndex];
        const trimmedValue = String(value ?? "").trim();
        if (trimmedValue) {
          valueSet.add(trimmedValue);
        }
      }
      return [...valueSet];
    };
    gUI.validationLists = {
      Sk1Typ: extractList("SkTyp"),
      Sk2Typ: extractList("SkTyp"),
      Act: extractList("Act"),
      Dur: extractList("Dur"),
      Rng: extractList("Rng"),
      Meta: extractList("Meta"),
    };
    fMyConsoleLog(
      `   -> ✅ Validation lists created for: ${Object.keys(
        gUI.validationLists
      ).join(", ")}`
    );
    return true;
  } // End function fCreateValidationListsFromCache

  /** function fRenderGridWithFinalData
   * Purpose: Initiates the grid rendering process after all data is finalized.
   * Assumptions: `gUI.arr` has been fully populated.
   * @returns {void}
   */
  function fRenderGridWithFinalData() {
    fMyConsoleLog("🚀 Initiating Final Grid Render...");
    if (!gUI.arr || gUI.arr.length === 0) {
      fMyConsoleLog("❌ Cannot render grid: gUI.arr is empty or invalid.");
      const gridDiv = document.getElementById("grid");
      if (gridDiv)
        gridDiv.innerHTML =
          '<p style="color:red;">Critical error loading grid data. Please check configuration or reload.</p>';
      fHideMessage();
      return;
    }
    fRenderTurbosFullGrid(() => {
      fRunPostRenderFormatting();
    });
  } // End function fRenderGridWithFinalData

  /**
   * Purpose: Main entry point for client-side script execution.
   * Assumptions: The DOM is fully loaded and parsed.
   * Notes: Kicks off data loading and sets up all initial UI event listeners.
   */
  window.addEventListener("DOMContentLoaded", () => {
    fShowMessageNoClose(
      "⏳ Turbo is Loading...<br><br>This may take a minute.<br><br>Please wait."
    );
    fLoadGameSheet();
    fSetupMenuInteractivity();
    fSetupMessageModalListeners();
    fSetupPromptModalListeners();
    fSetupInputPromptModalListeners();
    fSetupCustomNoteModalListeners();
    fSetupSidebarActionListeners();
  }); // End DOMContentLoaded listener
</script>
