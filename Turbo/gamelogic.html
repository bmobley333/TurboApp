  /** function fMetaFlood
   * Purpose: Handles the "Meta Flood" menu action.
   * Assumptions: gUI.range.meta and gUI.list.metaFull are correctly defined.
   * Notes: Randomly selects a Meta column, increases its value and preceding values, caps them, and logs.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fMetaFlood() {
    fMyConsoleLog("⚙️ Menu Action: Meta Flood...");
    const metaRangeDef = gUI.range?.meta;
    const metaCaps = gUI.list?.metaFull;
    const metaColorTags = gUI.list?.metaColor;
    let errorMsg = "";
    if (!metaRangeDef || !fDoesObjectHaveR1C1R2C2Properties(metaRangeDef))
      errorMsg = "Meta range definition missing or invalid.";
    else if (!Array.isArray(metaCaps) || metaCaps.length === 0)
      errorMsg = "Meta caps list (gUI.list.metaFull) missing or invalid.";
    if (errorMsg) {
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const metaRowTag = metaRangeDef.r1;
    const startCol = fResolveCol(metaRangeDef.c1);
    const endCol = fResolveCol(metaRangeDef.c2);
    if ([startCol, endCol].some(isNaN)) {
      errorMsg = `Could not resolve Meta column tags: ${metaRangeDef.c1}, ${metaRangeDef.c2}.`;
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const numMetaCols = Math.abs(endCol - startCol) + 1;
    if (metaCaps.length > 0 && numMetaCols !== metaCaps.length) {
      errorMsg = `Mismatch between number of Meta columns (${numMetaCols}) and Meta caps (${metaCaps.length}).`;
      console.warn(`fMetaFlood: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Flood failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const selectedIndex = Math.floor(Math.random() * numMetaCols);
    const selectedColIndex = startCol + selectedIndex;
    const selectedColTag =
      metaColorTags?.[selectedIndex] ?? `Index ${selectedIndex}`;
    fMyConsoleLog(
      `   -> Selected Meta Index: ${selectedIndex} (Column ${selectedColIndex} - Tag: ${selectedColTag})`
    );
    const finalValues = [];
    let amountToAdd = 1;
    for (let i = selectedIndex; i >= 0; i--) {
      const currentColIndex = startCol + i;
      const currentColTag = metaColorTags?.[i] ?? `Index ${i}`;
      const currentVal = fGetGridValue(metaRowTag, currentColIndex, true) || 0;
      const newValRaw = currentVal + amountToAdd;
      const cap =
        metaCaps && metaCaps[i] !== undefined ? metaCaps[i] : Infinity;
      const finalVal = Math.min(newValRaw, cap);
      fMyConsoleLog(
        `      -> Index ${i} (${currentColTag}): Current=${currentVal}, Add=${amountToAdd}, Raw=${newValRaw}, Cap=${
          cap === Infinity ? "N/A" : cap
        } => Final=${finalVal}`
      );
      finalValues.unshift(finalVal);
      amountToAdd++;
    }
    fMyConsoleLog(
      `   -> Updating Meta columns ${startCol} to ${selectedColIndex} with final values: [${finalValues.join(
        ", "
      )}]`
    );
    const success = fSetRangeOfGridValues(
      metaRowTag,
      startCol,
      metaRowTag,
      selectedColIndex,
      finalValues
    );
    if (!success) {
      errorMsg = `fSetRangeOfGridValues failed to update Meta grid.`;
      fMyConsoleLog(`   -> ⚠️ Meta Flood Error: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
    } else {
      fMyConsoleLog("✅ Meta Flood Update Complete.");
      const sidebarMsgHtml = `<span class="blue-bold">ℹ️ Meta Flood (Rolled ${selectedColTag}):</span>`;
      const sidebarMsgText = `ℹ️ Meta Flood (Rolled ${selectedColTag}):`;
      fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
      fShowSidebar();
      setTimeout(() => fSendLogToGMScreenAndPS(), 0);
    }
  } // End function fMetaFlood

  /** function fMetaChannel

   * Notes: Randomly selects a Meta Channel column, increments its value, updates the grid, and logs the action.

    const channelRangeDef = gUI.range?.metaChannel;
    const metaColorTags = gUI.list?.metaColor;
    let errorMsg = "";
    if (!channelRangeDef || !fDoesObjectHaveR1C1R2C2Properties(channelRangeDef))

      console.warn(`fMetaChannel: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Meta Channel failed: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const channelRowTag = channelRangeDef.r1;
    const startCol = fResolveCol(channelRangeDef.c1);
    const endCol = fResolveCol(channelRangeDef.c2);
    if ([startCol, endCol].some(isNaN)) {
      errorMsg = `Could not resolve Meta Channel column tags: ${channelRangeDef.c1}, ${channelRangeDef.c2}.`;

  /** function fIsOn_NewNishSet
   * Purpose: Processes the 'Is On' / 'Duration' columns at the start of a Nish turn.
   * Assumptions: gUI.range.isONDur contains valid range definitions.
   * Notes: Decrements positive integer durations by 1 and clears specific non-numeric states (e.g., 'i', 'p').
   * @returns {Promise<void>} Resolves after processing all defined ranges.
   */
  async function fIsOn_NewNishSet() {
    fMyConsoleLog("⚙️ Processing 'Is On/Duration' cells for Nish turn...");
    const rangeDefs = gUI.range?.isONDur;
    if (!Array.isArray(rangeDefs) || rangeDefs.length === 0) {
      fMyConsoleLog(
        "⚠️ Cannot process 'Is On': Range definitions missing or empty in gUI.range.isONDur."
      );
      return;
    }
    let cellsProcessed = 0;
    let cellsChanged = 0;
    let errorsEncountered = false;
    for (const range of rangeDefs) {
      if (!fDoesObjectHaveR1C1R2C2Properties(range)) {
        console.warn("fIsOn_NewNishSet: Skipping invalid range object", range);
        errorsEncountered = true;
        continue;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(range);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          "fIsOn_NewNishSet: Skipping range due to unresolved indices",
          range
        );
        errorsEncountered = true;
        continue;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          cellsProcessed++;
          const currentValue = fGetGridValue(r, c);
          let newValue = currentValue;
          if (currentValue === null || typeof currentValue === "undefined") {
            newValue = "";
          } else {
            const currentValueStrLower = String(currentValue).toLowerCase();
            if (
              currentValueStrLower === "i" ||
              currentValueStrLower === "p" ||
              currentValueStrLower === "n"
            ) {
              newValue = "";
            } else {
              const numericValue = Number(currentValue);
              if (!isNaN(numericValue)) {
                if (numericValue > 0) {
                  newValue = numericValue - 1;
                  if (newValue === 0) {
                    newValue = "";
                  }
                } else if (numericValue === 0) {
                  newValue = "";
                }
              }
            }
          }
          if (newValue !== currentValue) {
            if (fSetGridValue(r, c, newValue)) {
              cellsChanged++;
            } else {
              errorsEncountered = true;
            }
          }
        }
      }
    }
    fMyConsoleLog(
      `✅ 'Is On/Duration' Processing Complete. Processed: ${cellsProcessed}, Changed: ${cellsChanged}${
        errorsEncountered ? " (with errors)" : ""
      }.`
    );
  } // End function fIsOn_NewNishSet

    const gearRanges = gUI.gearTblCols;
    if (!Array.isArray(gearRanges) || gearRanges.length === 0) {
      console.error(
        "fToggleGearColumns: gUI.gearTblCols is not a valid array or is empty."
      );
      fMyConsoleLog("❌ Error: Gear column definition missing or invalid.");
      return;
    }
    let isCurrentlyVisible = false;
    for (const range of gearRanges) {
      if (
        !range ||
        typeof range.c1 === "undefined" ||
        typeof range.c2 === "undefined"
      ) {
        console.warn(
          "fToggleGearColumns: Skipping invalid range object:",
          range
        );
        continue;
      }
      const startCol = fResolveCol(range.c1);
      const endCol = fResolveCol(range.c2);
      if (isNaN(startCol) || isNaN(endCol)) {
        console.warn(
          `fToggleGearColumns: Skipping gear range due to invalid tags/indices: ${range.c1}, ${range.c2}`
        );
        continue;
      }
      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);
      for (let c = cMin; c <= cMax; c++) {
        if (!gUI.hiddenColumns.has(c)) {
          isCurrentlyVisible = true;
          break;
        }
      }
      if (isCurrentlyVisible) break;
    }
    if (isCurrentlyVisible) {
      fMyConsoleLog("⚙️ Toggling Gear: Currently Visible -> Hiding...");
      fHideGridsColumnRange(gearRanges);
    } else {
      fMyConsoleLog("⚙️ Toggling Gear: Currently Hidden -> Showing...");
      fShowGridsColumnRange(gearRanges);
    }
  } // End function fToggleGearColumns

    if (

    const roll1 = fdRoll(maxGemColorIndexBase + 1);
    const roll2 = fdRoll(maxGemColorIndexBase + 1);
    const maxGemColorIndex = Math.min(roll1, roll2) - 1;
    fMyConsoleLog(
      `   -> Base Max Index=${maxGemColorIndexBase}. Rolls=(${roll1}, ${roll2}). Final Max Index=${maxGemColorIndex} (${socketColors[maxGemColorIndex]}).`
    );
    const eligibleGems = [];
    for (let r = dataFirst_R_idx; r <= dataLast_R_idx; r++) {
      const rowData = critCache.text[r];
      if (!Array.isArray(rowData)) continue;
      const gemColor = String(rowData[gemColor_C] ?? "").toUpperCase();
      const gemDesc = String(rowData[gemDesc_C] ?? "").trim();
      const gemColorIndex = socketColors.indexOf(gemColor);
      if (
        gemColorIndex !== -1 &&
        gemColorIndex <= maxGemColorIndex &&
        gemDesc !== ""
      ) {
        eligibleGems.push({
          index: r,
          color: gemColor,
          description: gemDesc,
        });
      }
    }
    if (eligibleGems.length === 0) {
      const errorMsg = `No socket gems found matching level ${charLvl} criteria (Max Color: ${socketColors[maxGemColorIndex]}).`;
      fMyConsoleLog(`   -> ⚠️ ${funcName} Warning: ${errorMsg}`);
      await fShowMessage(`Warning: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(`   -> Found ${eligibleGems.length} eligible gems.`);
    const randomIndex = Math.floor(Math.random() * eligibleGems.length);
    const selectedGem = eligibleGems[randomIndex];
    fMyConsoleLog(
      `   -> Selected Gem: Color=${selectedGem.color}, Desc="${selectedGem.description}"`

    let titleHtml, titleText;
    if (isRandomRoll) {
      titleHtml = `<span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `Loot ${lootType}:`;
    } else {
      titleHtml = `<span class="red-bold">SPECIFIC</span> <span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `SPECIFIC Loot ${lootType}:`;
    }
    const messageBodyHtml = `${selectedGem.color} Gem:<br>${selectedGem.description}`;
    const messageBodyText = `${selectedGem.color} Gem:\n${selectedGem.description}`;

  /** function fLoot_RollArtifact
   * Purpose: Rolls a level-appropriate Artifact from the dbGearFSData cache.
   * Assumptions: gUI.characterInfo and gUI.dbGearFSData are populated.
   * Notes: Logs the result to the sidebar.
   * @param {boolean} [isRandomRoll=false] - True if called via function fLoot_RollRndTreasure.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fLoot_RollArtifact(isRandomRoll = false) {
    const funcName = "fLoot_RollArtifact";
    const lootType = "Artifact";
    fMyConsoleLog(
      `⚙️ ${funcName}: Triggered placeholder for ${lootType} (isRandomRoll: ${isRandomRoll})...`
    );
    const charLvl = Number(gUI.characterInfo?.level) || 0;
    const cacheKey = "dbGearFSData";
    const gearCache = gUI[cacheKey];
    if (
      !gearCache ||
      !gearCache.text ||
      !Array.isArray(gearCache.text) ||
      !gearCache.colTagsMap ||
      typeof gearCache.colTagsMap !== "object" ||
      !gearCache.rowTagsMap ||
      typeof gearCache.rowTagsMap !== "object"
    ) {
      const errorMsg = `Required cache ${cacheKey} is not loaded or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      await fShowMessage(`Error: ${errorMsg}`);
      return;
    }
    const isArtifact_C = fResolveFSDataCol(cacheKey, "IsArtifact");
    const artName_C = fResolveFSDataCol(cacheKey, "Name");
    const apCost_C = fResolveFSDataCol(cacheKey, "AP");
    const artDataFirst_R = fResolveFSDataRow(cacheKey, "RowBeforeFirstDataRow");
    const firstDataRowIndex = artDataFirst_R + 1;
    const artDataLast_R = gearCache.text.length - 1;
    const failedTags = [];
    if (isNaN(isArtifact_C)) failedTags.push("IsArtifact");
    if (isNaN(artName_C)) failedTags.push("Name");
    if (isNaN(apCost_C)) failedTags.push("AP");
    if (isNaN(artDataFirst_R))
      failedTags.push("RowBeforeFirstDataRow (start row)");
    if (failedTags.length > 0) {
      const errorMsg = `Could not resolve required tags in ${cacheKey}: ${failedTags.join(
        ", "
      )}.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      await fShowMessage(`Error: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(
      `   -> Resolved Tags: IsArtifact=${isArtifact_C}, Name=${artName_C}, AP=${apCost_C}. Data Range: ${firstDataRowIndex}-${artDataLast_R}. CharLvl=${charLvl}.`
    );
    const artifactRows = [];
    for (let r = firstDataRowIndex; r <= artDataLast_R; r++) {
      const rowData = gearCache.text[r];
      if (!Array.isArray(rowData)) continue;
      const isArtifactVal = rowData[isArtifact_C];
      const isTrulyArtifact =
        isArtifactVal === true ||
        String(isArtifactVal).toUpperCase() === "TRUE";
      if (isTrulyArtifact) {
        artifactRows.push({
          index: r,
          data: rowData,
        });
      }
    }
    if (artifactRows.length === 0) {
      const errorMsg = `No items marked as Artifact found in ${cacheKey}.`;
      fMyConsoleLog(`   -> ⚠️ ${funcName} Warning: ${errorMsg}`);
      await fShowMessage(`Warning: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(`   -> Found ${artifactRows.length} total artifacts.`);
    const maxAPCost = Math.max(5, charLvl);
    fMyConsoleLog(
      `   -> Filtering artifacts by Max AP Cost <= ${maxAPCost} (based on charLvl ${charLvl}).`
    );
    const eligibleArtifacts = artifactRows.filter((artifact) => {
      const apCost = Number(artifact.data[apCost_C]) || Infinity;
      return apCost <= maxAPCost;
    });
    if (eligibleArtifacts.length === 0) {
      const errorMsg = `No artifacts found with AP Cost <= ${maxAPCost}.`;
      fMyConsoleLog(`   -> ⚠️ ${funcName} Warning: ${errorMsg}`);
      const userMsg = `No artifacts found suitable for character level ${charLvl} (Max AP Cost: ${maxAPCost}).`;
      await fShowMessage(userMsg);
      return;
    }
    fMyConsoleLog(
      `   -> Found ${eligibleArtifacts.length} eligible artifacts.`
    );
    const randomIndex = Math.floor(Math.random() * eligibleArtifacts.length);
    const selectedArtifact = eligibleArtifacts[randomIndex];
    const selectedRowData = selectedArtifact.data;
    const artName = String(
      selectedRowData[artName_C] || "Unknown Artifact"
    ).trim();
    const apCost = selectedRowData[apCost_C] ?? "?";
    fMyConsoleLog(
      `   -> Selected Artifact: "${artName}" (AP: ${apCost}) at original index ${selectedArtifact.index}.`
    );
    let titleHtml, titleText;
    if (isRandomRoll) {
      titleHtml = `<span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `Loot ${lootType}:`;
    } else {
      titleHtml = `<span class="red-bold">SPECIFIC</span> <span class="blue-bold">Loot ${lootType}:</span>`;
      titleText = `SPECIFIC Loot ${lootType}:`;
    }
    const messageBodyHtml = `${artName} (${apCost}AP)`;
    const messageBodyText = `${artName} (${apCost}AP)`;
    const sidebarMsgHtml = `${titleHtml}<br>${messageBodyHtml}`;
    const sidebarMsgText = `${titleText}\n${messageBodyText}`;
    fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
    fShowSidebar();
    setTimeout(() => fSendLogToGMScreenAndPS(), 0);
    fMyConsoleLog(`✅ ${funcName}: Artifact loot posted.`);
  } // End function fLoot_RollArtifact

  /** function fHandleNewLevelSlotName
   * Purpose: Handles the "Update (Level, Slot, Names)" menu action.
   * Assumptions: Relies on a chain of async helper functions for cache refreshing and grid updates.
   * Notes: Force-refreshes user-specific caches, validates data, sends a log, and re-processes the grid.
   * @returns {Promise<void>} Resolves after completing actions or handling errors.
   */
  async function fHandleNewLevelSlotName() {
    const funcName = "fHandleNewLevelSlotName";
    fMyConsoleLog(`⚙️ Menu Action: ${funcName} Triggered...`);
    fShowMessageNoClose(
      "⏳ Refreshing Caches, Sending Log & Updating Grid...<br><br>This may take a minute.<br><br>Please wait."
    );
    try {
      const userCachesToRefresh = [
        {
          workbookAbr: "MyCS",
          sheetName: "RaceClass",
          gUIKey: "myCSRaceClassFSData",
        },
        {
          workbookAbr: "MyCS",
          sheetName: "List",
          gUIKey: "myCSListFSData",
        },
        {
          workbookAbr: "MyKL",
          sheetName: "KnownAbilities",
          gUIKey: "myKLKnownAbilitiesFSData",
        },
      ];
      const refreshPromises = userCachesToRefresh.map((config) =>
        fRefreshAndCacheOneFSData(
          config.workbookAbr,
          config.sheetName,
          config.gUIKey
        )
      );
      fMyConsoleLog(
        `   -> Starting parallel refresh for ${userCachesToRefresh.length} user caches...`
      );
      const results = await Promise.allSettled(refreshPromises);
      fMyConsoleLog(`   -> Parallel cache refreshes completed.`);
      let allRefreshesSucceeded = true;
      let firstErrorMessage = null;
      for (let i = 0; i < results.length; i++) {
        const result = results[i];
        const config = userCachesToRefresh[i];
        if (result.status === "rejected" || result.value === false) {
          allRefreshesSucceeded = false;
          firstErrorMessage =
            result.reason?.message || `Refresh failed for ${config.gUIKey}.`;
          fMyConsoleLog(
            `      -> ❌ Refresh FAILED for ${config.gUIKey}: ${firstErrorMessage}`
          );
          break;
        } else {
          fMyConsoleLog(`      -> ✅ Refresh SUCCEEDED for ${config.gUIKey}.`);
        }
      }
      if (!allRefreshesSucceeded) {
        throw new Error(
          firstErrorMessage || `One or more cache refreshes failed.`
        );
      }
      fMyConsoleLog(`   -> All user cache refreshes successful.`);
      fMyConsoleLog(
        "   -> Updating Ability Dropdowns based on refreshed List cache..."
      );
      fProcessCachedAbilityList();
      fMyConsoleLog("      -> ✅ Ability Dropdowns updated.");
      fMyConsoleLog("   -> Validating Slot Number from refreshed data...");
      const currentSlot = gUI.characterInfo?.slotNum;
      const slotRegex = /^Slot([1-9])$/i;
      if (!currentSlot || !slotRegex.test(currentSlot)) {
        const invalidSlotMsg = `Invalid or missing Slot # ("${
          currentSlot || "null"
        }") after cache refresh.`;
        throw new Error(invalidSlotMsg);
      }
      fMyConsoleLog(`      -> Slot validated: ${currentSlot}`);
      fMyConsoleLog("   -> Sending log update...");
      await fSendLogToGMScreenAndPS();
      fMyConsoleLog("      -> ✅ Log send successful.");
      fMyConsoleLog("   -> Refreshing grid rows (Abilities/Gear)...");
      await fTotalRereshOfAllAbilitiesAndAllGear();
      fMyConsoleLog("      -> ✅ Grid row refresh complete.");
      fMyConsoleLog(`✅ ${funcName} Completed Successfully.`);
      fHideMessage();
    } catch (error) {
      fHideMessage();
      const errorMsg = `❌ Error during Update (Level, Slot, Names): ${
        error?.message || error
      }`;
      console.error(errorMsg, error);
      fMyConsoleLog(`   -> ❌ ${errorMsg}`);
      await fShowMessage(errorMsg);
    }
  } // End function fHandleNewLevelSlotName

  /** function fCalculatesEnc_MR_AP
   * Purpose: Calculates Movement Rate (MR) and Carry Capacity, updates the grid, and recalculates total AP.
   * Assumptions: Relies on various values and range definitions in the gUI object.
   * Notes: This is a core calculation function triggered after gear or stat changes.
   * @returns {Promise<void>} Resolves when calculations and updates are complete.
   */
  async function fCalculatesEnc_MR_AP() {
    fMyConsoleLog("⚙️ Calculating Movement Rate and Encumbrance...");
    const movementMultipliers = [1, 0.9, 0.8, 0.65, 0.5, 0.25];
    const carryMultipliers = [1, 2, 4, 8, 12, 16];
    const mrColumnTags = [
      "GearMRCol1",
      "GearMRCol2",
      "GearMRCol3",
      "GearMRCol4",
      "GearMRCol5",
      "GearMRCol6",
    ];
    const MR_TABLE_ROW = "GearMRTbl";
    const CARRY_TABLE_ROW = "GearCarryTbl";
    const CHECKBOX_ROW = "GearMRCheckBox";
    let errorMsg = "";
    const agilityValue = fGetGridValue("Agi", "Sk1", true);
    const strengthValue = fGetGridValue("Str", "Sk1", true);
    const plusMRValue = fGetGridValue("GearPlusMR", "GearPlusMR", true) || 0;
    const plusCarryValue =
      fGetGridValue("GearPlusCarry", "GearPlusCarry", true) || 0;
    const currentEncumbrance = fCalcTotalEnc() || 0;
    if (isNaN(agilityValue))
      errorMsg += "Agility ('Agi', 'Sk1') is not a valid number. ";
    if (isNaN(strengthValue))
      errorMsg += "Strength ('Str', 'Sk1') is not a valid number. ";
    if (isNaN(currentEncumbrance))
      errorMsg +=
        "Current Encumbrance ('PossEncTot', 'PossEncTot') is not a valid number.";
    if (errorMsg) {
      console.error(
        `fCalculatesEnc_MR_AP: Input validation failed: ${errorMsg}`
      );
      fMyConsoleLog(`❌ MR/Enc Calc Failed: ${errorMsg}`);
      await fShowMessage(`❌ Error calculating MR/Enc: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(
      `   -> Inputs: Agi=${agilityValue}, Str=${strengthValue}, +MR=${plusMRValue}, +Carry=${plusCarryValue}, CurrentEnc=${currentEncumbrance}`
    );
    let updateSuccess = true;
    updateSuccess &&= fSetGridValue("GearSpe", "GearSpeAndStr", agilityValue);
    updateSuccess &&= fSetGridValue("GearStr", "GearSpeAndStr", strengthValue);
    if (!updateSuccess) {
      fMyConsoleLog(
        "   -> ⚠️ Warning: Failed to update GearSpe/GearStr overview cells."
      );
    }
    let foundActiveMRLevel = false;
    let finalMovementRate = 0;
    let calculationErrors = false;
    for (let i = 0; i < mrColumnTags.length; i++) {
      const colTag = mrColumnTags[i];
      const movementRate = Math.round(
        (6 + agilityValue / 5 + plusMRValue) * movementMultipliers[i]
      );
      const carryCapacity = Math.round(
        (50 + strengthValue + plusCarryValue) * carryMultipliers[i]
      );
      let mrSet = fSetGridValue(MR_TABLE_ROW, colTag, movementRate);
      let carrySet = fSetGridValue(CARRY_TABLE_ROW, colTag, carryCapacity);
      let cbSetInitial = fSetGridValue(CHECKBOX_ROW, colTag, false);
      if (!mrSet || !carrySet || !cbSetInitial) {
        fMyConsoleLog(
          `   -> ⚠️ Error setting MR/Carry/Checkbox values for column ${colTag}.`
        );
        calculationErrors = true;
      }
      if (!foundActiveMRLevel && currentEncumbrance <= carryCapacity) {
        fMyConsoleLog(
          `   -> Active MR Level Found: Col '${colTag}' (Enc ${currentEncumbrance} <= Carry ${carryCapacity})`
        );
        if (!fSetGridValue(CHECKBOX_ROW, colTag, true)) {
          fMyConsoleLog(
            `   -> ⚠️ Error setting Checkbox to TRUE for column ${colTag}.`
          );
          calculationErrors = true;
        } else {
          foundActiveMRLevel = true;
          finalMovementRate = movementRate;
          fMyConsoleLog(`   -> Final MR set to: ${finalMovementRate}`);
        }
      }
    }
    if (!fSetGridValue("MR", "MR", finalMovementRate)) {
      fMyConsoleLog("   -> ⚠️ Error setting final MR value in ('MR', 'MR').");
      calculationErrors = true;
    }
    if (!foundActiveMRLevel || finalMovementRate === 0) {
      fMyConsoleLog("   -> 🚨 Character is over-encumbered!");
      await fShowMessage("⚠️ You are over encumbered, MR is 0.");
    }
    fCalcTotalAP();
    if (calculationErrors) {
      fMyConsoleLog("❌ MR/Enc/AP Calc Completed with errors.");
    } else {
      fMyConsoleLog("✅ MR/Enc/AP Calc Completed successfully.");
    }
  } // End function fCalculatesEnc_MR_AP

  /** function fCalcTotalEnc
   * Purpose: Calculates total encumbrance from gear and updates the grid.
   * Assumptions: gUI.range.gearEncCol and gUI.range.currentEnc are defined.
   * Notes: Sums values from all defined encumbrance columns.
   * @returns {number} The calculated and rounded total encumbrance, or 0 on error.
   */
  function fCalcTotalEnc() {
    const funcName = "fCalcTotalEnc";
    fMyConsoleLog(`⚖️ Calculating Total Encumbrance...`);
    let totalEnc = 0;
    let errorsOccurred = false;
    const encRangeDefs = gUI.range?.gearEncCol;
    const targetCellDef = gUI.range?.currentEnc;
    if (!Array.isArray(encRangeDefs) || encRangeDefs.length === 0) {
      console.error(
        `${funcName}: Encumbrance source range definition (gUI.range.gearEncCol) is missing or invalid.`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Encumbrance source range definition missing.`
      );
      errorsOccurred = true;
    }
    if (
      !targetCellDef ||
      typeof targetCellDef.r1 === "undefined" ||
      typeof targetCellDef.c1 === "undefined"
    ) {
      console.error(
        `${funcName}: Target cell definition (gUI.range.currentEnc is "${gUI.range.currentEnc}") is missing or invalid (requires r1, c1).`
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Target cell definition missing or invalid.`
      );
      errorsOccurred = true;
    }
    if (errorsOccurred) return 0;
    encRangeDefs.forEach((rangeDef, index) => {
      if (!fDoesObjectHaveR1C1R2C2Properties(rangeDef)) {
        console.warn(
          `${funcName}: Skipping invalid range object at index ${index}:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const resolved = fConvertsR1C1R2C2TagOrNumToIndices(rangeDef);
      if ([resolved.r1, resolved.c1, resolved.r2, resolved.c2].some(isNaN)) {
        console.warn(
          `${funcName}: Skipping range at index ${index} due to unresolved indices:`,
          rangeDef
        );
        errorsOccurred = true;
        return;
      }
      const rMin = Math.min(resolved.r1, resolved.r2);
      const rMax = Math.max(resolved.r1, resolved.r2);
      const cMin = Math.min(resolved.c1, resolved.c2);
      const cMax = Math.max(resolved.c1, resolved.c2);
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          const value = fGetGridValue(r, c);
          const numericValue = Number(value) || 0;
          totalEnc += numericValue;
        }
      }
    });
    const roundedTotalEnc = Math.round(totalEnc * 100) / 100;
    fMyConsoleLog(
      `   -> Raw Total Enc: ${totalEnc}, Rounded: ${roundedTotalEnc}`
    );
    const targetR = fResolveRow(targetCellDef.r1);
    const targetC = fResolveCol(targetCellDef.c1);
    if (isNaN(targetR) || isNaN(targetC)) {
      console.error(
        `${funcName}: Could not resolve target cell coordinates from gUI.range.currentEnc:`,
        targetCellDef
      );
      fMyConsoleLog(
        `❌ ${funcName} Error: Could not resolve target cell coordinates.`
      );
      errorsOccurred = true;
    } else {
      if (!fSetGridValue(targetR, targetC, roundedTotalEnc)) {
        fMyConsoleLog(
          `   -> ⚠️ Warning: Failed to update target cell [${targetR}, ${targetC}] with total encumbrance.`
        );
        errorsOccurred = true;
      } else {
        fMyConsoleLog(
          `   -> Target cell [${targetR}, ${targetC}] updated with: ${roundedTotalEnc}`
        );
      }
    }
    fMyConsoleLog(
      `✅ ${funcName} finished ${
        errorsOccurred ? "with errors" : "successfully"
      }. Returning: ${roundedTotalEnc}`
    );
    return roundedTotalEnc;
  } // End function fCalcTotalEnc

  /** function fCalc_VitMaxNowPerc
   * Purpose: Handles the "Set Vit Max" menu action by recalculating derived vitality values.
   * Assumptions: gUI.range definitions for Vit and Fortitude are correct.
   * Notes: Calculates and updates Vit Max, Vit Now, and Vit Now Percent based on Fortitude and bonuses.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fCalc_VitMaxNowPerc() {
    fMyConsoleLog("⚙️ Menu Action: Setting Vit to Max...");
    const fortitudeRange = gUI.range?.fortitudeSk1;
    const vitMaxRange = gUI.range?.vitMax;
    const vitMaxPlusRange = gUI.range?.vitMaxPlus;
    let errorMsg = "";
    if (!fortitudeRange || !fortitudeRange.r1 || !fortitudeRange.c1)
      errorMsg = "Fortitude range definition missing.";
    else if (!vitMaxRange || !vitMaxRange.r1 || !vitMaxRange.c1)
      errorMsg = "Vit Max range definition missing.";
    else if (!vitMaxPlusRange || !vitMaxPlusRange.r1 || !vitMaxPlusRange.c1)
      errorMsg = "Vit Max Plus range definition missing.";
    if (errorMsg) {
      console.warn(`fCalc_VitMaxNowPerc: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Cannot set Vit to max: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const fortitudeValueRaw = fGetGridValue(
      fortitudeRange.r1,
      fortitudeRange.c1
    );
    const fortitudeValue = Number(fortitudeValueRaw);
    if (isNaN(fortitudeValue)) {
      errorMsg = `Fortitude Sk1 value ('${fortitudeValueRaw}') is not a valid number.`;
      console.warn(`fCalc_VitMaxNowPerc: ${errorMsg}`);
      fMyConsoleLog(`⚠️ Cannot set Vit to max: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    fMyConsoleLog(`   -> Fortitude Sk1 value: ${fortitudeValue}`);
    const vitMaxPlusValueRaw = fGetGridValue(
      vitMaxPlusRange.r1,
      vitMaxPlusRange.c1
    );
    let vitMaxPlusBonus = 0;
    if (
      vitMaxPlusValueRaw !== null &&
      vitMaxPlusValueRaw !== "" &&
      !isNaN(Number(vitMaxPlusValueRaw))
    ) {
      vitMaxPlusBonus = Math.round(Number(vitMaxPlusValueRaw));
      fMyConsoleLog(
        `   -> Vit Max Plus Bonus found: ${vitMaxPlusValueRaw} -> Rounded: ${vitMaxPlusBonus}`
      );
    } else {
      fMyConsoleLog(`   -> No valid Vit Max Plus Bonus found. Using 0.`);
    }
    const newVitMax = Math.round(fortitudeValue + vitMaxPlusBonus);
    fMyConsoleLog(
      `   -> Calculated New Vit Max: ${fortitudeValue} (For) + ${vitMaxPlusBonus} (Bonus) = ${newVitMax}`
    );
    const setMaxSuccess = fSetGridValue(
      vitMaxRange.r1,
      vitMaxRange.c1,
      newVitMax
    );
    if (!setMaxSuccess) {
      fMyConsoleLog(
        `⚠️ Failed to set Vit Max value (${newVitMax}) in cell (${vitMaxRange.r1}, ${vitMaxRange.c1}). Aborting further updates.`
      );
      await fShowMessage(
        `❌ Error: Failed to update the Vit Max value in the grid.`
      );
      return;
    }
    fMyConsoleLog(`   -> Successfully set Vit Max to ${newVitMax}.`);
    await fVitNowNPercent_Calc();
    fMyConsoleLog("✅ Vit Set to Max sequence complete.");
    fMyConsoleLog(
      "   -> Calling function fSendLogToGMScreenAndPS from function fCalc_VitMaxNowPerc..."
    );
    setTimeout(() => fSendLogToGMScreenAndPS(), 0);
  } // End function fCalc_VitMaxNowPerc

  /** function fVitNowNPercent_Calc
   * Purpose: Calculates 'Vit Now' and 'Vit Now Percent' and updates the grid.
   * Assumptions: Called after Vit Max or Wounds have changed. gUI.range definitions are correct.
   * Notes: This is a helper function to keep derived vitality fields synchronized.
   * @returns {Promise<void>} Resolves after the operation is complete.
   */
  async function fVitNowNPercent_Calc() {
    fMyConsoleLog("   -> Calculating Vit Now & Percent...");
    const vitMaxRange = gUI.range?.vitMax;
    const vit1stRange = gUI.range?.vit1stWnds;
    const vit2ndRange = gUI.range?.vit2ndWnds;
    const vit3rdRange = gUI.range?.vit3rdWnds;
    const vitNowRange = gUI.range?.vitNow;
    const vitNowPercentRange = gUI.range?.vitNowPercent;
    let errorMsg = "";
    if (!vitMaxRange || !vitMaxRange.r1 || !vitMaxRange.c1)
      errorMsg = "Vit Max range definition missing.";
    else if (!vit1stRange || !vit1stRange.r1 || !vit1stRange.c1)
      errorMsg = "Vit 1st Wounds range definition missing.";
    else if (!vit2ndRange || !vit2ndRange.r1 || !vit2ndRange.c1)
      errorMsg = "Vit 2nd Wounds range definition missing.";
    else if (!vit3rdRange || !vit3rdRange.r1 || !vit3rdRange.c1)
      errorMsg = "Vit 3rd Wounds range definition missing.";
    else if (!vitNowRange || !vitNowRange.r1 || !vitNowRange.c1)
      errorMsg = "Vit Now range definition missing.";
    else if (
      !vitNowPercentRange ||
      !vitNowPercentRange.r1 ||
      !vitNowPercentRange.c1
    )
      errorMsg = "Vit Now Percent range definition missing.";
    if (errorMsg) {
      console.warn(`fVitNowNPercent_Calc: ${errorMsg}`);
      fMyConsoleLog(`   -> ⚠️ Calculation aborted: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const currentVitMaxRaw = fGetGridValue(vitMaxRange.r1, vitMaxRange.c1);
    const currentVitMax = Number(currentVitMaxRaw);
    if (isNaN(currentVitMax)) {
      errorMsg = `Vit Max value ('${currentVitMaxRaw}') needed for calculation is not a number.`;
      console.warn(`fVitNowNPercent_Calc: ${errorMsg}`);
      fMyConsoleLog(`   -> ⚠️ Calculation aborted: ${errorMsg}`);
      await fShowMessage(`❌ Error: ${errorMsg}`);
      return;
    }
    const getWoundVal = (range) => {
      const raw = fGetGridValue(range.r1, range.c1);
      return raw !== null && raw !== "" && !isNaN(Number(raw))
        ? Math.round(Number(raw))
        : 0;
    };
    const wounds1st = getWoundVal(vit1stRange);
    const wounds2nd = getWoundVal(vit2ndRange);
    const wounds3rd = getWoundVal(vit3rdRange);
    const totalWounds = wounds1st + wounds2nd + wounds3rd;
    fMyConsoleLog(
      `      -> Wounds: ${wounds1st}(1st) + ${wounds2nd}(2nd) + ${wounds3rd}(3rd) = ${totalWounds}`
    );
    const newVitNow = Math.round(currentVitMax - totalWounds);
    fMyConsoleLog(
      `      -> Calculated Vit Now: ${currentVitMax} (Max) - ${totalWounds} (Wounds) = ${newVitNow}`
    );
    const setNowSuccess = fSetGridValue(
      vitNowRange.r1,
      vitNowRange.c1,
      newVitNow
    );
    if (!setNowSuccess) {
      fMyConsoleLog(`   -> ⚠️ Failed to set Vit Now value (${newVitNow}).`);
      await fShowMessage(`❌ Error: Failed to update the Vit Now value.`);
    }
    const percent =
      currentVitMax === 0 ? 0 : Math.round((newVitNow / currentVitMax) * 100);
    const percentString = percent + "%";
    fMyConsoleLog(`      -> Calculated Vit Now Percent: ${percentString}`);
    const setPercentSuccess = fSetGridValue(
      vitNowPercentRange.r1,
      vitNowPercentRange.c1,
      percentString
    );
    if (!setPercentSuccess) {
      fMyConsoleLog(
        `   -> ⚠️ Failed to set Vit Now Percent value (${percentString}).`
      );
      await fShowMessage(
        `❌ Error: Failed to update the Vit Now Percent value.`
      );
    }
    fMyConsoleLog("   -> Vit Now & Percent Calculation complete.");
  } // End function fVitNowNPercent_Calc

  /** function fCalcGearLine
   * Purpose: Handles edits to gear-related cells, validates input, and triggers recalculations.
   * Assumptions: Relies on various helper functions and gUI state.
   * @param {number} r - The 0-based row index of the edited cell.
   * @param {number} c - The 0-based column index of the edited cell.
   * @param {any} newValue - The proposed new value for the edited cell.
   * @param {any} oldValue - The previous value for reverting on failure.
   * @returns {Promise<any | null>} Resolves with the validated value or null on failure.
   */
  async function fCalcGearLine(r, c, newValue, oldValue) {
    const funcName = "fCalcGearLine";
    fMyConsoleLog(
      `⚖️ ${funcName}: Handling edit for cell [${r}, ${c}] with new value: "${newValue}" (Old: "${oldValue}")`
    );
    const possNumColTag = "PossNum";
    const possWornColTag = "PossWorn";
    const possPerOffColTag = "PossPerOff";
    const possEncColTag = "PossEnc";
    const possCrTotColTag = "PossCrTot";
    const possAPTotColTag = "PossAPTot";
    const gearColumnsToCalculate = [
      possNumColTag,
      possWornColTag,
      possPerOffColTag,
    ];
    const possNameVal = fGetGridValue(r, "Ability");
    const gearID = fGetIDFromNameID(possNameVal);
    const gearCache = gUI.dbGearFSData;
    if (!gearID) {
      fMyConsoleLog(
        `   -> Skipping ${funcName}: PossName invalid or missing ID for row ${r}.`
      );
      await fShowMessage(
        "ℹ️ Cannot modify gear numbers/status until a valid item with an ID is selected in the 'Ability' column."
      );
      fRevertCellDOM(r, c, oldValue);
      return null;
    }
    if (!gearCache || !gearCache.text || !gearCache.colTagsMap) {
      fMyConsoleLog(
        `   -> ❌ Error: DB/Gear cache (gUI.dbGearFSData) not loaded or invalid.`
      );
      await fShowMessage(
        "❌ Error: Gear definition cache not loaded. Cannot calculate gear line."
      );
      fRevertCellDOM(r, c, oldValue);
      return null;
    }
    const editedColTag = Object.keys(gUI.colTag).find(
      (tag) => gUI.colTag[tag] === c
    );
    let validatedValue = newValue;
    let validationError = "";
    if (!gearColumnsToCalculate.includes(editedColTag)) {
      fMyConsoleLog(
        `   -> ❌ Error: ${funcName} called unexpectedly for non-gear-input column: ${editedColTag}`
      );
      fRevertCellDOM(r, c, oldValue);
      return null;
    }
    switch (editedColTag) {
      case possNumColTag:
        const numInput = Number(newValue);
        if (isNaN(numInput) || !Number.isInteger(numInput) || numInput < 0) {
          validationError = `❌ Invalid number ("${newValue}"). '${possNumColTag}' must be a whole number >= 0.`;
          validatedValue = null;
        } else {
          validatedValue = numInput;
        }
        break;
      case possWornColTag:
        if (typeof newValue !== "boolean") {
          validatedValue = String(newValue).toUpperCase() === "TRUE";
        } else {
          validatedValue = newValue;
        }
        break;
      case possPerOffColTag:
        const perOffInput = String(newValue ?? "").trim();
        if (
          perOffInput !== "" &&
          (!perOffInput.endsWith("%") || isNaN(parseFloat(perOffInput)))
        ) {
          validationError = `❌ Invalid format ("${newValue}"). '${possPerOffColTag}' must be blank or a percentage (e.g., 50%).`;
          validatedValue = null;
        } else {
          validatedValue = perOffInput;
        }
        break;
    }
    if (validatedValue === null) {
      fMyConsoleLog(`   -> ❌ Input Validation Failed: ${validationError}`);
      await fShowMessage(validationError);
      fRevertCellDOM(r, c, oldValue);
      return null;
    }
    const previousEnc = fGetGridValue(r, possEncColTag);
    const previousCr = fGetGridValue(r, possCrTotColTag);
    const previousAp = fGetGridValue(r, possAPTotColTag);
    if (!fSetGridValue(r, c, validatedValue)) {
      fMyConsoleLog(
        `   -> ❌ Error setting validated value for edited cell [${r}, ${c}].`
      );
      await fShowMessage(
        `❌ Error updating edited cell [${r}, ${c}] with validated value.`
      );
      return null;
    }
    fMyConsoleLog(
      `   -> Successfully updated edited cell [${r}, ${c}] with validated value: "${validatedValue}"`
    );
    const refreshSuccess = fRefreshGearLineCalcs(
      r,
      previousEnc,
      previousCr,
      previousAp
    );
    if (refreshSuccess) {
      fMyConsoleLog(
        `   -> Triggering function fCalculatesEnc_MR_AP after successful refresh for row ${r}...`
      );
      await fCalculatesEnc_MR_AP();
      fMyConsoleLog(`✅ ${funcName} completed successfully for [${r}, ${c}].`);
      return validatedValue;
    } else {
      fMyConsoleLog(
        `   -> ❌ Error occurred during function fRefreshGearLineCalcs for row ${r}.`
      );
      fMyConsoleLog(
        `      -> Reverting edited cell [${r}, ${c}] back to old value: "${oldValue}"`
      );
      fSetGridValue(r, c, oldValue);
      return null;
    }
  } // End function fCalcGearLine

  /** function fRefreshGearLineCalcs
   * Purpose: Helper to calculate and update derived gear values for a specific row.
   * Assumptions: Reverts to old values on failure.
   * @param {number} r - The 0-based row index of the gear line to refresh.
   * @param {any} oldEnc - The value of 'PossEnc' before the change.
   * @param {any} oldCr - The value of 'PossCrTot' before the change.
   * @param {any} oldAp - The value of 'PossAPTot' before the change.
   * @returns {boolean} True if calculations and updates succeeded, false otherwise.
   */
  function fRefreshGearLineCalcs(r, oldEnc, oldCr, oldAp) {
    const funcName = "fRefreshGearLineCalcs";
    fMyConsoleLog(
      `   -> ${funcName}: Refreshing derived calculations for row ${r}...`
    );
    const possNameColTag = "Ability";
    const possNumColTag = "PossNum";
    const possWornColTag = "PossWorn";
    const possPerOffColTag = "PossPerOff";
    const possEncColTag = "PossEnc";
    const possCrTotColTag = "PossCrTot";
    const possAPTotColTag = "PossAPTot";
    const possNameVal = fGetGridValue(r, possNameColTag);
    const calc_possNumVal = fGetGridValue(r, possNumColTag, true) || 0;
    const calc_isWornVal = fGetGridValue(r, possWornColTag) || false;
    const calc_perOffVal = fGetGridValue(r, possPerOffColTag) || "";
    const gearID = fGetIDFromNameID(possNameVal);
    const gearCache = gUI.dbGearFSData;
    let validationFailed = false;
    if (!gearID) {
      fMyConsoleLog(
        `      -> ${funcName} Validation Failed: Cannot extract Gear ID from "${possNameVal}" for row ${r}.`
      );
      validationFailed = true;
    } else if (!gearCache || !gearCache.text || !gearCache.colTagsMap) {
      fMyConsoleLog(
        `      -> ${funcName} Validation Failed: DB/Gear cache (gUI.dbGearFSData) not loaded or invalid.`
      );
      validationFailed = true;
    }
    if (validationFailed) {
      fMyConsoleLog(
        `      -> Reverting derived cells for row ${r} to old values.`
      );
      fSetGridValue(r, possEncColTag, oldEnc);
      fSetGridValue(r, possCrTotColTag, oldCr);
      fSetGridValue(r, possAPTotColTag, oldAp);
      return false;
    }
    fMyConsoleLog(`      -> ${funcName}: Using Gear ID: ${gearID}`);
    const wornEnc = Number(fGetVal_GUICache(gearID, "WornEnc", gearCache) || 0);
    const itemEnc = Number(fGetVal_GUICache(gearID, "ItemEnc", gearCache) || 0);
    const crEach = Number(fGetVal_GUICache(gearID, "ItemCR", gearCache) || 0);
    const apEach = Number(fGetVal_GUICache(gearID, "AP", gearCache) || 0);
    fMyConsoleLog(
      `      -> DB Constants: WornEnc=${wornEnc}, ItemEnc=${itemEnc}, CrEach=${crEach}, APEach=${apEach}`
    );
    const encEachVal = calc_isWornVal && wornEnc !== 0 ? wornEnc : itemEnc;
    const gearEncTot = calc_possNumVal * encEachVal;
    fMyConsoleLog(
      `         -> Enc Calc: EncEach=${encEachVal}, Total=${gearEncTot}`
    );
    let parsedPercent = 1.0;
    if (typeof calc_perOffVal === "string" && calc_perOffVal.endsWith("%")) {
      const numPart = parseFloat(calc_perOffVal);
      if (!isNaN(numPart)) {
        parsedPercent = (100 - numPart) / 100;
      }
    }
    const rawCrTotal = calc_possNumVal * crEach * parsedPercent;
    const gearTotCr = isNaN(rawCrTotal) ? 0 : Math.round(rawCrTotal);
    fMyConsoleLog(
      `         -> CR Calc: CrEach=${crEach}, Num=${calc_possNumVal}, PercMult=${parsedPercent.toFixed(
        2
      )} => Raw=${rawCrTotal} => Final=${gearTotCr}`
    );
    const gearAPTot = calc_possNumVal * apEach;
    fMyConsoleLog(
      `         -> AP Calc: APEach=${apEach}, Num=${calc_possNumVal} => Total=${gearAPTot}`
    );
    let updateSuccess = true;
    fMyConsoleLog(`      -> Updating calculated cells for row ${r}...`);
    updateSuccess &&= fSetGridValue(r, possEncColTag, gearEncTot);
    updateSuccess &&= fSetGridValue(r, possCrTotColTag, gearTotCr);
    updateSuccess &&= fSetGridValue(r, possAPTotColTag, gearAPTot);
    if (!updateSuccess) {
      fMyConsoleLog(
        `      -> ❌ ${funcName}: Error occurred during fSetGridValue updates for derived cells on row ${r}.`
      );
      fSetGridValue(r, possEncColTag, oldEnc);
      fSetGridValue(r, possCrTotColTag, oldCr);
      fSetGridValue(r, possAPTotColTag, oldAp);
      return false;
    }
    fMyConsoleLog(
      `   -> ${funcName}: Refresh finished successfully for row ${r}.`
    );
    return true;
  } // End function fRefreshGearLineCalcs

  /** function fExecuteNishSequence
   * Purpose: Executes the common sequence of actions required at the start of a Nish turn.
   * Assumptions: Skips Meta/Duration updates if Luck was used to trigger the Nish turn.
   * @param {} - No parameters.
   * @returns {void}
   */
  async function fExecuteNishSequence() {
    fMyConsoleLog("🎬 Executing Nish Sequence...");
    fPostToSidebar(
      '<hr class="nish-divider"><br>',
      "\n======================\n"
    );
    fMyConsoleLog("   -> Sidebar divider added.");
    if (!gUI.buttonOrMenu.isLuck) {
      await fMetaChannel();
      fMyConsoleLog("   -> fMetaChannel executed.");
    } else {
      fMyConsoleLog("   -> Skipping fMetaChannel (Luck trigger).");
    }
    await fAct_SetToMax();
    fMyConsoleLog("   -> fAct_SetToMax executed.");
    if (!gUI.buttonOrMenu.isLuck) {
      await fIsOn_NewNishSet();
      fMyConsoleLog("   -> fIsOn_NewNishSet executed.");
    } else {
      fMyConsoleLog("   -> Skipping fIsOn_NewNishSet (Luck trigger).");
    }
    fMyConsoleLog("✅ Nish Sequence Execution Complete.");
  } // End function fExecuteNishSequence

  /** function fNishTorCText
   * Purpose: Selects and displays a random Tremendous or Critical Nish result to the sidebar.
   * Assumptions: The dbCritFSData cache is populated.
   * @param {string} tOrC - 't' for Tremendous, 'c' for Critical.
   * @returns {void}
   */
  async function fNishTorCText(tOrC) {
    const funcName = "fNishTorCText";
    fMyConsoleLog(
      `⚙️ ${funcName}: Processing Nish T/C result for input '${tOrC}'...`
    );
    const inputLower = String(tOrC ?? "").toLowerCase();
    if (inputLower !== "t" && inputLower !== "c") {
      fMyConsoleLog(
        `   -> ${funcName}: Invalid input '${tOrC}'. Must be 't' or 'c'. Aborting.`
      );
      return;
    }
    const cacheKey = "dbCritFSData";
    const cache = gUI[cacheKey];
    if (
      !cache ||
      !cache.text ||
      !Array.isArray(cache.text) ||
      !cache.colTagsMap ||
      !cache.rowTagsMap
    ) {
      const errorMsg = `Cannot get Nish T/C text: Required cache gUI['${cacheKey}'] is missing or invalid.`;
      console.error(`${funcName}: ${errorMsg}`);
      fMyConsoleLog(`   -> ❌ ${funcName} Error: ${errorMsg}`);
      return;
    }
    const columnTag = inputLower === "t" ? "NishTrem" : "NishCrit";
    const titleText =
      inputLower === "t" ? "Tremendous Nish:" : "Critical Nish:";
    const titleHtml = `<span class="red-bold">${titleText}</span>`;
    const startRowTag = "RowBeforeFirstDataRow";
    const resultColIndex = fResolveFSDataCol(cacheKey, columnTag);
    const startRowIndex = fResolveFSDataRow(cacheKey, startRowTag) + 1;
    if (isNaN(resultColIndex)) {
      fMyConsoleLog(
        `   -> ❌ ${funcName} Error: Column tag '${columnTag}' not found in ${cacheKey}.`
      );
      return;
    }
    if (isNaN(startRowIndex)) {
      fMyConsoleLog(
        `   -> ❌ ${funcName} Error: Start row tag '${startRowTag}' not found in ${cacheKey}.`
      );
      return;
    }
    fMyConsoleLog(
      `   -> Resolved '${columnTag}' to index ${resultColIndex}, '${startRowTag}' to index ${startRowIndex}.`
    );
    const resultsList = [];
    const numRows = cache.text.length;
    for (let r = startRowIndex; r < numRows; r++) {
      const cellValue = cache.text[r]?.[resultColIndex];
      const trimmedValue = String(cellValue ?? "").trim();
      if (trimmedValue !== "") {
        resultsList.push(trimmedValue);
      }
    }
    if (resultsList.length === 0) {
      fMyConsoleLog(
        `   -> ${funcName}: No valid results found in '${columnTag}' column starting from row '${startRowTag}'. Skipping display.`
      );
      return;
    }
    const randomIndex = Math.floor(Math.random() * resultsList.length);
    const selectedResult = resultsList[randomIndex];
    fMyConsoleLog(`   -> Randomly selected result: "${selectedResult}"`);
    const sidebarMsgHtml = `${titleHtml}<br>${selectedResult}`;
    const sidebarMsgText = `${titleText}\n${selectedResult}`;
    fPostToSidebar(sidebarMsgHtml, sidebarMsgText);
    fShowSidebar();
    fMyConsoleLog(`✅ ${funcName}: Completed.`);
  } // End function fNishTorCText
</script>
